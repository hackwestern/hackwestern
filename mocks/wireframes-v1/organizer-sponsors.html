<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Organizer Sponsors wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" />
<style>
/* Dashboard tokens (src/lib/tokens.ts, dashboardColors) */
:root {
  --text-heavy: #0b2b4a; --text-medium: #1c3550; --text-light: #516476;
  --text-link: #0b6bc4; --text-active: #08559c; --text-warning: #8a4300; --text-task: #5c3d00;
  --bg-page: #f3f7fc; --bg-surface: #ffffff; --bg-nav: #dbe7f5; --bg-nav-selected: #b9d3f0;
  --bg-inset: #edf3fa; --bg-highlight: #e1effb; --bg-task: #ffefb8;
  --action: #0b6bc4;
  --border: #cdddeb; --border-subtle: #e0eaf3; --border-card: #d6e3ef; --border-control: #b9cbe0;
  --border-outline: #accae5; --border-task: #c78a00; --border-muted: rgba(81,100,118,0.2);
  --live: #16803c; --warn: #a34a00; --badge-bg: #fbdac4; --badge-icon: #cf6b28;
  --sch-pink: rgba(250,104,235,0.15); --sch-blue: rgba(37,130,254,0.15);
  --sch-green: rgba(104,250,109,0.15); --sch-orange: rgba(254,145,37,0.15);
  --shadow-card: 0 1px 2px rgba(11,43,74,0.06), 0 1px 4px rgba(11,43,74,0.05);
  --r-sm: 4px; --r-md: 6px; --r-lg: 8px; --r-xl: 10px; --r-2xl: 12px; --r-3xl: 20px;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
}
* { box-sizing: border-box; }
html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #e6edf5; color: var(--text-heavy); font-family: Figtree, system-ui, sans-serif; font-weight: 500; overflow-x: hidden; }
button { font: inherit; color: inherit; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
p { margin: 0; }

/* ---------- harness chrome ---------- */
.wf-bar { position: sticky; top: 0; z-index: 50; background: #f8fafc; border-bottom: 1px solid #d5dde6; padding: 10px 16px; display: flex; flex-direction: column; gap: 8px; }
.wf-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.wf-badge { font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 3px 8px; border-radius: 999px; background: #111; color: #fff; }
.wf-title { font-size: 14px; font-weight: 700; }
.wf-spacer { flex: 1; }
.wf-seg { display: inline-flex; padding: 2px; border-radius: 999px; background: #e3e8ee; }
.wf-seg button { border: 0; background: transparent; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #4b5563; cursor: pointer; }
.wf-seg button[aria-pressed="true"] { background: #fff; color: #111; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.wf-note { font-size: 13px; color: #374151; line-height: 1.4; }
.wf-note b { color: #111; }
.wf-pickwrap { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.wf-pickwrap::-webkit-scrollbar { display: none; }

/* Picker (prototype skill PICKER.md, verbatim except placed in the top bar) */
.proto-picker { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(10,10,10,0.82); -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4); box-shadow: 0 0 0 1px rgba(255,255,255,0.08) inset, 0 8px 24px rgba(0,0,0,0.24), 0 2px 6px rgba(0,0,0,0.12); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; line-height: 1; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
.proto-picker-highlight { position: absolute; top: 4px; left: 0; height: 28px; border-radius: 999px; background: rgba(255,255,255,0.12); }
.proto-picker[data-ready] .proto-picker-highlight { transition: transform 250ms cubic-bezier(0.23,1,0.32,1), width 250ms cubic-bezier(0.23,1,0.32,1); }
@media (prefers-reduced-motion: reduce) { .proto-picker[data-ready] .proto-picker-highlight { transition: none; } }
.proto-picker-item { position: relative; display: flex; align-items: center; height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: rgba(255,255,255,0.55); font: inherit; cursor: pointer; white-space: nowrap; transition: color 150ms ease-out, transform 160ms cubic-bezier(0.23,1,0.32,1); }
@media (hover: hover) and (pointer: fine) { .proto-picker-item:hover { color: rgba(255,255,255,0.85); } }
.proto-picker-item:active { transform: scale(0.97); }
.proto-picker-item:focus-visible { outline: 2px solid rgba(255,255,255,0.4); outline-offset: 2px; }
.proto-picker-item[data-active] { color: #fff; }

.wf-stagewrap { padding: 20px 16px 48px; display: flex; justify-content: center; }
.frame { width: 1280px; max-width: 100%; background: var(--bg-page); border-radius: 14px; box-shadow: 0 0 0 1px #d5dde6; container-type: inline-size; overflow: hidden; min-height: 70vh; }
.frame[data-mode="phone"] { width: 375px; border-radius: 28px; box-shadow: 0 0 0 8px #1f2937, 0 20px 40px rgba(0,0,0,.2); }

/* ---------- app (wireframe of the product) ---------- */
.app { padding: 20px 24px 32px; display: flex; flex-direction: column; gap: 14px; }
@container (max-width: 640px) { .app { padding: 16px 16px 28px; } }
.app-top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.app-title { font-size: 24px; font-weight: 700; }
.tabs { display: flex; gap: 2px; padding: 3px; background: var(--bg-nav); border-radius: 999px; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.tabs span { font-size: 13px; font-weight: 600; padding: 5px 11px; border-radius: 999px; color: var(--text-light); white-space: nowrap; }
.tabs span.on { background: var(--bg-surface); color: var(--text-active); box-shadow: var(--shadow-card); }
.tabs .count { display: inline-block; min-width: 16px; padding: 0 4px; margin-left: 4px; border-radius: 999px; background: var(--warn); color: #fff; font-size: 11px; line-height: 16px; text-align: center; }

.dayrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.daypills { display: inline-flex; gap: 2px; padding: 2px; border-radius: 999px; background: var(--bg-nav); }
.daypills button { border: 0; background: transparent; font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 999px; color: var(--text-light); cursor: pointer; transition: transform 160ms var(--ease-out); }
.daypills button[aria-pressed="true"] { background: var(--action); color: #fff; }
.daypills button:active, .pill:active, .chip:active { transform: scale(0.97); }
.nowtag { font-size: 12px; color: var(--text-light); display: inline-flex; align-items: center; gap: 6px; }
.livedot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); display: inline-block; }
.summary { font-size: 15px; font-weight: 600; color: var(--text-medium); }
.summary b { color: var(--text-heavy); }

.card { background: var(--bg-surface); border-radius: var(--r-2xl); box-shadow: var(--shadow-card); }
.pill { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--border); background: var(--bg-surface); color: var(--text-medium); font-size: 12px; font-weight: 600; line-height: 1; padding: 5px 9px; border-radius: 999px; cursor: pointer; white-space: nowrap; text-decoration: none; transition: transform 160ms var(--ease-out), background-color 150ms ease-out; }
.pill.link { color: var(--text-link); border-color: var(--border-outline); }
.pill.solid { background: var(--action); border-color: var(--action); color: #fff; }
.pill.ghost { border-color: transparent; background: transparent; color: var(--text-link); padding-left: 4px; padding-right: 4px; }
@media (hover: hover) and (pointer: fine) { .pill:hover { background: var(--bg-highlight); } .pill.solid:hover { background: var(--text-active); } }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; line-height: 1; padding: 4px 8px; border-radius: 999px; white-space: nowrap; }
.tag.ok { background: var(--sch-green); color: var(--live); }
.tag.warn { background: var(--bg-task); color: var(--text-task); }
.tag.wait { background: var(--bg-inset); color: var(--text-medium); }
.tag.off { background: transparent; color: var(--text-light); padding-left: 0; }
.tag.help { background: var(--badge-bg); color: var(--text-warning); }
.tick { display: inline-flex; width: 18px; height: 18px; border-radius: 5px; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex: none; }
.tick.y { background: var(--live); color: #fff; }
.tick.n { border: 1.5px solid var(--border-control); color: transparent; }
.muted { color: var(--text-light); }
.small { font-size: 12px; }
.strong { font-weight: 700; }
.filters { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.chip { border: 1px solid var(--border); background: var(--bg-surface); font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 999px; color: var(--text-medium); cursor: pointer; transition: transform 160ms var(--ease-out); }
.chip span { color: var(--text-light); margin-left: 3px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--action); border-color: var(--action); color: #fff; }
.chip[aria-pressed="true"] span { color: rgba(255,255,255,.8); }
img.logo { height: 20px; width: auto; max-width: 96px; object-fit: contain; display: block; }
.wordmark { font-weight: 800; letter-spacing: .06em; font-size: 15px; color: var(--text-heavy); line-height: 20px; display: block; }
.owner { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-medium); font-weight: 600; white-space: nowrap; }
.owner i { font-style: normal; width: 18px; height: 18px; border-radius: 6px; background: var(--bg-nav); display: inline-flex; align-items: center; justify-content: center; font-size: 10px; color: var(--text-active); }
.bar { height: 6px; border-radius: 999px; background: var(--bg-inset); overflow: hidden; min-width: 60px; }
.bar > span { display: block; height: 100%; background: var(--action); border-radius: 999px; }
.bar.full > span { background: var(--live); }
.hint { font-size: 12px; color: var(--text-light); }
.copied { color: var(--live) !important; border-color: var(--live) !important; }
.sectionlabel { font-size: 12px; font-weight: 700; letter-spacing: -0.02em; text-transform: uppercase; color: var(--text-light); }

/* ---------- V1 table ---------- */
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-size: 12px; font-weight: 600; color: var(--text-light); padding: 10px 12px; border-bottom: 1px solid var(--border-subtle); white-space: nowrap; }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--border-subtle); vertical-align: middle; }
.tbl tr.helprow td:first-child { box-shadow: inset 3px 0 0 var(--badge-icon); }
.tbl tfoot td { font-size: 13px; color: var(--text-medium); font-weight: 600; border-bottom: 0; }
.cellstack { display: flex; flex-direction: column; gap: 3px; }
.inl { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
@container (max-width: 760px) {
  .tbl thead { display: none; }
  .tbl, .tbl tbody, .tbl tr, .tbl td, .tbl tfoot { display: block; width: 100%; }
  .tbl tr { padding: 10px 14px; border-bottom: 1px solid var(--border-subtle); display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; }
  .tbl td { padding: 0; border: 0; }
  .tbl td[data-l]::before { content: attr(data-l); display: block; font-size: 11px; color: var(--text-light); margin-bottom: 2px; }
  .tbl td.wide { grid-column: 1 / -1; }
  .tbl tr.helprow { box-shadow: inset 3px 0 0 var(--badge-icon); }
  .tbl tr.helprow td:first-child { box-shadow: none; }
}

/* ---------- V2 cards ---------- */
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.scard { padding: 14px; display: flex; flex-direction: column; gap: 10px; position: relative; min-height: 170px; }
.scard.help { box-shadow: 0 0 0 1.5px var(--badge-icon), var(--shadow-card); }
.scard .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 28px; }
.scard .big { font-size: 18px; font-weight: 700; line-height: 1.2; }
.scard .foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
.scard .line { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-medium); }
.helpline { font-size: 12px; background: var(--badge-bg); color: var(--text-warning); border-radius: var(--r-md); padding: 6px 8px; }
@container (max-width: 640px) { .cgrid { grid-template-columns: 1fr 1fr; gap: 8px; } .scard { padding: 10px; min-height: 150px; } .scard .big { font-size: 15px; } .scard .hidephone { display: none; } }

/* ---------- V3 roll call ---------- */
.roll-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; padding: 18px; }
.roll-num { font-size: 48px; font-weight: 700; line-height: 1; }
.roll-num small { font-size: 20px; color: var(--text-light); font-weight: 600; }
.segs { display: flex; gap: 4px; flex: 1; min-width: 200px; }
.segs span { flex: 1; height: 10px; border-radius: 3px; background: var(--bg-inset); }
.segs span.y { background: var(--live); }
.segs span.h { background: var(--border-task); }
.roll { list-style: none; margin: 0; padding: 0; }
.roll li { display: grid; grid-template-columns: 110px 1fr auto auto; gap: 14px; align-items: center; padding: 12px 18px; border-top: 1px solid var(--border-subtle); }
.bigtick { width: 34px; height: 34px; border-radius: 10px; border: 2px solid var(--border-control); background: var(--bg-surface); display: inline-flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; color: transparent; cursor: pointer; transition: transform 160ms var(--ease-out), background-color 150ms ease-out; }
.bigtick:active { transform: scale(0.94); }
.bigtick.y { background: var(--live); border-color: var(--live); color: #fff; }
.bigtick:disabled { opacity: .35; cursor: default; }
.tickcol { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--text-light); min-width: 54px; }
@container (max-width: 640px) { .roll li { grid-template-columns: 1fr auto auto; padding: 12px 14px; gap: 10px; } .roll li .rmeta { grid-column: 1 / -1; order: 4; } .roll-num { font-size: 40px; } }

/* ---------- V4 board ---------- */
.board { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 12px; align-items: start; }
.col { background: var(--bg-inset); border-radius: var(--r-2xl); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 120px; }
.col h3 { margin: 0 2px 2px; font-size: 13px; font-weight: 700; display: flex; justify-content: space-between; }
.col h3 span { color: var(--text-light); font-weight: 600; }
.bcard { background: var(--bg-surface); border-radius: var(--r-xl); box-shadow: var(--shadow-card); padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.bcard .r { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.offrow { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 14px; }
@container (max-width: 760px) { .board { grid-template-columns: 1fr; } .col { min-height: 0; } }

/* ---------- V5 map ---------- */
.mapwrap { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.floor { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.floor h3 { margin: 0; font-size: 13px; font-weight: 700; color: var(--text-light); }
.plan { display: grid; gap: 6px; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-auto-rows: 64px; }
.room { border: 1.5px solid var(--border-card); border-radius: var(--r-lg); padding: 6px; display: flex; flex-direction: column; gap: 4px; background: var(--bg-page); overflow: hidden; }
.room .rn { font-size: 11px; font-weight: 600; color: var(--text-light); line-height: 1.2; }
.room .logos { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.room.bay { background: var(--sch-blue); border-color: var(--border-outline); }
.room.judge { background: var(--sch-pink); }
.room.chat { background: var(--sch-orange); }
.mlogo { border: 0; background: var(--bg-surface); border-radius: var(--r-md); padding: 4px 6px; cursor: pointer; position: relative; box-shadow: var(--shadow-card); transition: transform 160ms var(--ease-out); }
.mlogo:active { transform: scale(0.96); }
.mlogo img.logo, .mlogo .wordmark { height: 16px; font-size: 12px; line-height: 16px; max-width: 64px; }
.mlogo.sel { box-shadow: 0 0 0 2px var(--action); }
.mlogo .ping { position: absolute; top: -3px; right: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--badge-icon); box-shadow: 0 0 0 2px #fff; }
.tray { padding: 12px 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.tray .mlogo { opacity: .55; }
.mapdetail { padding: 14px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
@container (max-width: 760px) { .mapwrap { grid-template-columns: 1fr; } .plan { grid-auto-rows: 58px; } }

/* ---------- V6 tiles ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.kpi .n { font-size: 32px; font-weight: 700; line-height: 1; }
.kpi .n small { font-size: 16px; color: var(--text-light); }
.kpi .l { font-size: 13px; color: var(--text-medium); }
.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.tile { padding: 12px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; border: 0; text-align: left; cursor: pointer; transition: transform 160ms var(--ease-out); }
.tile:active { transform: scale(0.98); }
.tile.ok { box-shadow: inset 0 -3px 0 var(--live), var(--shadow-card); }
.tile.warn { box-shadow: inset 0 -3px 0 var(--border-task), var(--shadow-card); }
.tile.wait { box-shadow: inset 0 -3px 0 var(--border-control), var(--shadow-card); }
.tile.off { opacity: .6; }
.duo { display: grid; grid-template-columns: 1.3fr 1fr; gap: 12px; }
.panel { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.panel h3 { margin: 0; font-size: 15px; }
.prow { display: flex; align-items: center; gap: 10px; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--border-subtle); flex-wrap: wrap; }
@container (max-width: 760px) { .kpis { grid-template-columns: 1fr 1fr; } .tiles { grid-template-columns: 1fr 1fr; } .duo { grid-template-columns: 1fr; } }

/* ---------- V7 triage ---------- */
.inbox { display: flex; flex-direction: column; gap: 8px; }
.item { padding: 14px; display: grid; grid-template-columns: 100px 1fr auto; gap: 14px; align-items: center; }
.item .say { font-size: 15px; line-height: 1.4; }
.item .say b { font-weight: 700; }
.item .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.item.urgent { box-shadow: inset 3px 0 0 var(--badge-icon), var(--shadow-card); }
.okfold summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--text-medium); padding: 12px 14px; list-style: none; }
.okfold summary::-webkit-details-marker { display: none; }
.okline { display: flex; gap: 12px; align-items: center; padding: 8px 14px; border-top: 1px solid var(--border-subtle); font-size: 13px; color: var(--text-medium); flex-wrap: wrap; }
.calm { padding: 22px; text-align: center; color: var(--text-medium); }
@container (max-width: 640px) { .item { grid-template-columns: 1fr; gap: 8px; } .item .acts { justify-content: flex-start; } }

/* ---------- V8 split ---------- */
.split { display: grid; grid-template-columns: 300px 1fr; gap: 12px; align-items: start; }
.slist { padding: 6px; display: flex; flex-direction: column; }
.sitem { border: 0; background: transparent; text-align: left; display: grid; grid-template-columns: 90px 1fr auto; gap: 8px; align-items: center; padding: 10px; border-radius: var(--r-lg); cursor: pointer; }
.sitem[aria-current="true"] { background: var(--bg-highlight); }
@media (hover: hover) and (pointer: fine) { .sitem:hover { background: var(--bg-inset); } }
.sdetail { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.dgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.dday { border: 1px solid var(--border-subtle); border-radius: var(--r-xl); padding: 12px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.dday.on { border-color: var(--border-outline); background: var(--bg-highlight); }
.kv { display: grid; grid-template-columns: 120px 1fr; gap: 8px 12px; font-size: 14px; }
.kv dt { color: var(--text-light); }
.kv dd { margin: 0; }
.backpill { display: none; }
@container (max-width: 760px) {
  .split { grid-template-columns: 1fr; }
  .split[data-open="1"] .slist { display: none; }
  .split[data-open="0"] .sdetail { display: none; }
  .backpill { display: inline-flex; align-self: flex-start; }
  .dgrid { grid-template-columns: 1fr; }
  .kv { grid-template-columns: 100px 1fr; }
}

/* ---------- V9 focus ---------- */
.strip { display: flex; gap: 6px; flex-wrap: wrap; }
.strip button { border: 0; background: var(--bg-surface); border-radius: var(--r-md); padding: 5px 7px; box-shadow: var(--shadow-card); cursor: pointer; position: relative; }
.strip button img.logo, .strip button .wordmark { height: 14px; font-size: 11px; line-height: 14px; max-width: 56px; }
.strip button[aria-current="true"] { box-shadow: 0 0 0 2px var(--action); }
.strip button .st { position: absolute; left: 4px; right: 4px; bottom: -4px; height: 3px; border-radius: 2px; }
.focus { padding: 28px; display: flex; flex-direction: column; gap: 20px; max-width: 640px; width: 100%; margin: 0 auto; }
.focus .flogo img.logo { height: 40px; max-width: 220px; }
.focus .flogo .wordmark { font-size: 32px; line-height: 40px; }
.focus .fstate { font-size: 26px; font-weight: 700; line-height: 1.2; }

<script>
// ---------------- dummy data ----------------
const LOGO = "../../public/shared/sponsors/";
const DAYS = [
  { key: "fri", short: "Fri", label: "Fri Nov 20", now: "7:40 pm" },
  { key: "sat", short: "Sat", label: "Sat Nov 21", now: "11:20 am" },
  { key: "sun", short: "Sun", label: "Sun Nov 22", now: "11:50 am" },
];
const S = [
  { id: "accenture", name: "Accenture", logo: "accenture.svg", owner: "Noah", booth: 1, url: "a3f9c2",
    fri: { expected: true, arrived: "5:42 pm", link: true }, sat: null,
    sun: null, sunWhere: "Left at 11:00 am", satWhere: "Booth 1, Sponsor Bay" },
  { id: "canadalife", name: "Canada Life", logo: "canadalife.png", owner: "Caroline", booth: 2, url: "c81d07",
    fri: { expected: true, arrived: "6:05 pm", link: true },
    sat: { room: "2243", hours: "10 am to 12 pm", format: "Groups of 3 · 30 min", booked: 9, wanted: 18, next: "11:30", nextFill: 1 },
    sun: { room: "2230", shortlist: 11, shortlistAt: "9:51 am", top5: false, where: "Rm 2230 · picking top 5" }, satWhere: "Rm 2243, coffee chats" },
  { id: "manulife", name: "Manulife", logo: "manulife.svg", owner: "Daniel", booth: 3, url: "m55e10",
    fri: { expected: true, arrived: "6:12 pm", link: true }, sat: null, sun: null, sunWhere: "Booth 3, Sponsor Bay", satWhere: "Booth 3, Sponsor Bay" },
  { id: "qnx", name: "QNX", logo: null, owner: "Alice", booth: 4, url: "q09b4e",
    fri: { expected: true, arrived: null, link: false, eta: "8:15 pm" }, sat: null,
    sun: { room: "2235", shortlist: 9, shortlistAt: "9:58 am", top5: false, where: "Rm 2235 · 2 teams left to present" }, satWhere: "Booth 4, Sponsor Bay" },
  { id: "tinyfish", name: "TinyFish", logo: "tinyfish.svg", owner: "Aniya", booth: 5, url: "t77a21",
    fri: { expected: true, arrived: "7:02 pm", link: true }, sat: null, sun: null, sunWhere: "Booth 5, Sponsor Bay", satWhere: "Booth 5, Sponsor Bay" },
  { id: "startech", name: "StarTech", logo: "startech.svg", owner: "Noah", booth: 6, url: "s21f88",
    fri: { expected: true, arrived: null, link: false, eta: "8:00 pm" },
    sat: { room: "2241", hours: "9 am to 1 pm", format: "1-on-1 · 15 min · 3 reps", booked: 17, wanted: 24, next: "11:30", nextFill: 2 },
    sun: null, sunWhere: "Booth 6, Sponsor Bay", satWhere: "Rm 2241, coffee chats" },
  { id: "cse", name: "CSE", logo: "cse-trimmed.png", owner: "Caroline", booth: 7, url: "e40c3d",
    fri: { expected: true, arrived: null, link: false, eta: "Running late, no ETA" }, sat: null, sun: null, sunWhere: "Booth 7, Sponsor Bay", satWhere: "Booth 7, Sponsor Bay" },
  { id: "sunlife", name: "Sun Life", logo: "sunlife.png", owner: "Daniel", booth: 8, url: "u63d92",
    fri: { expected: true, arrived: null, link: false, eta: "7:45 pm" },
    sat: { room: "2242", hours: "10 am to 4 pm", format: "Groups of 3 · 30 min", booked: 18, wanted: 18, next: "11:30", nextFill: 3 },
    sun: null, sunWhere: "Booth 8, Sponsor Bay", satWhere: "Rm 2242, coffee chats" },
  { id: "scotiabank", name: "Scotiabank", logo: "scotiabank-trimmed.svg", owner: "Alice", booth: 9, url: "b12e56",
    fri: { expected: true, arrived: "7:18 pm", link: false }, sat: null,
    sun: { room: "2110", shortlist: 14, shortlistAt: "9:44 am", top5: true, top5At: "11:44 am", where: "Rm 2110 · done judging" }, satWhere: "Booth 9, Sponsor Bay" },
  { id: "commure", name: "Commure", logo: "commure.svg", owner: "Aniya", booth: 10, url: "o98a17",
    fri: { expected: false, arrived: null, link: false }, sat: null, sun: null, sunWhere: "Booth 10, Sponsor Bay", satWhere: "Booth 10, Sponsor Bay" },
];
const PINGS = [
  { id: 1, sponsor: "manulife", day: "fri", text: "Need an extension cord at the booth", mins: 6, open: true },
  { id: 2, sponsor: "tinyfish", day: "fri", text: "Where do we unload the van?", mins: 14, open: true },
  { id: 3, sponsor: "sunlife", day: "sat", text: "A hacker didn't show up for the 11:00 group", mins: 3, open: true },
  { id: 4, sponsor: "startech", day: "sat", text: "Can we add a 4th rep after lunch?", mins: 12, open: true },
  { id: 5, sponsor: "qnx", day: "sun", text: "Projector in Rm 2235 keeps cutting out", mins: 2, open: true },
];
const SHIFTS = {
  fri: { Noah: "On until 2 am", Caroline: "On until 11 pm", Daniel: "On until midnight", Alice: "Arrives 8 pm", Aniya: "On until 10 pm" },
  sat: { Noah: "Off until 1 pm (on call)", Caroline: "On 8 am to 4 pm", Daniel: "On 9 am to 6 pm", Alice: "On 10 am to 8 pm", Aniya: "On call overnight 2 to 6 am" },
  sun: { Noah: "On 8 am to 3 pm", Caroline: "On 8 am to 3 pm", Daniel: "On 9 am to 1 pm", Alice: "On 8 am to 3 pm", Aniya: "Off" },
};
const OWNERS = ["Noah", "Caroline", "Daniel", "Alice", "Aniya"];

// ---------------- state ----------------
const state = { day: "fri", filter: "all", sel: "accenture", open: 0, focus: 0, mine: "all", floor: 1, mapSel: null, copied: null };

// ---------------- helpers ----------------
const byId = (id) => S.find((s) => s.id === id);
const dayObj = () => DAYS.find((d) => d.key === state.day);
const pingsFor = (s, day = state.day) => PINGS.filter((p) => p.sponsor === s.id && p.day === day && p.open);
const openPings = (day = state.day) => PINGS.filter((p) => p.day === day && p.open);
function logo(s, h) {
  const st = h ? ` style="height:${h}px;max-width:${h * 5}px"` : "";
  if (!s.logo) return `<span class="wordmark"${h ? ` style="font-size:${Math.round(h * 0.75)}px;line-height:${h}px"` : ""}>${s.name}</span>`;
  return `<img class="logo" src="${LOGO}${s.logo}" alt="${s.name}"${st}>`;
}
const ownerChip = (name) => `<span class="owner"><i>${name[0]}</i>${name}</span>`;
const tick = (y) => `<span class="tick ${y ? "y" : "n"}" aria-label="${y ? "Yes" : "No"}">✓</span>`;
const tag = (tone, text) => `<span class="tag ${tone}">${text}</span>`;
const portalUrl = (s) => `hackwestern.com/sponsors/${s.url}…`;
function portalPills(s, compact) {
  const c = state.copied === s.id;
  return `<span class="inl"><button class="pill ${c ? "copied" : ""}" data-act="copy" data-id="${s.id}">${c ? "Copied" : compact ? "Copy" : "Copy portal link"}</button><a class="pill link" href="#" data-act="noop">Portal ↗</a></span>`;
}
function judgeRoom(s) { return s.sun ? `Rm ${s.sun.room}` : `<span class="muted">No track</span>`; }

// status of one sponsor on the picked day
function st(s, day = state.day) {
  if (day === "fri") {
    const f = s.fri;
    if (!f.expected) return { tone: "off", short: "Coming Saturday", line: "Not expected today", where: "Not on site" };
    if (!f.arrived) return { tone: "wait", short: "Not here yet", line: `ETA ${f.eta}`, where: "On the way" };
    if (!f.link) return { tone: "warn", short: "Needs portal link", line: `Arrived ${f.arrived}`, where: `Booth ${s.booth}, Sponsor Bay` };
    return { tone: "ok", short: "All set", line: `Arrived ${f.arrived} · link given`, where: `Booth ${s.booth}, Sponsor Bay` };
  }
  if (day === "sat") {
    const c = s.sat;
    if (!c) return { tone: "off", short: "No coffee chats", line: "Booth only today", where: s.satWhere };
    const left = c.wanted - c.booked;
    if (left <= 0) return { tone: "ok", short: "Chats full", line: `${c.booked} of ${c.wanted} hackers booked`, where: s.satWhere };
    return { tone: left > c.wanted / 2 - 1 ? "warn" : "wait", short: `${left} spots open`, line: `${c.booked} of ${c.wanted} hackers booked`, where: s.satWhere };
  }
  const j = s.sun;
  if (!j) return { tone: "off", short: "No judging track", line: "Booth until closing", where: s.sunWhere };
  if (j.top5) return { tone: "ok", short: "Top 5 sent", line: `Sent ${j.top5At}`, where: j.where };
  return { tone: "wait", short: "Picking top 5", line: `Shortlist of ${j.shortlist} sent ${j.shortlistAt}`, where: j.where };
}
const expectedFri = () => S.filter((s) => s.fri.expected);
const arrivedFri = () => S.filter((s) => s.fri.arrived);
function summary() {
  if (state.day === "fri") {
    const a = arrivedFri().length, e = expectedFri().length, l = S.filter((s) => s.fri.arrived && s.fri.link).length;
    return `<b>${a} of ${e}</b> arrived · <b>${l} of ${a}</b> have their portal link`;
  }
  if (state.day === "sat") {
    const c = S.filter((s) => s.sat), b = c.reduce((n, s) => n + s.sat.booked, 0), w = c.reduce((n, s) => n + s.sat.wanted, 0);
    return `<b>${b} of ${w}</b> coffee chat spots booked · ${c.filter((s) => s.sat.booked >= s.sat.wanted).length} of ${c.length} sponsors full`;
  }
  const j = S.filter((s) => s.sun);
  return `Shortlists <b>${j.filter((s) => s.sun.shortlist).length} of ${j.length}</b> sent · Top 5 <b>${j.filter((s) => s.sun.top5).length} of ${j.length}</b> sent · round 2 open`;
}
function filterDefs() {
  const help = { key: "help", label: "Help", fn: (s) => pingsFor(s).length > 0 };
  if (state.day === "fri") return [
    { key: "all", label: "All", fn: () => true },
    { key: "notyet", label: "Not here yet", fn: (s) => s.fri.expected && !s.fri.arrived },
    { key: "nolink", label: "No link", fn: (s) => s.fri.arrived && !s.fri.link },
    help];
  if (state.day === "sat") return [
    { key: "all", label: "All", fn: () => true },
    { key: "chats", label: "Coffee chats", fn: (s) => !!s.sat },
    { key: "open", label: "Spots open", fn: (s) => s.sat && s.sat.booked < s.sat.wanted },
    help];
  return [
    { key: "all", label: "All", fn: () => true },
    { key: "judging", label: "Judging", fn: (s) => !!s.sun },
    { key: "top5", label: "Waiting on top 5", fn: (s) => s.sun && !s.sun.top5 },
    help];
}
function filtered() { const f = filterDefs().find((d) => d.key === state.filter) || filterDefs()[0]; return S.filter(f.fn); }
function filterPills() {
  return `<div class="filters" role="group" aria-label="Filter">${filterDefs().map((f) => `<button class="chip" data-act="filter" data-k="${f.key}" aria-pressed="${state.filter === f.key}">${f.label}<span>${S.filter(f.fn).length}</span></button>`).join("")}</div>`;
}
function helpTag(s) { const p = pingsFor(s); return p.length ? tag("help", `Help · ${p[0].mins}m`) : ""; }

function chrome(body, opts = {}) {
  const d = dayObj();
  const pings = openPings().length;
  return `<div class="app">
    <div class="app-top"><span class="app-title">Sponsors</span>
      <div class="tabs"><span class="on">Sponsors</span><span>Run of show</span><span>Coffee chats</span><span>Help${pings ? `<i class="count" style="font-style:normal">${pings}</i>` : ""}</span><span>Judging</span></div></div>
    <div class="dayrow">
      <div class="daypills" role="group" aria-label="Day">${DAYS.map((x) => `<button data-act="day" data-k="${x.key}" aria-pressed="${state.day === x.key}">${x.short}</button>`).join("")}</div>
      <span class="nowtag"><span class="livedot"></span>Now ${d.short} ${d.now}</span>
    </div>
    ${opts.noSummary ? "" : `<p class="summary">${summary()}</p>`}
    ${body}
  </div>`;
}

// ---------------- V1 Table ----------------
function v1() {
  const rows = filtered();
  const d = state.day;
  const head = d === "fri" ? "<th>Arrived</th><th>Portal link given</th>" : d === "sat" ? "<th>Coffee chats</th><th>Next slot</th>" : "<th>Shortlist</th><th>Top 5</th><th>Right now</th>";
  const cells = (s) => {
    const x = st(s);
    if (d === "fri") {
      if (!s.fri.expected) return `<td class="wide muted" colspan="2">Coming Saturday</td>`;
      return `<td data-l="Arrived"><span class="inl">${tick(s.fri.arrived)}${s.fri.arrived ? s.fri.arrived : `<span class="muted">ETA ${s.fri.eta}</span>`}</span></td>
        <td data-l="Portal link"><span class="inl">${tick(s.fri.link)}${s.fri.link ? "Given" : s.fri.arrived ? `<button class="pill link" data-act="link" data-id="${s.id}">Mark given</button>` : `<span class="muted">After they arrive</span>`}</span></td>`;
    }
    if (d === "sat") {
      if (!s.sat) return `<td class="wide muted" colspan="2">No coffee chats</td>`;
      const c = s.sat;
      return `<td data-l="Coffee chats"><div class="cellstack"><span><b>${c.booked}/${c.wanted}</b> hackers booked · Rm ${c.room}</span><div class="bar ${c.booked >= c.wanted ? "full" : ""}"><span style="width:${(c.booked / c.wanted) * 100}%"></span></div></div></td>
        <td data-l="Next slot">${c.next} · ${c.nextFill}/3</td>`;
    }
    if (!s.sun) return `<td class="wide muted" colspan="2">No judging track</td><td data-l="Right now">${x.where}</td>`;
    return `<td data-l="Shortlist"><span class="inl">${tick(true)}${s.sun.shortlist} teams</span></td>
      <td data-l="Top 5"><span class="inl">${tick(s.sun.top5)}${s.sun.top5 ? s.sun.top5At : `<span class="muted">Not yet</span>`}</span></td>
      <td data-l="Right now">${x.where}</td>`;
  };
  const foot = d === "fri" ? `${arrivedFri().length} of ${expectedFri().length} arrived · ${S.filter((s) => s.fri.link).length} links given` : d === "sat" ? summary().replace(/<\/?b>/g, "") : summary().replace(/<\/?b>/g, "");
  return chrome(`${filterPills()}
    <div class="card" style="overflow:hidden"><table class="tbl">
      <thead><tr><th>Sponsor</th><th>Owner</th>${head}<th>Help</th><th>Judging room</th><th>Portal</th></tr></thead>
      <tbody>${rows.map((s) => `<tr class="${pingsFor(s).length ? "helprow" : ""}">
        <td class="wide">${logo(s)}</td><td data-l="Owner">${ownerChip(s.owner)}</td>${cells(s)}
        <td data-l="Help">${pingsFor(s).length ? `<span title="${pingsFor(s)[0].text}">${helpTag(s)}</span>` : `<span class="muted">None</span>`}</td>
        <td data-l="Judging">${judgeRoom(s)}</td><td class="wide">${portalPills(s, true)}</td></tr>`).join("") || `<tr><td class="muted" colspan="9">Nobody here. Try All.</td></tr>`}</tbody>
      <tfoot><tr><td colspan="9">${foot}</td></tr></tfoot></table></div>`);
}

// ---------------- V2 Cards ----------------
function v2() {
  return chrome(`${filterPills()}<div class="cgrid">${filtered().map((s) => {
    const x = st(s), p = pingsFor(s);
    let mid = "";
    if (state.day === "fri" && s.fri.expected) mid = `<div class="line">${tick(s.fri.arrived)} Arrived</div><div class="line">${tick(s.fri.link)} Portal link</div>`;
    if (state.day === "sat" && s.sat) mid = `<div class="bar ${s.sat.booked >= s.sat.wanted ? "full" : ""}"><span style="width:${(s.sat.booked / s.sat.wanted) * 100}%"></span></div><div class="line small">Next ${s.sat.next} · ${s.sat.nextFill}/3 · Rm ${s.sat.room}</div>`;
    if (state.day === "sun" && s.sun) mid = `<div class="line">${tick(true)} Shortlist · ${s.sun.shortlist}</div><div class="line">${tick(s.sun.top5)} Top 5</div>`;
    return `<div class="card scard ${p.length ? "help" : ""}">
      <div class="top">${logo(s, 22)}${tag(x.tone, x.tone === "ok" ? "✓" : x.tone === "off" ? "" : "•")}</div>
      <div><p class="big">${x.short}</p><p class="small muted">${x.line}</p></div>
      ${mid}
      ${p.length ? `<p class="helpline">${p[0].text} · ${p[0].mins}m</p>` : ""}
      <div class="foot">${ownerChip(s.owner)}<span class="hidephone small muted">${state.day === "sun" ? judgeRoom(s) : x.where}</span>${portalPills(s, true)}</div>
    </div>`;
  }).join("")}</div>`);
}

// ---------------- V3 Roll call ----------------
function v3() {
  const d = state.day;
  let num, of, label, segs, rows;
  if (d === "fri") {
    const e = expectedFri();
    num = arrivedFri().length; of = e.length; label = "arrived";
    segs = e.map((s) => `<span class="${s.fri.arrived && s.fri.link ? "y" : s.fri.arrived ? "h" : ""}" title="${s.name}"></span>`).join("");
    rows = e.map((s) => `<li>${logo(s)}<span class="rmeta"><span class="strong">${s.name}</span> <span class="small muted">· ${s.fri.arrived ? `arrived ${s.fri.arrived}` : `ETA ${s.fri.eta}`} · ${s.owner}</span> ${helpTag(s)}</span>
      <span class="tickcol"><button class="bigtick ${s.fri.arrived ? "y" : ""}" data-act="arrive" data-id="${s.id}" aria-label="${s.name} arrived">✓</button>Arrived</span>
      <span class="tickcol"><button class="bigtick ${s.fri.link ? "y" : ""}" data-act="link" data-id="${s.id}" ${s.fri.arrived ? "" : "disabled"} aria-label="${s.name} has portal link">✓</button>Link</span></li>`).join("")
      + `<li><span class="muted small">Commure</span><span class="rmeta small muted">Coming Saturday, nothing to tick today</span><span></span><span></span></li>`;
  } else if (d === "sat") {
    const c = S.filter((s) => s.sat);
    num = c.reduce((n, s) => n + s.sat.booked, 0); of = c.reduce((n, s) => n + s.sat.wanted, 0); label = "chat spots booked";
    segs = c.map((s) => `<span style="flex:${s.sat.wanted};background:linear-gradient(90deg,var(--action) ${(s.sat.booked / s.sat.wanted) * 100}%,var(--bg-inset) 0)" title="${s.name}"></span>`).join("");
    rows = c.map((s) => `<li>${logo(s)}<span class="rmeta"><span class="strong">${s.sat.booked} of ${s.sat.wanted} hackers</span> <span class="small muted">· ${s.sat.format} · Rm ${s.sat.room} · ${s.owner}</span> ${helpTag(s)}</span>
      <span class="tickcol"><span class="strong" style="font-size:16px;color:var(--text-heavy)">${s.sat.nextFill}/3</span>Next ${s.sat.next}</span>
      <span class="tickcol"><span class="bigtick ${s.sat.booked >= s.sat.wanted ? "y" : ""}">✓</span>Full</span></li>`).join("")
      + `<li><span class="muted small">7 others</span><span class="rmeta small muted">No coffee chats, booth only</span><span></span><span></span></li>`;
  } else {
    const j = S.filter((s) => s.sun);
    num = j.filter((s) => s.sun.top5).length; of = j.length; label = "top 5s in";
    segs = j.map((s) => `<span class="${s.sun.top5 ? "y" : "h"}"></span>`).join("");
    rows = j.map((s) => `<li>${logo(s)}<span class="rmeta"><span class="strong">Rm ${s.sun.room}</span> <span class="small muted">· ${s.sun.where} · ${s.owner}</span> ${helpTag(s)}</span>
      <span class="tickcol"><span class="bigtick y">✓</span>Shortlist</span>
      <span class="tickcol"><span class="bigtick ${s.sun.top5 ? "y" : ""}">✓</span>Top 5</span></li>`).join("")
      + `<li><span class="muted small">7 others</span><span class="rmeta small muted">No judging track · at their booths until closing</span><span></span><span></span></li>`;
  }
  return chrome(`<div class="card">
    <div class="roll-head"><div><div class="roll-num">${num}<small> of ${of}</small></div><p class="muted">${label}</p></div><div class="segs">${segs}</div></div>
    <ul class="roll">${rows}</ul></div>
    <p class="hint">${d === "fri" ? "Tap a box as each sponsor walks in. Link unlocks once they're here." : "Ticks fill in on their own from the portal."}</p>`, { noSummary: true });
}

// ---------------- V4 Board ----------------
function v4() {
  const d = state.day;
  const cols = d === "fri"
    ? [["Not here yet", (s) => s.fri.expected && !s.fri.arrived], ["Here, needs link", (s) => s.fri.arrived && !s.fri.link], ["All set", (s) => s.fri.arrived && s.fri.link]]
    : d === "sat"
      ? [["Lots open", (s) => s.sat && s.sat.wanted - s.sat.booked > s.sat.wanted / 3], ["Almost full", (s) => s.sat && s.sat.booked < s.sat.wanted && s.sat.wanted - s.sat.booked <= s.sat.wanted / 3], ["Full", (s) => s.sat && s.sat.booked >= s.sat.wanted]]
      : [["Shortlist not sent", (s) => s.sun && !s.sun.shortlist], ["Presenting", (s) => s.sun && s.sun.where.includes("present")], ["Picking top 5", (s) => s.sun && !s.sun.top5 && !s.sun.where.includes("present")], ["Top 5 sent", (s) => s.sun && s.sun.top5]];
  const off = S.filter((s) => !cols.some(([, f]) => f(s)));
  const card = (s) => {
    const x = st(s);
    let extra = "";
    if (d === "fri" && !s.fri.arrived) extra = `<button class="pill link" data-act="arrive" data-id="${s.id}">Mark arrived</button>`;
    else if (d === "fri" && !s.fri.link) extra = `<button class="pill link" data-act="link" data-id="${s.id}">Mark link given</button>`;
    if (d === "sat") extra = `<div class="bar ${s.sat.booked >= s.sat.wanted ? "full" : ""}"><span style="width:${(s.sat.booked / s.sat.wanted) * 100}%"></span></div>`;
    return `<div class="bcard"><div class="r">${logo(s, 18)}${helpTag(s)}</div><p class="small">${x.line}</p>${d === "sat" ? `<p class="small muted">Next ${s.sat.next} · ${s.sat.nextFill}/3 · Rm ${s.sat.room}</p>` : ""}${d === "sun" ? `<p class="small muted">${s.sun.where}</p>` : ""}<div class="r">${ownerChip(s.owner)}${extra}</div></div>`;
  };
  return chrome(`<div class="board" style="--cols:${cols.length}">${cols.map(([t, f]) => { const l = S.filter(f); return `<div class="col"><h3>${t}<span>${l.length}</span></h3>${l.map(card).join("") || `<p class="small muted" style="padding:4px">Nobody</p>`}</div>`; }).join("")}</div>
    ${off.length ? `<div class="card offrow"><span class="small muted">${d === "fri" ? "Not today" : d === "sat" ? "No coffee chats" : "No judging track"}</span>${off.map((s) => logo(s, 16)).join("")}</div>` : ""}`);
}

// ---------------- V5 Map ----------------
function v5() {
  const d = state.day;
  const place = (s) => {
    if (d === "fri") return s.fri.arrived ? "bay" : null;
    if (d === "sat") return s.sat ? `r${s.sat.room}` : "bay";
    if (s.sun) return `r${s.sun.room}`;
    return s.sunWhere.startsWith("Left") ? null : "bay";
  };
  const at = (k) => S.filter((s) => place(s) === k).map((s) => `<button class="mlogo ${state.mapSel === s.id ? "sel" : ""}" data-act="mapsel" data-id="${s.id}" aria-label="${s.name}">${logo(s)}${pingsFor(s).length ? `<span class="ping"></span>` : ""}</button>`).join("");
  const room = (k, name, cls, span) => `<div class="room ${cls}" style="grid-column:span ${span[0]};grid-row:span ${span[1]}"><span class="rn">${name}</span><div class="logos">${at(k)}</div></div>`;
  const f1 = `<div class="card floor"><h3>Floor 1</h3><div class="plan">
    ${room("bay", "Sponsor Bay · SM Atrium", "bay", [4, 3])}${room("r1110", "Grand Hall · Rm 1110", "", [2, 2])}${room("x", "Entrance", "", [2, 1])}</div></div>`;
  const f2 = `<div class="card floor"><h3>Floor 2</h3><div class="plan">
    ${room("r2110", d === "sun" ? "Rm 2110 · Scotiabank judging" : "Rm 2110 · sponsor lounge", d === "sun" ? "judge" : "", [2, 1])}${room("r2230", "Rm 2230 · Canada Life judging", d === "sun" ? "judge" : "", [2, 1])}${room("r2235", "Rm 2235 · QNX judging", d === "sun" ? "judge" : "", [2, 1])}
    ${room("r2241", "Rm 2241 · chats", d === "sat" ? "chat" : "", [2, 1])}${room("r2242", "Rm 2242 · chats", d === "sat" ? "chat" : "", [2, 1])}${room("r2243", "Rm 2243 · chats", d === "sat" ? "chat" : "", [2, 1])}
    ${room("r2244", "Rm 2244 · belongings", "", [6, 1])}</div></div>`;
  const away = S.filter((s) => !place(s));
  const sel = state.mapSel && byId(state.mapSel);
  const detail = sel ? (() => { const x = st(sel); return `<div class="card mapdetail">${logo(sel, 24)}<div style="flex:1;min-width:160px"><p class="strong">${x.short}</p><p class="small muted">${x.line} · ${x.where}</p></div>${ownerChip(sel.owner)}${helpTag(sel)}<span class="small muted">Judging ${judgeRoom(sel)}</span>${portalPills(sel)}</div>`; })() : `<p class="hint">Tap a logo to see who it is and what they need.</p>`;
  return chrome(`<div class="mapwrap">${f1}${f2}</div>
    ${away.length ? `<div class="card tray"><span class="small muted">${d === "fri" ? "Not here yet" : "Not on site"}</span>${away.map((s) => `<button class="mlogo ${state.mapSel === s.id ? "sel" : ""}" data-act="mapsel" data-id="${s.id}" aria-label="${s.name}">${logo(s)}</button>`).join("")}</div>` : ""}
    ${detail}`);
}

// ---------------- V6 Tiles ----------------
function v6() {
  const d = state.day;
  let k;
  if (d === "fri") k = [[`${arrivedFri().length}<small>/${expectedFri().length}</small>`, "arrived"], [`${S.filter((s) => s.fri.link).length}<small>/${arrivedFri().length}</small>`, "have their portal link"], [openPings().length, "help pings open"], ["1", "coming Saturday"]];
  else if (d === "sat") { const c = S.filter((s) => s.sat); k = [[`${c.reduce((n, s) => n + s.sat.booked, 0)}<small>/${c.reduce((n, s) => n + s.sat.wanted, 0)}</small>`, "chat spots booked"], [`${c.filter((s) => s.sat.booked >= s.sat.wanted).length}<small>/${c.length}</small>`, "sponsors full"], [openPings().length, "help pings open"], ["3", "chat rooms in use"]]; }
  else { const j = S.filter((s) => s.sun); k = [[`${j.length}<small>/${j.length}</small>`, "shortlists sent"], [`${j.filter((s) => s.sun.top5).length}<small>/${j.length}</small>`, "top 5s sent"], [openPings().length, "help pings open"], ["1", "room running late"]]; }
  const pings = openPings();
  return chrome(`<div class="kpis">${k.map(([n, l]) => `<div class="card kpi"><span class="n">${n}</span><span class="l">${l}</span></div>`).join("")}</div>
    <div class="tiles">${S.map((s) => { const x = st(s); return `<button class="card tile ${x.tone}" data-act="sel8" data-id="${s.id}">${logo(s, 18)}<span class="small strong">${x.short}</span><span class="small muted">${s.owner}</span></button>`; }).join("")}</div>
    <div class="duo">
      <div class="card panel"><h3>Help pings</h3>${pings.map((p) => `<div class="prow"><span class="inl">${logo(byId(p.sponsor), 16)}<span class="small">${p.text}</span></span><span class="inl"><span class="small muted">${p.mins}m · ${byId(p.sponsor).owner}</span><button class="pill" data-act="resolve" data-id="${p.id}">Resolve</button></span></div>`).join("") || `<p class="small muted">No one needs help right now.</p>`}</div>
      <div class="card panel"><h3>Spon team today</h3>${OWNERS.map((o) => `<div class="prow">${ownerChip(o)}<span class="small muted">${S.filter((s) => s.owner === o).map((s) => s.name).join(", ")}</span><span class="small">${SHIFTS[d][o]}</span></div>`).join("")}</div>
    </div>`);
}

// ---------------- V7 Needs you ----------------
function v7() {
  const d = state.day, items = [];
  openPings().forEach((p) => { const s = byId(p.sponsor); items.push({ s, urgent: true, say: `<b>${s.name}</b> asked: "${p.text}"`, meta: `${p.mins} min ago · ${s.owner} owns them · ${st(s).where}`, acts: `<button class="pill solid" data-act="resolve" data-id="${p.id}">Resolve</button><button class="pill">Call rep</button>` }); });
  if (d === "fri") {
    S.filter((s) => s.fri.arrived && !s.fri.link).forEach((s) => items.push({ s, say: `<b>${s.name}</b> is here but hasn't been given their portal link`, meta: `Arrived ${s.fri.arrived} · ${s.owner} owns them`, acts: `<button class="pill solid" data-act="link" data-id="${s.id}">Mark given</button>${portalPills(s, true)}` }));
    S.filter((s) => s.fri.expected && !s.fri.arrived).forEach((s) => items.push({ s, say: `<b>${s.name}</b> isn't here yet`, meta: `ETA ${s.fri.eta} · ${s.owner} owns them`, acts: `<button class="pill" data-act="arrive" data-id="${s.id}">Mark arrived</button>` }));
  } else if (d === "sat") {
    S.filter((s) => s.sat && s.sat.booked < s.sat.wanted).forEach((s) => items.push({ s, say: `<b>${s.name}</b> still has ${s.sat.wanted - s.sat.booked} coffee chat spots open`, meta: `${s.sat.booked} of ${s.sat.wanted} booked · next ${s.sat.next} is ${s.sat.nextFill}/3 · Rm ${s.sat.room}`, acts: `<button class="pill">Post in #hackers</button><button class="pill link">Coffee chats</button>` }));
  } else {
    S.filter((s) => s.sun && !s.sun.top5).forEach((s) => items.push({ s, say: `Waiting on <b>${s.name}</b>'s top 5`, meta: `${s.sun.where} · ${s.owner} owns them`, acts: `<button class="pill">Nudge on Slack</button>${portalPills(s, true)}` }));
  }
  const fine = S.filter((s) => !items.some((i) => i.s === s));
  return chrome(`<p style="font-size:20px;font-weight:700">${items.length ? `${items.length} things need you` : "Nothing needs you right now"}</p>
    <div class="inbox">${items.map((i) => `<div class="card item ${i.urgent ? "urgent" : ""}">${logo(i.s)}<div><p class="say">${i.say}</p><p class="small muted">${i.meta}</p></div><div class="acts">${i.acts}</div></div>`).join("") || `<div class="card calm">All sponsors are on track.</div>`}</div>
    <details class="card okfold"><summary>On track · ${fine.length} ▾</summary>${fine.map((s) => { const x = st(s); return `<div class="okline">${logo(s, 16)}<span>${x.short}</span><span class="muted">${x.line}</span><span class="muted">${s.owner}</span></div>`; }).join("")}</details>`, { noSummary: false });
}

// ---------------- V8 Split ----------------
function v8() {
  const s = byId(state.sel), x = st(s), p = pingsFor(s);
  const day = (k) => {
    const y = st(s, k), lbl = DAYS.find((d) => d.key === k).label;
    let body = "";
    if (k === "fri") body = s.fri.expected ? `<span class="inl">${tick(s.fri.arrived)} Arrived ${s.fri.arrived || ""}</span><span class="inl">${tick(s.fri.link)} Portal link given</span>` : `<span class="muted">Not coming Friday</span>`;
    if (k === "sat") body = s.sat ? `<span>${s.sat.booked}/${s.sat.wanted} hackers booked</span><span class="muted">${s.sat.format}</span><span class="muted">Rm ${s.sat.room} · ${s.sat.hours}</span><span>Next ${s.sat.next} · ${s.sat.nextFill}/3</span>` : `<span class="muted">No coffee chats</span><span class="muted">${s.satWhere}</span>`;
    if (k === "sun") body = s.sun ? `<span class="inl">${tick(true)} Shortlist · ${s.sun.shortlist} teams</span><span class="inl">${tick(s.sun.top5)} Top 5 ${s.sun.top5 ? s.sun.top5At : ""}</span><span class="muted">${s.sun.where}</span>` : `<span class="muted">No judging track</span><span class="muted">${s.sunWhere}</span>`;
    return `<div class="dday ${k === state.day ? "on" : ""}"><span class="sectionlabel">${lbl}</span><span class="strong">${y.short}</span>${body}</div>`;
  };
  return chrome(`<div class="split" data-open="${state.open}">
    <div class="card slist">${filterPills()}<div style="height:6px"></div>${filtered().map((t) => { const y = st(t); return `<button class="sitem" data-act="sel" data-id="${t.id}" aria-current="${t.id === state.sel}">${logo(t, 18)}<span class="small">${y.short}</span>${pingsFor(t).length ? tag("help", "Help") : `<span class="tick ${y.tone === "ok" ? "y" : "n"}">✓</span>`}</button>`; }).join("")}</div>
    <div class="card sdetail">
      <button class="pill backpill" data-act="back">‹ All sponsors</button>
      <div class="inl" style="justify-content:space-between;width:100%">${logo(s, 32)}${tag(x.tone, x.short)}</div>
      ${p.length ? `<p class="helpline" style="font-size:14px">Help ping: "${p[0].text}" · ${p[0].mins} min ago <button class="pill" data-act="resolve" data-id="${p[0].id}" style="margin-left:6px">Resolve</button></p>` : ""}
      <dl class="kv"><dt>Owner</dt><dd>${ownerChip(s.owner)}</dd><dt>Right now</dt><dd>${x.where}</dd><dt>Booth</dt><dd>Booth ${s.booth}, Sponsor Bay</dd><dt>Judging room</dt><dd>${s.sun ? `Rm ${s.sun.room}, Sunday` : "No track"}</dd><dt>Portal</dt><dd><span class="small muted">${portalUrl(s)}</span><br>${portalPills(s)}</dd></dl>
      <div class="dgrid">${day("fri")}${day("sat")}${day("sun")}</div>
    </div></div>`);
}

// ---------------- V9 One at a time ----------------
function v9() {
  const list = S, i = Math.min(state.focus, list.length - 1), s = list[i], x = st(s), p = pingsFor(s);
  const d = state.day;
  let checks = "";
  if (d === "fri") checks = s.fri.expected ? `<div class="fcheck"><button class="bigtick ${s.fri.arrived ? "y" : ""}" data-act="arrive" data-id="${s.id}">✓</button>Arrived ${s.fri.arrived ? `<span class="muted">${s.fri.arrived}</span>` : `<span class="muted">· ETA ${s.fri.eta}</span>`}</div><div class="fcheck"><button class="bigtick ${s.fri.link ? "y" : ""}" data-act="link" data-id="${s.id}" ${s.fri.arrived ? "" : "disabled"}>✓</button>Portal link given</div>` : `<p class="muted">Not coming today. Skip to the next one.</p>`;
  if (d === "sat") checks = s.sat ? `<div><p class="strong" style="font-size:18px">${s.sat.booked} of ${s.sat.wanted} hackers booked</p><div class="bar ${s.sat.booked >= s.sat.wanted ? "full" : ""}" style="height:10px;margin-top:8px"><span style="width:${(s.sat.booked / s.sat.wanted) * 100}%"></span></div><p class="small muted" style="margin-top:8px">${s.sat.format} · Rm ${s.sat.room} · ${s.sat.hours} · next ${s.sat.next} is ${s.sat.nextFill}/3</p></div>` : `<p class="muted">No coffee chats. At their booth all day.</p>`;
  if (d === "sun") checks = s.sun ? `<div class="fcheck">${tick(true)} Shortlist sent · ${s.sun.shortlist} teams</div><div class="fcheck">${tick(s.sun.top5)} Top 5 ${s.sun.top5 ? `sent ${s.sun.top5At}` : "not in yet"}</div>` : `<p class="muted">No judging track today.</p>`;
  return chrome(`<div class="strip">${list.map((t, j) => { const y = st(t); return `<button data-act="focus" data-i="${j}" aria-current="${j === i}" aria-label="${t.name}">${logo(t)}<span class="st" style="background:${y.tone === "ok" ? "var(--live)" : y.tone === "warn" ? "var(--border-task)" : y.tone === "wait" ? "var(--border-control)" : "transparent"}"></span></button>`; }).join("")}</div>
    <div class="card focus">
      <div class="inl" style="justify-content:space-between"><span class="small muted">${i + 1} of ${list.length} · booth order</span>${ownerChip(s.owner)}</div>
      <div class="flogo">${logo(s)}</div>
      <div><p class="fstate">${x.short}</p><p class="muted">${x.where}</p></div>
      <div class="fchecks">${checks}</div>
      ${p.length ? `<p class="helpline" style="font-size:14px">"${p[0].text}" · ${p[0].mins} min ago</p>` : ""}
      <div class="inl"><span class="small muted">Judging ${judgeRoom(s)}</span>${portalPills(s)}</div>
      <div class="fnav"><button class="pill" data-act="focus" data-i="${(i - 1 + list.length) % list.length}">‹ Previous</button><button class="pill solid" data-act="focus" data-i="${(i + 1) % list.length}">Next sponsor ›</button></div>
    </div>`);
}

// ---------------- V10 By owner ----------------
function v10() {
  const shown = state.mine === "all" ? OWNERS : [state.mine];
  return chrome(`<div class="filters" role="group" aria-label="Owner"><button class="chip" data-act="mine" data-k="all" aria-pressed="${state.mine === "all"}">Everyone<span>${S.length}</span></button>${OWNERS.map((o) => `<button class="chip" data-act="mine" data-k="${o}" aria-pressed="${state.mine === o}">${o}<span>${S.filter((s) => s.owner === o).length}</span></button>`).join("")}</div>
    <div class="owners">${shown.map((o) => { const mine = S.filter((s) => s.owner === o), ok = mine.filter((s) => st(s).tone === "ok" || st(s).tone === "off").length, pk = mine.reduce((n, s) => n + pingsFor(s).length, 0);
      return `<div class="card ocard"><div class="ohead"><h3>${o}</h3><span class="small muted">${SHIFTS[state.day][o]}</span><span class="small">${ok} of ${mine.length} fine${pk ? ` · <span style="color:var(--text-warning)">${pk} help</span>` : ""}</span></div>
      ${mine.map((s) => { const x = st(s), p = pingsFor(s); return `<div class="orow">${logo(s, 18)}<div><p class="strong">${x.short}</p><p class="small muted">${x.line} · ${x.where}</p>${p.length ? `<p class="small" style="color:var(--text-warning)">"${p[0].text}"</p>` : ""}<p class="small muted">Judging ${judgeRoom(s)}</p></div>${portalPills(s, true)}</div>`; }).join("")}</div>`; }).join("")}</div>`);
}

const variants = [v1, v2, v3, v4, v5, v6, v7, v8, v9, v10];
const NOTES = [
  ["Table", "Dense rows you can scan down; columns swap per day, so Friday is arrival ticks and Sunday is shortlist and top 5."],
  ["Cards", "One card per sponsor with the day's state as the headline; good when you glance rather than read."],
  ["Roll call", "Built for the Friday door: one big count and tap-to-tick rows. Sat and Sun reuse the same 'X of Y' frame."],
  ["Board", "Sponsors sit in columns by where they are in the day (not here, needs link, all set), so the left column is your to-do."],
  ["Map", "Logos placed where each sponsor should be right now on the floor plan; spots the ones in the wrong place."],
  ["Tiles", "Dashboard: the day's numbers up top, a logo wall coloured by state, then help pings and who's on shift."],
  ["Needs you", "A triage list written as sentences: only what needs action, ranked; everything fine folds away."],
  ["Split", "List on the left, one sponsor's whole weekend on the right; on phones the list pushes to the detail."],
  ["One at a time", "Walk the bay booth by booth: one sponsor full screen with big ticks and Next, like a checklist on the go."],
  ["By owner", "Grouped by spon team member with their shift, so each person sees their own sponsors first."],
];

// ---------------- events ----------------
const stage = document.getElementById("stage");
function rerender() { stage.innerHTML = variants[current](); }
stage.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  if (a === "noop") { e.preventDefault(); return; }
  if (a === "day") { state.day = b.dataset.k; state.filter = "all"; state.mapSel = null; }
  if (a === "filter") state.filter = b.dataset.k;
  if (a === "mine") state.mine = b.dataset.k;
  if (a === "copy") { state.copied = id; setTimeout(() => { if (state.copied === id) { state.copied = null; rerender(); } }, 1500); }
  if (a === "link") { const s = byId(id); if (s.fri.arrived) s.fri.link = !s.fri.link; }
  if (a === "arrive") { const s = byId(id); if (s.fri.expected) { s.fri.arrived = s.fri.arrived ? null : "7:40 pm"; if (!s.fri.arrived) s.fri.link = false; } }
  if (a === "resolve") { const p = PINGS.find((x) => x.id === +id); p.open = false; }
  if (a === "sel") { state.sel = id; state.open = 1; }
  if (a === "sel8") { state.sel = id; setActive(7); state.open = 1; rerender(); return; }
  if (a === "back") state.open = 0;
  if (a === "mapsel") state.mapSel = state.mapSel === id ? null : id;
  if (a === "focus") state.focus = +b.dataset.i;
  rerender();
});
document.getElementById("mode").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll("#mode button").forEach((x) => x.setAttribute("aria-pressed", x === b));
  document.getElementById("frame").dataset.mode = b.dataset.mode;
  const u = new URL(location); u.searchParams.set("m", b.dataset.mode); history.replaceState(null, "", u);
});
const m0 = new URLSearchParams(location.search).get("m");
if (m0 === "phone") document.querySelector('#mode [data-mode="phone"]').click();

// ---------------- picker wiring (PICKER.md reference) ----------------
const picker = document.querySelector(".proto-picker");
const highlight = picker.querySelector(".proto-picker-highlight");
const items = [...picker.querySelectorAll(".proto-picker-item")];
let current = 0;
function moveHighlight() { const el = items[current]; highlight.style.width = el.offsetWidth + "px"; highlight.style.transform = `translateX(${el.offsetLeft}px)`; }
function mount(i) { stage.innerHTML = ""; requestAnimationFrame(() => { stage.innerHTML = variants[i](); }); }
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => { el.toggleAttribute("data-active", j === i); if (j === i) el.setAttribute("aria-current", "true"); else el.removeAttribute("aria-current"); });
  moveHighlight();
  items[i].scrollIntoView({ block: "nearest", inline: "nearest" });
  document.getElementById("note").innerHTML = `<b>${i + 1} · ${NOTES[i][0]}.</b> ${NOTES[i][1]}`;
  const url = new URL(location); url.searchParams.set("v", i + 1); history.replaceState(null, "", url);
  mount(i);
}
items.forEach((el, i) => el.addEventListener("click", () => setActive(i)));
window.addEventListener("resize", moveHighlight);
document.addEventListener("keydown", (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= 9) setActive(num - 1);
  else if (e.key === "0") setActive(9);
  else if (e.key === "ArrowRight") setActive((current + 1) % variants.length);
  else if (e.key === "ArrowLeft") setActive((current - 1 + variants.length) % variants.length);
});
const requested = parseInt(new URLSearchParams(location.search).get("v"), 10);
setActive(requested >= 1 && requested <= variants.length ? requested - 1 : 0);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute("data-ready", "")));
</script>
