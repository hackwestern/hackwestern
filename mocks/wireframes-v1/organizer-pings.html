<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Organizer pings · wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== Design tokens (src/lib/tokens.ts → dashboardColors) ===== */
:root{
  --text-heavy:#0b2b4a; --text-medium:#1c3550; --text-light:#516476;
  --text-placeholder:rgba(81,100,118,.7); --text-disabled:rgba(81,100,118,.5);
  --text-inverse:#fff; --text-link:#0b6bc4; --text-active:#08559c;
  --text-warning:#8a4300; --text-task:#5c3d00;
  --bg-page:#f3f7fc; --bg-surface:#fff; --bg-nav:#dbe7f5; --bg-nav-selected:#b9d3f0;
  --bg-inset:#edf3fa; --bg-highlight:#e1effb; --bg-highlight-subtle:rgba(225,239,251,.4);
  --bg-task:#ffefb8;
  --action-primary:#0b6bc4;
  --border-default:#cdddeb; --border-subtle:#e0eaf3; --border-card:#d6e3ef;
  --border-control:#b9cbe0; --border-outline:#accae5; --border-task:#c78a00;
  --border-faint:rgba(81,100,118,.1); --border-muted:rgba(81,100,118,.2); --border-strong:#516476;
  --status-live:#16803c; --status-warning:#a34a00;
  --sch-pink:rgba(250,104,235,.15); --sch-blue:rgba(37,130,254,.15);
  --sch-green:rgba(104,250,109,.15); --sch-orange:rgba(254,145,37,.15);
  --r-xs:4px; --r-sm:6px; --r-md:8px; --r-lg:12px; --r-2xl:20px;
  --shadow-card:0 1px 2px rgba(11,43,74,.06),0 4px 12px rgba(11,43,74,.06);
  --ease-out:cubic-bezier(.23,1,.32,1);
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);color:var(--text-heavy);background:#e9eef4;font-size:14px;line-height:1.45;padding:64px 0 40px}
button,a,[role=button]{touch-action:manipulation}
button{font:inherit;color:inherit;user-select:none;-webkit-user-select:none}
input,select,textarea{font:inherit;font-size:16px}
h1,h2,h3,h4,p{margin:0}
ul{margin:0;padding:0;list-style:none}

/* ===== Harness chrome (not part of the design) ===== */
.h-top{max-width:1312px;margin:0 auto;padding:12px 16px 8px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.h-title{font-weight:700;font-size:15px}
.h-badge{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#6b4e00;background:#fff3c4;border:1px solid #e6c55a;border-radius:999px;padding:2px 8px}
.h-frame-toggle{margin-left:auto;display:inline-flex;background:#dfe6ee;border-radius:999px;padding:2px}
.h-frame-toggle button{border:0;background:transparent;border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;color:#445}
.h-frame-toggle button[aria-pressed=true]{background:#fff;color:#111;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.h-note{max-width:1312px;margin:0 auto;padding:0 16px 12px;font-size:13px;color:#445}
.h-note b{color:#111}
.frame{container-type:inline-size;margin:0 auto;width:1280px;max-width:calc(100% - 32px);background:var(--bg-page);border-radius:14px;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 10px 30px rgba(0,0,0,.08);overflow:hidden;min-height:70vh}
.frame[data-mode=phone]{width:375px}
@media (max-width:420px){.frame{max-width:100%;border-radius:0}}

/* Picker: PICKER.md verbatim, data-position="top" */
.proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;max-width:calc(100vw - 16px);overflow-x:auto;scrollbar-width:none}
.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12)}
.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}
@media (prefers-reduced-motion:reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}}
.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;white-space:nowrap;transition:color 150ms ease-out,transform 160ms cubic-bezier(.23,1,.32,1)}
@media (hover:hover) and (pointer:fine){.proto-picker-item:hover{color:rgba(255,255,255,.85)}}
.proto-picker-item:active{transform:scale(.97)}
.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}
.proto-picker-item[data-active]{color:#fff}
.proto-picker[data-position=top]{bottom:auto;top:12px}

/* ===== Shared wireframe kit (uses tokens) ===== */
.app{min-height:70vh;font-size:14px}
.wrap{padding:20px 24px;display:flex;flex-direction:column;gap:16px}
@container (max-width:640px){.wrap{padding:16px}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:8px}
.muted{color:var(--text-light)}
.small{font-size:12px}
.tnum{font-variant-numeric:tabular-nums}
.h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.h2{font-size:16px;font-weight:600}
.h3{font-size:14px;font-weight:600}
.card{background:var(--bg-surface);border-radius:var(--r-lg);box-shadow:var(--shadow-card);padding:16px}
.card.flat{box-shadow:none;border:1px solid var(--border-subtle)}
.inset{background:var(--bg-inset);border-radius:var(--r-md);padding:12px}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--border-control);background:var(--bg-surface);font-size:12px;font-weight:500;color:var(--text-medium);cursor:pointer;white-space:nowrap;transition:transform 160ms var(--ease-out),background-color 150ms ease-out}
.pill:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){.pill:hover{background:var(--bg-highlight)}}
.pill.primary{background:var(--action-primary);border-color:var(--action-primary);color:#fff}
@media (hover:hover) and (pointer:fine){.pill.primary:hover{background:var(--text-active)}}
.pill.ghost{border-color:transparent;background:transparent;color:var(--text-link)}
.pill.map{background:var(--text-heavy);border-color:var(--text-heavy);color:#fff;font-weight:600}
.pill:focus-visible,.seg button:focus-visible{outline:2px solid var(--action-primary);outline-offset:2px}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px}
.seg button{height:28px;padding:0 10px;border-radius:999px;border:0;background:var(--bg-nav);color:var(--text-medium);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--action-primary);color:#fff}
.seg button .n{opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--bg-inset);color:var(--text-light)}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.plain::before{display:none}
.tag.sent{background:#e3f4e8;color:var(--status-live)}
.tag.sched{background:var(--bg-highlight);color:var(--text-active)}
.tag.failed{background:#fde9dc;color:var(--status-warning)}
.tag.warn{background:var(--bg-task);color:var(--text-task)}
.tag.off{background:var(--bg-inset);color:var(--text-light)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--status-live);display:inline-block;flex:none}
.dot.warn{background:var(--status-warning)}.dot.off{background:var(--border-medium,#a9b4bf)}.dot.amber{background:var(--border-task)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-weight:600;color:var(--text-light);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--border-subtle);white-space:nowrap}
table.t td{padding:10px;border-bottom:1px solid var(--border-subtle);vertical-align:top}
table.t tr:nth-child(even) td{background:var(--bg-highlight-subtle)}
.logo{height:18px;width:auto;max-width:90px;object-fit:contain;display:block}
.logo-txt{font-weight:700;font-size:13px;letter-spacing:.02em}
.sel{outline:2px solid var(--action-primary);outline-offset:-2px}
.hide-phone{}
@container (max-width:640px){.hide-phone{display:none!important}.t-phone-stack thead{display:none}.t-phone-stack tr{display:block;padding:10px 0;border-bottom:1px solid var(--border-subtle)}.t-phone-stack td{display:block;border:0;padding:2px 0;background:none!important}}
.show-phone{display:none}
@container (max-width:640px){.show-phone{display:revert}}
.slack{border:1px solid var(--border-subtle);border-radius:var(--r-md);padding:12px;background:#fff;font-size:14px;display:flex;gap:10px}
.slack .av{width:32px;height:32px;border-radius:6px;background:var(--text-heavy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.slack .who{font-weight:700}.slack .when{color:var(--text-light);font-size:12px;margin-left:6px;font-weight:400}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* v2 rail */
.v2-rail{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.v2-n{display:grid;grid-template-columns:72px 14px 1fr;gap:10px;padding:10px 0}
.v2-t{font-weight:600;font-size:13px;text-align:right}
.v2-dot{width:10px;height:10px;border-radius:50%;background:var(--action-primary);margin-top:4px;position:relative}
.v2-dot::after{content:"";position:absolute;left:4px;top:14px;width:2px;height:calc(100% + 40px);background:var(--border-subtle)}
.v2-dot.bad{background:var(--status-warning)}.v2-dot.amber{background:var(--border-task)}
.v2-c{background:var(--bg-surface);border-radius:var(--r-md);padding:10px 12px;box-shadow:var(--shadow-card);min-width:0}
.v2-n.flag .v2-c{box-shadow:inset 3px 0 0 var(--border-task),var(--shadow-card)}
.v2-now{display:flex;align-items:center;gap:8px;color:var(--status-live);font-weight:600;font-size:12px;padding:4px 0}
.v2-now::before,.v2-now::after{content:"";height:2px;background:var(--status-live);flex:1}
.v2-now::before{flex:0 0 72px}
@container (max-width:640px){.v2-n{grid-template-columns:56px 10px 1fr;gap:8px}.v2-now::before{flex-basis:56px}}
/* v3 focus */
.v3-card{max-width:620px;padding:20px}
.v3-d{width:22px;height:4px;border-radius:2px;background:var(--border-subtle)}.v3-d.on{background:var(--action-primary)}.v3-d.ok{background:var(--status-live)}
.v3-in{width:100%;max-width:320px;height:36px;border:1px solid var(--border-control);border-radius:var(--r-md);padding:0 10px}
/* v4 tiles */
.v4-k{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.v4-n{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.v4-g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@container (max-width:640px){.v4-k{grid-template-columns:1fr 1fr}.v4-g{grid-template-columns:1fr}}
/* v5 split */
.v5{display:grid;grid-template-columns:minmax(0,380px) 1fr;gap:12px;align-items:start}
.v5-left ul{margin-top:10px;max-height:560px;overflow:auto}
.v5-i{display:flex;gap:8px;align-items:center;padding:8px;border-radius:var(--r-md);cursor:pointer}
@media (hover:hover) and (pointer:fine){.v5-i:hover{background:var(--bg-highlight-subtle)}}
.v5-i.sel{background:var(--bg-highlight);outline:0}
.v5-tt{display:block;font-weight:500}
.v5-right{gap:12px}
@container (max-width:640px){.v5{grid-template-columns:1fr}.v5[data-open="1"] .v5-left{display:none}.v5:not([data-open="1"]) .v5-right{display:none}}
/* v6 board */
.v6{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.v6-col{background:var(--bg-inset);border-radius:var(--r-lg);padding:10px;display:flex;flex-direction:column;gap:8px}
.v6-col[data-k=need]{background:#fff6dc}
.v6-c{background:var(--bg-surface);border-radius:var(--r-md);padding:10px;box-shadow:var(--shadow-card)}
@container (max-width:640px){.v6{grid-template-columns:1fr}.v6-col{display:none}.v6[data-col=need] [data-k=need],.v6[data-col=sched] [data-k=sched],.v6[data-col=sent] [data-k=sent],.v6[data-col=skip] [data-k=skip]{display:flex}.v6-h{display:none}}
/* v7 people */
.v7-unk{box-shadow:inset 3px 0 0 var(--border-task),var(--shadow-card)}
.v7-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.v7-av{width:26px;height:26px;border-radius:6px;background:var(--bg-nav);display:grid;place-items:center;font-size:11px;font-weight:700}
@container (max-width:900px){.v7-g{grid-template-columns:1fr 1fr}}
@container (max-width:640px){.v7-g{grid-template-columns:1fr}}
/* v8 feed */
.v8{display:flex;flex-direction:column;background:#fff}
.v8-top{padding:12px 20px;border-bottom:1px solid var(--border-subtle)}
.v8-feed{max-width:760px;width:100%;margin:0 auto}
.v8-m.later{opacity:.6}
.v8-m .row{margin-bottom:4px}
.v8-now{display:flex;align-items:center;gap:8px;color:var(--status-live);font-weight:600;font-size:12px}
.v8-now::before,.v8-now::after{content:"";height:1px;background:var(--status-live);flex:1}
.v8-ask .slack{border-color:var(--border-task);background:#fffaea}
.v8-me{margin-left:auto;width:fit-content;background:var(--bg-highlight);border-radius:12px;padding:8px 12px}
.v8-bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--border-subtle);padding:10px 20px}
@container (max-width:640px){.v8-top,.v8-bar{padding:10px 16px}}
/* v9 track */
.v9-row{display:grid;grid-template-columns:260px 1fr;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border-subtle)}
.v9-head{border:0;padding-bottom:0}
.v9-tt{font-weight:500}
.v9-lab .tag{margin-top:2px}
.v9-track{position:relative;height:18px;background:var(--bg-inset);border-radius:9px}
.v9-scale{background:none;height:16px}.v9-scale span{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--text-light)}
.v9-bar{position:absolute;top:3px;height:12px;border-radius:6px;background:var(--sch-blue);box-shadow:inset 0 0 0 1px rgba(11,107,196,.35)}
.v9-bar.task{background:var(--bg-task);box-shadow:inset 0 0 0 1px var(--border-task)}
.v9-bar.flag{background:repeating-linear-gradient(45deg,var(--bg-task) 0 4px,#fff 4px 8px)}
.v9-ping{position:absolute;top:4px;width:10px;height:10px;margin-left:-5px;border-radius:50%;border:2px solid var(--action-primary);background:#fff}
.v9-ping.done{background:var(--action-primary)}
.v9-now{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--status-live)}
@container (max-width:640px){.v9-row{grid-template-columns:1fr;gap:6px}.v9-head>div:first-child{display:none}}
/* v10 steps */
.v10-steps{display:flex;gap:8px;flex-wrap:wrap}
.v10-st{display:flex;align-items:center;gap:8px;border:0;background:var(--bg-nav);border-radius:999px;padding:4px 12px 4px 4px;font-size:13px;cursor:pointer;color:var(--text-medium)}
.v10-st span:first-child{width:22px;height:22px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.v10-st.on{background:var(--action-primary);color:#fff}.v10-st.on span:first-child{color:var(--action-primary)}
.v10-st.ok span:first-child{background:var(--status-live);color:#fff}
.v10-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.v10-pv{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
#v10b .h2{margin-bottom:6px}#v10b p{margin-bottom:12px}
.v10-sw{width:20px;height:20px;accent-color:var(--action-primary)}
@container (max-width:640px){.v10-lab{display:none}.v10-st.on .v10-lab{display:inline}.v10-sum,.v10-pv{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="h-top">
  <span class="h-title">Organizer pings</span>
  <span class="h-badge">Wireframe · dummy data</span>
  <span class="small" style="color:#556">Pretend now: Sat Nov 21, 10:12 AM ET</span>
  <div class="h-frame-toggle" role="group" aria-label="Frame width">
    <button data-frame="desktop" aria-pressed="true">Desktop</button>
    <button data-frame="phone" aria-pressed="false">Phone</button>
  </div>
</div>
<p class="h-note" id="h-note"></p>
<div class="frame" id="frame" data-mode="desktop"><div id="stage"></div></div>
<nav class="proto-picker" data-position="top" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
</nav>

<script>
const actions = {};
/* ===== Dummy data ===== */
const DAYS = [
  { id: 'fri', short: 'Fri', label: 'Fri Nov 20' },
  { id: 'sat', short: 'Sat', label: 'Sat Nov 21', today: true },
  { id: 'sun', short: 'Sun', label: 'Sun Nov 22' },
];
const DAY_I = { fri: 0, sat: 1, sun: 2 };
const NOW = { day: 'sat', m: 10 * 60 + 12 };
const toM = (hhmm) => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; };
const fmt = (m) => { m = ((m % 1440) + 1440) % 1440; const h = Math.floor(m / 60), mm = m % 60; return `${(h % 12) || 12}:${String(mm).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`; };
const isPast = (day, m) => DAY_I[day] < DAY_I[NOW.day] || (day === NOW.day && m <= NOW.m);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* Task pings: the sponsor team's run of show. to = a Slack person, or null = team channel */
const TASKS = [
  ['fri', '16:00', 'Open the sponsor check-in desk', 'SM Atrium, Floor 1', 'Caroline', 'Caroline'],
  ['fri', '17:30', 'Help sponsors set up booths', 'Sponsor Bay (SM Atrium, Floor 1)', '[SPON] Daniel', 'Daniel'],
  ['fri', '19:00', 'Sponsor intros at opening ceremony', 'Grand Hall Rm 1110', 'Noah', 'Noah'],
  ['fri', '21:00', 'Walk reps to the sponsor lounge', 'Rm 2110 sponsor lounge', 'All', null],
  ['sat', '08:30', 'Restock lounge snacks and coffee', 'Rm 2110 sponsor lounge', 'Alice', 'Alice'],
  ['sat', '09:00', 'Open StarTech coffee chats', 'Rm 2241', 'Aniya', 'Aniya'],
  ['sat', '09:45', 'Check reps are signed in', 'Sponsor Bay (SM Atrium, Floor 1)', '[SPON] Daniel', 'Daniel', 'ratelimited'],
  ['sat', '10:00', 'Open Sun Life group chats', 'Rm 2242', 'All', null],
  ['sat', '10:00', 'Open Canada Life group chats', 'Rm 2243', 'Caroline', 'Caroline'],
  ['sat', '10:30', 'Move rep belongings', 'Rm 2244 belongings', 'Noah + Caroline', null],
  ['sat', '11:00', 'Walk Scotiabank reps to their talk', 'Grand Hall Rm 1110', 'Daniel', 'Daniel'],
  ['sat', '12:00', 'Pick up rep lunch', 'Rm 2110 sponsor lounge', 'Noah', 'Noah'],
  ['sat', '13:00', 'Close StarTech coffee chats', 'Rm 2241', 'Aniya', 'Aniya'],
  ['sat', '16:00', 'Close Sun Life group chats', 'Rm 2242', 'QNX: Noah Scotiabank: Caroline', null],
  ['sun', '08:30', 'Run the sponsor judging workshop', 'Rm 2110 sponsor lounge', 'Daniel', 'Daniel'],
  ['sun', '09:00', 'Check every sponsor sent a shortlist', 'Rm 2110 sponsor lounge', 'Alice', 'Alice'],
  ['sun', '10:00', 'Presentations start in all rooms', 'Rm 2110, Rm 2230, Rm 2235', 'Everyone', null],
  ['sun', '11:30', 'Collect top 5 from every sponsor', 'Rm 2110 sponsor lounge', 'Noah', 'Noah'],
].map(([day, t, task, where, owner, to, fail], i) => {
  const m = toM(t);
  return { id: 't' + i, kind: 'task', day, m, task, where, owner, to, fail: fail || null,
    status: fail ? 'failed' : isPast(day, m) ? 'sent' : 'sched' };
});

/* Ops pings: the big run-of-show sheet ("Schedule View"), whole organizer team.
   match: ok | none | ambig | close | everyone. Slack people are the ones tagged [ORGANIZER]. */
const ORGANIZERS = ['Priya Shah', 'Marcus Lee', 'Jordan Kim', 'Jordan Patel', 'Elena Rossi', 'Sam Okafor', 'Wen Zhao', 'Fatima Noor', 'Ben Carter', 'Grace Liu', 'Noah', 'Caroline', 'Daniel', 'Alice', 'Aniya'];
const OPS = [
  ['fri', '15:00', '18:00', 'Hacker check-in desk', 'SM Atrium, Floor 1', 'Bring wristbands and the 2 scanner iPads.', 'Priya', 'ok', ['Priya Shah']],
  ['fri', '18:30', '19:30', 'Dinner service', 'Grand Hall Rm 1110', 'Dietary table on the left. Count trays at the end.', 'Grace', 'ok', ['Grace Liu']],
  ['fri', '21:00', '22:00', 'Opening night games', 'Grand Hall Rm 1110', 'Projector cable is in the blue bin.', 'Everyone', 'everyone', []],
  ['sat', '08:00', '10:00', 'Breakfast service', 'Grand Hall Rm 1110', 'Count leftover trays and tell Wen.', 'Priya', 'ok', ['Priya Shah']],
  ['sat', '09:00', '11:00', 'Hacker help desk', 'SM Atrium, Floor 1', 'Log every question in #help-desk.', 'Jordan', 'ambig', ['Jordan Kim', 'Jordan Patel']],
  ['sat', '09:30', '10:30', 'Workshop: Intro to React', 'Rm 3315', 'Check the mic before 9:25. Slides on the desktop.', 'Marcus L', 'ok', ['Marcus Lee']],
  ['sat', '10:00', '12:00', 'Swag table', 'Sponsor Bay (SM Atrium, Floor 1)', 'One shirt per badge. Sizes are on the box.', 'Elana R', 'close', ['Elena Rossi']],
  ['sat', '10:15', '10:45', 'Photo walk', 'All floors', 'Get every sponsor booth and the coffee chat rooms.', 'Mike T', 'none', []],
  ['sat', '10:30', '12:30', 'Mentor check-in', 'Rm 2110 sponsor lounge', 'Sign mentors in, hand out lanyards, point them to the help queue.', 'Sam', 'ok', ['Sam Okafor']],
  ['sat', '12:00', '13:30', 'Lunch service', 'Grand Hall Rm 1110', 'Vegan trays go out first.', 'Everyone', 'everyone', []],
  ['sat', '12:30', '13:00', 'Garbage and recycling run', 'All floors', 'Bags under the stage.', 'Ben + Wen', 'ok', ['Ben Carter', 'Wen Zhao']],
  ['sat', '14:00', '15:00', 'Cup stacking contest', 'Grand Hall Rm 1110', 'Prizes are in Rm 2244.', 'Fatima', 'ok', ['Fatima Noor']],
  ['sat', '15:00', '17:00', 'Coffee chat floor help', 'Rm 2241, 2242, 2243', 'Keep the hallway clear, send late hackers to the desk.', 'ALL OF SPON', 'everyone', []],
  ['sat', '18:00', '19:30', 'Dinner service', 'Grand Hall Rm 1110', 'Pizza boxes flat in the recycling.', 'Grace', 'ok', ['Grace Liu']],
  ['sat', '23:30', '01:00', 'Midnight snack', 'Grand Hall Rm 1110', 'Noodles. Kettles are on the cart.', 'Jordan', 'ambig', ['Jordan Kim', 'Jordan Patel']],
  ['sun', '08:00', '09:00', 'Breakfast service', 'Grand Hall Rm 1110', 'Last meal, clear the hall after.', 'Wen', 'ok', ['Wen Zhao']],
  ['sun', '09:00', '09:15', 'Hacking ends: collect submissions', 'Grand Hall Rm 1110', 'Countdown on the big screen.', 'Marcus', 'ok', ['Marcus Lee']],
  ['sun', '10:00', '11:30', 'Judging room runners', 'Rm 2110, Rm 2230, Rm 2235', 'Keep teams moving, 5 minutes each.', 'Jordn P', 'close', ['Jordan Patel']],
].map(([day, s, e, task, where, notes, owner, match, slack], i) => {
  const m = toM(s); let end = toM(e); if (end < m) end += 1440;
  const flagged = match !== 'ok';
  const before = flagged ? 'none' : isPast(day, m - 10) ? 'sent' : 'sched';
  const atEnd = flagged ? 'none' : isPast(day, end) ? 'sent' : 'sched';
  return { id: 'o' + i, kind: 'ops', day, m, end, task, where, notes, owner, match, slack, before, atEnd };
});
const SHEET = { tasks: 142, readAt: '10:05 AM' };
const NEEDS = OPS.filter(o => o.match === 'ambig' || o.match === 'none' || o.match === 'close');

/* Shared bits */
const ST = { sent: ['sent', 'Sent'], sched: ['sched', 'Scheduled'], failed: ['failed', 'Failed'], none: ['off', 'Not pinged'] };
const tag = (s, extra = '') => `<span class="tag ${ST[s][0]}">${ST[s][1]}${extra}</span>`;
const MATCH = { none: ['failed', 'No match'], ambig: ['warn', 'Ambiguous'], close: ['warn', 'Close match: check'], everyone: ['off', 'Everyone, not pinged'] };
const matchTag = (o) => o.match === 'ok' ? '' : `<span class="tag ${MATCH[o.match][0]}">${MATCH[o.match][1]}</span>`;
const who = (o) => o.match === 'ok' ? o.slack.map(n => '@' + n).join(', ') : o.match === 'ambig' ? o.slack.join(' or ') + '?' : o.match === 'close' ? o.slack[0] + '?' : o.match === 'everyone' ? 'Channel post only' : 'No one on Slack';
const sendsTo = (t) => t.to ? `DM @${t.to}` : 'Team channel (@here)';
const taskStatus = (t) => t.status === 'failed' ? tag('failed', ` · ${t.fail}`) : tag(t.status);
const dayOf = (list, d) => list.filter(x => x.day === d).sort((a, b) => a.m - b.m);
const daySeg = (act, cur) => `<div class="seg" data-act="${act}" role="group" aria-label="Day">${DAYS.map(d => `<button data-val="${d.id}" aria-pressed="${d.id === cur}">${d.short}${d.today ? ' · Today' : ''}</button>`).join('')}</div>`;
const refreshPill = (id = '') => `<button class="pill" data-act="refresh" ${id ? `id="${id}"` : ''}>↻ Refresh from sheet</button><span class="small muted" data-refreshed>Read ${SHEET.readAt} · ${SHEET.tasks} tasks</span>`;
const logoFor = (txt) => { const map = { StarTech: 'startech.svg', 'Sun Life': 'sunlife.png', 'Canada Life': 'canadalife.png', Scotiabank: 'scotiabank-trimmed.svg' }; for (const k in map) if (txt.includes(k)) return `<img class="logo" src="../../public/shared/sponsors/${map[k]}" alt="${k}">`; return ''; };
const dmBefore = (o) => `⏰ <b>In 10 min (${fmt(o.m)})</b>: ${esc(o.task)} · ${esc(o.where)}<br>Until ${fmt(o.end)}<br>To do: ${esc(o.notes)}`;
const dmEnd = (o) => `✅ <b>Time's up (${fmt(o.end)})</b>: ${esc(o.task)}. Wrap up and hand off to the next shift.`;
const dmTask = (t) => t.to ? `⏰ <b>Now (${fmt(t.m)})</b>: ${esc(t.task)} · ${esc(t.where)}` : `@here ⏰ <b>Now (${fmt(t.m)})</b>: ${esc(t.task)} · ${esc(t.where)}<br>Owner in the sheet: ${esc(t.owner)}. No one person to DM, can someone grab this?`;
const slackMsg = (body, when) => `<div class="slack"><div class="av">HW</div><div class="grow"><div><span class="who">Hack Western bot</span><span class="when">${when}</span></div><div>${body}</div></div></div>`;
actions.refresh = (el) => {
  const lbl = el.parentElement.querySelector('[data-refreshed]') || el.nextElementSibling;
  el.disabled = true; el.textContent = 'Reading sheet…';
  setTimeout(() => { el.disabled = false; el.textContent = '↻ Refresh from sheet'; if (lbl) lbl.textContent = `Read just now · ${SHEET.tasks} tasks · 0 changed`; }, 700);
};
actions.retry = (el) => { el.outerHTML = tag('sched', ' · retrying'); };

/* ===== Variants: { short, name, why, html(), init?(root) } ===== */
const variants = [];
/* ---------- 1. Sheet mirror (table) ---------- */
(() => {
  const s = { scope: 'task', day: 'sat', f: 'all' };
  const render = (root) => {
    const b = root.querySelector('#v1b');
    if (s.scope === 'task') {
      const rows = dayOf(TASKS, s.day);
      const c = (k) => rows.filter(r => r.status === k).length;
      const shown = rows.filter(r => s.f === 'all' || r.status === s.f);
      b.innerHTML = `<div class="row between"><div class="seg" data-act="v1f">${[['all', 'All', rows.length], ['sent', 'Sent', c('sent')], ['sched', 'Scheduled', c('sched')], ['failed', 'Failed', c('failed')]].map(([v, l, n]) => `<button data-val="${v}" aria-pressed="${s.f === v}">${l}<span class="n">${n}</span></button>`).join('')}</div><span class="small muted">One DM at the start time</span></div>
      <div class="card" style="padding:4px 8px"><table class="t t-phone-stack"><thead><tr><th>Time</th><th>Task</th><th>Owner (sheet)</th><th>Sends to</th><th>Status</th></tr></thead><tbody>
      ${shown.map(t => `<tr><td class="tnum"><b>${fmt(t.m)}</b></td><td><div>${esc(t.task)}</div><div class="small muted">${esc(t.where)}</div></td><td class="small">${esc(t.owner)}</td><td class="small">${sendsTo(t)}</td><td>${taskStatus(t)} ${t.status === 'failed' ? '<button class="pill" data-act="retry">Retry</button>' : ''}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">Nothing here for this day.</td></tr>'}
      </tbody></table></div>`;
    } else {
      const rows = dayOf(OPS, s.day);
      const need = rows.filter(r => ['none', 'ambig', 'close'].includes(r.match));
      const shown = rows.filter(r => s.f === 'all' || (s.f === 'need' ? need.includes(r) : s.f === 'ok' ? r.match === 'ok' : r.match === 'everyone'));
      b.innerHTML = `<div class="row between"><div class="seg" data-act="v1f">${[['all', 'All', rows.length], ['need', 'Needs a look', need.length], ['ok', 'Pinging', rows.filter(r => r.match === 'ok').length], ['everyone', 'Everyone', rows.filter(r => r.match === 'everyone').length]].map(([v, l, n]) => `<button data-val="${v}" aria-pressed="${s.f === v}">${l}<span class="n">${n}</span></button>`).join('')}</div><span class="small muted">DM 10 min before start and at the end</span></div>
      <div class="card" style="padding:4px 8px"><table class="t t-phone-stack"><thead><tr><th>Time</th><th>Task</th><th>Owner (sheet)</th><th>Slack</th><th>10 min before</th><th>At end</th></tr></thead><tbody>
      ${shown.map(o => `<tr><td class="tnum"><b>${fmt(o.m)}</b><div class="small muted">to ${fmt(o.end)}</div></td><td><div>${esc(o.task)}</div><div class="small muted">${esc(o.where)}</div></td><td class="small">${esc(o.owner)}</td><td class="small">${o.match === 'ok' ? who(o) : matchTag(o) + (o.slack.length ? `<div class="muted">${who(o)}</div>` : '')}</td><td>${tag(o.before)}</td><td>${tag(o.atEnd)}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">Nothing here.</td></tr>'}
      </tbody></table></div>`;
    }
  };
  actions.v1scope = (el) => { s.scope = el.dataset.val; s.f = 'all'; render(stage); };
  actions.v1day = (el) => { s.day = el.dataset.val; s.f = 'all'; render(stage); };
  actions.v1f = (el) => { s.f = el.dataset.val; render(stage); };
  variants.push({ short: 'Table', name: 'Sheet mirror', why: 'Looks like the sheet it reads: one dense row per task, so 140 rows scan fast and flags stand out in their column.',
    html: () => `<div class="app wrap">
      <div class="row between"><div class="h1">Pings</div><div class="row">${refreshPill()}</div></div>
      <div class="row between"><div class="seg" data-act="v1scope"><button data-val="task" aria-pressed="${s.scope === 'task'}">Task pings · sponsor team</button><button data-val="ops" aria-pressed="${s.scope === 'ops'}">Ops pings · whole team</button></div>${daySeg('v1day', s.day)}</div>
      <div id="v1b" class="stack" style="gap:12px"></div></div>`,
    init: render });
})();

/* ---------- 2. Day rail (timeline) ---------- */
(() => {
  const s = { day: 'sat' };
  const node = (x) => {
    if (x.kind === 'task') return `<li class="v2-n" data-cat="task"><div class="v2-t tnum">${fmt(x.m)}</div><div class="v2-dot ${x.status === 'failed' ? 'bad' : ''}"></div><div class="v2-c"><div class="row"><span class="h3">${esc(x.task)}</span><span class="tag plain small">Sponsor team</span></div><div class="small muted">${esc(x.where)} · ${esc(x.owner)}</div><div class="row small" style="margin-top:4px"><span>${x.to ? 'DM @' + x.to : 'Team channel'} at ${fmt(x.m)}</span>${taskStatus(x)}${x.status === 'failed' ? '<button class="pill" data-act="retry">Retry</button>' : ''}</div></div></li>`;
    const flagged = x.match !== 'ok';
    return `<li class="v2-n ${flagged ? 'flag' : ''}" data-cat="ops ${flagged ? 'need' : ''}"><div class="v2-t tnum">${fmt(x.m)}<div class="small muted">${fmt(x.end)}</div></div><div class="v2-dot ${flagged ? 'amber' : ''}"></div><div class="v2-c"><div class="row"><span class="h3">${esc(x.task)}</span><span class="tag plain small">Ops</span>${matchTag(x)}</div><div class="small muted">${esc(x.where)} · sheet says “${esc(x.owner)}” → ${who(x)}</div>${flagged ? '' : `<div class="row small" style="margin-top:4px"><span>DM ${fmt(x.m - 10)}</span>${tag(x.before)}<span>DM ${fmt(x.end)}</span>${tag(x.atEnd)}</div>`}</div></li>`;
  };
  const render = (root) => {
    const items = [...dayOf(TASKS, s.day), ...dayOf(OPS, s.day)].sort((a, b) => a.m - b.m);
    let html = '', nowPut = s.day !== 'sat';
    items.forEach(x => { if (!nowPut && x.m > NOW.m) { html += `<li class="v2-now"><span>Now · ${fmt(NOW.m)}</span></li>`; nowPut = true; } html += node(x); });
    root.querySelector('#v2b').innerHTML = html;
    root.querySelector('#v2day').textContent = DAYS[DAY_I[s.day]].label;
    root.querySelector('.v2-scope [aria-pressed=true]')?.click();
  };
  actions.v2day = (el) => { s.day = el.dataset.val; render(stage); };
  variants.push({ short: 'Day rail', name: 'Day rail', why: 'Time is the spine: every task and every ping on one line for the picked day, with a Now marker, so you see what just went out and what is next.',
    html: () => `<div class="app wrap" data-scope>
      <div class="row between"><div><div class="h1">Pings</div><div class="muted" id="v2day"></div></div><div class="row">${refreshPill()}</div></div>
      <div class="row between">${daySeg('v2day', s.day)}<div class="seg v2-scope" data-filter><button data-val="all" aria-pressed="true">Both</button><button data-val="task" aria-pressed="false">Sponsor team</button><button data-val="ops" aria-pressed="false">Ops</button><button data-val="need" aria-pressed="false">Needs a look<span class="n">${NEEDS.filter(n => n.day === 'sat').length}</span></button></div></div>
      <ol class="v2-rail" id="v2b"></ol></div>`,
    init: render });
})();

/* ---------- 3. Needs a look (one at a time) ---------- */
(() => {
  const queue = () => [TASKS.find(t => t.status === 'failed'), ...NEEDS];
  let i = 0; const done = [];
  const body = (x) => {
    if (x.kind === 'task') return `<div class="tag failed">Task ping failed · ${x.fail}</div><div class="h2" style="margin-top:10px">${esc(x.task)}</div><div class="muted">${DAYS[DAY_I[x.day]].short} ${fmt(x.m)} · ${esc(x.where)}</div><p style="margin:12px 0">Slack was busy and turned the DM to <b>@${x.to}</b> away. Nothing reached them.</p>${slackMsg(dmTask(x), fmt(x.m))}<div class="row" style="margin-top:14px"><button class="pill primary" data-act="v3ok" data-msg="Sent to @${x.to}">Send now</button><button class="pill" data-act="v3ok" data-msg="Skipped">Skip, it's done</button></div>`;
    const head = `${matchTag(x)}<div class="h2" style="margin-top:10px">${esc(x.task)}</div><div class="muted">${DAYS[DAY_I[x.day]].short} ${fmt(x.m)} to ${fmt(x.end)} · ${esc(x.where)}</div>`;
    if (x.match === 'ambig') return `${head}<p style="margin:12px 0">The sheet says <b>“${esc(x.owner)}”</b>. Two people tagged [ORGANIZER] have that name. Who is it?</p><div class="row">${x.slack.map(n => `<button class="pill" data-act="v3ok" data-msg="Matched to @${n}">${n}</button>`).join('')}</div><p class="small muted" style="margin-top:12px">We'll DM them at ${fmt(x.m - 10)} and ${fmt(x.end)}.</p>`;
    if (x.match === 'close') return `${head}<p style="margin:12px 0">The sheet says <b>“${esc(x.owner)}”</b>. Closest on Slack is <b>${x.slack[0]}</b>. Is that them?</p><div class="row"><button class="pill primary" data-act="v3ok" data-msg="Matched to @${x.slack[0]}">Yes, ${x.slack[0].split(' ')[0]}</button><button class="pill" data-act="v3other">Someone else</button></div><div id="v3pick" hidden style="margin-top:10px"><div class="seg">${ORGANIZERS.slice(0, 10).map(n => `<button data-act="v3ok" data-msg="Matched to @${n}">${n}</button>`).join('')}</div></div>`;
    return `${head}<p style="margin:12px 0">No one tagged [ORGANIZER] on Slack matches <b>“${esc(x.owner)}”</b>. Pick who owns it, or fix the name in the sheet and refresh.</p><input class="v3-in" placeholder="Type a name" aria-label="Find an organizer" data-act="v3noop"><div class="seg" style="margin-top:8px">${['Marcus Lee', 'Ben Carter', 'Fatima Noor'].map(n => `<button data-act="v3ok" data-msg="Matched to @${n}">${n}</button>`).join('')}</div><div class="row" style="margin-top:12px"><button class="pill" data-act="v3ok" data-msg="Left as channel only">Post in the channel instead</button></div>`;
  };
  const render = (root) => {
    const q = queue(); const box = root.querySelector('#v3b');
    root.querySelector('#v3dots').innerHTML = q.map((_, j) => `<span class="v3-d ${j < i ? 'ok' : j === i ? 'on' : ''}"></span>`).join('') + `<span class="small muted">${Math.min(i + 1, q.length)} of ${q.length}</span>`;
    root.querySelector('#v3done').innerHTML = done.map(d => `<li class="row small"><span class="tag sent">Fixed</span>${esc(d)}</li>`).join('');
    if (i >= q.length) { box.innerHTML = `<div class="h2">All set</div><p class="muted" style="margin-top:6px">Every task has someone to ping. ${SHEET.tasks} tasks read at ${SHEET.readAt}. We'll check again when the sheet changes.</p>`; return; }
    box.innerHTML = body(q[i]);
  };
  actions.v3ok = (el) => { const q = queue(); done.push(`${q[i].task}: ${el.dataset.msg}`); i++; render(stage); };
  actions.v3other = () => { stage.querySelector('#v3pick').hidden = false; };
  actions.v3noop = () => {};
  variants.push({ short: 'Needs a look', name: 'Needs a look, one at a time', why: 'Most pings run on their own; the job is fixing the few that can’t. One problem per card, with only the answer that applies.',
    html: () => { i = 0; done.length = 0; return `<div class="app wrap v3">
      <div class="row between"><div class="h1">Needs a look</div><div class="row">${refreshPill()}</div></div>
      <div class="row" id="v3dots"></div>
      <div class="card v3-card" id="v3b"></div>
      <ul class="stack" id="v3done"></ul>
      <div class="small muted">Everything else is fine: ${TASKS.filter(t => t.status === 'sched').length} task pings and ${OPS.filter(o => o.match === 'ok').length * 2} ops DMs are scheduled. <button class="pill ghost" data-show="v3all">See them</button></div>
      <div id="v3all" hidden class="card flat small">${dayOf(OPS, 'sat').filter(o => o.match === 'ok').map(o => `<div class="row between" style="padding:4px 0"><span>${fmt(o.m)} ${esc(o.task)} · ${who(o)}</span>${tag(o.before)}</div>`).join('')}</div>
    </div>`; },
    init: render });
})();

/* ---------- 4. Tiles (dashboard) ---------- */
(() => {
  const sat = dayOf(OPS, 'sat');
  const nextHour = [...dayOf(TASKS, 'sat').filter(t => t.m > NOW.m && t.m <= NOW.m + 60).map(t => ({ at: t.m, label: t.task, to: sendsTo(t) })),
    ...sat.filter(o => o.match === 'ok').flatMap(o => [{ at: o.m - 10, label: o.task + ' (starts soon)', to: who(o) }, { at: o.end, label: o.task + ' (ends)', to: who(o) }]).filter(p => p.at > NOW.m && p.at <= NOW.m + 60)].sort((a, b) => a.at - b.at);
  const sentToday = TASKS.filter(t => t.day === 'sat' && t.status === 'sent').length + sat.filter(o => o.before === 'sent').length + sat.filter(o => o.atEnd === 'sent').length;
  const prev = sat.find(o => o.task === 'Mentor check-in');
  variants.push({ short: 'Tiles', name: 'Dashboard tiles', why: 'A glance first: four numbers say if pings are healthy today, then small tiles for what’s next, what’s stuck and what a DM looks like.',
    html: () => `<div class="app wrap">
      <div class="row between"><div><div class="h1">Pings today</div><div class="muted">Sat Nov 21 · <span class="dot"></span> Slack connected · #organizers</div></div><div class="row">${refreshPill()}</div></div>
      <div class="v4-k">
        <div class="card"><div class="small muted">Sent today</div><div class="v4-n tnum">${sentToday}</div><div class="small muted">task + ops DMs</div></div>
        <div class="card"><div class="small muted">Next hour</div><div class="v4-n tnum">${nextHour.length}</div><div class="small muted">until ${fmt(NOW.m + 60)}</div></div>
        <div class="card"><div class="small muted">Failed</div><div class="v4-n tnum" style="color:var(--status-warning)">1</div><div class="small muted">Slack rate limit</div></div>
        <div class="card"><div class="small muted">Needs a look</div><div class="v4-n tnum" style="color:var(--text-task)">${NEEDS.length}</div><div class="small muted">owners we can't ping</div></div>
      </div>
      <div class="v4-g">
        <div class="card stack"><div class="h3">Next hour</div>${nextHour.map(p => `<div class="row between small"><span class="tnum" style="width:64px"><b>${fmt(p.at)}</b></span><span class="grow">${esc(p.label)}<div class="muted">${esc(p.to)}</div></span>${tag('sched')}</div>`).join('')}</div>
        <div class="card stack"><div class="h3">Needs a look</div>
          <div class="row between small"><span class="grow"><b>Check reps are signed in</b><div class="muted">Task ping to @Daniel · ratelimited</div></span><button class="pill" data-act="retry">Retry</button></div>
          ${NEEDS.map(o => `<div class="row between small"><span class="grow"><b>${esc(o.task)}</b><div class="muted">${DAYS[DAY_I[o.day]].short} ${fmt(o.m)} · “${esc(o.owner)}”</div></span>${matchTag(o)}</div>`).join('')}</div>
        <div class="card stack"><div class="h3">Sponsor team · task pings</div>${dayOf(TASKS, 'sat').map(t => `<div class="row between small"><span class="tnum" style="width:64px">${fmt(t.m)}</span><span class="grow">${esc(t.task)}</span>${t.status === 'failed' ? tag('failed') : tag(t.status)}</div>`).join('')}</div>
        <div class="card stack"><div class="row between"><div class="h3">DM preview</div><div class="seg"><button aria-pressed="true" data-act="v4b">Before</button><button aria-pressed="false" data-act="v4e">At end</button></div></div><div class="small muted">${esc(prev.task)} → @${prev.slack[0]}</div><div id="v4p">${slackMsg(dmBefore(prev), fmt(prev.m - 10))}</div></div>
      </div></div>`,
    init: () => { actions.v4b = () => stage.querySelector('#v4p').innerHTML = slackMsg(dmBefore(prev), fmt(prev.m - 10)); actions.v4e = () => stage.querySelector('#v4p').innerHTML = slackMsg(dmEnd(prev), fmt(prev.end)); } });
})();

/* ---------- 5. Split view (list + DM preview) ---------- */
(() => {
  const s = { day: 'sat', id: null };
  const all = () => [...dayOf(TASKS, s.day), ...dayOf(OPS, s.day)].sort((a, b) => a.m - b.m);
  const find = (id) => [...TASKS, ...OPS].find(x => x.id === id);
  const li = (x) => `<li class="v5-i ${x.id === s.id ? 'sel' : ''}" data-pick="${x.id}" data-cat="${x.kind}" role="button" tabindex="0"><span class="tnum small" style="width:60px">${fmt(x.m)}</span><span class="grow"><span class="v5-tt">${esc(x.task)}</span><span class="small muted">${x.kind === 'task' ? sendsTo(x) : who(x)}</span></span>${x.kind === 'task' ? (x.status === 'failed' ? tag('failed') : '') : matchTag(x)}</li>`;
  const detail = (x) => {
    if (!x) return `<div class="muted" style="padding:40px 0;text-align:center">Pick a task to see who gets pinged and what they'll read.</div>`;

    const owner = `<div class="inset small"><div class="row between"><span>Sheet says <b>“${esc(x.owner)}”</b></span>${x.kind === 'ops' ? matchTag(x) : ''}</div><div style="margin-top:4px">${x.kind === 'task' ? sendsTo(x) : x.match === 'ok' ? 'Slack: ' + who(x) : x.match === 'ambig' ? `Pick one: ${x.slack.map(n => `<button class="pill">${n}</button>`).join(' ')}` : x.match === 'close' ? `Is it <b>${x.slack[0]}</b>? <button class="pill">Yes</button> <button class="pill">Someone else</button>` : x.match === 'none' ? 'No one tagged [ORGANIZER] matches. <button class="pill">Pick a person</button>' : 'Groups get a channel post, no DMs.'}</div></div>`;
    const msgs = x.kind === 'task' ? `<div class="row between"><span class="h3">At ${fmt(x.m)}</span>${taskStatus(x)}</div>${slackMsg(dmTask(x), fmt(x.m))}`
      : x.match === 'ok' ? `<div class="row between"><span class="h3">10 min before · ${fmt(x.m - 10)}</span>${tag(x.before)}</div>${slackMsg(dmBefore(x), fmt(x.m - 10))}<div class="row between"><span class="h3">At end · ${fmt(x.end)}</span>${tag(x.atEnd)}</div>${slackMsg(dmEnd(x), fmt(x.end))}`
      : `<div class="muted small">No DM until the owner is sorted out. Here's what they'd get:</div>${slackMsg(dmBefore(x), fmt(x.m - 10))}`;
    return `${top}${owner}${msgs}<div class="row">${x.status === 'failed' ? '<button class="pill primary" data-act="retry">Retry</button>' : ''}<button class="pill">Send a test to me</button></div>`;
  };
  const render = (root) => {
    const el = root.querySelector('.v5'); el.dataset.open = s.id ? '1' : '';
    root.querySelector('#v5l').innerHTML = all().map(li).join('');
    root.querySelector('#v5d').innerHTML = detail(find(s.id));
    root.querySelector('.v5-scope [aria-pressed=true]')?.click();
  };
  actions.v5pick = (el) => { s.id = el.dataset.pick; render(stage); };
  actions.v5back = () => { s.id = null; render(stage); };
  actions.v5day = (el) => { s.day = el.dataset.val; s.id = null; render(stage); };
  variants.push({ short: 'Split', name: 'List + DM preview', why: 'You trust a ping when you can read it: pick any task on the left, see the match and the exact Slack DMs on the right.',
    html: () => { s.id = 'o8'; return `<div class="app wrap">
      <div class="row between"><div class="h1">Pings</div><div class="row">${refreshPill()}</div></div>
      <div class="v5" data-scope>
        <div class="v5-left card"><div class="stack">${daySeg('v5day', s.day)}<div class="seg v5-scope" data-filter><button data-val="all" aria-pressed="true">All</button><button data-val="task" aria-pressed="false">Sponsor team</button><button data-val="ops" aria-pressed="false">Ops</button></div></div><ul id="v5l" data-picklist="v5pick"></ul></div>
        <div class="v5-right card stack" id="v5d"></div>
      </div></div>`; },

/* ---------- 9. Track (hour bars) ---------- */
(() => {
  const s = { day: 'sat' };
  const A = 8 * 60, B = 20 * 60, span = B - A;
  const pct = (m) => Math.max(0, Math.min(100, (m - A) / span * 100));
  const render = (root) => {
    const rows = [...dayOf(OPS, s.day).map(o => ({ ...o, e: o.end })), ...dayOf(TASKS, s.day).map(t => ({ ...t, e: t.m + 15 }))].filter(r => r.m < B).sort((a, b) => a.m - b.m);
    const ticks = []; for (let h = 8; h <= 20; h += 2) ticks.push(`<span style="left:${pct(h * 60)}%">${(h % 12) || 12}${h < 12 ? 'a' : 'p'}</span>`);
    root.querySelector('#v9b').innerHTML = `<div class="v9-row v9-head"><div></div><div class="v9-track v9-scale">${ticks.join('')}</div></div>` + rows.map(r => {
      const flag = r.kind === 'ops' && r.match !== 'ok';
      const pings = r.kind === 'task' ? [r.m] : flag ? [] : [r.m - 10, r.e];
      return `<div class="v9-row"><div class="v9-lab"><div class="v9-tt">${esc(r.task)}</div><div class="small muted">${fmt(r.m)} · ${r.kind === 'task' ? sendsTo(r) : who(r)}</div>${flag ? matchTag(r) : r.status === 'failed' ? tag('failed') : ''}</div>
        <div class="v9-track"><div class="v9-bar ${r.kind} ${flag ? 'flag' : ''}" style="left:${pct(r.m)}%;width:${Math.max(1.2, pct(r.e) - pct(r.m))}%"></div>${pings.map(p => `<span class="v9-ping ${isPast(s.day, p) ? 'done' : ''}" style="left:${pct(p)}%" title="DM ${fmt(p)}"></span>`).join('')}${s.day === 'sat' ? `<span class="v9-now" style="left:${pct(NOW.m)}%"></span>` : ''}</div></div>`;
    }).join('');
  };
  actions.v9day = (el) => { s.day = el.dataset.val; render(stage); };
  variants.push({ short: 'Track', name: 'Hour track', why: 'Spatial: each task is a bar on an 8am–8pm track with its DM ticks, so overlaps, gaps and the 10-minute lead are visible at once.',
    html: () => `<div class="app wrap">
      <div class="row between"><div class="h1">Pings by hour</div><div class="row">${refreshPill()}</div></div>
      <div class="row between">${daySeg('v9day', s.day)}<span class="small muted">Each dot is a DM</span></div>
      <div class="card" id="v9b"></div></div>`,
    init: render });
})();

    () => `<div class="h2">Turn on pings</div><div class="stack"><label class="inset row between"><span><b>Task pings</b><div class="small muted">Sponsor team · ${TASKS.filter(t => t.status === 'sched').length} left this weekend</div></span><input type="checkbox" checked class="v10-sw"></label><label class="inset row between"><span><b>Ops pings</b><div class="small muted">Whole team · ${OPS.filter(o => o.match === 'ok').length * 2} DMs · ${NEEDS.length} owners still need a look</div></span><input type="checkbox" checked class="v10-sw"></label></div><p class="small muted">Pings already sent stay in Slack. Turning one off stops the next ones.</p>`,
  ];
  const render = (root) => {
    root.querySelector('#v10s').innerHTML = steps.map((t, j) => `<button class="v10-st ${j === step ? 'on' : j < step ? 'ok' : ''}" data-act="v10go" data-i="${j}"><span class="tnum">${j < step ? '✓' : j + 1}</span><span class="v10-lab">${t}</span></button>`).join('');
    root.querySelector('#v10b').innerHTML = bodies[step]() + `<div class="row between" style="margin-top:16px"><button class="pill" data-act="v10back" ${step === 0 ? 'disabled' : ''}>Back</button>${step < 3 ? `<button class="pill primary" data-act="v10next">Next: ${steps[step + 1]}</button>` : '<button class="pill primary">Done</button>'}</div>`;
  };
  actions.v10go = (el) => { step = +el.dataset.i; render(stage); };
  actions.v10next = () => { step = Math.min(3, step + 1); render(stage); };
  actions.v10back = () => { step = Math.max(0, step - 1); render(stage); };
  actions.v10fix = (el) => { el.closest('.inset').querySelector('.tag').outerHTML = '<span class="tag sent">Fixed</span>'; el.parentElement.remove(); };
  variants.push({ short: 'Steps', name: 'Set up, step by step', why: 'For the night before: read the sheet, fix owners, see a DM, switch on. Each step only asks what it needs; the live log lives elsewhere.',
    html: () => { step = 0; return `<div class="app wrap"><div class="h1">Slack pings for the weekend</div><div class="v10-steps" id="v10s"></div><div class="card" id="v10b"></div></div>`; },
    init: render });
})();

/* ===== Harness wiring (PICKER.md behaviour) ===== */
const stage = document.getElementById('stage');
const frame = document.getElementById('frame');
const note = document.getElementById('h-note');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
variants.forEach((v, i) => {
  const b = document.createElement('button');
  b.className = 'proto-picker-item';
  b.textContent = (i + 1) % 10 + ' ' + v.short;
  picker.appendChild(b);
});
const items = [...picker.querySelectorAll('.proto-picker-item')];
let current = 0;
function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}
function mount(i) {
  stage.innerHTML = '';
  requestAnimationFrame(() => {
    stage.innerHTML = variants[i].html();
    variants[i].init && variants[i].init(stage);
  });
}
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true'); else el.removeAttribute('aria-current');
  });
  moveHighlight();
  items[i].scrollIntoView({ block: 'nearest', inline: 'nearest' });
  note.innerHTML = `<b>${i + 1}. ${variants[i].name}</b> — ${variants[i].why}`;
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = e.key === '0' ? 10 : parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
});
/* Desktop / Phone frame */
const frameBtns = [...document.querySelectorAll('[data-frame]')];
function setFrame(mode) {
  frame.dataset.mode = mode;
  frameBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.frame === mode)));
  const url = new URL(location); url.searchParams.set('f', mode); history.replaceState(null, '', url);
}
frameBtns.forEach(b => b.addEventListener('click', () => setFrame(b.dataset.frame)));
setFrame(new URLSearchParams(location.search).get('f') === 'phone' ? 'phone' : 'desktop');

/* ===== Shared interaction kit (event delegation on the stage) =====
   .seg[data-filter] buttons[data-val] → show [data-cat~=val] inside closest [data-scope]
   [data-show=id] toggles #id hidden; [data-act=name] → actions[name](el, e)
   [data-pick] inside [data-picklist] → marks .sel, calls actions[list value] */
stage.addEventListener('click', (e) => {
  const segBtn = e.target.closest('.seg button');
  if (segBtn) {
    const seg = segBtn.closest('.seg');
    seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === segBtn)));
    if (seg.dataset.filter !== undefined) {
      const scope = seg.closest('[data-scope]') || stage;
      const val = segBtn.dataset.val;
      scope.querySelectorAll('[data-cat]').forEach(el => {
        el.hidden = !(val === 'all' || el.dataset.cat.split(' ').includes(val));
      });
    }
    if (seg.dataset.act && actions[seg.dataset.act]) actions[seg.dataset.act](segBtn, e);
    if (segBtn.dataset.act && actions[segBtn.dataset.act]) actions[segBtn.dataset.act](segBtn, e);
    return;
  }
  const show = e.target.closest('[data-show]');
  if (show) { const t = stage.querySelector('#' + show.dataset.show); if (t) t.hidden = !t.hidden; }
  const pick = e.target.closest('[data-pick]');
  if (pick) {
    const list = pick.closest('[data-picklist]');
    list.querySelectorAll('[data-pick]').forEach(x => x.classList.toggle('sel', x === pick));
    if (actions[list.dataset.picklist]) actions[list.dataset.picklist](pick, e);
  }
  const act = e.target.closest('[data-act]');
  if (act && !act.classList.contains('seg') && actions[act.dataset.act]) actions[act.dataset.act](act, e);
});

const requested = parseInt(new URLSearchParams(location.search).get('v'), 10);
setActive(requested >= 1 && requested <= variants.length ? requested - 1 : 0);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body>
</html>
