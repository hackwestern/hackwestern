/* =========================================================
   COMPONENT 7 · Dialogs vs bottom sheets
   Scenario: offer a StarTech 1-on-1 chat. Only the option that applies is shown.
   ========================================================= */
const offerHead = (x=true) => `<div class="row" style="align-items:flex-start;margin-bottom:4px"><div class="grow"><h3>Offer ${esc(me().name)} a coffee chat</h3><div class="small muted">15 min, 1-on-1 with a StarTech rep · Rm 2241</div></div>${x?`<button class="dlg-x" data-close aria-label="Close">${I.x}</button>`:""}</div>`;
const offerSlots = () => `<div class="sec-h" style="margin-top:14px">Fri Nov 20</div><div class="pick" data-pickgroup><button aria-pressed="false" disabled>10:00 · Full</button><button aria-pressed="true">10:15 · 1/3</button><button aria-pressed="false">10:30 · 2/3</button><button aria-pressed="false">10:45 · 0/3</button></div>`;
const offerActs = (full=false) => `<div class="row" style="gap:8px;${full?"":"justify-content:flex-end"}"><button class="gp" data-close ${full?'style="flex:1;height:40px;justify-content:center"':""}>Cancel</button><button class="gp pri" data-close data-toast="Offer sent. ${esc(me().name)} gets a Slack message." ${full?'style="flex:2;height:40px;justify-content:center"':""}>Send offer</button></div>`;
const ctxPage = (trigger) => `<div class="appbar">${logo(SP()[5],18)}<span class="grow muted small">Interested hackers</span></div><div class="ctx">${offerCard("",trigger)}<p class="note-strip">StarTech only runs 1-on-1 chats, so the dialog never asks 'group or 1-on-1?'.</p></div>`;
const openBtn = (id,label="Offer a chat") => `<button class="gp pri" data-open="${id}">${I.coffee}${label}</button>`;
C.dialogs = {label:"Dialogs & sheets", variants:[
 {name:"Centred dialog", why:"Classic modal in the middle, scrim behind. Clear focus, best on desktop.", render:()=>`<div class="screen">${ctxPage(openBtn("d1"))}<div class="ov" id="d1" hidden style="display:grid;place-items:center;padding:16px"><div class="dlg" style="width:min(440px,100%);animation:pop 200ms var(--ease-out)">${offerHead()}${offerSlots()}${offerActs()}</div></div></div>`},
 {name:"Adaptive: sheet on phone", why:"Same content, two shells: a dialog on desktop, a bottom sheet with a grab bar on phone.", render:()=>`<style>.d2{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 32px));animation:pop 200ms var(--ease-out)}@container frame (max-width:600px){.d2{left:0;right:0;top:auto;bottom:0;transform:none;width:auto;border-radius:var(--r-3xl) var(--r-3xl) 0 0;padding-bottom:28px;animation:sheetup 320ms var(--ease-drawer)}.d2 .grab{display:block!important}}@keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}</style><div class="screen">${ctxPage(openBtn("d2o"))}<div class="ov" id="d2o" hidden><div class="dlg d2"><i class="grab" style="display:none;width:36px;height:4px;border-radius:2px;background:var(--border);margin:-8px auto 12px"></i>${offerHead()}${offerSlots()}${offerActs()}</div></div></div>`},
 {name:"Side panel", why:"Slides in from the right and keeps the list visible, so a rep can offer chats to several hackers in a row.", render:()=>`<div class="screen">${ctxPage(openBtn("d3"))}<div class="ov" id="d3" hidden style="background:rgba(11,43,74,0.12)"><div class="dlg" style="position:absolute;top:0;right:0;bottom:0;width:min(380px,100%);border-radius:var(--r-3xl) 0 0 var(--r-3xl);animation:slidein 300ms var(--ease-drawer);display:flex;flex-direction:column">${offerHead()}${offerSlots()}<div class="note-strip" style="margin:0 0 auto">${esc(me().note||"No note")}</div><div style="margin-top:16px">${offerActs(true)}</div></div></div><style>@keyframes slidein{from{transform:translateX(100%)}to{transform:none}}</style></div>`},
 {name:"Inline, no overlay", why:"The card itself opens to show times; nothing covers the page, and the context stays exactly where it was.", render:()=>`<div class="screen" style="min-height:420px"><div class="appbar">${logo(SP()[5],18)}<span class="grow muted small">Interested hackers</span></div><div class="ctx"><div class="card" style="max-width:520px"><div class="row" style="align-items:flex-start">${av(me(),36)}<div class="grow"><div style="font-weight:600;overflow-wrap:anywhere">${esc(me().name)}</div><div class="small muted">${esc(meta(me())||"No school listed")}</div></div><button class="gp pri" data-toggle="d4">${I.coffee}Offer</button></div><div id="d4" hidden style="animation:rise 200ms var(--ease-out);border-top:1px solid var(--border-subtle);margin-top:12px;padding-top:4px"><div class="small muted" style="margin-top:8px">15 min, 1-on-1 · Rm 2241</div>${offerSlots()}<div class="row" style="gap:8px;justify-content:flex-end"><button class="gp" data-toggle="d4">Cancel</button><button class="gp pri" data-toggle="d4" data-toast="Offer sent">Send offer</button></div></div></div></div></div>`},
 {name:"Popover from the button", why:"A small card grows out of the button it came from; quick, light, and you can click away.", render:()=>`<div class="screen" style="min-height:460px"><div class="appbar">${logo(SP()[5],18)}<span class="grow muted small">Interested hackers</span></div><div class="ctx"><div class="card" style="max-width:520px"><div class="row" style="align-items:flex-start">${av(me(),36)}<div class="grow"><div style="font-weight:600;overflow-wrap:anywhere">${esc(me().name)}</div><div class="small muted">${esc(meta(me())||"No school listed")}</div></div><span style="position:relative;flex-shrink:0"><button class="gp pri" data-menu="d5">Offer ${I.chev}</button><div class="menu" id="d5" hidden style="right:0;top:calc(100% + 6px);width:min(280px,80vw);padding:12px"><div style="font-weight:700">Pick a time</div><div class="small muted">15 min · Rm 2241</div><div class="pick" data-pickgroup style="margin-bottom:10px"><button aria-pressed="true">10:15 · 1/3</button><button aria-pressed="false">10:30 · 2/3</button><button aria-pressed="false">10:45 · 0/3</button></div><button class="gp pri" style="width:100%;justify-content:center" data-close-menu data-toast="Offer sent">Send offer</button></div></span></div></div></div></div>`},
 {name:"Full-screen on phone", why:"Takes over the whole phone screen with a top bar and big tap targets: no scrim, no half states.", render:()=>`<div class="screen">${ctxPage(openBtn("d6"))}<div class="ov" id="d6" hidden style="background:var(--surface);animation:rise 260ms var(--ease-out)"><div class="appbar"><button class="gp" data-close style="border:0">${I.x}Close</button><span class="grow"></span></div><div style="padding:20px;max-width:520px;margin:0 auto">${offerHead(false)}${offerSlots()}<div class="note-strip">${esc(me().name)} gets a Slack message with the time and room.</div><div style="margin-top:20px">${offerActs(true)}</div></div></div></div>`},
 {name:"Drag sheet, two heights", why:"A sheet you can drag between half and full height, and flick down to close; follows the finger 1:1.", render:()=>`<style>.d7{position:absolute;left:0;right:0;bottom:0;height:88%;background:var(--surface);border-radius:var(--r-3xl) var(--r-3xl) 0 0;box-shadow:var(--shadow-secondary);padding:8px 20px 20px;touch-action:none;transform:translateY(45%);transition:transform 380ms var(--ease-drawer)}.d7.drag{transition:none}.d7 .grab{width:36px;height:4px;border-radius:2px;background:var(--border);margin:4px auto 14px;cursor:grab}</style><div class="screen">${ctxPage(openBtn("d7o"))}<div class="ov" id="d7o" hidden data-sheet><div class="d7" data-drag><div class="grab"></div>${offerHead()}${offerSlots()}${offerActs()}<div class="sec-h" style="margin-top:20px">About ${esc(me().name)}</div><p style="margin:0">${esc(me().note||"No note")}</p><div class="row wrap" style="gap:4px;margin-top:8px">${skillChips(me())}</div></div></div></div>`},
 {name:"Confirm in place", why:"No dialog at all: the button turns into 'Send 10:15 offer? Yes / No' right where you tapped.", render:()=>`<div class="screen" style="min-height:380px"><div class="appbar">${logo(SP()[5],18)}<span class="grow muted small">Interested hackers</span></div><div class="ctx">${H().slice(0,4).map((h,i)=>`<div class="card" style="max-width:560px;margin-bottom:8px"><div class="row">${av(h,32)}<div class="grow"><div class="trunc" style="font-weight:600">${esc(h.name)}</div><div class="small muted">Next open: ${["10:15","10:30","10:45","11:00"][i]}</div></div><span data-morph style="flex-shrink:0"><button class="gp pri" data-morph-go>Offer ${["10:15","10:30","10:45","11:00"][i]}</button><span class="row" hidden style="gap:4px;animation:pop 160ms var(--ease-out)"><span class="small" style="font-weight:600">Send?</span><button class="gp pri" data-morph-yes>Yes</button><button class="gp" data-morph-no>No</button></span></span></div></div>`).join("")}</div></div>`},
 {name:"Quick command box", why:"Type a name, pick a time, Enter: a compact dialog for reps who are fast on a keyboard.", render:()=>`<div class="screen">${ctxPage(openBtn("d9","Offer to anyone…"))}<div class="ov" id="d9" hidden style="padding:48px 16px 16px"><div class="dlg" style="max-width:480px;margin:0 auto;padding:8px;animation:pop 160ms var(--ease-out)"><input placeholder="Type a hacker's name" style="width:100%;border:0;padding:10px 12px;outline:none;border-bottom:1px solid var(--border-subtle)" data-cmd><div data-cmd-list style="max-height:260px;overflow:auto;padding:4px 0">${H().slice(0,8).map(h=>`<button class="li" data-close data-toast="Offer sent to ${esc(h.name)} for 10:15" style="width:100%;border:0;background:transparent;padding:8px 10px;cursor:pointer;text-align:left;border-radius:var(--r-lg)" data-name="${esc(h.name.toLowerCase())}">${av(h,24)}<span class="grow trunc" style="font-weight:600">${esc(h.name)}</span><span class="small muted">10:15 ↵</span></button>`).join("")}</div></div></div></div>`},
 {name:"Two-step sheet", why:"Step 1 picks the time, step 2 shows exactly what the hacker will get; one decision per screen.", render:()=>`<div class="screen">${ctxPage(openBtn("d10"))}<div class="ov" id="d10" hidden><div class="dlg" style="position:absolute;left:0;right:0;bottom:0;border-radius:var(--r-3xl) var(--r-3xl) 0 0;max-width:520px;margin:0 auto;animation:sheetup 320ms var(--ease-drawer)" data-steps><div class="small muted" style="font-weight:600">Step <span data-step-n>1</span> of 2</div><div data-step="1">${offerHead()}${offerSlots()}<div class="row" style="justify-content:flex-end"><button class="gp pri" data-step-next>Next</button></div></div><div data-step="2" hidden style="animation:rise 200ms var(--ease-out)"><h3>Here's what ${esc(me().name.split(" ")[0])} will see</h3><div class="note-strip" style="font-size:13px;color:var(--text-medium)">☕ StarTech offered you a coffee chat on <b>Fri at 10:15</b> in <b>Rm 2241</b>. Tap to accept.</div><div class="row" style="gap:8px;justify-content:flex-end;margin-top:16px"><button class="gp" data-step-back>Back</button><button class="gp pri" data-close data-toast="Offer sent">Send offer</button></div></div></div></div><style>@keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}</style></div>`},
]};

/* =========================================================
   COMPONENT 8 · Toasts and confirmations
   ========================================================= */
const tName = () => me().name;
const tPage = (btns, extra="") => `<div class="screen" style="min-height:440px"><div class="appbar">${logo(SP()[5],18)}<span class="grow muted small">Interested hackers</span></div><div class="ctx">${offerCard("",btns)}${extra}</div></div>`;
C.toasts = {label:"Toasts", variants:[
 {name:"Bottom toast", why:"A dark toast rises from the bottom for 3 seconds and leaves the same way; one at a time.", render:()=>tPage(`<button class="gp pri" data-t1>Send offer</button>`)},
 {name:"Top banner", why:"A full-width banner drops under the header: hard to miss on a phone held at arm's length.", render:()=>`<style>.t2{position:absolute;left:0;right:0;top:46px;z-index:40;background:var(--s-green);color:var(--live);font-weight:600;padding:10px 16px;display:flex;gap:8px;align-items:center;animation:down 240ms var(--ease-out)}@keyframes down{from{transform:translateY(-100%);opacity:0}to{transform:none;opacity:1}}</style>${tPage(`<button class="gp pri" data-t2>Send offer</button>`)}`},
 {name:"Button becomes the answer", why:"No toast: the button itself turns into 'Sent ✓' and stays, so the confirmation lives where you looked.", render:()=>tPage(`<button class="gp pri" data-load="Sending…|Offer sent ✓">Send offer</button>`)},
 {name:"Undo with countdown", why:"The offer waits 5 seconds before it really sends; the toast shows a shrinking bar and Undo.", render:()=>`<style>.t4bar{position:absolute;left:0;bottom:0;height:3px;background:rgba(255,255,255,.5);animation:shrink 5s linear forwards}@keyframes shrink{from{width:100%}to{width:0}}</style>${tPage(`<button class="gp pri" data-t4>Send offer</button>`)}`},
 {name:"Row flash + note", why:"The changed row tints blue for a moment and gains a small 'Offer sent 9:42' line; the list is the record.", render:()=>`<style>@keyframes flash{from{background:var(--highlight)}to{background:var(--surface)}}.t5 .card.fl{animation:flash 1.6s ease-out}</style><div class="screen t5" style="min-height:440px"><div class="appbar">${logo(SP()[5],18)}<span class="grow muted small">Interested hackers</span></div><div class="ctx">${H().slice(0,3).map(h=>`<div class="card" style="max-width:560px;margin-bottom:8px"><div class="row">${av(h,32)}<div class="grow"><div class="trunc" style="font-weight:600">${esc(h.name)}</div><div class="small muted" data-t5note>${esc(h.school||"No school listed")}</div></div><button class="gp pri" data-t5>Offer</button></div></div>`).join("")}</div></div>`},
 {name:"Success screen", why:"After sending, the sheet shows a calm done state with what happens next and two next actions.", render:()=>tPage(`<button class="gp pri" data-open="t6">Send offer</button>`,`<div class="ov" id="t6" hidden style="display:grid;place-items:center;padding:16px"><div class="dlg" style="width:min(400px,100%);text-align:center;animation:pop 220ms var(--ease-out)"><div style="width:44px;height:44px;border-radius:50%;background:var(--s-green);color:var(--live);display:grid;place-items:center;margin:0 auto 10px">${I.check.replace('class="ic"','class="ic" style="width:22px;height:22px"')}</div><h3>Offer sent</h3><p class="muted" style="margin:4px 0 16px;overflow-wrap:anywhere">${esc(tName())} gets a Slack message now. You'll see it here when they accept.</p><div class="row" style="gap:8px;justify-content:center"><button class="gp" data-close>Back to list</button><button class="gp pri" data-close>Offer the next one</button></div></div></div>`)},
 {name:"Stack that fans out", why:"Several toasts stack into a neat pile; hover or tap the pile to fan them out and read each one.", render:()=>`<style>.t7{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(340px,calc(100% - 32px));height:60px;z-index:40}.t7 .g-toast{position:absolute;left:0;right:0;bottom:0;transition:transform 300ms var(--ease-out),opacity 300ms ease;cursor:pointer}.t7.open{height:auto}</style>${tPage(`<button class="gp pri" data-t7>Send offer</button><button class="gp" data-t7>Send 3 quickly</button>`,`<div class="t7" data-t7host></div>`)}`},
 {name:"Status line in the header", why:"A small persistent line in the header: 'Sending…' then 'Sent 9:42'. Never covers content.", render:()=>`<div class="screen" style="min-height:440px"><div class="appbar">${logo(SP()[5],18)}<span class="grow muted small">Interested hackers</span><span class="small" data-t8 style="font-weight:600;color:var(--text-light)">All saved</span></div><div class="ctx">${offerCard("",`<button class="gp pri" data-t8go>Send offer</button>`)}</div></div>`},
 {name:"Toast with a next step", why:"The confirmation offers the obvious next move: 'Booked for 10:15 · View on map'.", render:()=>tPage(`<button class="gp pri" data-t9>Book 10:15</button>`)},
 {name:"Failure with retry", why:"Shows what failure looks like: an orange toast that stays until handled, with Retry and the reason.", render:()=>`<style>.t10{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(380px,calc(100% - 32px));z-index:40;background:var(--surface);border:1px solid var(--badge);border-left:4px solid var(--warning);border-radius:var(--r-2xl);box-shadow:var(--shadow-secondary);padding:12px;animation:rise 240ms var(--ease-out)}</style>${tPage(`<button class="gp pri" data-t10>Send offer (will fail)</button>`)}`},
]};

/* =========================================================
   COMPONENT 9 · Empty, loading and error states
   Each take shows Empty / Loading / Error / Lots (40+) side by side.
   ========================================================= */
const ST_TITLE = "Hackers who want a chat";
const four = (e,l,er,lots) => `<div class="grid2">${[["Empty",e],["Loading",l],["Error",er],[`Lots (${H().length})`,lots]].map(([t,b])=>`<div class="card" style="min-height:220px"><div class="row" style="margin-bottom:10px"><span style="font-weight:700" class="grow trunc">${ST_TITLE}</span><span class="wf-badge" style="background:var(--inset);color:var(--text-light)">${t}</span></div>${b}</div>`).join("")}</div>`;
const lotsList = (n=6) => `<div class="list">${H().slice(0,n).map(h=>`<div class="li">${av(h,28)}<div class="grow"><div class="trunc" style="font-weight:600" title="${esc(h.name)}">${esc(h.name)}</div><div class="trunc small muted">${esc(meta(h)||"No school listed")}</div></div></div>`).join("")}</div>`;
const skRows = n => [...Array(n)].map(()=>`<div class="li"><span class="skel" style="width:28px;height:28px;border-radius:50%;flex-shrink:0"></span><div class="grow"><div class="skel" style="width:55%"></div><div class="skel" style="width:35%;margin-top:6px;height:10px"></div></div></div>`).join("");
C.states = {label:"Empty / loading / error", variants:[
 {name:"Centred and plain", why:"One sentence and at most one pill, centred. Calm, and the same shape for every state.", render:()=>{const c=(t,b,a="")=>`<div style="text-align:center;padding:28px 8px"><div style="font-weight:600">${t}</div><div class="small muted" style="margin:4px auto 12px;max-width:32ch">${b}</div>${a}</div>`;return four(c("No one yet","Hackers who tap Interested on your booth page show up here."),c(`<span class="spin" style="color:var(--primary)"></span>`,"Getting your list…"),c("Couldn't load this","Check your wifi and try again.",`<button class="gp">Try again</button>`),lotsList()+`<button class="gp" style="margin-top:8px">Show all ${H().length}</button>`)}},
 {name:"Skeletons", why:"Loading keeps the exact row shape, so nothing jumps when data lands. Empty uses the same rows, dimmed.", render:()=>four(`<div style="opacity:.5">${skRows(2).replace(/skel/g,"skelx")}</div><style>.skelx{background:var(--inset);border-radius:var(--r-sm);height:12px}</style><div class="small muted" style="margin-top:8px">No requests yet. They'll appear in this list.</div>`,`<div class="list">${skRows(4)}</div>`,`<div class="list" style="opacity:.4">${skRows(2).replace(/skel/g,"skelx")}</div><div class="row" style="margin-top:8px"><span class="small grow" style="color:var(--warning)">Didn't load.</span><button class="gp" style="height:24px;font-size:12px">Retry</button></div>`,lotsList(8))},
 {name:"Keep stale data", why:"Errors never blank the list: you keep the last good copy with a thin warning bar and Retry.", render:()=>four(`<div class="muted">Nothing here yet.</div>`,`<div class="row small muted" style="margin-bottom:6px"><span class="spin"></span>Updating…</div><div style="opacity:.6">${lotsList(3)}</div>`,`<div class="row" style="background:var(--badge);color:var(--warning);border-radius:var(--r-lg);padding:6px 10px;margin-bottom:8px;font-size:12px;font-weight:600">${I.alert}<span class="grow">Can't refresh. Showing 10:42.</span><button class="gp" style="height:22px;font-size:11.5px">Retry</button></div>${lotsList(3)}`,lotsList(6))},
 {name:"Empty teaches", why:"Empty states explain how the list fills: a three-step mini checklist instead of a sad message.", render:()=>four(`<ol style="margin:0;padding-left:18px;display:grid;gap:6px"><li>Hackers visit your booth page</li><li>They tap <b>Interested</b></li><li>They show up here and you offer a time</li></ol><button class="gp" style="margin-top:12px">${I.scan}Scan a badge instead</button>`,`<div class="list">${skRows(3)}</div>`,`<div class="small" style="color:var(--warning);font-weight:600">We couldn't reach the server.</div><div class="small muted">Your offers are safe. Try again in a moment.</div><button class="gp" style="margin-top:8px">Try again</button>`,lotsList(6))},
 {name:"Progress words", why:"Loading talks: 'Getting your chats… almost there'. Useful on slow venue wifi where skeletons sit for long.", render:()=>four(`<div class="muted">You're all caught up. No requests right now.</div>`,`<div style="display:grid;gap:8px"><div class="row"><span class="spin" style="color:var(--primary)"></span><b>Getting your chats…</b></div><div style="height:4px;border-radius:2px;background:var(--inset);overflow:hidden"><i style="display:block;height:100%;width:60%;background:var(--primary)"></i></div><div class="small muted">Venue wifi is slow tonight. Still working.</div></div>`,`<div><b>That took too long.</b><div class="small muted">Still nothing after 20 seconds.</div><div class="row" style="gap:6px;margin-top:8px"><button class="gp">Try again</button><button class="gp" style="border:0;color:var(--link)">Ask for help</button></div></div>`,lotsList(6))},
 {name:"Errors per row", why:"Partial failure is shown on the rows that failed, not as a page error; the rest of the list still works.", render:()=>four(`<div class="muted">No requests yet.</div>`,`<div class="list">${skRows(3)}</div>`,`<div class="list">${H().slice(0,4).map((h,i)=>`<div class="li">${av(h,28)}<span class="grow trunc" style="font-weight:600">${esc(h.name)}</span>${i===1||i===3?`<span class="small" style="color:var(--warning);font-weight:600;flex-shrink:0">Failed</span><button class="gp" style="height:22px;font-size:11.5px">Resend</button>`:`<span class="small muted">Sent</span>`}</div>`).join("")}</div>`,lotsList(6))},
 {name:"Offline aware", why:"Names the real cause: 'You're offline. Showing what we saved at 10:42.' Actions queue until wifi is back.", render:()=>four(`<div class="muted">No requests yet. We'll check again when you're back online.</div>`,`<div class="list">${skRows(3)}</div>`,`<div class="row" style="gap:8px;background:var(--inset);border-radius:var(--r-lg);padding:8px 10px;margin-bottom:8px">${I.wifi}<span class="small grow"><b>You're offline.</b> Showing what we saved at 10:42. Offers will send when you reconnect.</span></div>${lotsList(3)}`,lotsList(6))},
 {name:"Empty points elsewhere", why:"An empty list suggests the two places to find hackers right now: scan badges, or browse the projects.", render:()=>four(`<div style="display:grid;gap:8px"><div class="muted small">No requests yet. Meanwhile:</div><button class="gp" style="justify-content:flex-start;height:40px">${I.scan}Scan a badge at your booth</button><button class="gp" style="justify-content:flex-start;height:40px">${I.users}Browse all 412 hackers</button></div>`,`<div class="list">${skRows(3)}</div>`,`<div class="muted small">Couldn't load requests.</div><button class="gp" style="margin-top:8px">Try again</button><button class="gp" style="margin-top:8px;border:0;color:var(--link)">${I.scan}Scan a badge instead</button>`,lotsList(6))},
 {name:"Lots: grouped and paged", why:"For 40+ requests the list groups by status with counts and shows 10 at a time, so it never becomes a wall.", render:()=>{const g=["Waiting","Booked","Full"].map(s=>[s,H().filter(h=>h.status===s)]);return four(`<div class="muted">No requests yet.</div>`,`<div class="list">${skRows(3)}</div>`,`<div class="muted small">Couldn't load.</div><button class="gp" style="margin-top:8px">Try again</button>`,g.map(([s,l])=>`<details ${s==="Waiting"?"open":""} style="border-top:1px solid var(--border-subtle);padding:6px 0"><summary style="cursor:pointer;font-weight:600">${s} <span class="muted num">${l.length}</span></summary><div class="list">${l.slice(0,3).map(h=>`<div class="li">${av(h,24)}<span class="trunc grow">${esc(h.name)}</span></div>`).join("")}</div>${l.length>3?`<button class="gp" style="height:24px;font-size:12px">Show ${Math.min(10,l.length-3)} more</button>`:""}</details>`).join(""))}},
 {name:"Worst-case table", why:"The break-ui pass: long names wrap to 2 lines, emails break anywhere, missing school shows nothing, 0 says 'No requests'.", render:()=>{const L=HACKERS_WORST.slice(0,6);return four(`<div class="muted">No requests yet.</div><div class="small muted">Count reads “0 requests”, “1 request”, “2 requests”.</div>`,`<table class="tbl"><tbody>${[1,2,3].map(()=>`<tr><td><div class="skel" style="width:70%"></div></td><td style="width:30%"><div class="skel"></div></td></tr>`).join("")}</tbody></table>`,`<div class="small" style="color:var(--warning)">Couldn't load. Retry</div>`,`<table class="tbl"><colgroup><col style="width:62%"><col></colgroup><tbody>${L.map(h=>`<tr><td><span class="clamp2" style="font-weight:600;overflow-wrap:anywhere" title="${esc(h.name)}">${esc(h.name)}</span></td><td class="small muted">${esc(h.school)}</td></tr>`).join("")}</tbody></table><div class="small muted" style="margin-top:6px">${plural(HACKERS_WORST.length,"request","requests")}</div>`)}},
]};
</script>

<script>
/* =========================================================
   Harness: component picker, variant picker, device + data toggles
   ========================================================= */
const COMP_KEYS = ["buttons","filters","chips","logos","avatars","slots","dialogs","toasts","states"];
const stage = document.getElementById("stage"), frame = document.getElementById("frame");
const picker = document.querySelector(".proto-picker"), highlight = picker.querySelector(".proto-picker-highlight");
const itemsHost = document.getElementById("picker-items"), replay = picker.querySelector(".proto-picker-replay");
const note = document.getElementById("wf-note"), compsEl = document.getElementById("wf-comps");
const qs = new URLSearchParams(location.search);
let comp = COMP_KEYS.includes(qs.get("c")) ? qs.get("c") : "buttons";
let current = 0, items = [];
MODE = qs.get("data")==="worst" ? "worst" : "demo";

compsEl.innerHTML = COMP_KEYS.map(k=>`<button data-c="${k}" aria-pressed="${k===comp}">${C[k].label}</button>`).join("");
function buildItems(){
  itemsHost.innerHTML = C[comp].variants.map((v,i)=>`<button class="proto-picker-item">${i+1} ${esc(v.name.split(/[,:+]/)[0].trim())}</button>`).join("");
  items = [...itemsHost.querySelectorAll(".proto-picker-item")];
  items.forEach((el,i)=>el.addEventListener("click",()=>setActive(i)));
}
function moveHighlight(){const el=items[current];if(!el)return;highlight.style.width=el.offsetWidth+"px";highlight.style.transform=`translateX(${el.offsetLeft}px)`;}
function setURL(){const u=new URL(location);u.searchParams.set("c",comp);u.searchParams.set("v",current+1);u.searchParams.set("d",frame.dataset.device);u.searchParams.set("data",MODE);history.replaceState(null,"",u);}
function mount(){
  const v = C[comp].variants[current];
  note.innerHTML = `<b>${current+1}. ${esc(v.name)}</b> · ${esc(v.why)}`;
  stage.innerHTML = "";
  requestAnimationFrame(()=>{ try{ stage.innerHTML = v.render(); afterMount(); }catch(e){ stage.innerHTML = `<pre style="color:var(--warning)">${esc(e.stack)}</pre>`; console.error(e);} });
}
function setActive(i){
  const n=C[comp].variants.length; if(i<0||i>=n) return; current=i;
  items.forEach((el,j)=>{el.toggleAttribute("data-active",j===i); if(j===i){el.setAttribute("aria-current","true");el.scrollIntoView({block:"nearest",inline:"nearest"})} else el.removeAttribute("aria-current");});
  moveHighlight(); setURL(); mount();
}
function setComp(k,v=0){comp=k;[...compsEl.children].forEach(b=>b.setAttribute("aria-pressed",b.dataset.c===k));buildItems();setActive(v);}
compsEl.addEventListener("click",e=>{const b=e.target.closest("[data-c]");if(b)setComp(b.dataset.c)});
function seg(id,fn){const el=document.getElementById(id);el.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;[...el.children].forEach(x=>x.setAttribute("aria-pressed",x===b));fn(b.dataset.v)});return el;}
const devEl = seg("wf-device",v=>{frame.dataset.device=v;setURL();requestAnimationFrame(()=>{afterMount()})});
const dataEl = seg("wf-data",v=>{MODE=v;setURL();mount()});
if(qs.get("d")==="phone"){frame.dataset.device="phone";[...devEl.children].forEach(x=>x.setAttribute("aria-pressed",x.dataset.v==="phone"))}
[...dataEl.children].forEach(x=>x.setAttribute("aria-pressed",x.dataset.v===MODE));
replay.addEventListener("click",mount);
window.addEventListener("resize",()=>{moveHighlight();afterMount()});
document.addEventListener("keydown",e=>{
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==="Escape"){closeAll();return}
  const n=C[comp].variants.length, num=parseInt(e.key,10);
  if(!isNaN(num)){const i=num===0?9:num-1;if(i<n)setActive(i)}
  else if(e.key==="ArrowRight") setActive((current+1)%n);
  else if(e.key==="ArrowLeft") setActive((current-1+n)%n);
  else if(e.key==="r"||e.key==="R") mount();
});

/* ---------- per-mount wiring ---------- */
function afterMount(){
  stage.querySelectorAll("[data-slide]").forEach(slideHL);
  stage.querySelectorAll("[data-drag]").forEach(wireDrag);
}
function slideHL(track){const hl=track.querySelector(".hl"),on=track.querySelector("[aria-pressed=true]");if(!hl||!on)return;hl.style.width=on.offsetWidth+"px";hl.style.transform=`translateX(${on.offsetLeft}px)`;}
function root(){return stage.querySelector(".screen")||stage}
function closeAll(){stage.querySelectorAll(".ov:not([hidden])").forEach(closeOv);stage.querySelectorAll(".menu:not([hidden])").forEach(m=>m.hidden=true)}
function closeOv(ov){ov.classList.add("closing");setTimeout(()=>{ov.hidden=true;ov.classList.remove("closing");const d=ov.querySelector("[data-drag]");if(d)d.style.transform=""},180)}
function applyFilter(scope){
  const multi=scope.querySelector("[data-multi]");
  const on=[...scope.querySelectorAll("[data-f][aria-pressed=true]")].map(b=>b.dataset.f);
  const sel=scope.querySelector("[data-f-select]"); if(sel) on.splice(0,on.length,sel.value);
  let shown=0;
  scope.querySelectorAll("[data-st]").forEach(r=>{const ok=on.includes("All")||on.includes(r.dataset.st)||(!multi&&!on.length);r.hidden=!ok;if(ok)shown++});
  const em=scope.querySelector(".f-empty"); if(em) em.hidden=shown>0;
  const lab=scope.querySelector("[data-f-label]"); if(lab){lab.textContent=on[0]||"All";scope.querySelector("[data-f-count]").textContent=shown}
}
function sendToast(msg,opts){toast(root(),msg,opts)}

stage.addEventListener("change",e=>{
  const sel=e.target.closest("[data-f-select]"); if(sel) applyFilter(sel.closest("[data-fscope]"));
  const bulk=e.target.closest("[data-bulk]"); if(bulk){const n=bulk.querySelectorAll("input:checked").length;const bar=bulk.querySelector(".a9bar");bar.hidden=!n;bulk.querySelector("[data-bulk-n]").textContent=`${n} selected`}
});
stage.addEventListener("input",e=>{
  if(e.target.matches("[data-cmd]")){const q=e.target.value.toLowerCase();e.target.parentElement.querySelectorAll("[data-name]").forEach(b=>b.hidden=!b.dataset.name.includes(q))}
});
stage.addEventListener("click",e=>{
  const t=e.target;
  // menus
  const mb=t.closest("[data-menu]");
  if(mb){const m=stage.querySelector("#"+mb.dataset.menu);const was=m.hidden;stage.querySelectorAll(".menu").forEach(x=>x.hidden=true);m.hidden=!was;e.stopPropagation();return}
  if(!t.closest(".menu")) stage.querySelectorAll(".menu").forEach(x=>x.hidden=true);
  // filters
  const fb=t.closest("[data-f]");
  if(fb&&!fb.disabled){const scope=fb.closest("[data-fscope]");const multi=fb.closest("[data-multi]");
    if(multi) fb.setAttribute("aria-pressed",fb.getAttribute("aria-pressed")!=="true");
    else scope.querySelectorAll("[data-f]").forEach(b=>b.setAttribute("aria-pressed",b===fb||(b.dataset.f===fb.dataset.f)));
    scope.querySelectorAll("[data-slide]").forEach(slideHL); applyFilter(scope);}
  if(t.closest("[data-f-reset]")){const s=t.closest("[data-fscope]");s.querySelectorAll("[data-f]").forEach(b=>b.setAttribute("aria-pressed","false"));applyFilter(s)}
  if(t.closest("[data-close-menu]")) t.closest(".menu").hidden=true;
  // single-select groups
  const ss=t.closest("[data-single] > button"); if(ss) ss.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===ss));
  const pk=t.closest("[data-pickgroup] > button"); if(pk&&!pk.disabled) pk.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===pk));
  // loading buttons
  const lb=t.closest("[data-load]");
  if(lb&&!lb.disabled&&!lb.dataset.busy){const [busy,done]=lb.dataset.load.split("|");const w=lb.offsetWidth;lb.dataset.busy=1;lb.style.minWidth=w+"px";const orig=lb.innerHTML;lb.innerHTML=`<span class="spin"></span>${busy}`;
    setTimeout(()=>{lb.innerHTML=`${I.check}${done}`;setTimeout(()=>{lb.innerHTML=orig;delete lb.dataset.busy},2200)},900)}
  // overlays
  const ob=t.closest("[data-open]"); if(ob){const ov=stage.querySelector("#"+ob.dataset.open);ov.hidden=false;const d=ov.querySelector("[data-drag]");if(d){d.style.transform="translateY(100%)";requestAnimationFrame(()=>requestAnimationFrame(()=>d.style.transform="translateY(45%)"))}const st=ov.querySelector("[data-steps]");if(st)stepTo(st,1)}
  if(t.closest("[data-close]")){const ov=t.closest(".ov");if(ov)closeOv(ov)}
  else if(t.classList.contains("ov")) closeOv(t);
  const tg=t.closest("[data-toggle]"); if(tg){const el=stage.querySelector("#"+tg.dataset.toggle);el.hidden=!el.hidden}
  // steps
  if(t.closest("[data-step-next]")) stepTo(t.closest("[data-steps]"),2);
  if(t.closest("[data-step-back]")) stepTo(t.closest("[data-steps]"),1);
  // morph confirm
  const mg=t.closest("[data-morph-go]"); if(mg){mg.hidden=true;mg.nextElementSibling.hidden=false}
  const mn=t.closest("[data-morph-no]"); if(mn){const w=mn.closest("[data-morph]");w.children[1].hidden=true;w.children[0].hidden=false}
  const my=t.closest("[data-morph-yes]"); if(my){const w=my.closest("[data-morph]");w.innerHTML=`<span class="small" style="color:var(--live);font-weight:600;animation:pop 160ms var(--ease-out)">${I.check} Sent</span>`}
  // bulk clear
  if(t.closest("[data-bulk-clear]")){const b=t.closest("[data-bulk]");b.querySelectorAll("input").forEach(i=>i.checked=false);b.querySelector(".a9bar").hidden=true}
  // toasts
  const tt=t.closest("[data-toast]"); if(tt) sendToast(tt.dataset.toast);
  if(t.closest("[data-t1]")) sendToast(`Offer sent to ${tName()}`);
  if(t.closest("[data-t2]")){const r=root();r.querySelector(".t2")?.remove();const b=document.createElement("div");b.className="t2";b.innerHTML=`${I.check}<span class="grow" style="overflow-wrap:anywhere">Offer sent to ${esc(tName())}. They'll get a Slack message.</span>`;r.appendChild(b);setTimeout(()=>{b.style.transition="opacity 200ms";b.style.opacity=0;setTimeout(()=>b.remove(),200)},3000)}
  if(t.closest("[data-t4]")){const r=root();let host=r.querySelector(".toast-host");if(!host){host=document.createElement("div");host.className="toast-host";r.appendChild(host)}const el=document.createElement("div");el.className="g-toast";el.style.position="relative";el.style.overflow="hidden";el.innerHTML=`<span class="grow trunc">Sending offer to ${esc(tName())}…</span><button class="gp" style="height:24px;font-size:12px">Undo</button><i class="t4bar"></i>`;host.appendChild(el);const tm=setTimeout(()=>{el.querySelector("span").textContent="Offer sent";el.querySelector("button").remove();setTimeout(()=>el.remove(),1500)},5000);el.querySelector("button").onclick=()=>{clearTimeout(tm);el.querySelector("span").textContent="Cancelled. Nothing was sent.";el.querySelector("button").remove();el.querySelector(".t4bar").remove();setTimeout(()=>el.remove(),1500)}}
  const t5=t.closest("[data-t5]"); if(t5){const c=t5.closest(".card");c.classList.remove("fl");void c.offsetWidth;c.classList.add("fl");c.querySelector("[data-t5note]").innerHTML=`<span style="color:var(--live);font-weight:600">${I.check} Offer sent 9:42</span>`;t5.textContent="Sent";t5.disabled=true}
  const t7=t.closest("[data-t7]"); if(t7){const host=root().querySelector("[data-t7host]");const n=t7.textContent.includes("3")?3:1;for(let k=0;k<n;k++)setTimeout(()=>{const el=document.createElement("div");el.className="g-toast";el.innerHTML=`<span class="grow trunc">Offer sent to ${esc(H()[host.children.length%H().length].name)}</span>`;host.appendChild(el);layoutStack(host)},k*250);host.onclick=()=>{host.classList.toggle("open");layoutStack(host)}}
  if(t.closest("[data-t8go]")){const s=root().querySelector("[data-t8]");s.innerHTML=`<span class="spin" style="width:10px;height:10px"></span> Sending…`;setTimeout(()=>{s.innerHTML=`<span style="color:var(--live)">${I.check} Sent 9:42</span>`},1000)}
  if(t.closest("[data-t9]")) sendToast("Booked for 10:15 in Rm 2241",{action:"View on map",ms:4000});
  if(t.closest("[data-t10]")){const r=root();r.querySelector(".t10")?.remove();const el=document.createElement("div");el.className="t10";el.innerHTML=`<div class="row" style="align-items:flex-start"><span style="color:var(--warning)">${I.alert}</span><div class="grow"><b>Offer didn't send</b><div class="small muted" style="overflow-wrap:anywhere">Slack couldn't reach ${esc(tName())}. We'll email them instead if you retry.</div><div class="row" style="gap:6px;margin-top:8px"><button class="gp pri" style="height:26px">Retry</button><button class="gp" style="height:26px">Dismiss</button></div></div></div>`;r.appendChild(el);el.querySelectorAll("button").forEach(b=>b.onclick=ev=>{ev.stopPropagation();el.remove();if(b.textContent==="Retry")sendToast("Sent by email")})}
});
function layoutStack(host){const ts=[...host.children];const open=host.classList.contains("open");ts.forEach((el,i)=>{const fromTop=ts.length-1-i;el.style.transform=open?`translateY(${-fromTop*52}px)`:`translateY(${-fromTop*8}px) scale(${1-fromTop*0.05})`;el.style.opacity=fromTop>2&&!open?0:1;el.style.zIndex=i})}
function stepTo(st,n){st.querySelector("[data-step-n]").textContent=n;st.querySelectorAll("[data-step]").forEach(s=>s.hidden=s.dataset.step!=n)}
function wireDrag(sheet){
  if(sheet.dataset.wired) return; sheet.dataset.wired=1;
  let y0=0,base=0,h=0,last=0,lt=0,vel=0,dragging=false;
  const cur=()=>{const m=/translateY\(([-\d.]+)(%|px)\)/.exec(sheet.style.transform);if(!m)return h*0.45;return m[2]==="%"?h*parseFloat(m[1])/100:parseFloat(m[1])};
  sheet.addEventListener("pointerdown",e=>{if(e.target.closest("button"))return;h=sheet.offsetHeight;base=cur();y0=e.clientY;last=e.clientY;lt=e.timeStamp;dragging=true;sheet.classList.add("drag");sheet.setPointerCapture(e.pointerId)});
  sheet.addEventListener("pointermove",e=>{if(!dragging)return;let y=base+(e.clientY-y0);if(y<0)y=y*0.25;sheet.style.transform=`translateY(${y}px)`;vel=(e.clientY-last)/Math.max(1,e.timeStamp-lt);last=e.clientY;lt=e.timeStamp});
  const end=()=>{if(!dragging)return;dragging=false;sheet.classList.remove("drag");const y=cur()+vel*200;const snaps=[0,h*0.45,h];const tgt=snaps.reduce((a,b)=>Math.abs(b-y)<Math.abs(a-y)?b:a);if(tgt===h){sheet.style.transform="translateY(100%)";setTimeout(()=>{sheet.closest(".ov").hidden=true;sheet.style.transform=""},300)}else sheet.style.transform=`translateY(${tgt}px)`};
  sheet.addEventListener("pointerup",end);sheet.addEventListener("pointercancel",end);
}

const reqV = parseInt(qs.get("v"),10);
buildItems();
setActive(reqV>=1&&reqV<=C[comp].variants.length?reqV-1:0);
requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute("data-ready","")));
</script>
</body>
</html>
