<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff">
<title>Components · Wireframes v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --text-heavy:#0b2b4a;--text-medium:#1c3550;--text-light:#516476;--text-placeholder:rgba(81,100,118,0.7);--text-disabled:rgba(81,100,118,0.5);
  --link:#0b6bc4;--text-active:#08559c;--text-warning:#8a4300;--text-task:#5c3d00;
  --bg-page:#f3f7fc;--surface:#fff;--nav:#dbe7f5;--nav-selected:#b9d3f0;--inset:#edf3fa;--highlight:#e1effb;--highlight-subtle:rgba(225,239,251,0.4);--task:#ffefb8;
  --primary:#0b6bc4;--border:#cdddeb;--border-subtle:#e0eaf3;--border-card:#d6e3ef;--border-control:#b9cbe0;--border-outline:#accae5;
  --border-faint:rgba(81,100,118,0.1);--border-muted:rgba(81,100,118,0.2);--border-medium:rgba(81,100,118,0.5);--border-strong:#516476;
  --live:#16803c;--warning:#a34a00;--badge:#fbdac4;--badge-icon:#cf6b28;
  --s-pink:rgba(250,104,235,0.15);--s-blue:rgba(37,130,254,0.15);--s-green:rgba(104,250,109,0.15);--s-orange:rgba(254,145,37,0.15);
  --r-xs:3px;--r-sm:4px;--r-md:6px;--r-lg:8px;--r-xl:10px;--r-2xl:12px;--r-3xl:20px;--r-full:999px;
  --shadow-card:0px 1px 2px 0px rgba(11,43,74,0.06),0px 1px 4px 0px rgba(11,43,74,0.05);
  --shadow-primary:0px 2px 4px 0px rgba(11,43,74,0.2);--shadow-secondary:0px 2px 8px 0px rgba(0,0,0,0.12);
  --ease-out:cubic-bezier(0.23,1,0.32,1);--ease-in-out:cubic-bezier(0.77,0,0.175,1);--ease-drawer:cubic-bezier(0.32,0.72,0,1);
}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg-page);color:var(--text-heavy);font-family:Figtree,system-ui,sans-serif;font-size:14px;line-height:1.45;overflow-x:hidden}
button,a,[role=button]{touch-action:manipulation}
button,[role=button]{user-select:none;-webkit-user-select:none;font:inherit;color:inherit}
input,select,textarea{font:inherit;font-size:16px}
.num{font-variant-numeric:tabular-nums}

/* ---------- harness chrome ---------- */
.wf-head{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--border-subtle);padding:10px 16px 8px}
.wf-row{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;max-width:1280px;margin:0 auto}
.wf-row+.wf-row{margin-top:8px}
.wf-title{font-weight:700;font-size:16px;margin:0}
.wf-title a{color:var(--text-light);text-decoration:none;font-weight:500}
.wf-badge{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--warning);background:var(--s-orange);border-radius:var(--r-full);padding:2px 8px;white-space:nowrap}
.wf-spacer{flex:1}
.wf-seg{display:inline-flex;background:var(--inset);border-radius:var(--r-full);padding:2px;gap:2px}
.wf-seg button{border:0;background:transparent;border-radius:var(--r-full);padding:3px 10px;font-size:12px;font-weight:600;color:var(--text-light);cursor:pointer;white-space:nowrap}
.wf-seg button[aria-pressed=true]{background:var(--surface);color:var(--text-heavy);box-shadow:var(--shadow-card)}
.wf-comps{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;max-width:100%;padding-bottom:2px}
.wf-comps::-webkit-scrollbar{display:none}
.wf-comps button{flex-shrink:0;border:1px solid var(--border-subtle);background:var(--surface);border-radius:var(--r-full);padding:3px 10px;font-size:12px;font-weight:600;color:var(--text-light);cursor:pointer;white-space:nowrap}
.wf-comps button[aria-pressed=true]{background:var(--nav-selected);border-color:var(--nav-selected);color:var(--text-active)}
#wf-note{font-size:13px;color:var(--text-light);margin:0;min-height:19px}
#wf-note b{color:var(--text-heavy)}
.wf-main{padding:20px 16px 48px}
#frame{margin:0 auto;max-width:1280px;width:100%;container-type:inline-size;container-name:frame}
#frame[data-device=phone]{max-width:375px;border:1px solid var(--border);border-radius:28px;padding:8px 0;background:var(--bg-page);box-shadow:var(--shadow-secondary)}
#stage{min-height:200px}

/* picker: verbatim from PICKER.md, with the inline position for the header */
.proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,0.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,0.08) inset,0 8px 24px rgba(0,0,0,0.24),0 2px 6px rgba(0,0,0,0.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,0.12)}
.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(0.23,1,0.32,1),width 250ms cubic-bezier(0.23,1,0.32,1)}
@media (prefers-reduced-motion:reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}}
.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,0.55);font:inherit;cursor:pointer;transition:color 150ms ease-out,transform 160ms cubic-bezier(0.23,1,0.32,1);white-space:nowrap;flex-shrink:0}
@media (hover:hover) and (pointer:fine){.proto-picker-item:hover{color:rgba(255,255,255,0.85)}}
.proto-picker-item:active{transform:scale(0.97)}
.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,0.4);outline-offset:2px}
.proto-picker-item[data-active]{color:#fff}
.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,0.12);flex-shrink:0}
.proto-picker-replay{padding:0 10px;font-size:14px}
.proto-picker[data-position=inline]{position:relative;left:auto;bottom:auto;top:auto;transform:none;max-width:100%;overflow-x:auto;scrollbar-width:none;z-index:1}
.proto-picker[data-position=inline]::-webkit-scrollbar{display:none}

/* ---------- shared wireframe bits ---------- */
.sec{margin:0 0 16px}
.sec-h{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-light);margin:0 0 8px}
.card{background:var(--surface);border:1px solid var(--border-subtle);border-radius:var(--r-2xl);box-shadow:var(--shadow-card);padding:16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@container frame (max-width:700px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--text-light)}
.small{font-size:12px}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ic{width:14px;height:14px;flex-shrink:0;vertical-align:-2px}
.logo{display:block;width:auto;max-width:100%;object-fit:contain;flex-shrink:0}
.wordmark{font-weight:700;letter-spacing:-0.01em;color:var(--text-heavy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:inline-block;line-height:1.1}
.av{flex-shrink:0;display:inline-grid;place-items:center;font-weight:700;color:var(--text-heavy);border-radius:var(--r-full);overflow:hidden}
.screen{position:relative;overflow:hidden;min-height:560px;background:var(--bg-page);border:1px solid var(--border-subtle);border-radius:var(--r-2xl)}
#frame[data-device=phone] .screen{border:0;border-radius:0}
.appbar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--border-subtle);min-width:0}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--border-subtle);min-width:0}
.li:first-child{border-top:0}
.tbl{width:100%;border-collapse:collapse;table-layout:fixed}
.tbl th{font-size:12px;color:var(--text-light);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--border-subtle)}
.tbl td{padding:8px;border-bottom:1px solid var(--border-subtle);vertical-align:top;min-width:0;overflow-wrap:anywhere}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;display:inline-block;animation:spin 700ms linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,var(--inset) 0,var(--highlight) 50%,var(--inset) 100%);background-size:200% 100%;animation:shimmer 1.2s linear infinite;border-radius:var(--r-sm);height:12px}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(0.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
  .spin{animation:spin 1.4s linear infinite!important}
}
/* generic pill used outside variant specific styles */
.gp{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:var(--r-full);border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:transform 160ms var(--ease-out),background-color 150ms ease}
.gp:active{transform:scale(0.97)}
.gp.pri{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:var(--shadow-primary)}
.gp:disabled{opacity:.5;cursor:not-allowed}
.gp:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
@media (hover:hover) and (pointer:fine){.gp:hover{background:var(--inset)}.gp.pri:hover{background:var(--text-active)}}
.menu{position:absolute;z-index:20;min-width:220px;background:var(--surface);border:1px solid var(--border-subtle);border-radius:var(--r-2xl);box-shadow:var(--shadow-secondary);padding:6px;transform-origin:top right;animation:pop 160ms var(--ease-out)}
.menu[hidden]{display:none}
.menu button{display:flex;width:100%;align-items:center;gap:8px;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:var(--r-lg);cursor:pointer;font-size:13px;font-weight:500}
@media (hover:hover) and (pointer:fine){.menu button:hover{background:var(--inset)}}
.menu-h{font-size:11px;font-weight:600;color:var(--text-light);text-transform:uppercase;letter-spacing:.05em;padding:6px 10px 4px}
.note-strip{font-size:12px;color:var(--text-light);background:var(--inset);border-radius:var(--r-lg);padding:8px 10px;margin-top:12px}
</style>
</head>
<body>
<header class="wf-head">
  <div class="wf-row">
    <p class="wf-title"><a href="index.html">Wireframes</a> / Components</p>
    <span class="wf-badge">WIREFRAME · dummy data</span>
    <span class="wf-spacer"></span>
    <div class="wf-seg" id="wf-data" role="group" aria-label="Data">
      <button data-v="demo" aria-pressed="true">Demo data</button><button data-v="worst" aria-pressed="false">Worst case</button>
    </div>
    <div class="wf-seg" id="wf-device" role="group" aria-label="Frame">
      <button data-v="desktop" aria-pressed="true">Desktop</button><button data-v="phone" aria-pressed="false">Phone</button>
    </div>
  </div>
  <div class="wf-row"><div class="wf-comps" id="wf-comps" role="group" aria-label="Component"></div></div>
  <div class="wf-row">
    <nav class="proto-picker" data-position="inline" aria-label="Prototype variants">
      <span class="proto-picker-highlight" aria-hidden="true"></span>
      <span id="picker-items" style="display:contents"></span>
      <span class="proto-picker-divider" aria-hidden="true"></span>
      <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
    </nav>
  </div>
  <div class="wf-row"><p id="wf-note"></p></div>
</header>
<main class="wf-main"><div id="frame" data-device="desktop"><div id="stage"></div></div></main>

<script>
/* =========================================================

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  ...HACKERS.slice(0,37)];

let MODE = "demo";
const H = () => MODE === "worst" ? HACKERS_WORST : HACKERS;
const SP = () => MODE === "worst" ? SPONSORS_WORST : SPONSORS;
const me = () => H()[0];

/* ---------- helpers ---------- */
const SUFFIX = /^(jr|sr|ii|iii|iv)\.?$/i;
function initials(name){
  const seg = typeof Intl !== "undefined" && Intl.Segmenter ? new Intl.Segmenter(undefined,{granularity:"grapheme"}) : null;
  const first = s => seg ? ([...seg.segment(s)][0]||{}).segment||"" : s[0]||"";
  const words = name.replace(/@.*/,"").split(/[\s.\-_]+/).filter(w=>w && !SUFFIX.test(w) && /\p{L}/u.test(w));
  if(!words.length) return "?";
  const a = first(words[0]).toUpperCase(), b = words.length>1 ? first(words[words.length-1]).toUpperCase() : "";
  return a+b;
}
const AVBG = ["var(--nav)","var(--s-green)","var(--task)","var(--badge)","var(--s-pink)","var(--highlight)"];
function hash(s){let h=0;for(const c of s)h=(h*31+c.codePointAt(0))>>>0;return h}
function av(h,size=32,shape="full"){
  const r = shape==="sq" ? "var(--r-lg)" : "var(--r-full)";
  return `<span class="av" style="width:${size}px;height:${size}px;border-radius:${r};background:${AVBG[hash(h.name)%AVBG.length]};font-size:${Math.round(size*0.38)}px" aria-hidden="true">${esc(initials(h.name))}</span>`;
}
function logo(s,h=20,extra=""){
  if(!s.f) return `<span class="wordmark" style="font-size:${Math.max(11,Math.round(h*0.75))}px" title="${esc(s.n)}">${esc(s.n)}</span>`;
  return `<img class="logo" src="${LOGO+s.f}" alt="${esc(s.n)}" style="height:${h}px;${extra}" onerror="this.outerHTML='<span class=&quot;wordmark&quot; style=&quot;font-size:${Math.max(11,Math.round(h*0.75))}px&quot; title=&quot;'+this.alt+'&quot;>'+this.alt+'</span>'">`;
}
const plural = (n,one,many) => `${n.toLocaleString()} ${n===1?one:many}`;
const meta = h => [h.school,h.program].filter(Boolean).join(" · ");
const I = {

  right:'<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 4 4 4-4 4"/></svg>',
  x:'<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m4 4 8 8M12 4l-8 8"/></svg>',
  coffee:'<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 6h9v4a4 4 0 0 1-4 4h-1a4 4 0 0 1-4-4V6Z"/><path d="M11.5 7.5h1a1.8 1.8 0 0 1 0 3.6h-1.2M5 1.8v2M8 1.8v2"/></svg>',
  scan:'<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1.5 5V2.5a1 1 0 0 1 1-1H5M11 1.5h2.5a1 1 0 0 1 1 1V5M14.5 11v2.5a1 1 0 0 1-1 1H11M5 14.5H2.5a1 1 0 0 1-1-1V11M4 8h8"/></svg>',
  seat:'<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 2.5h8v6H4zM3 8.5h10v2H3zM4.5 10.5v3.5M11.5 10.5v3.5"/></svg>',
  wifi:'<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1.5 6a9.5 9.5 0 0 1 13 0M3.8 8.5a6 6 0 0 1 8.4 0M6 11a2.8 2.8 0 0 1 4 0"/><circle cx="8" cy="13.2" r=".6" fill="currentColor"/></svg>',
};
const HOWTO = ["Offer a coffee chat","Ask for help","Find your way","Judging on Sunday"];
const howtoMenu = (id,pos="right:0;top:calc(100% + 6px)") => `<div class="menu" id="${id}" hidden style="${pos}"><div class="menu-h">How to…</div>${HOWTO.map(t=>`<button data-toast="Opening “${t}”">${t}</button>`).join("")}</div>`;
/* status colours: token pairs only */
const STC = {
  "Booked":{bg:"var(--s-green)",fg:"var(--live)",ic:I.check},
  "Waiting":{bg:"var(--task)",fg:"var(--text-task)",ic:I.clock},
  "Full":{bg:"var(--inset)",fg:"var(--text-light)",ic:I.lock},
  "Needs 2":{bg:"var(--highlight)",fg:"var(--link)",ic:I.users},
  "Sent":{bg:"var(--nav)",fg:"var(--text-active)",ic:I.send},
  "Failed":{bg:"var(--badge)",fg:"var(--warning)",ic:I.alert}};
function counts(list){const c={All:list.length};STATUSES.forEach(s=>c[s]=0);list.forEach(h=>c[h.status]++);return c}
/* toast host scoped to the frame */
function toast(root,msg,opts={}){
  let host = root.querySelector(".toast-host");
  if(!host){host=document.createElement("div");host.className="toast-host";root.appendChild(host)}
  const t=document.createElement("div");t.className="g-toast";t.innerHTML=`<span class="grow">${esc(msg)}</span>${opts.action?`<button class="gp" style="height:24px;padding:0 8px;font-size:12px">${esc(opts.action)}</button>`:""}`;
  host.appendChild(t);setTimeout(()=>{t.style.opacity="0";t.style.transform="translateY(6px)";setTimeout(()=>t.remove(),220)},opts.ms||2600);
}
</script>
<style>
.toast-host{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:40;width:min(360px,calc(100% - 32px));pointer-events:none}
.g-toast{pointer-events:auto;display:flex;align-items:center;gap:8px;background:var(--text-heavy);color:#fff;border-radius:var(--r-2xl);padding:10px 12px;font-size:13px;box-shadow:var(--shadow-secondary);animation:rise 240ms var(--ease-out);transition:opacity 200ms ease,transform 200ms var(--ease-out)}
.g-toast .gp{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
</style>
<script>
/* =========================================================
   COMPONENT 1 · Buttons and pills
   ========================================================= */
const C = {};
const btnSpecs = (p) => `
  <div class="sec-h" style="margin-top:16px">Every state</div>
  <div class="row wrap" style="gap:10px">
    <button class="${p}pri" data-load="Sending…|Sent">Send offer</button>
    <button class="${p}sec">Not now</button>
    <button class="${p}sm">Edit</button>
    <span class="${p}tag">Friday</span>
    <button class="${p}pri" disabled>Send offer</button>
    <button class="${p}pri" aria-busy="true"><span class="spin"></span>Sending…</button>
  </div>`;
const offerCard = (p, actions) => `
  <div class="card" style="max-width:520px">
    <div class="row" style="align-items:flex-start">${av(me(),36)}<div class="grow"><div style="font-weight:600;overflow-wrap:anywhere">${esc(me().name)} wants a coffee chat</div><div class="muted small" style="overflow-wrap:anywhere">${esc(meta(me())||"No school listed")}</div></div></div>
    <div class="row wrap" style="margin-top:12px;gap:8px">${actions}</div>
  </div>`;
const bar = (right) => `<div class="appbar">${logo(SP()[8],18)}<span class="grow trunc muted small">Sponsor portal</span><div class="row" style="position:relative;gap:6px">${right}</div></div>`;

C.buttons = {label:"Buttons & pills", variants:[
 {name:"Quiet pills", why:"Everything is a small 28px pill; only the one action that matters is filled blue.", render:()=>`
  <style>.b1pri,.b1sec,.b1sm,.b1map,.b1q{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid var(--border);background:var(--surface);cursor:pointer;white-space:nowrap;transition:transform 160ms var(--ease-out),background-color 150ms ease}
  .b1pri{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:var(--shadow-primary)}.b1sm{height:24px;padding:0 9px;font-size:12px}
  .b1map{background:var(--text-heavy);border-color:var(--text-heavy);color:#fff}.b1q{width:28px;padding:0;justify-content:center}
  .b1tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;background:var(--nav);color:var(--text-active);font-size:12px;font-weight:600}
  [class^=b1]:active{transform:scale(0.97)}[class^=b1]:disabled{opacity:.5;cursor:not-allowed;transform:none}
  @media (hover:hover) and (pointer:fine){.b1sec:hover,.b1sm:hover,.b1q:hover{background:var(--inset)}.b1pri:hover{background:var(--text-active)}}</style>
  <div class="screen" style="min-height:0">${bar(`<button class="b1map">${I.pin}Map</button><button class="b1q" data-menu="m1" aria-label="How to">?</button>${howtoMenu("m1")}`)}
  <div style="padding:16px">${offerCard("b1",`<button class="b1pri" data-load="Sending…|Offer sent">${I.coffee}Offer a chat</button><button class="b1sec">Not now</button>`)}${btnSpecs("b1")}</div></div>`},

 {name:"Text-first, Map floats", why:"Secondary actions are plain links so the page stays calm; Map is a floating pill always in reach.", render:()=>`
  <style>.b2pri{height:32px;padding:0 14px;border:0;border-radius:999px;background:var(--primary);color:#fff;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:transform 160ms var(--ease-out)}
  .b2sec,.b2sm{border:0;background:none;color:var(--link);font-weight:600;font-size:13px;cursor:pointer;padding:6px 4px;text-underline-offset:3px}.b2sm{font-size:12px}
  .b2tag{font-size:12px;font-weight:600;color:var(--text-light)}.b2tag::before{content:"● ";color:var(--primary)}
  .b2fab{position:absolute;right:16px;bottom:16px;height:40px;padding:0 16px;border-radius:999px;border:0;background:var(--text-heavy);color:#fff;font-weight:700;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow-secondary);cursor:pointer}
  .b2pri:active,.b2fab:active{transform:scale(0.97)}.b2pri:disabled{opacity:.5}
  @media (hover:hover) and (pointer:fine){.b2sec:hover,.b2sm:hover{text-decoration:underline}}</style>
  <div class="screen">${bar(`<button class="b2sec" data-menu="m2">How to…</button>${howtoMenu("m2")}`)}
  <div style="padding:16px">${offerCard("b2",`<button class="b2pri" data-load="Sending…|Offer sent">Offer a chat</button><button class="b2sec">Not now</button>`)}${btnSpecs("b2")}
  <p class="note-strip">Map sits bottom right on every page, above the content, so it's one tap from anywhere.</p></div>
  <button class="b2fab" data-toast="Map opens full screen">${I.pin}Map</button></div>`},

 {name:"Toolbar chips with keys", why:"Dense icon + label chips like a desktop tool; keyboard hints for reps working on a laptop at the booth.", render:()=>`
  <style>.b3pri,.b3sec,.b3sm{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 8px;border-radius:var(--r-md);font-size:12.5px;font-weight:600;border:1px solid var(--border-muted);background:var(--surface);cursor:pointer;transition:transform 160ms var(--ease-out)}
  .b3pri{background:var(--text-heavy);color:#fff;border-color:var(--text-heavy)}.b3sm{height:22px;padding:0 6px;font-size:12px}
  kbd{font:600 10.5px/1 Figtree;padding:2px 4px;border-radius:3px;background:var(--inset);color:var(--text-light)}.b3pri kbd{background:rgba(255,255,255,.15);color:#fff}
  .b3tag{font-size:11.5px;font-weight:600;padding:2px 6px;border-radius:var(--r-sm);border:1px solid var(--border)}
  [class^=b3]:active{transform:scale(0.97)}[class^=b3]:disabled{opacity:.5}
  @media (hover:hover) and (pointer:fine){.b3sec:hover,.b3sm:hover{background:var(--inset)}}
  @container frame (max-width:500px){kbd{display:none}}</style>
  <div class="screen" style="min-height:0">${bar(`<button class="b3sec">${I.pin}Map <kbd>M</kbd></button><button class="b3sec" data-menu="m3">${I.help}How to <kbd>?</kbd></button>${howtoMenu("m3")}`)}
  <div style="padding:16px">${offerCard("b3",`<button class="b3pri" data-load="Sending…|Sent">${I.coffee}Offer chat <kbd>O</kbd></button><button class="b3sec">Skip <kbd>S</kbd></button>`)}${btnSpecs("b3")}</div></div>`},

 {name:"Soft tint, live Map", why:"No borders anywhere; tinted fills carry hierarchy. The Map pill shows a live dot and where you are.", render:()=>`
  <style>.b4pri,.b4sec,.b4sm{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 14px;border-radius:999px;border:0;font-size:13px;font-weight:600;cursor:pointer;transition:transform 160ms var(--ease-out),background-color 150ms ease}
  .b4pri{background:var(--primary);color:#fff}.b4sec{background:var(--nav);color:var(--text-active)}.b4sm{height:24px;padding:0 10px;font-size:12px;background:var(--inset)}
  .b4tag{padding:3px 10px;border-radius:999px;background:var(--highlight);font-size:12px;font-weight:600;color:var(--link)}
  .b4map{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px 0 10px;border:0;border-radius:999px;background:var(--highlight);color:var(--text-heavy);font-weight:600;font-size:13px;cursor:pointer}
  .b4dot{width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 0 3px var(--s-green)}
  [class^=b4]:active{transform:scale(0.97)}[class^=b4]:disabled{opacity:.5}
  @media (hover:hover) and (pointer:fine){.b4sec:hover{background:var(--nav-selected)}.b4map:hover{background:var(--nav)}}</style>
  <div class="screen" style="min-height:0">${bar(`<button class="b4map"><span class="b4dot"></span>Map<span class="muted small" style="font-weight:500">Sponsor Bay</span></button><button class="b4sec" data-menu="m4" style="width:30px;padding:0;justify-content:center" aria-label="How to">?</button>${howtoMenu("m4")}`)}
  <div style="padding:16px">${offerCard("b4",`<button class="b4pri" data-load="Sending…|Sent">Offer a chat</button><button class="b4sec">Not now</button>`)}${btnSpecs("b4")}</div></div>`},

 {name:"Joined action bar", why:"Related actions sit in one connected group, so a row of choices reads as one control, not five buttons.", render:()=>`
  <style>.b5grp{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:var(--surface)}
  .b5grp>button{border:0;border-left:1px solid var(--border);background:transparent;height:30px;padding:0 12px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background-color 150ms ease}
  .b5grp>button:first-child{border-left:0}.b5grp>button.on{background:var(--primary);color:#fff}
  .b5grp>button:active{background:var(--inset)}
  .b5pri{height:30px;padding:0 14px;border-radius:999px;border:0;background:var(--primary);color:#fff;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}.b5sec,.b5sm{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-weight:600;cursor:pointer}.b5sm{height:24px;font-size:12px}
  .b5tag{font-size:12px;font-weight:600;border-bottom:2px solid var(--primary)}.b5pri:disabled{opacity:.5}
  @media (hover:hover) and (pointer:fine){.b5grp>button:not(.on):hover{background:var(--inset)}}</style>
  <div class="screen" style="min-height:0">${bar(`<div class="b5grp"><button>${I.pin}Map</button><button>${I.scan}Scan</button><button data-menu="m5" aria-label="How to">?</button></div>${howtoMenu("m5")}`)}
  <div style="padding:16px">${offerCard("b5",`<div class="b5grp"><button class="on" data-load="Sending…|Sent">${I.coffee}Offer chat</button><button>Save for later</button><button>Not now</button></div>`)}${btnSpecs("b5")}</div></div>`},

 {name:"Split button + menu", why:"One primary action with a chevron for the rare alternatives, so the main path is one tap and the rest don't crowd it.", render:()=>`
  <style>.b6split{display:inline-flex;position:relative}.b6split>button{height:30px;border:0;background:var(--primary);color:#fff;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .b6split>button:first-child{padding:0 12px;border-radius:999px 0 0 999px}.b6split>button:nth-child(2){padding:0 8px;border-radius:0 999px 999px 0;border-left:1px solid rgba(255,255,255,.3)}
  .b6pri{height:30px;padding:0 14px;border-radius:999px;border:0;background:var(--primary);color:#fff;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}.b6sec,.b6sm{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-weight:600;cursor:pointer}.b6sm{height:24px;font-size:12px}
  .b6tag{font-size:12px;padding:2px 8px;border-radius:999px;border:1px dashed var(--border-medium)}.b6pri:disabled{opacity:.5}
  .b6split>button:active,.b6pri:active,.b6sec:active{transform:scale(0.97)}
  .b6how{height:30px;padding:0 10px 0 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px}</style>
  <div class="screen" style="min-height:0">${bar(`<button class="b6how" style="background:var(--text-heavy);color:#fff;border-color:var(--text-heavy)">${I.pin}Map</button><button class="b6how" data-menu="m6">How to ${I.chev}</button>${howtoMenu("m6")}`)}
  <div style="padding:16px">${offerCard("b6",`<div class="b6split"><button data-load="Sending…|Sent">${I.coffee}Offer 10:15 chat</button><button data-menu="m6b" aria-label="More times">${I.chev}</button><div class="menu" id="m6b" hidden style="left:0;top:calc(100% + 6px)"><div class="menu-h">Other times today</div><button>10:30 · 1/3</button><button>10:45 · 0/3</button><button>Pick a day…</button></div></div><button class="b6sec">Not now</button>`)}${btnSpecs("b6")}</div></div>`},

 {name:"Phone dock", why:"The three things a rep does standing up (Map, Scan, How to) live in a thumb-reach dock; page buttons stay small.", render:()=>`
  <style>.b7dock{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:4px;padding:5px;background:var(--surface);border:1px solid var(--border-subtle);border-radius:999px;box-shadow:var(--shadow-secondary)}
  .b7dock button{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px;height:46px;justify-content:center;border:0;border-radius:999px;background:transparent;font-size:11px;font-weight:600;cursor:pointer;transition:transform 160ms var(--ease-out)}
  .b7dock button .ic{width:18px;height:18px}.b7dock .hot{background:var(--text-heavy);color:#fff}.b7dock button:active{transform:scale(0.95)}
  .b7pri,.b7sec,.b7sm{height:28px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid var(--border);background:var(--surface);cursor:pointer}
  .b7pri{background:var(--primary);color:#fff;border-color:var(--primary);display:inline-flex;align-items:center;gap:6px}.b7sm{height:24px;font-size:12px}.b7pri:disabled{opacity:.5}
  .b7tag{font-size:12px;font-weight:600;background:var(--inset);padding:2px 8px;border-radius:999px}</style>
  <div class="screen">${bar(``)}
  <div style="padding:16px 16px 90px">${offerCard("b7",`<button class="b7pri" data-load="Sending…|Sent">Offer a chat</button><button class="b7sec">Not now</button>`)}${btnSpecs("b7")}</div>
  <div class="b7dock"><button class="hot" data-toast="Map opens full screen">${I.pin}Map</button><button>${I.scan}Scan</button><button data-menu="m7">${I.help}How to</button></div>
  ${howtoMenu("m7","left:50%;bottom:76px;transform:translateX(-50%);transform-origin:bottom center")}</div>`},

 {name:"Header Map with count", why:"Map is the loudest thing in the header and says what's on it today (3 rooms), so reps know it's worth a tap.", render:()=>`
  <style>.b8map{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 6px 0 12px;border-radius:999px;border:1.5px solid var(--primary);background:var(--surface);color:var(--primary);font-weight:700;cursor:pointer}
  .b8map .n{background:var(--primary);color:#fff;border-radius:999px;font-size:11px;padding:2px 7px}
  .b8q{height:32px;padding:0 12px;border-radius:999px;border:0;background:transparent;color:var(--text-light);font-weight:600;cursor:pointer}
  .b8pri,.b8sec,.b8sm{height:30px;padding:0 14px;border-radius:999px;border:1.5px solid transparent;background:transparent;font-weight:600;cursor:pointer;transition:border-color 120ms ease,transform 160ms var(--ease-out)}
  .b8pri{color:#fff;background:var(--primary)}.b8sec{color:var(--text-medium)}.b8sec:active,.b8sm:active{border-color:var(--border-strong)}.b8sm{height:24px;padding:0 10px;font-size:12px;color:var(--link)}
  .b8pri:active{transform:scale(0.97)}.b8pri:disabled{opacity:.5}.b8tag{font-size:12px;font-weight:600;color:var(--text-medium);background:var(--inset);padding:2px 8px;border-radius:var(--r-sm)}
  @media (hover:hover) and (pointer:fine){.b8sec:hover,.b8q:hover{background:var(--inset)}}</style>
  <div class="screen" style="min-height:0">${bar(`<button class="b8map">${I.pin}Map<span class="n num">3 rooms</span></button><button class="b8q" data-menu="m8">? How to</button>${howtoMenu("m8")}`)}
  <div style="padding:16px">${offerCard("b8",`<button class="b8pri" data-load="Sending…|Sent">Offer a chat</button><button class="b8sec">Not now</button>`)}${btnSpecs("b8")}</div></div>`},

 {name:"Square 6px buttons", why:"A control set against pills: squarer 6px corners read as 'buttons' and pills are kept for tags only.", render:()=>`
  <style>.b9pri,.b9sec,.b9sm{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r-md);font-size:13px;font-weight:600;border:1px solid var(--border-control);background:var(--surface);cursor:pointer;box-shadow:var(--shadow-card);transition:transform 160ms var(--ease-out)}
  .b9pri{background:var(--primary);color:#fff;border-color:var(--text-active);box-shadow:var(--shadow-primary)}.b9sm{height:26px;padding:0 8px;font-size:12px}
  .b9tag{padding:2px 10px;border-radius:999px;background:var(--nav);font-size:12px;font-weight:600}
  [class^=b9]:active{transform:scale(0.97)}[class^=b9]:disabled{opacity:.5}
  @media (hover:hover) and (pointer:fine){.b9sec:hover,.b9sm:hover{background:var(--inset)}}</style>
  <div class="screen" style="min-height:0">${bar(`<button class="b9pri" style="background:var(--text-heavy);border-color:var(--text-heavy)">${I.pin}Map</button><button class="b9sec" data-menu="m9">${I.help}How to</button>${howtoMenu("m9")}`)}
  <div style="padding:16px">${offerCard("b9",`<button class="b9pri" data-load="Sending…|Sent">${I.coffee}Offer a chat</button><button class="b9sec">Not now</button>`)}${btnSpecs("b9")}</div></div>`},

 {name:"Big touch, full width", why:"Phone-first: 44px tall, full-width stacked actions with icons for reps holding a coffee in one hand.", render:()=>`
  <style>.b10pri,.b10sec,.b10sm{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;font-size:15px;font-weight:600;border:1px solid var(--border);background:var(--surface);cursor:pointer;transition:transform 160ms var(--ease-out)}
  .b10pri{background:var(--primary);color:#fff;border-color:var(--primary)}.b10sm{min-height:36px;font-size:13px}
  .b10tag{padding:4px 12px;border-radius:999px;background:var(--nav);font-weight:600}
  .b10stack{display:grid;gap:8px}.b10stack>*{width:100%}
  [class^=b10]:active{transform:scale(0.98)}[class^=b10]:disabled{opacity:.5}
  .b10map{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:0 16px;border:0;border-radius:var(--r-2xl);background:var(--text-heavy);color:#fff;font-weight:700;font-size:15px;cursor:pointer;margin-bottom:12px}</style>
  <div class="screen" style="min-height:0">${bar(`<button class="b10sm" data-menu="m10" style="min-height:36px;width:36px;padding:0" aria-label="How to">?</button>${howtoMenu("m10")}`)}
  <div style="padding:16px;max-width:420px">
  <button class="b10map">${I.pin}<span class="grow" style="text-align:left">Open the map</span><span class="small" style="opacity:.7">Sponsor Bay, Floor 1</span></button>
  <div class="card"><div class="row" style="align-items:flex-start">${av(me(),36)}<div class="grow"><div style="font-weight:600;overflow-wrap:anywhere">${esc(me().name)} wants a coffee chat</div><div class="muted small">${esc(meta(me())||"No school listed")}</div></div></div>
  <div class="b10stack" style="margin-top:12px"><button class="b10pri" data-load="Sending…|Offer sent">${I.coffee}Offer a chat</button><button class="b10sec">Not now</button></div></div>
  ${btnSpecs("b10")}</div></div>`},
]};
</script>
<script>
/* =========================================================
   COMPONENT 2 · Segmented filter pills with counts
   ========================================================= */
const TIMES = ["9:00","9:15","9:30","9:45","10:00","10:15","10:30","10:45","11:00","11:15","11:30","11:45","12:00","12:15","12:30","12:45"];
const fRows = (list=H()) => `<div class="list" style="max-height:300px;overflow:auto;margin-top:12px">${list.map((h,i)=>`
  <div class="li" data-st="${h.status}">${av(h,28)}<div class="grow"><div class="trunc" style="font-weight:600" title="${esc(h.name)}">${esc(h.name)}</div><div class="trunc muted small">${esc(meta(h)||"No school listed")}</div></div><span class="small muted num" style="flex-shrink:0">Fri ${TIMES[i%16]}</span><span class="small" style="flex-shrink:0;font-weight:600;color:${STC[h.status].fg};width:64px;text-align:right">${h.status}</span></div>`).join("")}
  <div class="li f-empty" hidden><span class="muted">No chats here yet.</span></div></div>`;
const F4 = ["All","Booked","Waiting","Full"];
const fScope = (inner, title="Coffee chats · Fri Nov 20") => `<div class="card" data-fscope style="max-width:760px"><div style="font-weight:700;font-size:16px;margin-bottom:10px">${title}</div>${inner}${fRows()}</div>`;

C.filters = {label:"Filter pills", variants:[
 {name:"Sliding segmented track", why:"One grey track, the active segment is a white pill that slides; counts sit inside each label.", render:()=>{const c=counts(H());return `
  <style>.f1{position:relative;display:inline-flex;background:var(--nav);border-radius:999px;padding:3px;max-width:100%;overflow-x:auto;scrollbar-width:none}
  .f1 button{position:relative;z-index:1;border:0;background:transparent;height:28px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--text-light);cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
  .f1 button[aria-pressed=true]{color:var(--text-heavy)}.f1 button .num{color:var(--text-light);font-weight:500}
  .f1 .hl{position:absolute;top:3px;left:0;height:28px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow-card);transition:transform 220ms var(--ease-out),width 220ms var(--ease-out)}
  .f1 button:disabled{opacity:.45;cursor:not-allowed}</style>
  ${fScope(`<div class="f1" data-slide><span class="hl"></span>${F4.map((f,i)=>`<button data-f="${f}" aria-pressed="${i===0}" ${c[f]===0?"disabled":""}>${f}<span class="num">${c[f]}</span></button>`).join("")}</div>`)}`}},

 {name:"Separate chips, count badges", why:"Each filter is its own small pill with a round count, so a zero count can simply disappear.", render:()=>{const c=counts(H());return `
  <style>.f2 button{height:28px;padding:0 6px 0 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;transition:transform 160ms var(--ease-out)}
  .f2 button .num{min-width:20px;height:18px;padding:0 6px;border-radius:999px;background:var(--inset);font-size:11.5px;display:inline-grid;place-items:center}
  .f2 button[aria-pressed=true]{background:var(--primary);border-color:var(--primary);color:#fff}.f2 button[aria-pressed=true] .num{background:rgba(255,255,255,.2)}
  .f2 button:active{transform:scale(0.97)}</style>
  ${fScope(`<div class="f2 row wrap" style="gap:6px">${F4.filter(f=>c[f]>0).map((f,i)=>`<button data-f="${f}" aria-pressed="${i===0}">${f}<span class="num">${c[f]}</span></button>`).join("")}</div>`)}`}},

 {name:"Underline tabs", why:"Filters as quiet text tabs with a 2px underline; feels like part of the page, not a control panel.", render:()=>{const c=counts(H());return `
  <style>.f3{display:flex;gap:18px;border-bottom:1px solid var(--border-subtle);overflow-x:auto;scrollbar-width:none}
  .f3 button{border:0;background:none;padding:8px 0;font-size:14px;font-weight:600;color:var(--text-light);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
  .f3 button[aria-pressed=true]{color:var(--text-heavy);border-color:var(--primary)}.f3 .num{font-weight:500;margin-left:4px}
  @media (hover:hover) and (pointer:fine){.f3 button:hover{color:var(--text-heavy)}}</style>
  ${fScope(`<div class="f3">${F4.map((f,i)=>`<button data-f="${f}" aria-pressed="${i===0}">${f}<span class="num">${c[f]}</span></button>`).join("")}</div>`)}`}},

 {name:"One pill, menu of filters", why:"On a tight phone header, a single 'Showing: All 40' pill opens the options, so filters cost one pill of space.", render:()=>{const c=counts(H());return `
  <style>.f4{position:relative;display:inline-block}.f4>button{height:30px;padding:0 10px 0 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
  .f4 .menu{left:0;top:calc(100% + 6px);transform-origin:top left}.f4 .menu button[aria-pressed=true]{background:var(--highlight);color:var(--text-active)}.f4 .menu .num{margin-left:auto;color:var(--text-light)}</style>
  ${fScope(`<div class="f4"><button data-menu="f4m"><span class="muted" style="font-weight:500">Showing</span> <span data-f-label>All</span> <span class="num" data-f-count>${c.All}</span>${I.chev}</button>
  <div class="menu" id="f4m" hidden>${F4.map((f,i)=>`<button data-f="${f}" data-close-menu aria-pressed="${i===0}">${f}<span class="num">${c[f]}</span></button>`).join("")}</div></div>`)}`}},

 {name:"Scrolling chip row", why:"Every status and day in one horizontal row with a fade edge; swipe on phone, nothing wraps.", render:()=>{const c=counts(H());const all=["All","Booked","Waiting","Full","Sent","Needs 2","Failed"];return `
  <style>.f5wrap{position:relative;margin:0 -16px}.f5{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 16px;scroll-snap-type:x proximity;overscroll-behavior-x:contain;touch-action:pan-x}
  .f5wrap::after{content:"";position:absolute;right:0;top:0;bottom:0;width:32px;background:linear-gradient(90deg,transparent,var(--surface));pointer-events:none}
  .f5 button{flex-shrink:0;scroll-snap-align:start;height:28px;padding:0 12px;border-radius:999px;border:0;background:var(--inset);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
  .f5 button[aria-pressed=true]{background:var(--text-heavy);color:#fff}.f5 .num{opacity:.65;margin-left:4px;font-weight:500}.f5 button:disabled{opacity:.4}</style>
  ${fScope(`<div class="f5wrap"><div class="f5">${all.map((f,i)=>`<button data-f="${f}" aria-pressed="${i===0}" ${c[f]===0?"disabled":""}>${f}<span class="num">${c[f]}</span></button>`).join("")}</div></div>`)}`}},

 {name:"Count tiles that filter", why:"The numbers are the point: four stat tiles show today's totals and tapping one filters the list.", render:()=>{const c=counts(H());return `
  <style>.f6{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.f6 button{border:1px solid var(--border-subtle);background:var(--surface);border-radius:var(--r-2xl);padding:10px 12px;text-align:left;cursor:pointer;transition:transform 160ms var(--ease-out),border-color 150ms ease}
  .f6 b{display:block;font-size:24px;line-height:1.1}.f6 span{font-size:12px;color:var(--text-light);font-weight:600}
  .f6 button[aria-pressed=true]{border-color:var(--primary);background:var(--highlight)}.f6 button:active{transform:scale(0.98)}</style>
  ${fScope(`<div class="f6">${F4.map((f,i)=>`<button data-f="${f}" aria-pressed="${i===0}"><b class="num">${c[f]}</b><span>${f==="All"?"All chats":f}</span></button>`).join("")}</div>`)}`}},

 {name:"Multi-select toggles", why:"Pick more than one (Booked + Waiting) with check pills; useful when a rep wants 'everyone coming today'.", render:()=>{const c=counts(H());return `
  <style>.f7 button{height:28px;padding:0 12px 0 8px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .f7 .bx{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--border-medium);display:grid;place-items:center}
  .f7 button[aria-pressed=true]{border-color:var(--primary);color:var(--text-active);background:var(--highlight)}.f7 button[aria-pressed=true] .bx{background:var(--primary);border-color:var(--primary);color:#fff}
  .f7 button[aria-pressed=true] .bx::after{content:"✓";font-size:10px;line-height:1}.f7 .num{color:var(--text-light);font-weight:500}</style>
  ${fScope(`<div class="f7 row wrap" style="gap:6px" data-multi>${F4.slice(1).map(f=>`<button data-f="${f}" aria-pressed="true"><span class="bx"></span>${f}<span class="num">${c[f]}</span></button>`).join("")}<button class="gp" style="height:28px;border:0;color:var(--link)" data-f-reset>Clear</button></div>`)}`}},

 {name:"Sidebar filter list", why:"Split view for the laptop at the booth: filters are a left list with right-aligned counts, results on the right.", render:()=>{const c=counts(H());return `
  <style>.f8{display:grid;grid-template-columns:180px minmax(0,1fr);gap:16px}.f8 nav{display:flex;flex-direction:column;gap:2px}
  .f8 nav button{display:flex;justify-content:space-between;border:0;background:transparent;padding:7px 10px;border-radius:var(--r-lg);font-size:13px;font-weight:600;cursor:pointer;color:var(--text-medium)}
  .f8 nav button[aria-pressed=true]{background:var(--nav-selected);color:var(--text-active)}.f8 .num{color:var(--text-light);font-weight:500}
  @container frame (max-width:600px){.f8{grid-template-columns:minmax(0,1fr)}.f8 nav{flex-direction:row;overflow-x:auto}.f8 nav button{flex-shrink:0;gap:6px}}
  @media (hover:hover) and (pointer:fine){.f8 nav button:not([aria-pressed=true]):hover{background:var(--inset)}}</style>
  <div class="card" data-fscope style="max-width:900px"><div class="f8"><nav><div class="menu-h" style="padding-left:10px">Coffee chats</div>${F4.map((f,i)=>`<button data-f="${f}" aria-pressed="${i===0}">${f}<span class="num">${c[f]}</span></button>`).join("")}</nav><div style="min-width:0"><div style="font-weight:700;font-size:16px">Fri Nov 20</div>${fRows()}</div></div></div>`}},

 {name:"Sentence filter", why:"Reads as plain English: 'Show waiting chats on Friday'. The words you can change are underlined.", render:()=>{const c=counts(H());return `
  <style>.f9{font-size:18px;font-weight:600;line-height:1.6}.f9 select{font:inherit;font-size:18px;color:var(--link);border:0;border-bottom:2px dashed var(--border-outline);background:transparent;padding:0 2px;cursor:pointer;-webkit-appearance:none;appearance:none}</style>
  <div class="card" data-fscope style="max-width:760px"><div class="f9">Show <select data-f-select>${F4.map(f=>`<option value="${f}">${f==="All"?"all":f.toLowerCase()} (${c[f]})</option>`).join("")}</select> chats on <select><option>Friday</option><option>Saturday</option></select></div>${fRows()}</div>`}},

 {name:"Proportion bar", why:"One bar split by status: you see the mix at a glance, and each labelled segment is the filter.", render:()=>{const c=counts(H());const segs=F4.slice(1).filter(f=>c[f]>0);const col={Booked:"var(--s-green)",Waiting:"var(--task)",Full:"var(--inset)"};return `
  <style>.f10{display:flex;gap:3px;height:40px;border-radius:var(--r-lg);overflow:hidden}.f10 button{border:0;min-width:56px;padding:0 10px;text-align:left;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;outline-offset:-2px;transition:filter 150ms ease}
  .f10 button[aria-pressed=true]{box-shadow:inset 0 0 0 2px var(--primary)}.f10 button[aria-pressed=false]{filter:saturate(.6)}</style>
  ${fScope(`<div class="row" style="justify-content:space-between;margin-bottom:6px"><span class="small muted">${plural(c.All,"chat","chats")} today</span><button class="gp" style="height:24px;font-size:12px" data-f="All" aria-pressed="true">Show all</button></div>
  <div class="f10">${segs.map(f=>`<button data-f="${f}" aria-pressed="false" style="flex:${c[f]};background:${col[f]}">${f} <span class="num">${c[f]}</span></button>`).join("")}</div>`)}`}},
]};

/* =========================================================
   COMPONENT 3 · Status chips
   ========================================================= */
const chipCtx = (chip) => {
  const rows=[["Booked","Fri 10:15 · Rm 2241"],["Waiting","Asked 12 min ago"],["Full","Fri 10:30 · 3/3"],["Needs 2","Sun Life group · 1/3"],["Sent","Offer sent 9:42"],["Failed","Slack message didn't go through"]];
  return `<div class="grid2"><div class="card"><div class="sec-h">All six</div><div class="row wrap" style="gap:8px">${STATUSES.map(chip).join("")}</div></div>
  <div class="card"><div class="sec-h">In a list</div><div class="list">${rows.map(([s,t],i)=>{const h=H()[i];return `<div class="li" style="align-items:center">${av(h,28)}<div class="grow"><div class="trunc" style="font-weight:600">${esc(h.name)}</div><div class="small muted trunc">${t}</div></div>${chip(s)}</div>`}).join("")}</div></div></div>`;
};
C.chips = {label:"Status chips", variants:[
 {name:"Tinted pill with dot", why:"Soft fill plus a coloured dot: colour carries the status, text says it, nothing shouts.", render:()=>`<style>.c1{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px 0 7px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;flex-shrink:0}.c1::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}</style>${chipCtx(s=>`<span class="c1" style="background:${STC[s].bg};color:${STC[s].fg}">${s}</span>`)}`},
 {name:"Outline pill", why:"Thin coloured border, white inside: lighter on busy lists and prints well.", render:()=>`<style>.c2{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid currentColor;white-space:nowrap;flex-shrink:0;background:var(--surface)}</style>${chipCtx(s=>`<span class="c2" style="color:${STC[s].fg}">${s}</span>`)}`},
 {name:"Dot and word", why:"No container at all. The quietest option; status reads like metadata, not a badge.", render:()=>`<style>.c3{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--text-medium);white-space:nowrap;flex-shrink:0}.c3 i{width:8px;height:8px;border-radius:50%}</style>${chipCtx(s=>`<span class="c3"><i style="background:${STC[s].fg}"></i>${s}</span>`)}`},
 {name:"Icon and word", why:"Each status has an icon (check, clock, lock, people, plane, alert), so it still reads without colour.", render:()=>`<style>.c4{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:var(--r-md);font-size:12px;font-weight:600;white-space:nowrap;flex-shrink:0}</style>${chipCtx(s=>`<span class="c4" style="background:${STC[s].bg};color:${STC[s].fg}">${STC[s].ic}${s}</span>`)}`},
 {name:"Only problems are loud", why:"Booked, Sent and Full stay grey text; only Waiting, Needs 2 and Failed get a filled chip, because those need action.", render:()=>`<style>.c5{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;flex-shrink:0}</style>${chipCtx(s=>["Waiting","Needs 2","Failed"].includes(s)?`<span class="c5" style="background:${STC[s].fg};color:#fff">${s}</span>`:`<span class="c5" style="color:var(--text-light);font-weight:600;padding:0">${s}</span>`)}`},
 {name:"Row edge stripe", why:"Status becomes the row's left edge plus a word; scanning a long list by colour is fastest this way.", render:()=>`<style>.c6row .li{border-left:3px solid var(--c);padding-left:10px;border-top:0;margin-bottom:4px;background:var(--highlight-subtle);border-radius:0 var(--r-lg) var(--r-lg) 0}.c6{font-size:12px;font-weight:600;color:var(--c);white-space:nowrap;flex-shrink:0}</style>
  <div class="card c6row" style="max-width:560px"><div class="sec-h">In a list</div><div class="list">${STATUSES.map((s,i)=>{const h=H()[i];return `<div class="li" style="--c:${STC[s].fg}">${av(h,28)}<div class="grow"><div class="trunc" style="font-weight:600">${esc(h.name)}</div><div class="small muted">Fri ${TIMES[i+4]}</div></div><span class="c6">${s}</span></div>`}).join("")}</div></div>`},
 {name:"Small caps tag", why:"Uppercase 10.5px tags with square corners: compact, sit on the baseline next to names in dense tables.", render:()=>`<style>.c7{display:inline-block;padding:2px 5px;border-radius:var(--r-xs);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;flex-shrink:0}</style>${chipCtx(s=>`<span class="c7" style="background:${STC[s].bg};color:${STC[s].fg}">${s}</span>`)}`},
 {name:"Chip shows progress", why:"Full and Needs 2 carry their own tiny fill meter, so you don't need a separate '1/3'.", render:()=>`<style>.c8{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px 0 6px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;flex-shrink:0}.c8 .m{display:inline-flex;gap:2px}.c8 .m i{width:5px;height:10px;border-radius:2px;background:currentColor;opacity:.25}.c8 .m i.on{opacity:1}</style>${chipCtx(s=>{const m=s==="Full"?3:s==="Needs 2"?1:-1;return `<span class="c8" style="background:${STC[s].bg};color:${STC[s].fg}">${m>=0?`<span class="m">${[0,1,2].map(k=>`<i class="${k<m?"on":""}"></i>`).join("")}</span>`:STC[s].ic}${s}</span>`})}`},
 {name:"Status as a sentence", why:"Drops the chip for a short line that says what it means: 'Booked for 10:15 in Rm 2241'.", render:()=>{const say={"Booked":"Booked for 10:15 in Rm 2241","Waiting":"Waiting for you to reply","Full":"Full, 3 of 3 booked","Needs 2":"Needs 2 more for a group","Sent":"Offer sent, no reply yet","Failed":"Didn't send. Try again"};return `<style>.c9{font-size:13px;font-weight:600}</style><div class="card" style="max-width:560px"><div class="list">${STATUSES.map((s,i)=>{const h=H()[i];return `<div class="li" style="align-items:flex-start">${av(h,28)}<div class="grow"><div style="font-weight:600;overflow-wrap:anywhere">${esc(h.name)}</div><div class="c9" style="color:${STC[s].fg}">${say[s]}${s==="Failed"?` <button class="gp" style="height:22px;font-size:12px;margin-left:4px">Retry</button>`:""}</div></div></div>`}).join("")}</div></div>`}},
 {name:"Tap a chip to act", why:"The chip is also the control: tap it to see why and change it (Booked → Cancel, Failed → Resend).", render:()=>{const acts={"Booked":["Move time","Cancel chat"],"Waiting":["Offer a time","Decline"],"Full":["Open one more spot"],"Needs 2":["Run with 1","Cancel group"],"Sent":["Resend","Withdraw offer"],"Failed":["Resend now","Copy message"]};return `<style>.c10w{position:relative;display:inline-block;flex-shrink:0}.c10{display:inline-flex;align-items:center;gap:3px;height:24px;padding:0 6px 0 9px;border-radius:999px;border:0;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}.c10 .ic{width:12px;height:12px}.c10w .menu{right:0;top:calc(100% + 4px);min-width:180px}</style>${chipCtx(s=>{const id="c10"+Math.random().toString(36).slice(2,7);return `<span class="c10w"><button class="c10" data-menu="${id}" style="background:${STC[s].bg};color:${STC[s].fg}">${s}${I.chev}</button><div class="menu" id="${id}" hidden><div class="menu-h">${s}</div>${acts[s].map(a=>`<button data-toast="${a}">${a}</button>`).join("")}</div></span>`})}`}},
]};

/* =========================================================
   COMPONENT 4 · Sponsor logo treatments
   ========================================================= */
const ROOMS = ["2241","2242","2243"];
C.logos = {label:"Sponsor logos", variants:[
 {name:"Fixed-height row", why:"Every logo is 22px tall and keeps its own width; no frames, so wide and square marks sit on one baseline.", render:()=>`<div class="card"><div class="sec-h">Sponsors this weekend</div><div class="row wrap" style="gap:28px 36px;align-items:center">${SP().map(s=>`<span style="max-width:200px;min-width:0;display:inline-flex">${logo(s,22)}</span>`).join("")}</div></div>`},
 {name:"Room grid, logo only", why:"In the coffee chat room grid each cell shows just the logo, as Jazz asked; the name is in the alt text and tooltip.", render:()=>{const sp=SP();return `<style>.l2{display:grid;grid-template-columns:64px repeat(3,minmax(0,1fr));gap:4px}.l2>div{height:48px;border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;padding:6px 10px;min-width:0}.l2 .h{font-size:12px;font-weight:600;color:var(--text-light);height:auto}.l2 .cell{background:var(--surface);border:1px solid var(--border-subtle)}.l2 .free{background:var(--inset);font-size:12px;color:var(--text-light)}.l2 .t{font-size:12px;color:var(--text-light);justify-content:flex-start}</style>
  <div class="card"><div class="sec-h">Fri Nov 20 · coffee chat rooms</div><div class="l2"><div></div>${ROOMS.map(r=>`<div class="h">Rm ${r}</div>`).join("")}${["9:00","10:00","11:00","12:00"].map((t,i)=>`<div class="t num">${t}</div>${ROOMS.map((r,j)=>{const s=[sp[5],sp[7],sp[1],null][(i+j)%4];return s?`<div class="cell" title="${esc(s.n)}">${logo(s,20)}</div>`:`<div class="free">Free</div>`}).join("")}`).join("")}</div></div>`}},
 {name:"Logo + name list", why:"Lists pair a small logo with the name, and a sponsor without a logo (QNX) shows its name as a bold wordmark.", render:()=>`<div class="card" style="max-width:560px"><div class="list">${SP().map((s,i)=>`<div class="li"><span style="width:88px;display:flex;flex-shrink:0;min-width:0">${logo(s,18)}</span><div class="grow"><div class="trunc" style="font-weight:600" title="${esc(s.n)}">${esc(s.n)}</div><div class="small muted">Booth ${i+1} · Sponsor Bay</div></div><span class="small muted num" style="flex-shrink:0">${(i*7)%12} chats</span></div>`).join("")}</div></div>`},
 {name:"Grey until chosen", why:"Logos sit in greyscale so a wall of brands stays calm; the picked or hovered one gets its colour back.", render:()=>`<style>.l4 button{border:0;background:transparent;padding:10px 12px;border-radius:var(--r-lg);cursor:pointer;filter:grayscale(1);opacity:.65;transition:filter 200ms ease,opacity 200ms ease;display:flex;align-items:center;justify-content:center;height:56px;min-width:0}.l4 button[aria-pressed=true]{filter:none;opacity:1;background:var(--highlight)}@media (hover:hover) and (pointer:fine){.l4 button:hover{filter:none;opacity:1}}</style><div class="card"><div class="sec-h">Filter the schedule by sponsor</div><div class="l4 grid3" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:4px" data-single>${SP().map((s,i)=>`<button aria-pressed="${i===8}" title="${esc(s.n)}">${logo(s,22)}</button>`).join("")}</div></div>`},
 {name:"Hero logo on home", why:"The sponsor's own page leads with their logo, large and centred on white, like their own welcome sign.", render:()=>{const s=SP()[MODE==="worst"?0:8];return `<div class="card" style="text-align:center;padding:36px 16px"><div style="display:flex;justify-content:center;margin-bottom:16px;min-width:0">${logo(s,48)}</div><div style="font-size:24px;font-weight:700;overflow-wrap:anywhere">Welcome, ${esc(s.n)}!</div><div class="muted">Booth 4 · Sponsor Bay (SM Atrium, Floor 1)</div></div>`}},
 {name:"Tiered logo wall", why:"Bigger logos for bigger tiers in a tidy grid of equal cells; logos are centred and contained, never cropped.", render:()=>{const sp=SP();return `<style>.l6{display:grid;gap:8px}.l6 div{display:flex;align-items:center;justify-content:center;background:var(--surface);border-radius:var(--r-2xl);padding:16px;min-width:0}</style><div class="sec-h">Gold</div><div class="l6" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr))">${sp.slice(0,2).map(s=>`<div style="height:96px">${logo(s,40)}</div>`).join("")}</div><div class="sec-h" style="margin-top:16px">Silver</div><div class="l6" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">${sp.slice(2,6).map(s=>`<div style="height:72px">${logo(s,28)}</div>`).join("")}</div><div class="sec-h" style="margin-top:16px">Bronze</div><div class="l6" style="grid-template-columns:repeat(auto-fill,minmax(110px,1fr))">${sp.slice(6).map(s=>`<div style="height:56px">${logo(s,20)}</div>`).join("")}</div>`}},
 {name:"Inline logo mention", why:"A 14px logo inside a sentence or chip, for notifications like 'StarTech offered you a chat'.", render:()=>{const sp=SP();return `<style>.l7{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:var(--surface);border:1px solid var(--border-subtle);vertical-align:middle;max-width:100%;min-width:0}.l7 .logo{height:14px!important}</style><div class="card" style="max-width:560px"><div class="list">${[[5,"offered you a coffee chat at 10:15."],[7,"moved your group chat to Rm 2242."],[8,"shortlisted your team for judging."],[3,"wants to see your demo at 11:00."]].map(([i,t])=>`<div class="li" style="display:block;line-height:2">${`<span class="l7">${logo(sp[i],14)}</span>`} ${t}</div>`).join("")}</div></div>`}},
 {name:"Logo on a band", why:"Logos sit in a full-width inset band at the top of each sponsor card, so mixed logo shapes line up across cards.", render:()=>`<style>.l8{padding:0;overflow:hidden}.l8 .band{height:72px;background:var(--inset);display:flex;align-items:center;justify-content:center;padding:12px 16px;min-width:0}.l8 .b{padding:12px 16px}</style><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px">${SP().slice(0,6).map((s,i)=>`<div class="card l8"><div class="band">${logo(s,30)}</div><div class="b"><div class="trunc" style="font-weight:600" title="${esc(s.n)}">${esc(s.n)}</div><div class="small muted">${i%2?"Chats 10:00 to 12:00":"Workshop 2:00 PM"} · Rm ${2241+i%3}</div></div></div>`).join("")}</div>`},
 {name:"Logo in schedule blocks", why:"Schedule blocks lead with the sponsor logo and the time; the logo is the fastest way to find 'ours' in a busy day.", render:()=>{const sp=SP();const ev=[[0,"9:00","9:45","Breakfast talk","Grand Hall Rm 1110"],[5,"10:00","12:00","Coffee chats","Rm 2241"],[7,"10:00","1:00","Coffee chats","Rm 2242"],[3,"1:00","2:00","Workshop: real-time OS","Rm 2235"],[8,"2:00","3:00","Tech talk","Grand Hall Rm 1110"]];return `<style>.l9{display:grid;grid-template-columns:56px minmax(0,1fr);gap:6px 10px}.l9 .t{font-size:12px;color:var(--text-light);padding-top:10px}.l9 .b{background:var(--s-blue);border-radius:var(--r-lg);padding:10px 12px;min-width:0}.l9 .b .row{margin-bottom:4px}</style><div class="card" style="max-width:640px"><div class="sec-h">Fri Nov 20</div><div class="l9">${ev.map(([i,a,b,t,r])=>`<div class="t num">${a}</div><div class="b"><div class="row">${logo(sp[i],16)}</div><div style="font-weight:600" class="trunc">${t}</div><div class="small muted num">${a} to ${b} · ${r}</div></div>`).join("")}</div></div>`}},
 {name:"Shared-event logo strip", why:"When several sponsors share one event (Career fair), logos line up in a strip with a '+4' that opens the rest.", render:()=>{const sp=SP();return `<style>.l10{display:flex;align-items:center;gap:16px;min-width:0;overflow:hidden}.l10>span{flex-shrink:0;max-width:110px;display:inline-flex}.l10 .more{flex-shrink:0;height:24px;padding:0 9px;border-radius:999px;background:var(--inset);font-size:12px;font-weight:600;border:0;cursor:pointer}</style><div class="card" style="max-width:560px"><div style="font-weight:700">Career fair</div><div class="small muted" style="margin-bottom:12px">Sat Nov 21 · 1:00 to 3:00 PM · Sponsor Bay</div><div class="l10">${sp.slice(0,5).map(s=>`<span title="${esc(s.n)}">${logo(s,18)}</span>`).join("")}<button class="more" data-toast="Shows all ${sp.length} sponsors">+${sp.length-5}</button></div></div>`}},
]};
</script>
<script>
/* =========================================================
   COMPONENT 5 · Hacker avatar + name rows
   ========================================================= */
const hk = (n=8) => H().slice(0,n);
const skillChips = h => h.skills.map(s=>`<span style="font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--inset);white-space:nowrap">${esc(s)}</span>`).join("");
C.avatars = {label:"Hacker rows", variants:[
 {name:"Compact list row", why:"One line of name, one of school and program; the default for any list of people.", render:()=>`<div class="card" style="max-width:560px"><div class="list">${hk().map(h=>`<div class="li">${av(h,32)}<div class="grow"><div class="trunc" style="font-weight:600" title="${esc(h.name)}">${esc(h.name)}</div><div class="trunc small muted">${esc(meta(h)||"No school listed")}</div></div><button class="gp" style="height:26px;font-size:12px">Offer chat</button></div>`).join("")}</div></div>`},
 {name:"Profile cards with skills", why:"A grid of cards with skills as chips, for browsing who's interested rather than working a queue.", render:()=>`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px">${hk().map(h=>`<div class="card"><div class="row" style="align-items:flex-start">${av(h,40,"sq")}<div class="grow"><div style="font-weight:700;overflow-wrap:anywhere" class="clamp2">${esc(h.name)}</div><div class="small muted clamp2">${esc(meta(h)||"No school listed")}</div></div></div>${h.skills.length?`<div class="row wrap" style="gap:4px;margin-top:10px">${skillChips(h)}</div>`:""}</div>`).join("")}</div>`},
 {name:"Table", why:"Columns for school, program and skills so organizers can sort and compare many hackers at once.", render:()=>`<div class="card" style="overflow:auto"><table class="tbl" style="min-width:560px"><colgroup><col style="width:34%"><col style="width:18%"><col style="width:26%"><col></colgroup><thead><tr><th>Name</th><th>School</th><th>Program</th><th>Skills</th></tr></thead><tbody>${hk(10).map(h=>`<tr><td><div class="row">${av(h,24)}<span class="clamp2" style="font-weight:600">${esc(h.name)}</span></div></td><td class="muted">${esc(h.school)||"<span class='muted'>Not given</span>"}</td><td class="muted small">${esc(h.program)||""}</td><td class="small">${esc(h.skills.join(", "))}</td></tr>`).join("")}</tbody></table></div><p class="note-strip">On phone the table scrolls inside its card; the page itself never scrolls sideways.</p>`},
 {name:"Row with their note", why:"Shows what the hacker wrote (two lines, then 'more'), because the note is what helps a rep decide.", render:()=>`<div class="card" style="max-width:600px"><div class="list">${hk(6).map(h=>`<div class="li" style="align-items:flex-start">${av(h,36)}<div class="grow"><div class="row"><span class="trunc" style="font-weight:600">${esc(h.name)}</span><span class="small muted trunc" style="flex-shrink:1">${esc(h.school)}</span></div>${h.note?`<div class="clamp2 small" style="color:var(--text-medium);margin-top:2px" title="${esc(h.note)}">“${esc(h.note)}”</div>`:`<div class="small muted">No note</div>`}</div></div>`).join("")}</div></div>`},
 {name:"Face stack summary", why:"When the list isn't the point (a slot, a team), overlapping faces and 'Maya, Leo +4' say who in one line.", render:()=>{const sets=[H().slice(0,2),H().slice(2,5),H().slice(5,12)];return `<style>.a5{display:flex}.a5 .av{box-shadow:0 0 0 2px var(--surface)}.a5 .av+.av{margin-left:-8px}</style><div class="card" style="max-width:560px"><div class="list">${sets.map((s,i)=>`<div class="li"><span class="small muted num" style="width:48px;flex-shrink:0">${["10:00","10:15","10:30"][i]}</span><div class="a5">${s.slice(0,3).map(h=>av(h,28)).join("")}</div><div class="grow trunc small" style="font-weight:600">${esc(s.slice(0,2).map(h=>h.name.split(" ")[0]).join(", "))}${s.length>2?` <span class="muted">+${s.length-2}</span>`:""}</div></div>`).join("")}</div></div>`}},
 {name:"Swipe for actions", why:"On phone, swipe a row left to Offer or Skip; rows stay clean and the actions are a thumb away.", render:()=>`<style>.a6{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-top:1px solid var(--border-subtle);overscroll-behavior-x:contain}.a6::-webkit-scrollbar{display:none}.a6 .main{flex:0 0 100%;scroll-snap-align:start;display:flex;gap:10px;align-items:center;padding:10px 0;min-width:0;background:var(--surface)}.a6 .acts{flex:0 0 auto;display:flex;scroll-snap-align:end}.a6 .acts button{width:76px;border:0;font-weight:600;font-size:12px;cursor:pointer}</style><div class="card" style="max-width:420px"><div class="small muted" style="margin-bottom:6px">Swipe a row left (or scroll it with a trackpad)</div>${hk(6).map(h=>`<div class="a6"><div class="main">${av(h,32)}<div class="grow"><div class="trunc" style="font-weight:600">${esc(h.name)}</div><div class="trunc small muted">${esc(meta(h)||"No school listed")}</div></div><span class="muted">${I.right}</span></div><div class="acts"><button style="background:var(--inset)" data-toast="Skipped ${esc(h.name)}">Skip</button><button style="background:var(--primary);color:#fff" data-toast="Offer sent to ${esc(h.name)}">Offer</button></div></div>`).join("")}</div>`},
 {name:"Names only, dense", why:"No avatars: name, school and time in one tight line. Fits 20 people on a laptop screen at the judging table.", render:()=>`<div class="card" style="max-width:640px;padding:8px 16px">${H().slice(0,20).map((h,i)=>`<div class="row" style="padding:5px 0;border-top:${i?"1px solid var(--border-faint)":"0"}"><span class="trunc grow" style="font-weight:600" title="${esc(h.name)}">${esc(h.name)}</span><span class="trunc small muted" style="max-width:40%">${esc(h.school)||"—"}</span><span class="small muted num" style="width:44px;text-align:right;flex-shrink:0">${TIMES[i%16]}</span></div>`).join("")}</div>`},
 {name:"Face tiles", why:"A grid of big initials and first names: a quick 'who's here' wall for the booth screen.", render:()=>`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px">${hk(16).map(h=>`<div class="card" style="padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px">${av(h,48,"sq")}<div class="small clamp2" style="font-weight:600;overflow-wrap:anywhere">${esc(h.name)}</div></div>`).join("")}</div>`},
 {name:"Pick several, act once", why:"Check boxes on each row and a bar appears with 'Offer chats to 3', for clearing a queue quickly.", render:()=>`<style>.a9bar{position:sticky;bottom:0;display:flex;align-items:center;gap:8px;background:var(--text-heavy);color:#fff;border-radius:var(--r-2xl);padding:8px 8px 8px 14px;margin-top:10px;animation:rise 200ms var(--ease-out)}.a9 input{width:18px;height:18px;accent-color:var(--primary);flex-shrink:0;margin:0}</style><div class="card a9" style="max-width:560px" data-bulk><div class="list">${hk(8).map(h=>`<label class="li" style="cursor:pointer"><input type="checkbox">${av(h,28)}<div class="grow"><div class="trunc" style="font-weight:600">${esc(h.name)}</div><div class="trunc small muted">${esc(meta(h)||"No school listed")}</div></div></label>`).join("")}</div><div class="a9bar" hidden><span class="grow" data-bulk-n></span><button class="gp pri" style="height:28px" data-toast="Offers sent">Offer chats</button><button class="gp" style="height:28px;background:transparent;color:#fff;border-color:rgba(255,255,255,.3)" data-bulk-clear>Clear</button></div></div>`},
 {name:"Tap to expand", why:"Rows stay one line; tapping opens note, skills, email and actions in place, so you never leave the list.", render:()=>`<style>.a10 details{border-top:1px solid var(--border-subtle)}.a10 details:first-child{border-top:0}.a10 summary{list-style:none;display:flex;gap:10px;align-items:center;padding:10px 0;cursor:pointer;min-width:0}.a10 summary::-webkit-details-marker{display:none}.a10 summary .ic{transition:transform 200ms var(--ease-out)}.a10 details[open] summary .ic{transform:rotate(90deg)}.a10 .body{padding:0 0 12px 42px;animation:fade 200ms var(--ease-out)}</style><div class="card a10" style="max-width:560px">${hk(6).map((h,i)=>`<details ${i===0?"open":""}><summary>${av(h,32)}<div class="grow"><div class="trunc" style="font-weight:600">${esc(h.name)}</div><div class="trunc small muted">${esc(h.school||"No school listed")}</div></div>${I.right}</summary><div class="body">${h.note?`<p style="margin:0 0 8px">“${esc(h.note)}”</p>`:""}<div class="small muted" style="overflow-wrap:anywhere;margin-bottom:8px">${esc(h.program)} ${h.program?"·":""} ${esc(h.email)}</div><div class="row wrap" style="gap:4px;margin-bottom:10px">${skillChips(h)}</div><div class="row" style="gap:6px"><button class="gp pri" style="height:26px;font-size:12px">Offer chat</button><button class="gp" style="height:26px;font-size:12px">Save</button></div></div></details>`).join("")}</div>`},
]};

/* =========================================================
   COMPONENT 6 · Slot fill indicator
   ========================================================= */
const SL = () => { const b=[{t:"10:00",n:0},{t:"10:15",n:1},{t:"10:30",n:2},{t:"10:45",n:3}]; return MODE==="worst"?[...b,{t:"11:00",n:4,note:"An organizer added a 4th by hand"},{t:"11:15",n:3,grp:true}]:[...b,{t:"11:00",n:1,grp:true}]; };
const slotWrap = (fn, title="StarTech · 1-on-1, 15 min · Rm 2241") => `<div class="card" style="max-width:520px"><div class="sec-h">${title}</div><div class="list">${SL().map(s=>`<div class="li"><span class="num" style="width:48px;font-weight:600;flex-shrink:0">${s.t}</span><div class="grow small muted trunc">${s.grp?"Group of 3 with 1 rep":"3 reps, 1-on-1"}${s.note?` · <span style="color:var(--warning)">${s.note}</span>`:""}</div>${fn(s)}</div>`).join("")}</div></div>`;
const over = s => s.n>3;
C.slots = {label:"Slot fill 2/3", variants:[
 {name:"Plain fraction", why:"Just '2/3' in tabular figures; Full turns grey. The smallest thing that answers 'is there room?'", render:()=>slotWrap(s=>`<span class="num" style="font-weight:700;flex-shrink:0;color:${over(s)?"var(--warning)":s.n>=3?"var(--text-light)":"var(--text-heavy)"}">${s.n}/3</span>`)},
 {name:"Three dots", why:"Filled dots for booked seats; you count them without reading. Works at 6px.", render:()=>slotWrap(s=>`<span class="row" style="gap:4px;flex-shrink:0" aria-label="${s.n} of 3 booked">${[0,1,2].map(k=>`<i style="width:9px;height:9px;border-radius:50%;background:${k<s.n?"var(--primary)":"var(--border)"}"></i>`).join("")}${over(s)?`<b class="small" style="color:var(--warning)">+${s.n-3}</b>`:""}</span>`)},
 {name:"Segmented bar", why:"A three-part bar the width of a word; reads like a battery level and fills left to right.", render:()=>slotWrap(s=>`<span class="row" style="gap:6px;flex-shrink:0"><span style="display:flex;gap:2px">${[0,1,2].map(k=>`<i style="width:16px;height:6px;border-radius:2px;background:${k<s.n?(s.n>=3?"var(--text-light)":"var(--primary)"):"var(--inset)"}"></i>`).join("")}</span><span class="num small" style="font-weight:600;width:26px">${s.n}/3</span></span>`)},
 {name:"Seats with faces", why:"Booked hackers' initials fill seats, empty seats are dashed: you see who, not just how many.", render:()=>slotWrap(s=>`<span class="row" style="gap:3px;flex-shrink:0">${[0,1,2].map(k=>k<s.n?av(H()[k+s.t.length],24):`<i style="width:24px;height:24px;border-radius:50%;border:1.5px dashed var(--border-medium)"></i>`).join("")}${over(s)?av(H()[9],24):""}</span>`)},
 {name:"Ring", why:"A small ring with the number inside, like a timer; good in calendar cells where width is tight.", render:()=>slotWrap(s=>{const p=Math.min(s.n,3)/3;return `<svg width="28" height="28" viewBox="0 0 28 28" style="flex-shrink:0" aria-label="${s.n} of 3"><circle cx="14" cy="14" r="11" fill="none" stroke="var(--inset)" stroke-width="3"/><circle cx="14" cy="14" r="11" fill="none" stroke="${over(s)?"var(--warning)":"var(--primary)"}" stroke-width="3" stroke-dasharray="${69.1*p} 69.1" transform="rotate(-90 14 14)" stroke-linecap="round"/><text x="14" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="var(--text-heavy)" font-family="Figtree">${s.n}</text></svg>`})},
 {name:"Spots left, in words", why:"Says what a rep actually needs: '1 spot left', 'Full', 'Open'. No maths.", render:()=>slotWrap(s=>{const l=3-s.n;const t=l<0?`${-l} over`:l===0?"Full":l===3?"Open":`${l} ${l===1?"spot":"spots"} left`;return `<span class="small" style="font-weight:600;flex-shrink:0;color:${l<0?"var(--warning)":l===0?"var(--text-light)":"var(--live)"}">${t}</span>`})},
 {name:"Chair icons", why:"Three chair icons, filled when taken. A friendlier, more physical read for the coffee chat room.", render:()=>slotWrap(s=>`<span class="row" style="gap:2px;flex-shrink:0">${[0,1,2,...(over(s)?[3]:[])].map(k=>`<span style="color:${k>=3?"var(--warning)":k<s.n?"var(--primary)":"var(--border)"}">${I.seat.replace('class="ic"','class="ic" style="width:18px;height:18px"')}</span>`).join("")}</span>`)},
 {name:"Cell fills up", why:"In a grid, the slot cell itself fills from the bottom; the whole day's busyness shows as a skyline.", render:()=>`<div class="card"><div class="sec-h">Fri Nov 20 · StarTech · Rm 2241</div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px">${[...SL(),...SL().slice(0,4).map((s,i)=>({...s,t:["11:30","11:45","12:00","12:15"][i],n:(i+2)%4}))].map(s=>`<div style="position:relative;height:64px;border-radius:var(--r-lg);background:var(--inset);overflow:hidden;padding:6px 8px"><i style="position:absolute;left:0;right:0;bottom:0;height:${Math.min(s.n,3)/3*100}%;background:${over(s)?"var(--badge)":s.n>=3?"var(--nav-selected)":"var(--s-blue)"}"></i><div style="position:relative;font-weight:600" class="num small">${s.t}</div><div style="position:relative;font-weight:700" class="num">${s.n}/3</div></div>`).join("")}</div></div>`},
 {name:"Colour pill", why:"The count lives in a pill whose colour is the state: blue open, grey full, orange over.", render:()=>slotWrap(s=>`<span class="num" style="flex-shrink:0;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:${over(s)?"var(--badge)":s.n>=3?"var(--inset)":"var(--highlight)"};color:${over(s)?"var(--warning)":s.n>=3?"var(--text-light)":"var(--link)"}">${s.n>=3&&!over(s)?"Full":`${s.n}/3`}</span>`)},
 {name:"Seats you can fill", why:"Each empty seat is a small '+' you can tap to add a hacker right there; booked seats show their name.", render:()=>`<style>.s10{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;min-width:0}.s10 span,.s10 button{height:24px;border-radius:999px;font-size:12px;font-weight:600;padding:0 8px;display:inline-flex;align-items:center;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.s10 span{background:var(--highlight);color:var(--text-active)}.s10 button{border:1px dashed var(--border-medium);background:transparent;cursor:pointer;color:var(--text-light)}</style>${slotWrap(s=>`<span class="s10">${[...Array(Math.max(3,s.n))].map((_,k)=>k<s.n?`<span title="${esc(H()[k+2].name)}">${esc(H()[k+2].name.split(" ")[0])}</span>`:`<button data-toast="Pick a hacker for ${s.t}">+ Add</button>`).join("")}</span>`)}`},
]};
</script>
<style>
.ov{position:absolute;inset:0;z-index:30;background:rgba(11,43,74,0.32);animation:fade 200ms var(--ease-out)}
.ov[hidden]{display:none!important}
.dlg{background:var(--surface);border-radius:var(--r-3xl);box-shadow:var(--shadow-secondary);padding:20px;min-width:0}
.dlg h3{margin:0 0 4px;font-size:18px;overflow-wrap:anywhere}
.pick{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 16px}
.pick button{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:600;cursor:pointer}
.pick button[aria-pressed=true]{background:var(--primary);border-color:var(--primary);color:#fff}
.pick button:disabled{opacity:.45;cursor:not-allowed;text-decoration:line-through}
.dlg-x{border:0;background:var(--inset);width:28px;height:28px;border-radius:999px;display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.ctx{padding:16px}
.closing{opacity:0!important;transition:opacity 180ms ease}
</style>
<script>
