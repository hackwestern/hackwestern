<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a">
<title>Sponsor tour · wireframes v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* dashboardColors from src/lib/tokens.ts */
  --text-heavy:#0b2b4a; --text-medium:#1c3550; --text-light:#516476; --link:#0b6bc4; --active:#08559c;
  --bg-page:#f3f7fc; --surface:#ffffff; --nav:#dbe7f5; --nav-selected:#b9d3f0; --inset:#edf3fa; --highlight:#e1effb;
  --primary:#0b6bc4; --border:#cdddeb; --border-subtle:#e0eaf3; --live:#16803c; --warning:#a34a00;
  --r-xs:4px; --r-sm:6px; --r-md:8px; --r-lg:12px; --r-xl:20px; --r-full:999px;
  --shadow-card:0px 1px 2px 0px rgba(11,43,74,0.06),0px 1px 4px 0px rgba(11,43,74,0.05);
  --shadow-pop:0 12px 32px rgba(11,43,74,.22),0 0 0 1px var(--border-subtle);
  --dim:rgba(11,43,74,.52);
  --ease:cubic-bezier(0.23,1,0.32,1);
  --ease-io:cubic-bezier(0.77,0,0.175,1);
  --ease-drawer:cubic-bezier(0.32,0.72,0,1);
}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg-page);color:var(--text-heavy);font-family:Figtree,system-ui,sans-serif;font-size:14px;line-height:1.4;overflow-x:hidden}
button,a,[role="button"]{touch-action:manipulation}
button{user-select:none;-webkit-user-select:none;font-family:inherit}
h1{font-size:24px;line-height:1.2;margin:2px 0 0;font-weight:700}

/* ---------- wireframe chrome ---------- */
.wf-head{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid var(--border-subtle);padding:10px 16px}
.wf-row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wf-title{font-weight:700;font-size:16px}
.wf-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:var(--r-full);background:var(--inset);color:var(--text-light);white-space:nowrap}
.wf-back{font-size:12px;font-weight:600;color:var(--link);text-decoration:none}
.seg{margin-left:auto;display:inline-flex;background:var(--nav);border-radius:var(--r-full);padding:2px}
.seg button{border:0;background:transparent;font-size:12px;font-weight:600;padding:5px 10px;border-radius:var(--r-full);color:var(--text-light);cursor:pointer;transition:transform 160ms var(--ease)}
.seg button:active{transform:scale(.97)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--text-heavy);box-shadow:var(--shadow-card)}
.wf-row2{margin-top:8px}
#wf-note{margin-top:8px;font-size:13px;color:var(--text-light)}
#wf-note b{color:var(--text-heavy)}
main{padding:16px}
#frame{position:relative;margin:0 auto;max-width:1280px;height:calc(100dvh - var(--head-h,150px) - 32px);min-height:540px;background:var(--bg-page);border:1px solid var(--border-subtle);border-radius:var(--r-lg);overflow:hidden;container:app / inline-size}
body.phone #frame{max-width:375px;height:min(780px,calc(100dvh - var(--head-h,150px) - 32px));border:6px solid var(--text-medium);border-radius:28px}
#app{position:absolute;top:0;left:0;right:0;bottom:var(--ib,0px);overflow:auto;overscroll-behavior:contain}
#layer{position:absolute;inset:0;pointer-events:none;z-index:40}
#layer > *{pointer-events:auto}
#layer .center,#layer .toast-wrap,#layer .c3wrap,#layer .sheetwrap,#layer .chipwrap,#layer .tbwrap,#layer .pwrap{pointer-events:none}
#layer .center > *,#layer .toast-wrap > *,#layer .c3wrap > *,#layer .sheetwrap > *,#layer .chipwrap > *,#layer .tbwrap > *,#layer .pwrap > *{pointer-events:auto}

/* ---------- picker (verbatim from prototype/PICKER.md) ---------- */
.proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,0.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,0.08) inset,0 8px 24px rgba(0,0,0,0.24),0 2px 6px rgba(0,0,0,0.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,0.12)}
.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(0.23,1,0.32,1),width 250ms cubic-bezier(0.23,1,0.32,1)}
@media (prefers-reduced-motion: reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}}
.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,0.55);font:inherit;cursor:pointer;transition:color 150ms ease-out,transform 160ms cubic-bezier(0.23,1,0.32,1)}
@media (hover: hover) and (pointer: fine){.proto-picker-item:hover{color:rgba(255,255,255,0.85)}}
.proto-picker-item:active{transform:scale(0.97)}
.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,0.4);outline-offset:2px}
.proto-picker-item[data-active]{color:#fff}
.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,0.12)}
.proto-picker-replay{padding:0 10px;font-size:14px}
.proto-picker[data-position="top"]{bottom:auto;top:24px}
.proto-picker[data-position="inline"]{position:relative;left:auto;bottom:auto;top:auto;transform:none;max-width:100%;overflow-x:auto;scrollbar-width:none;width:max-content;white-space:nowrap}
.proto-picker[data-position="inline"]::-webkit-scrollbar{display:none}
.proto-picker-item{flex-shrink:0}

/* ---------- shared UI ---------- */
.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 12px;border-radius:var(--r-full);border:1px solid var(--border);background:#fff;color:var(--text-heavy);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:transform 160ms var(--ease),background-color 150ms ease,opacity 150ms ease}
.pill:active{transform:scale(.97)}
.pill.sm{height:28px;padding:0 11px;font-size:12px}
.pill.primary,.pill.map{background:var(--primary);border-color:var(--primary);color:#fff}
.pill:disabled{opacity:.45;cursor:default;transform:none}
.pill.dk{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
.pill.dk.primary{background:#fff;color:var(--text-heavy)}
.pill:focus-visible,.link:focus-visible,.mi:focus-visible,.fl:focus-visible,.dot:focus-visible,.hs:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.link{border:0;background:none;font-size:12px;font-weight:600;color:var(--text-light);padding:6px 4px;cursor:pointer;border-radius:var(--r-sm);white-space:nowrap}
@media (hover: hover) and (pointer: fine){
  .pill:hover{background:var(--inset)}
  .pill.primary:hover,.pill.map:hover{background:var(--active)}
  .pill.dk:hover{background:rgba(255,255,255,.2)}
  .pill.dk.primary:hover{background:var(--highlight)}
  .pill:disabled:hover{background:#fff}
  .pill.primary:disabled:hover{background:var(--primary)}
  .link:hover{color:var(--text-heavy)}
  .mi:hover,.fl:hover,.ck-i:hover{background:var(--inset)}
  .p-nav button:hover{color:var(--text-heavy)}
  .dp:hover,.chipb:hover{background:var(--inset)}
}
.sp{flex:1}
.lbl{font-size:11px;font-weight:700;color:var(--link);letter-spacing:.02em}
.ttl{font-size:15px;font-weight:700;margin-top:3px;line-height:1.3}
.ttl.lg{font-size:18px}
.bd{font-size:13px;color:var(--text-light);margin-top:4px;line-height:1.45}
.hint{margin-top:10px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--link);background:var(--highlight);padding:7px 10px;border-radius:var(--r-md)}
.pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--primary);position:relative;flex-shrink:0}
.pulse-dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--primary);animation:pulse 1.6s var(--ease) infinite}
.ctrls{display:flex;align-items:center;gap:6px;margin-top:12px;flex-wrap:wrap}
.noanim{animation:none !important}

@keyframes pop{from{opacity:0;transform:scale(.96)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes pulse{from{transform:scale(1);opacity:.55}to{transform:scale(2.6);opacity:0}}
@keyframes ripple{from{opacity:.8;transform:scale(.4)}to{opacity:0;transform:scale(1.7)}}

/* ---------- portal (the app under the tour) ---------- */
.p-root{min-height:100%;display:flex;flex-direction:column}
.p-top{order:0;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 24px;background:#fff;border-bottom:1px solid var(--border-subtle)}
.p-logo{height:18px;width:auto;display:block;flex-shrink:0}
.p-brand{font-size:12px;color:var(--text-light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.p-actions{margin-left:auto;display:flex;gap:6px;flex-shrink:0}
.p-nav{order:1;display:flex;gap:4px;padding:8px 24px;background:#fff;border-bottom:1px solid var(--border-subtle)}
.p-nav button{position:relative;border:0;background:transparent;color:var(--text-light);font-size:13px;font-weight:600;padding:6px 12px;border-radius:var(--r-full);cursor:pointer;transition:transform 160ms var(--ease)}
.p-nav button:active{transform:scale(.97)}
.p-nav button.on{background:var(--nav-selected);color:var(--active)}
.ndot{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 2px #fff}
.slot-top{order:2;padding:12px 24px 0;max-width:1000px;width:100%;margin:0 auto}
.p-body{order:3;flex:1;padding:20px 24px 32px;width:100%;max-width:1000px;margin:0 auto}
.hello{margin-bottom:14px}
.k{font-size:12px;font-weight:600;color:var(--text-light)}
.v{font-size:16px;font-weight:700;margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.s{font-size:13px;color:var(--text-light);margin-top:2px}
.days{display:inline-flex;gap:2px;background:var(--nav);border-radius:var(--r-full);padding:2px;margin-bottom:16px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.dp{border:0;background:transparent;border-radius:var(--r-full);padding:5px 12px;font-size:12px;font-weight:600;color:var(--text-light);cursor:pointer;white-space:nowrap}
.dp.on{background:#fff;color:var(--text-heavy);box-shadow:var(--shadow-card)}
.dp small{font-weight:500;color:var(--link)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--border-subtle);border-radius:var(--r-lg);box-shadow:var(--shadow-card);padding:14px 16px;min-width:0}
.card.wide{grid-column:span 2}
.fill{font-variant-numeric:tabular-nums;font-size:12px;font-weight:700;padding:2px 8px;border-radius:var(--r-full);background:var(--highlight);color:var(--link)}
.fill.full{background:var(--inset);color:var(--text-light)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mp,.hp{margin-bottom:14px}
.plan{margin-top:10px}
.fl-l{font-size:11px;font-weight:700;color:var(--text-light);margin:8px 0 4px}
.rooms{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.rm{background:var(--inset);border-radius:var(--r-md);padding:8px;font-size:12px;font-weight:600;line-height:1.25}
.rm small{font-weight:500;color:var(--text-light)}
.rm.you{background:var(--highlight);outline:1.5px solid var(--primary);color:var(--active)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chipb{border:1px solid var(--border);background:#fff;border-radius:var(--r-full);padding:5px 11px;font-size:12px;font-weight:600;color:var(--text-heavy);cursor:pointer}
.chipb.on{background:var(--primary);border-color:var(--primary);color:#fff}
.hs-status{display:flex;gap:8px;align-items:flex-start;margin-top:12px;padding:10px;border-radius:var(--r-md);background:var(--inset);font-size:12px;color:var(--text-light)}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--live);margin-top:4px;flex-shrink:0}
.list{padding:4px 0}
.li{display:flex;gap:14px;padding:10px 16px;border-bottom:1px solid var(--border-subtle)}
.li:last-child{border-bottom:0}
.tm{font-size:12px;font-weight:700;color:var(--text-light);width:76px;flex-shrink:0;font-variant-numeric:tabular-nums;padding-top:1px}
.tx{display:flex;flex-direction:column;min-width:0}
.tx small{font-size:12px;color:var(--text-light)}
.slots{display:grid;gap:10px}
.slotc .names{margin-top:6px;font-size:12px;color:var(--text-light)}
.scanbox{position:relative;height:220px;border-radius:var(--r-lg);background:var(--text-medium);display:grid;place-items:center;color:rgba(255,255,255,.8);font-size:13px;font-weight:600;max-width:420px;margin-bottom:12px}
.scanbox i{position:absolute;width:28px;height:28px;border:3px solid #fff}
.scanbox .tl{top:40px;left:calc(50% - 70px);border-right:0;border-bottom:0;border-radius:6px 0 0 0}
.scanbox .tr{top:40px;right:calc(50% - 70px);border-left:0;border-bottom:0;border-radius:0 6px 0 0}
.scanbox .bl{bottom:40px;left:calc(50% - 70px);border-right:0;border-top:0;border-radius:0 0 0 6px}
.scanbox .br{bottom:40px;right:calc(50% - 70px);border-left:0;border-top:0;border-radius:0 0 6px 0}
.scanlast{max-width:420px}
.tl-list{display:grid;gap:10px;max-width:640px}
.tlr{display:flex;gap:14px}

@container app (max-width: 640px){
  .p-top{padding:10px 12px;gap:8px}
  .p-brand,.lg{display:none}
  .p-actions .pill{padding:0 10px}
  .p-nav{order:9;position:sticky;bottom:0;z-index:5;border-bottom:0;border-top:1px solid var(--border-subtle);padding:6px 4px calc(6px + env(safe-area-inset-bottom));gap:0}
  .p-nav button{flex:1;font-size:11px;padding:8px 2px}
  .slot-top{padding:12px 16px 0}
  .p-body{padding:16px 16px 24px}
  .grid{grid-template-columns:minmax(0,1fr)}
  .card.wide{grid-column:auto}
  .rooms{grid-template-columns:repeat(3,minmax(0,1fr))}
  h1{font-size:21px}
}

/* ---------- tour: ring + callout ---------- */
.ring{position:absolute;left:0;top:0;z-index:30;pointer-events:none;border-radius:var(--r-lg);transition:transform 300ms var(--ease-io),width 300ms var(--ease-io),height 300ms var(--ease-io),opacity 200ms var(--ease)}
.ring.jump{transition:opacity 200ms var(--ease)}
.ring.off{opacity:0;visibility:hidden}
.ring.dim{box-shadow:0 0 0 2px var(--primary),0 0 0 6px rgba(11,107,196,.28),0 0 0 9999px var(--dim)}
.ring.soft{box-shadow:0 0 0 2px var(--primary),0 0 0 6px rgba(11,107,196,.18)}
#anchors > *{position:absolute;z-index:31}
.co{width:min(320px,calc(100% - 24px));background:#fff;border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--shadow-pop);animation:pop 200ms var(--ease) both}
.co.slim{width:min(280px,calc(100% - 24px));padding:12px 14px}
.menu{width:min(290px,calc(100% - 24px));background:#fff;border-radius:var(--r-lg);padding:6px;box-shadow:var(--shadow-pop);animation:pop 180ms var(--ease) both}
.menu-h{font-size:12px;font-weight:700;color:var(--text-light);padding:8px 10px 4px}
.mi{display:flex;flex-direction:column;align-items:flex-start;width:100%;border:0;background:none;text-align:left;padding:8px 10px;border-radius:var(--r-md);cursor:pointer;color:var(--text-heavy);transition:transform 160ms var(--ease)}
.mi:active{transform:scale(.98)}
.mi b{font-size:13px}
.mi span{font-size:12px;color:var(--text-light)}
.toast-wrap{position:absolute;left:0;right:0;bottom:calc(var(--ib,0px) + 16px);display:flex;justify-content:center;padding:0 16px}
.toast{background:var(--text-heavy);color:#fff;font-size:13px;font-weight:600;padding:9px 14px;border-radius:var(--r-full);box-shadow:0 8px 24px rgba(11,43,74,.25);animation:rise 300ms var(--ease) both;max-width:100%}
@container app (max-width: 640px){ .toast-wrap{bottom:calc(var(--ib,0px) + 70px)} }
.scrim{position:absolute;inset:0;background:var(--dim);animation:fade 200ms var(--ease) both}
.center{position:absolute;inset:0;display:grid;place-items:center;padding:16px}
.modal{width:min(380px,100%);background:#fff;border-radius:var(--r-xl);padding:20px;box-shadow:var(--shadow-pop);animation:pop 240ms var(--ease) both;max-height:100%;overflow:auto}
.mini{height:84px;border-radius:var(--r-lg);background:var(--inset);margin-bottom:14px;padding:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;align-content:end}
.mini i{height:34px;border-radius:var(--r-md);background:#fff;box-shadow:var(--shadow-card)}
.mini i:nth-child(2){outline:2px solid var(--primary)}

/* V2 checklist */
.side{position:absolute;top:0;right:0;bottom:0;width:300px;background:#fff;border-left:1px solid var(--border-subtle);display:flex;flex-direction:column}
.side-scroll{overflow:auto;flex:1}
.side-peek{display:none}
.side-hd{padding:16px;border-bottom:1px solid var(--border-subtle)}
.bar{height:4px;border-radius:var(--r-full);background:var(--border-subtle);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--live);transition:width 300ms var(--ease)}
.ck-sec{font-size:12px;font-weight:700;color:var(--text-light);padding:14px 16px 4px}
.ck{list-style:none}
.ck-list{margin:0;padding:4px 0}
.ck-i{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:9px 16px;cursor:pointer;color:var(--text-heavy);font-size:13px}
.ck-i small{display:block;font-size:12px;color:var(--text-light);font-weight:500}
.ck-c{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border);flex-shrink:0;display:grid;place-items:center;color:#fff}
.ck.done .ck-c{background:var(--live);border-color:var(--live)}
.ck.cur .ck-c{border-color:var(--primary);box-shadow:0 0 0 3px var(--highlight)}
.ck.cur{background:var(--highlight)}
.ck-b{padding:0 16px 12px 44px;animation:fade 200ms var(--ease)}
.side-ft{padding:10px 16px;border-top:1px solid var(--border-subtle);display:flex}
@container app (min-width: 641px){ .v-side #app{right:300px} }
@container app (max-width: 640px){
  .v-side #app{bottom:58px}
  .side{top:auto;left:0;width:auto;height:72%;border-left:0;border-top:1px solid var(--border-subtle);border-radius:20px 20px 0 0;box-shadow:0 -8px 32px rgba(11,43,74,.18);transform:translateY(calc(100% - 58px));transition:transform 400ms var(--ease-drawer)}
  .side.open{transform:none}
  .side-peek{display:flex;align-items:center;gap:8px;height:58px;padding:0 12px 0 16px;flex-shrink:0;border-bottom:1px solid var(--border-subtle)}
  .side-peek .pt{flex:1;min-width:0;border:0;background:none;text-align:left;cursor:pointer;color:var(--text-heavy);padding:0}
  .side-peek .pt b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side-peek .pt small{display:block;font-size:11px;color:var(--link);font-weight:600}
}

/* V3 dots card */
.c3wrap{position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center;padding:0 16px}
.c3{width:min(380px,100%);background:#fff;border-radius:var(--r-xl);padding:16px;box-shadow:var(--shadow-pop);animation:rise 300ms var(--ease) both;touch-action:pan-y}
.c3-in{animation:fade 180ms var(--ease) both}
.art{height:92px;border-radius:var(--r-lg);background:var(--inset);display:grid;place-items:center;margin-bottom:10px;padding:10px}
.a-card{background:#fff;border-radius:var(--r-md);box-shadow:var(--shadow-card);padding:8px 12px;font-size:12px;outline:2px solid var(--primary)}
.a-card small{display:block;color:var(--text-light)}
.a-plan{display:grid;grid-template-columns:repeat(3,36px);gap:4px}
.a-plan i{height:22px;border-radius:4px;background:#fff}
.a-plan i.you{background:var(--highlight);outline:2px solid var(--primary)}
.dots{display:flex;justify-content:center;margin:2px 0 4px}
.dot{width:22px;height:24px;border:0;background:none;padding:0;display:grid;place-items:center;cursor:pointer}
.dot span{display:block;width:8px;height:8px;border-radius:var(--r-full);background:var(--border);transition:width 200ms var(--ease),background-color 200ms ease}
.dot.on{width:34px}
.dot.on span{width:22px;background:var(--primary)}

.prow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.play{width:36px;height:36px;border-radius:50%;background:var(--primary);color:#fff;border:0;display:grid;place-items:center;cursor:pointer;flex-shrink:0;transition:transform 160ms var(--ease)}

.cap{flex:1;min-width:180px}
.cap .ttl{margin-top:1px}
.pctl{display:flex;gap:6px;align-items:center}

#cursor{position:absolute;left:0;top:0;z-index:33;pointer-events:none;transition:transform 700ms var(--ease-io),opacity 200ms ease}
#cursor.off{opacity:0}
#cursor::after{content:"";position:absolute;left:-11px;top:-11px;width:24px;height:24px;border-radius:50%;border:2px solid var(--primary);opacity:0}
#cursor.click::after{animation:ripple 400ms var(--ease)}
.vid{height:150px;border-radius:var(--r-lg);background:var(--text-medium);display:grid;place-items:center;margin-bottom:14px;position:relative}
.bigplay{width:56px;height:56px;border-radius:50%;border:0;background:#fff;color:var(--text-heavy);display:grid;place-items:center;cursor:pointer;transition:transform 160ms var(--ease)}
.bigplay:active{transform:scale(.95)}
.dur{position:absolute;right:10px;bottom:8px;font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.35);padding:2px 6px;border-radius:var(--r-xs)}

.hs{width:28px;height:28px;border:0;background:transparent;padding:0;cursor:pointer;transform:translate(-50%,-50%);display:grid;place-items:center;animation:pop 200ms var(--ease) both}
.hs::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 2px #fff;position:relative;z-index:1}
.hs::after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:var(--primary);animation:pulse 1.6s var(--ease) infinite}
.hs.seen::before{background:#fff;box-shadow:0 0 0 2px var(--primary)}
.hs.seen::after,.hs.cur::after{animation:none;opacity:0}
.chipwrap,.pwrap{position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center;padding:0 16px}
.pwrap{justify-content:flex-start}
.chip{display:flex;align-items:center;gap:10px;background:var(--text-heavy);color:#fff;border-radius:var(--r-full);padding:4px 4px 4px 14px;font-size:12px;font-weight:600;box-shadow:0 8px 24px rgba(11,43,74,.25);animation:rise 300ms var(--ease) both;max-width:100%}
.mbar{width:60px;height:4px;border-radius:var(--r-full);background:rgba(255,255,255,.2);overflow:hidden;flex-shrink:0}
.mbar i{display:block;height:100%;background:#fff;transition:width 300ms var(--ease)}
.pcard{width:min(330px,100%);background:#fff;border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--shadow-pop);animation:rise 300ms var(--ease) both}
@container app (max-width: 640px){ .chipwrap,.pwrap{bottom:66px;padding:0 10px} .pwrap{justify-content:center} }

.chat{position:absolute;right:16px;bottom:16px;top:16px;width:340px;display:flex;flex-direction:column;background:#fff;border-radius:var(--r-xl);box-shadow:var(--shadow-pop);animation:rise 300ms var(--ease) both;overflow:hidden}

.flt{flex:1;min-width:0}

@container app (max-width: 640px){ .tbwrap{bottom:66px} .tb{justify-content:flex-end} .tb b{flex:1 0 100%} }

  const el = s && q(s.t);
  if (mode && el) {
    const r = rel(el), pad = 4, was = ringEl.classList.contains("off");
    ringEl.className = "ring " + mode + (was ? " jump" : "");
    ringEl.style.width = r.w + pad * 2 + "px"; ringEl.style.height = r.h + pad * 2 + "px";
    ringEl.style.transform = "translate(" + (r.x - pad) + "px," + (r.y - pad) + "px)";
    const br = getComputedStyle(el).borderTopLeftRadius;
    ringEl.style.borderRadius = br && br !== "0px" ? "calc(" + br + " + 4px)" : "8px";
    if (was) { void ringEl.offsetWidth; ringEl.classList.remove("jump"); }
  } else ringEl.className = "ring off";
  anchorsEl.querySelectorAll("[data-anchor]").forEach(a => {
    const t = a.dataset.anchor === "step" ? (s && s.t) : a.dataset.anchor;
    const te = t && q(t);
    if (!te) { a.style.visibility = "hidden"; return; }
    a.style.visibility = "";
    const r = rel(te);
    if (a.dataset.place === "corner") { a.style.left = r.x + r.w - 6 + "px"; a.style.top = r.y + 6 + "px"; }
    else posNear(a, r);
  });
}
function keepSwap(root, html) {
  const prev = new Set([...root.querySelectorAll("[data-keep]")].map(e => e.dataset.keep));
  root.innerHTML = html;
  root.querySelectorAll("[data-keep]").forEach(e => { if (prev.has(e.dataset.keep)) e.classList.add("noanim"); });
}

      hs: a => { E.i = +a; E.open = true; E.hs.add(E.i); enter(); render(); },
      next: () => { const n = total(); for (let k = 1; k <= n; k++) { const j = (E.i + k) % n; if (!E.hs.has(j)) { E.i = j; E.open = true; E.hs.add(j); enter(); render(); return; } } E.open = false; finish(E.flow === "tour" ? "All 5 seen. You're set." : null); },
      back: () => { if (E.i > 0) { E.i--; E.hs.add(E.i); enter(); render(); } },
      closeHs: () => { E.open = false; E.panel = null; render(); },
    },
    anchor() {
      if (!E.on) return "";
      const steps = STEPS[E.flow].steps, left = steps.length - E.hs.size;
      let h = steps.map((s, i) => (s.page && s.page !== E.page) ? "" : '<button class="hs ' + (E.hs.has(i) ? "seen " : "") + (E.open && E.i === i ? "cur" : "") + '" data-anchor="' + s.t + '" data-place="corner" data-act="hs" data-arg="' + i + '" aria-label="Tour stop ' + (i + 1) + ": " + s.title + '"></button>').join("");
      if (E.open) h += '<div class="co" role="dialog" aria-label="Tour step" data-anchor="step" data-keep="co' + E.i + '">' + stepText() + '<div class="ctrls"><button class="link" data-act="closeHs">Close</button><span class="sp"></span>' + (E.i > 0 ? '<button class="pill sm" data-act="back">Back</button>' : "") + '<button class="pill sm primary" data-act="next"' + (step().wait ? " disabled" : "") + ">" + (left ? "Next" : "Done") + "</button></div></div>";
      return h;
    },
    layer() {
      if (E.prompt) return promptCard("Five blue dots mark the spots worth knowing. Tap them in any order.");
      if (!E.on) return "";
      const n = total();
      return '<div class="chipwrap"><div class="chip" data-keep="chip"><span>' + (E.open ? "" : "Tap a blue dot · ") + E.hs.size + " of " + n + ' seen</span><span class="mbar"><i style="width:' + (E.hs.size / n) * 100 + '%"></i></span><button class="pill sm dk" data-act="skip">Skip tour</button></div></div>';
    },
  },
  /* 7 */ {
    name: "Bottom-sheet coach",
    why: "Built for the phone: the coach lives in a sheet your thumb can reach and the page stays visible above. Drag it down to pause.",
    howto: true,
    ring: () => (E.on && !E.min ? "dim" : null),
    acts: {
      howto: () => { E.panel = E.panel === "howto" ? null : "howto"; render(); },
      resume: () => { E.min = false; render(); },
      start: a => { E.panel = null; E.min = false; start(a || "tour"); },
    },
    layer() {
      const wrap = (inner, label) => '<div class="sheetwrap"><div class="sheet" role="dialog" aria-label="' + label + '" data-keep="sheet"><button class="grab" aria-label="Drag down to pause"><i></i></button>' + inner + "</div></div>";
      if (E.panel === "howto") return wrap('<div class="ttl lg" style="margin-top:0">How to…</div><div style="margin:8px -10px 4px">' + MENU_ITEMS.map(f => '<button class="mi" data-act="start" data-arg="' + f[0] + '"><b>' + f[1] + "</b><span>" + f[2] + "</span></button>").join("") + '</div><div class="ctrls"><button class="pill sm" data-act="howto">Close</button></div>', "How to");
      if (E.prompt) return wrap('<div class="ttl lg" style="margin-top:0">Take a 1-minute tour?</div><div class="bd">' + PROMPT + '</div><div class="ctrls"><button class="pill sm" data-act="notnow">Not now</button><button class="pill sm primary" data-act="start">Start tour</button></div>', "Tour");
      if (!E.on) return "";
      const s = step(), n = total();
      if (E.min) return '<div class="sheetwrap"><div class="sheet" data-keep="sheet"><button class="grab" data-act="resume" aria-label="Resume tour"><i></i></button><div class="peekrow"><span class="sp" style="min-width:0"><span class="lbl">Tour paused</span><br><b style="font-size:13px">Step ' + (E.i + 1) + " of " + n + " · " + s.title + '</b></span><button class="link" data-act="skip">Skip tour</button><button class="pill sm primary" data-act="resume">Resume</button></div></div></div>';
      return wrap('<div class="segbar">' + STEPS[E.flow].steps.map((x, i) => '<i class="' + (i <= E.i ? "on" : "") + '"></i>').join("") + "</div>" + stepText() + ctrls(), "Tour step");
    },
    after() {
      const sh = layer.querySelector(".sheet"); if (!sh || !E.on || E.min || E.panel === "howto") return;
      const g = sh.querySelector(".grab"); let y0 = null, t0 = 0, dy = 0;
      g.onpointerdown = e => { y0 = e.clientY; t0 = performance.now(); dy = 0; sh.style.animation = "none"; sh.style.transition = "none"; g.setPointerCapture(e.pointerId); };
      g.onpointermove = e => { if (y0 == null) return; dy = e.clientY - y0; sh.style.transform = "translateY(" + (dy < 0 ? dy * 0.2 : dy) + "px)"; };
      g.onpointerup = g.onpointercancel = () => {
        if (y0 == null) return; const v = dy / Math.max(1, performance.now() - t0); y0 = null;
        if (dy > 80 || v > 0.5) { E.min = true; render(); }
        else { sh.style.transition = "transform 400ms var(--ease-drawer)"; sh.style.transform = ""; }
      };
    },
  },
  /* 8 */ {
    name: "Chat guide",
    why: "A friendly guide talks you through it one message at a time. Quick-reply pills replace buttons, and How-to is just asking.",
    howto: true,
    ring: () => (E.on ? "dim" : null),
    mount() {
      frame.classList.add("v-chat"); E.seenLog = 0; E.mode = "prompt";
      E.log = [{ w: "bot", h: "Hi! I'm from the Hack Western sponsor team. Welcome to Hack Western 13." }, { w: "bot", h: "<b>Take a 1-minute tour?</b> " + PROMPT }];
    },
    onStep() { const s = step(); E.log.push({ w: "bot", h: '<span class="lbl">Step ' + (E.i + 1) + " of " + total() + "</span><br><b>" + s.title + ".</b> " + s.body + (s.wait ? '<br><span class="hint-in">Try it: ' + s.hint.toLowerCase() + "</span>" : "") }); },
    onFinish(f) { E.log.push({ w: "bot", h: f === "tour" ? "That's the tour! Ask me how to do something any time." : "That's how to " + STEPS[f].name.toLowerCase() + ". Anything else?" }); E.mode = "idle"; },
    quietFinish: true,
    acts: {
      start: a => { E.log.push({ w: "me", h: a && a !== "tour" ? STEPS[a].name : "Start tour" }); start(a || "tour"); },
      next: () => { E.log.push({ w: "me", h: E.i === total() - 1 ? "Done" : "Next" }); next(); },
      back: () => { E.log.push({ w: "me", h: "Back" }); back(); },
      skip: () => { E.log.push({ w: "me", h: "Skip tour" }, { w: "bot", h: "No problem. Tap ? up top or ask me here when you need something." }); E.mode = "idle"; E.on = false; E.panel = null; render(); },
      notnow: () => { E.log.push({ w: "me", h: "Not now" }, { w: "bot", h: "Sure. I'll be right here if you need me." }); E.prompt = false; E.mode = "idle"; render(); },
      howto: () => { E.log.push({ w: "me", h: "How do I…?" }, { w: "bot", h: "What do you want to do?" }); E.prompt = false; E.mode = "idle"; E.on = false; render(); },
    },
    layer() {
      let r;
      if (E.on) {
        const s = step();
        r = (s.wait ? '<span class="pill sm waiting" aria-live="polite">Waiting for you…</span>' : '<button class="pill sm primary" data-act="next">' + (E.i === total() - 1 ? "Done" : "Next") + "</button>") +
          (E.i > 0 ? '<button class="pill sm" data-act="back">Back</button>' : "") + '<button class="pill sm" data-act="skip">Skip tour</button>';
      } else if (E.mode === "prompt") r = '<button class="pill sm primary" data-act="start">Start tour</button><button class="pill sm" data-act="notnow">Not now</button><button class="pill sm" data-act="howto">How do I…?</button>';
      else r = FLOW_LIST.map(f => '<button class="pill sm" data-act="start" data-arg="' + f[0] + '">' + f[1] + "</button>").join("") + '<button class="pill sm" data-act="start">Take the tour</button>';
      const msgs = E.log.map((m, i) => '<div class="b ' + m.w + (i < E.seenLog ? " noanim" : "") + '">' + m.h + "</div>").join("");
      return '<section class="chat" data-keep="chat" aria-label="Chat with the sponsor team"><div class="chat-h"><span class="av" aria-hidden="true">HW</span><span><b>Sponsor team</b><small>Here all weekend</small></span></div><div class="msgs" aria-live="polite">' + msgs + '</div><div class="replies">' + r + "</div></section>";
    },
    after() { E.seenLog = E.log.length; const m = layer.querySelector(".msgs"); if (m) m.scrollTop = m.scrollHeight; },
  },
  /* 9 */ {
    name: "Task launcher",
    why: "Asks what you came to do and teaches just that. The full tour is one option, not a gate in front of the page.",
    howto: true,
    quietFinish: true,
    ring: () => (E.on ? "dim" : null),
    onFinish(f) { E.doneFlow = f; },
    acts: {
      howto: () => { E.launch = true; E.doneFlow = null; render(); },
      start: a => { E.launch = false; E.doneFlow = null; start(a || "tour"); },
      notnow: () => { E.launch = false; notNow(); },
      closeL: () => { E.launch = false; E.doneFlow = null; render(); },
    },
    layer() {
      if (E.prompt || E.launch) {
        const first = E.prompt;
        return '<div class="scrim" data-keep="scrim"></div><div class="center"><div class="modal launch" role="dialog" aria-label="What do you want to do?" data-keep="launch"><div class="ttl lg">What do you want to do first?</div><div class="bd">Pick one and we\'ll walk you through it right on the page.</div><div class="fls">' +
          FLOW_LIST.map((f, i) => '<button class="fl" data-act="start" data-arg="' + f[0] + '"><span class="n">' + (i + 1) + '</span><span class="flt"><b>' + f[1] + "</b><span>" + f[2] + '</span></span><span class="flm">' + f[3] + "</span></button>").join("") +
          '</div><div class="tourrow"><span><b>Take a 1-minute tour?</b><span>All five basics in a row.</span></span><button class="pill sm" data-act="' + (first ? "notnow" : "closeL") + '">' + (first ? "Not now" : "Close") + '</button><button class="pill sm primary" data-act="start">Start tour</button></div></div></div>';
      }
      if (E.doneFlow) {
        const f = E.doneFlow, others = FLOW_LIST.filter(x => x[0] !== f);
        return '<div class="scrim" data-keep="scrim"></div><div class="center"><div class="modal launch" role="dialog" aria-label="Done" data-keep="launch"><div class="done-ic">' + CHECK + '</div><div class="ttl lg">' + (f === "tour" ? "Tour done" : "Done: " + STEPS[f].name) + '</div><div class="bd">Want to learn another one?</div><div class="fls">' +
          others.map((x, i) => '<button class="fl" data-act="start" data-arg="' + x[0] + '"><span class="n">' + (i + 1) + '</span><span class="flt"><b>' + x[1] + "</b><span>" + x[2] + '</span></span><span class="flm">' + x[3] + "</span></button>").join("") +
          '</div><div class="ctrls"><span class="sp"></span><button class="pill sm" data-act="closeL">Close</button></div></div></div>';
      }
      if (!E.on) return "";
      const s = step(), n = total();
      return '<div class="tbwrap"><div class="tb" data-keep="tb" role="region" aria-label="Tour progress"><b>' + (E.flow === "tour" ? "1-minute tour" : STEPS[E.flow].name) + '</b><span class="tbs">Step ' + (E.i + 1) + " of " + n + '</span><span class="mbar"><i style="width:' + ((E.i + 1) / n) * 100 + '%"></i></span>' +
        '<button class="pill sm dk" data-act="back"' + (E.i ? "" : " disabled") + '>Back</button><button class="pill sm dk primary" data-act="next"' + (s.wait ? " disabled" : "") + ">" + (E.i === n - 1 ? "Done" : "Next") + '</button><button class="pill sm dk" data-act="skip">Skip tour</button></div></div>';
    },
    anchor: () => (E.on ? '<div class="co slim" role="note" data-anchor="step" data-keep="co' + E.flow + E.i + '"><div class="ttl" style="margin-top:0">' + step().title + "</div>" + stepText({ noLabel: true, noTitle: true }) + "</div>" : ""),
  },
  /* 10 */ {
    name: "Page-by-page tips",
    why: "No tour to sit through: each page teaches one thing the first time you open it. A dot on a tab means that page still has a tip.",
    mount() { E.tipsOn = true; E.ctx = new Set(); E.seq = false; },
    onStep() { if (E.flow === "ctx") E.ctx.add(E.i); },
    navDot(k) { const i = STEPS.ctx.steps.findIndex(s => s.page === k); return E.tipsOn && i >= 0 && !E.ctx.has(i) ? '<i class="ndot" aria-label="(new tip)"></i>' : ""; },
    onPage(p) {
      if (E.on && E.flow !== "ctx") return;
      const i = STEPS.ctx.steps.findIndex(s => s.page === p);
      if (E.tipsOn && !E.prompt && i >= 0 && !E.ctx.has(i)) { E.flow = "ctx"; E.i = i; E.on = true; E.ctx.add(i); }
      else if (E.flow === "ctx") E.on = false;
    },
    ring: () => (E.on ? (E.seq || E.flow !== "ctx" ? "dim" : "soft") : null),
    afterWait() { if (E.flow === "ctx" && !E.seq) { E.on = false; E.panel = "map"; render(); } else next(); },
    acts: {
      start: a => { if (!a || a === "tour") { E.seq = true; E.tipsOn = true; E.ctx = new Set(); E.prompt = false; E.panel = null; E.flow = "ctx"; E.i = 0; E.on = true; enter(); render(); } else ACT.start(a); },
      notnow: () => { E.prompt = false; E.seq = false; E.flow = "ctx"; E.i = 0; E.on = true; enter(); render(); },
      gotit: () => { E.on = false; render(); },
      skip: () => { E.tipsOn = false; E.seq = false; skip(); },
    },
    layer: () => (E.prompt ? promptCard("Or skip it: we'll show one short tip the first time you open each page.") : ""),
    anchor() {
      if (!E.on) return "";
      if (E.flow !== "ctx") return callout();
      const s = step(), dis = s.wait ? " disabled" : "";
      return '<div class="co" role="dialog" aria-label="Page tip" data-anchor="step" data-keep="tip' + E.i + '"><div class="lbl">Step ' + (E.i + 1) + " of 5 · " + PAGE_NAME[s.page] + ' tip</div><div class="ttl">' + s.title + '</div><div class="bd">' + s.body + "</div>" + (s.wait ? '<div class="hint"><span class="pulse-dot"></span>' + s.hint + "</div>" : "") +
        '<div class="ctrls">' + (E.seq
          ? '<button class="link" data-act="skip">Skip tour</button><span class="sp"></span>' + (E.i ? '<button class="pill sm" data-act="back">Back</button>' : "") + '<button class="pill sm primary" data-act="next"' + dis + ">" + (E.i === 4 ? "Done" : "Next page") + "</button>"
          : '<button class="link" data-act="skip">Turn off tips</button><span class="sp"></span><button class="pill sm primary" data-act="gotit"' + dis + ">Got it</button>") + "</div></div>";
    },
  },
];

/* ================= mount + harness ================= */
function mountV(i) {
  clearTimers(); clearTimeout(toastT);
  V = VARIANTS[i];
  for (const k in E) delete E[k];
  Object.assign(E, { flow: null, i: 0, on: false, prompt: true, page: "home", panel: null, day: "fri", toast: null, reason: null });
  frame.className = ""; frame.style.removeProperty("--ib");
  app.innerHTML = '<div id="portal"></div><div id="ring" class="ring off" aria-hidden="true"></div><div id="anchors"></div>';
  layer.innerHTML = "";
  portalEl = $("#portal"); ringEl = $("#ring"); anchorsEl = $("#anchors");
  app.scrollTop = 0; lastKey = "";
  V.mount && V.mount();
  note.innerHTML = "<b>" + V.name + "</b> · " + V.why;
  measureHead();
  render();
}
function measureHead() { document.documentElement.style.setProperty("--head-h", $("#wf-head").offsetHeight + "px"); }
app.addEventListener("scroll", () => place(), { passive: true });
new ResizeObserver(() => { if (V) { place(); V.after && V.after(); } }).observe(app);
window.addEventListener("resize", measureHead);

// Desktop / Phone
const segBtns = [...document.querySelectorAll(".seg button")];
function setD(d) {
  document.body.classList.toggle("phone", d === "phone");
  segBtns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.d === d)));
  const url = new URL(location); if (d === "phone") url.searchParams.set("d", "phone"); else url.searchParams.delete("d"); history.replaceState(null, "", url);
  requestAnimationFrame(() => { if (V) { lastKey = ""; render(); } });
}
segBtns.forEach(b => b.addEventListener("click", () => setD(b.dataset.d)));
setD(new URLSearchParams(location.search).get("d") === "phone" ? "phone" : "desktop");

// Picker wiring (PICKER.md reference, mount swapped for this harness)
const picker = document.querySelector(".proto-picker");
const highlight = picker.querySelector(".proto-picker-highlight");
const items = [...picker.querySelectorAll(".proto-picker-item:not(.proto-picker-replay)")];
const replay = picker.querySelector(".proto-picker-replay");
let current = 0;
function moveHighlight() { const el = items[current]; highlight.style.width = el.offsetWidth + "px"; highlight.style.transform = "translateX(" + el.offsetLeft + "px)"; }
function mount(i) { requestAnimationFrame(() => mountV(i)); }
function setActive(i) {
  if (i < 0 || i >= VARIANTS.length) return;
  current = i;
  items.forEach((el, j) => { el.toggleAttribute("data-active", j === i); if (j === i) el.setAttribute("aria-current", "true"); else el.removeAttribute("aria-current"); });
  moveHighlight();
  const url = new URL(location); url.searchParams.set("v", i + 1); history.replaceState(null, "", url);
  mount(i);
}
items.forEach((el, i) => el.addEventListener("click", () => setActive(i)));
replay && replay.addEventListener("click", () => mount(current));
window.addEventListener("resize", moveHighlight);
document.addEventListener("keydown", e => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (e.key === "0") setActive(9);
  else if (num >= 1 && num <= VARIANTS.length) setActive(num - 1);
  else if (e.key === "ArrowRight") setActive((current + 1) % VARIANTS.length);
  else if (e.key === "ArrowLeft") setActive((current - 1 + VARIANTS.length) % VARIANTS.length);
  else if (e.key === "r" || e.key === "R") mount(current);
});
const requested = parseInt(new URLSearchParams(location.search).get("v"), 10);
setActive(requested >= 1 && requested <= VARIANTS.length ? requested - 1 : 0);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute("data-ready", "")));
</script>
</body>
</html>
