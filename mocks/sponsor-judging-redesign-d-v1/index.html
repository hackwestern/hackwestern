<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dbe7f5">
<title>Sponsor Judging D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Pix32";src:url("assets/Pix32.woff2") format("woff2");font-display:swap}
:root{
  /* copied from sponsor-portal-flow-hacker-v1 (src/lib/tokens.ts:242-294, 466-494) */
  --t-heavy:#0b2b4a;--t-medium:#1c3550;--t-light:#516476;--t-active:#08559c;--t-warn:#8a4300;--t-link:#0b6bc4;
  --bg-page:#f3f7fc;--bg-surface:#fff;--bg-nav:#dbe7f5;--bg-navSel:#b9d3f0;--bg-inset:#edf3fa;--bg-hl:#e1effb;--bg-current:#e4eefb;
  --primary:#0b6bc4;
  --b-default:#cdddeb;--b-subtle:#e0eaf3;--b-card:#d6e3ef;--b-control:#b9cbe0;
  --live:#16803c;--err:#b42318;--warn-bg:#fdf1e3;--warn-b:#f1c48f;
  --r-sm:4px;--r-md:6px;--r-lg:8px;
  --sh-card:0 1px 2px 0 rgba(11,43,74,.06),0 1px 4px 0 rgba(11,43,74,.05);
  --sh-btn:0 2px 4px 0 rgba(11,43,74,.2);
  --one-bg:#bfdbfe;--one-b:#93c5fd;--one-t:#1e3a8a;
  --ws-bg:#fef08a;--ws-b:#fde047;--ws-t:#713f12;
  --nav-h:64px;--bar-h:80px;--tick:44px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg-page);color:var(--t-heavy);font-family:Figtree,system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
@media (pointer:fine){body{cursor:url("assets/cursor-default.webp"),auto}a,button,[role=button],.strip{cursor:url("assets/hover-hand.webp"),pointer}}
a{color:inherit}
button{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* shell: top bar + sidebar, as hacker-v1 */
.app{display:flex;min-height:100dvh}
.side{display:none}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;height:calc(var(--nav-h) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0;background:var(--bg-nav);border-bottom:1px solid var(--b-default)}
.top-logo{display:flex;align-items:center;min-width:44px;min-height:44px;padding:0 4px}
.top-logo img{width:26px;height:38px}
.top-title{position:absolute;left:50%;transform:translateX(-50%);bottom:calc((var(--nav-h) - 24px)/2);font-weight:600;font-size:16px;white-space:nowrap}
.helpbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border:1px solid var(--b-default);border-radius:var(--r-lg);background:#fff;text-decoration:none;font-weight:600;font-size:14px;color:var(--t-heavy)}
.helpbtn svg.i{width:18px;height:18px;color:var(--t-active)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.pane{flex:1;padding:16px 16px calc(var(--bar-h) + 32px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px;min-width:0}
.desk-h,.lead{display:none}
@media (min-width:768px){
  .top{display:none}
  .side{display:flex;flex-direction:column;justify-content:space-between;position:sticky;top:0;height:100dvh;width:300px;flex:none;overflow-y:auto;background:var(--bg-nav);border-right:1px solid var(--b-default);border-radius:0 var(--r-lg) var(--r-lg) 0;padding:48px 24px}
  .brand{display:flex;align-items:center;gap:12px;font-size:20px;text-decoration:none}
  .brand img{width:34px;height:50px;margin:-2.5px 7px}
  .spon{display:flex;align-items:center;gap:10px;margin-top:28px;padding:10px 12px;background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh-card)}
  .spon img{height:22px;width:auto}
  .spon span{font-size:13px;color:var(--t-light)}
  .snav{display:flex;flex-direction:column;gap:6px;margin-top:36px}
  .snav hr{border:0;border-top:1px solid var(--b-subtle);margin:14px 0}
  .navl{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:var(--r-sm);text-decoration:none;color:var(--t-medium)}
  .navl svg.i{color:var(--t-light)}
  .navl:hover{background:var(--bg-surface);color:var(--t-heavy)}
  .navl[aria-current=page]{background:var(--bg-navSel);color:var(--t-active)}
  .navl[aria-current=page] svg.i{color:var(--t-active)}
  .side-ft{font-size:13px;color:var(--t-light)}
  .pane{padding:48px;gap:24px}
  .desk-h{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
  .desk-h .helpbtn{margin-top:6px}
  .lead{display:block;color:var(--t-medium);max-width:62ch}
}
.h1{font-size:28px;font-weight:700;line-height:1.2}
@media (min-width:768px){.h1{font-size:32px}}

/* cards, buttons, chips (hacker-v1) */
.card{background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh-card);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:768px){.card{padding:24px}}
.muted{color:var(--t-light)}
.small{font-size:14px}
.num{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r-lg);border:1px solid transparent;font-weight:500;font-size:16px;text-decoration:none;white-space:nowrap;transition:background .15s,transform .1s;background:none}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--primary);color:#fff;box-shadow:var(--sh-btn)}
.btn-p:hover{background:var(--t-active)}
.btn-o{background:#fff;border-color:var(--b-control);color:var(--t-heavy)}
.btn-o:hover{background:var(--bg-hl)}
.btn-l{color:var(--t-link);font-weight:600;padding:0 8px;font-size:14px}
.btn-l:hover{background:var(--bg-hl)}
.btn[aria-disabled=true]{opacity:.5;box-shadow:none}
.btn-o[aria-disabled=true]{background:var(--bg-inset);border-color:var(--b-subtle);color:var(--t-light);opacity:1}
.btn-w{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.btn{flex:1 1 0}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:var(--r-sm);background:var(--bg-nav);font-size:13px;font-weight:500;color:var(--t-medium)}
.tag.own{background:var(--bg-inset);color:var(--t-light)}
.stack{display:flex;flex-wrap:wrap;gap:6px}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-lg);background:var(--bg-inset);font-size:14px;color:var(--t-medium)}
.note svg.i{width:18px;height:18px;margin-top:1px;color:var(--t-light)}
.note.ok svg.i{color:var(--live)}
.ck-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-weight:600}
.k{font-size:13px;font-weight:600;color:var(--t-light)}
.mock{font-size:13px;color:var(--t-light);border:1px dashed var(--b-control);border-radius:var(--r-lg);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.mock .jumps{display:flex;flex-wrap:wrap;gap:4px}
.mock a,.mock .mb{display:inline-flex;align-items:center;min-height:44px;padding:0 10px;border-radius:var(--r-md);color:var(--t-link);font-weight:600;text-decoration:none;border:0;background:none;font-size:13px}
.mock a:hover,.mock .mb:hover{background:var(--bg-hl)}
.mock a[aria-current=true]{background:var(--bg-nav);color:var(--t-heavy)}

/* phase */
.phase{display:flex;flex-direction:column;gap:6px}
.phase .pk{font-family:Pix32,monospace;font-size:14px;color:var(--t-active);letter-spacing:.02em}
.seg{display:flex;gap:6px}
.seg i{flex:1;height:6px;border-radius:999px;background:var(--bg-nav)}
.seg i.on{background:var(--primary)}

/* segmented controls */
.segc{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:var(--bg-nav);border-radius:var(--r-lg)}
.segc button{min-height:44px;border:0;border-radius:var(--r-md);background:none;font-weight:600;font-size:15px;color:var(--t-medium);padding:0 6px;line-height:1.15}
.segc button[aria-pressed=true]{background:#fff;color:var(--t-heavy);box-shadow:var(--sh-card)}
.modes button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px}
.modes button svg.i{width:18px;height:18px;color:var(--t-light)}
.modes button[aria-pressed=true] svg.i{color:var(--t-active)}

/* who's judging */
.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:36px;height:36px;flex:none;border-radius:999px;background:var(--bg-navSel);color:var(--t-active);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.av.sm{width:26px;height:26px;font-size:12px}
.who .tx{flex:1;min-width:0;font-size:15px}
.who .tx b{font-weight:700}
.pick4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick4 button{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 12px;border:1px solid var(--b-control);border-radius:var(--r-lg);background:#fff;text-align:left;font-weight:600}
.pick4 button:hover{background:var(--bg-hl)}
.pick4 button[aria-pressed=true]{border-color:var(--primary);background:var(--bg-hl)}
.pick4 small{display:block;font-weight:400;font-size:12px;color:var(--t-light)}
.scope{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.scope .segc{flex:1 1 200px}
.sw{display:inline-flex;align-items:center;gap:10px;min-height:44px;border:0;background:none;padding:0 2px;font-weight:600;font-size:14px;color:var(--t-medium)}
.sw .tr{width:40px;height:24px;border-radius:999px;background:var(--b-control);position:relative;flex:none;transition:background .15s}
.sw .tr::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:999px;background:#fff;box-shadow:var(--sh-card);transition:transform .15s}
.sw[aria-checked=true] .tr{background:var(--primary)}
.sw[aria-checked=true] .tr::after{transform:translateX(16px)}

/* project card */
.pc{position:relative;touch-action:pan-y}
.pc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tbl{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:var(--r-lg);background:var(--bg-hl);color:var(--t-active);font-weight:600;font-size:15px}
.tbl b{font-family:Pix32,monospace;font-size:22px;line-height:1;font-weight:400}
.pc-name{font-size:24px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.pc-tag{font-size:16px;color:var(--t-medium)}
.kv{display:flex;flex-direction:column;gap:4px}
.links3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.links3 .btn{padding:0 6px;font-size:15px;gap:6px}
.pc.mini{gap:10px;padding:16px}
.pc.mini .pc-name{font-size:19px}
.pc.mini .pc-tag{font-size:14px}
.pc.mini .tbl{padding:4px 10px;font-size:13px}
.pc.mini .tbl b{font-size:18px}
.pc.mini .links3 .btn{font-size:14px}
.pc.done{box-shadow:var(--sh-card),inset 3px 0 0 var(--live)}
.saved{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--live)}
.saved svg.i{width:16px;height:16px}

/* score control: Holia's slider as a scroll-snap number strip */
.sc{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:var(--r-lg);background:var(--bg-inset)}
.sc-h{display:flex;align-items:center;gap:6px}
.sc-h .k{font-size:15px;color:var(--t-heavy)}
.sc-h .btn-l{padding:0 10px}
.sc-h .btn-l svg.i{width:18px;height:18px}
.sc-v{margin-left:auto;font-size:40px;font-weight:700;line-height:1;color:var(--t-active);font-variant-numeric:tabular-nums}
.sc-v small{font-size:15px;font-weight:600;color:var(--t-light);margin-left:2px}
.sc.un .sc-v{color:var(--t-light)}
.sc-r{display:flex;align-items:center;gap:6px}
.pm{width:44px;height:48px;flex:none;border:1px solid var(--b-control);border-radius:var(--r-md);background:#fff;font-size:22px;font-weight:600;line-height:1;color:var(--t-heavy)}
.pm:hover{background:var(--bg-hl)}
.pm[aria-disabled=true]{opacity:.4}
.stripw{position:relative;flex:1;min-width:0;height:48px;border-radius:var(--r-md);background:#fff;border:1px solid var(--b-card)}
.stripw::after{content:"";position:absolute;top:3px;bottom:3px;left:50%;width:var(--tick);margin-left:calc(var(--tick)/-2);border-radius:var(--r-md);background:var(--primary);pointer-events:none;z-index:0;transition:opacity .15s}
.sc.un .stripw::after{background:var(--b-control);opacity:.5}
.strip{position:relative;z-index:1;display:flex;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;touch-action:pan-x;border-radius:var(--r-md);-webkit-mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent)}
.strip::-webkit-scrollbar{display:none}
.strip::before,.strip::after{content:"";flex:0 0 calc(50% - var(--tick)/2)}
.tick{flex:0 0 var(--tick);scroll-snap-align:center;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:var(--t-medium);font-variant-numeric:tabular-nums;-webkit-user-select:none;user-select:none}
.tick.h{font-size:12px;font-weight:600;color:var(--t-light)}
.tick.on{color:#fff}
.sc.un .tick.on{color:var(--t-medium)}
.strip:focus-visible{outline-offset:-2px}
.sc-f{display:flex;justify-content:space-between;font-size:12px;color:var(--t-light)}

/* team scores */
.agg{display:flex;flex-direction:column;gap:6px;min-width:0}
.agg-l{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:14px;color:var(--t-medium)}
.agg-l .rs b{font-weight:700;color:var(--t-heavy)}
.agg-l .rs.me b{color:var(--t-active)}
.agg-l .avg{font-weight:700;color:var(--t-heavy)}
.flag{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:var(--r-md);background:var(--warn-bg);border:1px solid var(--warn-b);color:var(--t-warn);font-size:14px;font-weight:600}
.flag svg.i{width:18px;height:18px;margin-top:1px}
.fresh{animation:fresh 1.6s ease-out}
@keyframes fresh{0%{background:var(--bg-hl)}100%{background:transparent}}

/* progress */
.prog{display:flex;flex-direction:column;gap:6px}
.prog p{font-size:15px}
.bar{height:8px;border-radius:999px;background:var(--bg-nav);overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:999px;transition:width .2s}
.dots{display:flex;gap:6px}
.dots i{flex:1;height:6px;border-radius:999px;background:var(--bg-nav)}
.dots i.on{background:var(--primary)}
.dots i.cur{background:var(--t-active);outline:2px solid var(--bg-hl)}
.filt{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 6px 6px 12px;border-radius:var(--r-lg);background:var(--bg-hl);font-size:14px;color:var(--t-active);font-weight:600}
.tip{font-size:13px;color:var(--t-light)}
.tip b{color:var(--t-medium)}

/* quick pass */
.stamp{position:absolute;top:18px;padding:4px 12px;border:3px solid;border-radius:var(--r-md);font-family:Pix32,monospace;font-size:20px;background:#fff;opacity:0;pointer-events:none;z-index:2}
.stamp.y{right:18px;color:var(--live);transform:rotate(6deg)}
.stamp.n{left:18px;color:var(--err);transform:rotate(-6deg)}
.pc.anim{transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .2s}
.tri{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:2px 8px;border-radius:var(--r-sm);background:var(--bg-nav);color:var(--t-medium)}
.tri.yes{background:#dcf2e3;color:var(--live)}
.tri.no{background:#fbe4e2;color:var(--err)}

/* bottom bars: fixed on phones, inline on desktop */
.bbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--bg-nav);border-top:1px solid var(--b-default);display:flex;flex-direction:column;gap:6px}
.bbar .hint{font-size:13px;color:var(--t-medium);text-align:center}
.acts{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px}
.acts .btn{min-height:56px;font-weight:600;padding:0 8px}
.acts2{display:grid;grid-template-columns:auto 1fr;gap:8px}
.acts2 .btn{min-height:52px;font-weight:600}
@media (min-width:768px){.bbar{position:static;padding:0;background:none;border:0}}

/* layout */
.r1grid{display:grid;gap:16px}
.r1main{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (min-width:1100px){.r1grid{grid-template-columns:minmax(0,1fr) 300px;align-items:start;gap:28px}.r1side{position:sticky;top:48px}}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--b-subtle);min-width:0}
.li:first-child{border-top:0}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-weight:600;overflow-wrap:anywhere}
.li .tx span{display:block;font-size:13px;color:var(--t-light)}
.li .val{font-weight:700;font-variant-numeric:tabular-nums}
.slrow{display:flex;align-items:flex-start;gap:12px;width:100%;padding:12px 0;border:0;border-top:1px solid var(--b-subtle);background:none;text-align:left}
.slrow:first-child{border-top:0}
.cb{width:28px;height:28px;flex:none;margin-top:2px;border-radius:var(--r-md);border:2px solid var(--b-control);display:flex;align-items:center;justify-content:center;background:#fff}
.cb svg{width:18px;height:18px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.slrow[aria-pressed=true] .cb{background:var(--primary);border-color:var(--primary)}
.slrow[aria-pressed=true] .cb svg{opacity:1}
.slrow .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.slrow .tx b{font-weight:600;overflow-wrap:anywhere}
.slrow .avgbig{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--t-heavy);min-width:44px;text-align:right}
.slrow .avgbig small{display:block;font-size:11px;font-weight:600;color:var(--t-light)}
.slrow .avg{display:none}
.sug{display:inline-flex;font-size:12px;font-weight:600;color:var(--t-active)}
.grp-h{font-size:16px;font-weight:600;display:flex;gap:8px;align-items:baseline}
.m10{display:flex;gap:3px}
.m10 i{flex:1;height:8px;border-radius:999px;background:var(--bg-nav)}
.m10 i.on{background:var(--primary)}
.m10 i:nth-child(5){margin-right:6px}

/* waiting / locked / round 2 / review (from redesign A) */
.done-h{display:flex;align-items:center;gap:16px}
.big-ck{width:48px;height:48px;flex:none;border-radius:999px;background:var(--primary);display:flex;align-items:center;justify-content:center}
.big-ck svg{width:24px;height:24px;stroke:#fff;stroke-width:2.5;fill:none}
.done-h h2{font-size:20px;font-weight:600}
.sch{display:flex;flex-direction:column;gap:10px}
.ev{display:grid;grid-template-columns:64px 1fr;gap:10px}
.ev .tm{font-family:Pix32,monospace;font-size:14px;color:var(--t-medium);padding-top:12px;white-space:nowrap}
.evb{border:2px solid var(--one-b);background:var(--one-bg);color:var(--one-t);border-radius:var(--r-lg);padding:10px 12px;min-width:0}
.evb b{display:block;font-family:Pix32,monospace;font-size:15px;font-weight:400;letter-spacing:.02em;overflow-wrap:anywhere}
.evb span{display:block;font-size:13px}
.lockic{width:48px;height:48px;border-radius:999px;background:var(--bg-nav);display:flex;align-items:center;justify-content:center;color:var(--t-active)}
.lockic svg.i{width:24px;height:24px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:12px 8px}
.steps .tm{font-family:Pix32,monospace;font-size:14px;color:var(--t-active);width:56px;flex:none;padding-top:2px}
.steps b{display:block;font-weight:600}
.r2grid{display:grid;gap:20px}

const joined=()=>REPS.filter(r=>r===UI.me||ALREADY.includes(r));
/* Split: contiguous runs of tables, so each rep walks one part of the room. */
function chunks(){
  const R=joined(),n=R.length,base=Math.floor(PROJ.length/n),extra=PROJ.length%n,out={};let i=0;
  R.forEach((r,k)=>{const len=base+(k<extra?1:0);out[r]=PROJ.slice(i,i+len).map(p=>p.id);i+=len});return out;
}
const ownerOf=id=>{const c=chunks();return Object.keys(c).find(r=>c[r].includes(id))};
const myIds=()=>UI.me?chunks()[UI.me]:[];
function list(){
  let L=UI.split&&UI.scope==="mine"?PROJ.filter(p=>myIds().includes(p.id)):PROJ.slice();
  if(UI.ym&&UI.mode!=="quick")L=L.filter(p=>UI.tri[p.id]==="yes"||UI.tri[p.id]==="maybe");
  return L;
}
const myScore=id=>UI.sc[id]?.[UI.me];
const scoresOf=id=>{const s=UI.sc[id]||{};return REPS.filter(r=>s[r]!==undefined).map(r=>({r,v:s[r]}))};
const avgOf=id=>{const a=scoresOf(id);return a.length?a.reduce((t,x)=>t+x.v,0)/a.length:null};
const gapOf=id=>{const a=scoresOf(id);if(a.length<2)return null;const hi=a.reduce((m,x)=>x.v>m.v?x:m),lo=a.reduce((m,x)=>x.v<m.v?x:m);return hi.v-lo.v>=3?{hi,lo}:null};
function suggested(){
  const s=PROJ.filter(p=>avgOf(p.id)!==null).sort((a,b)=>avgOf(b.id)-avgOf(a.id));
  let n=s.filter(p=>avgOf(p.id)>=7.5).length;n=Math.max(MIN,Math.min(MAX,n));
  return s.slice(0,n).map(p=>p.id);
}
const picked=()=>UI.pick||suggested();
const avgTxt=id=>{const a=avgOf(id);return a===null?"No scores":`avg ${fmt(a)}`};

/* teammates' scores so far (seeded) */
function seedTeam(){
  const c=chunks(),V=[7,8.5,6,7.5,5.5,9,6.5,8];let k=0;
  ALREADY.filter(r=>r!==UI.me&&c[r]).forEach(r=>c[r].slice(0,2).forEach(id=>{(UI.sc[id]??={})[r]=V[k++%V.length]}));
  /* two reps who disagree, so the flag is visible from the start */
  const pr=c["Priya S."]||[];const id=pr[2]||pr[0];if(id){(UI.sc[id]??={})["Priya S."]=8.5;UI.sc[id]["Marcus O."]=5}
}
seedTeam();

/* ===== live regions: small renderers patched in place (no full re-render while someone is scrolling a score) ===== */
const LIVE={
  agg:d=>aggHTML(d.pid),
  prog:()=>progHTML(),
  save:()=>saveHTML(),
  side:()=>sideHTML(),
  bprog:()=>batchProgHTML(),
  mark:d=>myScore(d.pid)!==undefined?`<span class="saved">${ic("check")}Saved</span>`:"",
};
function patchLive(){$$("[data-live]").forEach(el=>{const f=LIVE[el.dataset.live];if(f)el.innerHTML=f(el.dataset)});
  $$(".pc[data-id]").forEach(el=>el.classList.toggle("done",UI.mode!=="quick"&&myScore(el.dataset.id)!==undefined))}
function aggHTML(id){
  const a=scoresOf(id);
  if(!a.length)return `<div class="agg-l"><span class="muted">No scores from your team yet</span></div>`;
  const g=gapOf(id),av=avgOf(id);
  return `<div class="agg-l${UI.fresh===id?" fresh":""}">${ic("users")}${a.map(x=>`<span class="rs${x.r===UI.me?" me":""}">${first(x.r)} <b class="num">${fmt(x.v)}</b></span>`).join("<span aria-hidden=\"true\">·</span>")}${a.length>1?`<span class="avg num">avg ${fmt(av)}</span>`:""}</div>
  ${g?`<p class="flag" data-flag="${id}">${ic("alert")}<span>${first(g.hi.r)} ${fmt(g.hi.v)} · ${first(g.lo.r)} ${fmt(g.lo.v)}: talk it through</span></p>`:""}`;
}

/* ===== score control =====
   Holia's slider (rubric-scorer.tsx in c7e6c2e1: 0-10 in 0.5 steps, big value, dimmed until touched)
   as a horizontal scroll-snap strip of 1, 1.5 ... 10, with -/+ 0.5 buttons and arrow keys. */
function scoreCtl(p){
  const v=myScore(p.id),shown=v??5.5,un=v===undefined;
  return `<div class="sc${un?" un":""}" data-ctl="${p.id}">
    <div class="sc-h"><span class="k" id="scl-${p.id}">Your score</span>
      <button type="button" class="btn btn-l" data-rubric="${p.id}" aria-haspopup="dialog">${ic("book")}Rubric</button>
      <output class="sc-v" data-out aria-hidden="true">${un?"–":fmt(v)}<small>/10</small></output></div>
    <div class="sc-r">
      <button type="button" class="pm" data-pm="-1" data-for="${p.id}" aria-label="Lower ${esc(p.name)}'s score by 0.5"${v===LO?' aria-disabled="true"':""}>−</button>
      <div class="stripw"><div class="strip" data-strip="${p.id}" role="slider" tabindex="0" aria-labelledby="scl-${p.id}" aria-valuemin="${LO}" aria-valuemax="${HI}" aria-valuenow="${shown}" aria-valuetext="${un?"Not scored yet":fmt(v)+" out of 10"}">${VALS.map(x=>`<span class="tick${x%1?" h":""}${x===shown?" on":""}" data-v="${x}">${fmt(x)}</span>`).join("")}</div></div>
      <button type="button" class="pm" data-pm="1" data-for="${p.id}" aria-label="Raise ${esc(p.name)}'s score by 0.5"${v===HI?' aria-disabled="true"':""}>+</button>
    </div>
    <div class="sc-f" aria-hidden="true"><span>1 weak</span><span>Scroll, tap or use ← →</span><span>10 best</span></div>
  </div>`;
}
function syncStrip(el,smooth){
  const id=el.dataset.strip,v=myScore(id)??5.5,left=VALS.indexOf(v)*el.querySelector(".tick").offsetWidth;
  el._prog=true;clearTimeout(el._pt);el._pt=setTimeout(()=>el._prog=false,smooth?450:60);
  if(smooth&&!reduced)el.scrollTo({left,behavior:"smooth"});else el.scrollLeft=left;
}
function paintCtl(id){
  $$(`[data-ctl="${id}"]`).forEach(c=>{const v=myScore(id),un=v===undefined;c.classList.toggle("un",un);
    c.querySelector("[data-out]").innerHTML=`${un?"–":fmt(v)}<small>/10</small>`;
    const s=c.querySelector(".strip");s.setAttribute("aria-valuenow",v??5.5);s.setAttribute("aria-valuetext",un?"Not scored yet":fmt(v)+" out of 10");
    s.querySelectorAll(".tick").forEach(t=>t.classList.toggle("on",+t.dataset.v===(v??5.5)));
    c.querySelectorAll("[data-pm]").forEach(b=>{const lim=b.dataset.pm==="1"?HI:LO;if(v===lim)b.setAttribute("aria-disabled","true");else b.removeAttribute("aria-disabled")})});
}
function setMine(id,v,{scroll=true}={}){
  v=clamp(v);if(myScore(id)===v)return;
  (UI.sc[id]??={})[UI.me]=v;paintCtl(id);
  if(scroll)$$(`[data-strip="${id}"]`).forEach(s=>syncStrip(s,true));
  patchLive();
}

/* mode 1: one at a time */
function curOne(L){
  if(!UI.cur||!L.some(p=>p.id===UI.cur))UI.cur=(L.find(p=>myScore(p.id)===undefined)||L[0])?.id||null;
  return UI.cur;
}
function saveHTML(){
  const id=UI.cur,ok=id&&myScore(id)!==undefined,L=list(),done=L.length&&scoredIn(L)===L.length;
  return `<div class="acts2"><button type="button" class="btn btn-o" data-skip1>Skip</button>
    <button type="button" class="btn btn-p" data-save1${ok?"":' aria-disabled="true"'}>${ok?(done?`${ic("check")}Save ${fmt(myScore(id))} · all scored`:`Save ${fmt(myScore(id))} & next`):"Pick a score"}${ok&&!done?ic("next"):""}</button></div>`;
}
function modeOne(){
  const L=list();if(!L.length)return emptyHTML();
  const id=curOne(L),p=byId(id),i=L.findIndex(x=>x.id===id);
  return `<article class="card pc" data-id="${p.id}" aria-label="${esc(p.name)}">${cardBody(p,{pos:`${i+1} of ${L.length}`})}
    ${scoreCtl(p)}<div class="agg" data-live="agg" data-pid="${p.id}">${aggHTML(p.id)}</div></article>
    ${allScored(L)}

}
function allScored(L){
  return scoredIn(L)===L.length?`<p class="note ok">${ic("check")}<span>You've scored all ${L.length}. <a href="#shortlist" style="color:var(--t-link);font-weight:600">Review the team shortlist</a>, or keep going on ${UI.scope==="mine"&&UI.split?`<button type="button" class="btn btn-l" data-scope="all" style="min-height:24px;padding:0 4px">everyone's ${PROJ.length}</button>`:"any project"}.</span></p>`:"";

/* mode 2: five at a time */
function batchProgHTML(){
  const L=list(),nb=Math.ceil(L.length/BATCH),B=L.slice(UI.bi*BATCH,UI.bi*BATCH+BATCH);
  return `<div class="ck-h"><span>Batch ${UI.bi+1} of ${nb}</span><span class="small num">${scoredIn(B)} of ${B.length} scored in this batch</span></div>
   <div class="dots" aria-hidden="true">${Array.from({length:nb},(_,k)=>{const b=L.slice(k*BATCH,k*BATCH+BATCH);return `<i class="${k===UI.bi?"cur":scoredIn(b)===b.length?"on":""}"></i>`}).join("")}</div>`;
}
function modeFive(){
  const L=list();if(!L.length)return emptyHTML();
  const nb=Math.ceil(L.length/BATCH);UI.bi=Math.min(UI.bi,nb-1);const B=L.slice(UI.bi*BATCH,UI.bi*BATCH+BATCH);

  return `<div class="prog" data-live="bprog">${batchProgHTML()}</div>
   <p class="small muted">Tables ${tables[0]} to ${tables[tables.length-1]}, nearby on the floor.</p>

   <div class="row">${UI.bi>0?`<button type="button" class="btn btn-o" data-batch="-1">${ic("back")}Previous 5</button>`:""}
     ${UI.bi<nb-1?`<button type="button" class="btn btn-p" data-batch="1">Next ${Math.min(BATCH,L.length-(UI.bi+1)*BATCH)}${ic("next")}</button>`:`<a class="btn btn-p" href="#shortlist">${ic("list")}Review shortlist</a>`}</div>`;
}

/* mode 3: quick pass */
function modeQuick(){
  const L=list();if(!L.length)return emptyHTML();
  const p=L.find(x=>!UI.tri[x.id]),ym=L.filter(x=>UI.tri[x.id]==="yes"||UI.tri[x.id]==="maybe").length;

/* ===== teammates scoring live (simulated) ===== */
function simTick(){
  if(!UI.live||!UI.me||UI.sent1)return;
  UI.tick++;const c=chunks(),others=joined().filter(r=>r!==UI.me),V=[7.5,6,8,6.5,9,5.5,7,8.5];
  let r,id,v;
  /* every other tick a teammate cross-checks one of your scores; every second cross-check disagrees by 4 */
  const mine=PROJ.filter(p=>myScore(p.id)!==undefined&&scoresOf(p.id).length===1);
  if(UI.tick%2===1&&mine.length){
    id=mine[0].id;r=others[UI.cross%others.length];const m=myScore(id);
    v=UI.cross%2===0?clamp(m>=5.5?m-4:m+4):clamp(m+(m>=9.5?-0.5:0.5));UI.cross++;
  }else{
    r=others.find(x=>(c[x]||[]).some(i=>UI.sc[i]?.[x]===undefined));if(!r)return;
    id=c[r].find(i=>UI.sc[i]?.[r]===undefined);v=V[UI.tick%V.length];
  }
  (UI.sc[id]??={})[r]=v;UI.fresh=id;
  patchLive();setTimeout(()=>{if(UI.fresh===id)UI.fresh=null},1600);
  toast(`${first(r)} scored ${byId(id).name} ${fmt(v)}`);
}
setInterval(simTick,8000);

function jump(k){
  if(k==="locked"||k==="r1"||k==="shortlist"){UI.sent1=null;UI.sent2=null;UI.ranks=[];UI.rhist=[]}

document.addEventListener("keydown",e=>{
  const s=e.target.closest?.("[data-strip]");if(!s)return;const id=s.dataset.strip,cur=myScore(id);
  const m={ArrowRight:STEP,ArrowUp:STEP,ArrowLeft:-STEP,ArrowDown:-STEP,PageUp:1,PageDown:-1}[e.key];
  if(m!==undefined){e.preventDefault();setMine(id,cur===undefined?5.5+Math.sign(m)*STEP:cur+m);return}
  if(e.key==="Home"){e.preventDefault();setMine(id,LO)}if(e.key==="End"){e.preventDefault();setMine(id,HI)}
});
let md=null,sw=null;
for(const ev of ["wheel","touchstart","pointerdown"])document.addEventListener(ev,e=>{const s=e.target.closest?.("[data-strip]");if(s)s._user=Date.now()},{capture:true,passive:true});
document.addEventListener("pointerdown",e=>{
  const h=e.target.closest("[data-handle]");if(h){startDrag(e,h);return}
  const s=e.target.closest("[data-strip]");
  if(s&&e.pointerType==="mouse"&&e.button===0){md={s,x0:e.clientX,l0:s.scrollLeft,moved:false};s.style.scrollSnapType="none";return}
  const el=e.target.closest(".pc[data-swipe]");if(!el||qbusy||e.target.closest("button,a")||e.button>0)return;
  sw={el,x0:e.clientX,y0:e.clientY,dx:0,on:false,id:e.pointerId};
});
document.addEventListener("pointermove",e=>{
  if(drag){moveDrag(e);return}
  if(md){const dx=e.clientX-md.x0;if(Math.abs(dx)>3)md.moved=true;md.s.scrollLeft=md.l0-dx;return}
  if(!sw||e.pointerId!==sw.id)return;const dx=e.clientX-sw.x0,dy=e.clientY-sw.y0;
  if(!sw.on){if(Math.abs(dy)>12&&Math.abs(dy)>Math.abs(dx)){sw=null;return}if(Math.abs(dx)<8)return;sw.on=true;sw.el.classList.remove("anim");try{sw.el.setPointerCapture(e.pointerId)}catch{}}
  sw.dx=dx;sw.el.style.transform=`translateX(${dx}px) rotate(${dx/24}deg)`;
  const a=Math.min(1,Math.abs(dx)/90);sw.el.querySelector(".stamp.y").style.opacity=dx>0?a:0;sw.el.querySelector(".stamp.n").style.opacity=dx<0?a:0;
});
function endPointer(){
  if(drag){endDrag();return}
  if(md){const {s,moved}=md;md=null;s.style.scrollSnapType="";if(moved){swallowClick=true;setTimeout(()=>swallowClick=false,0);syncStrip(s,true)}return}
  if(!sw)return;const {el,dx,on}=sw;sw=null;if(!on)return;swallowClick=true;setTimeout(()=>swallowClick=false,0);
  if(dx>90)triage("yes");else if(dx<-90)triage("no");else{el.classList.add("anim");el.style.transform="";el.querySelectorAll(".stamp").forEach(s=>s.style.opacity=0)}
}
document.addEventListener("pointerup",endPointer);
document.addEventListener("pointercancel",()=>{if(drag){endDrag();return}if(md){md.s.style.scrollSnapType="";md=null}if(sw?.on){sw.el.classList.add("anim");sw.el.style.transform=""}sw=null});

/* round 2: drag to reorder ranked slots (from redesign A) */
let drag=null;
function startDrag(e,h){e.preventDefault();const rows=[...document.querySelectorAll(".slot.filled")];const i=+h.dataset.handle;
  const r0=rows[0].getBoundingClientRect(),step=rows[1]?rows[1].getBoundingClientRect().top-r0.top:r0.height+8;
  drag={i,to:i,y0:e.clientY,rows,step};rows[i].classList.add("drag");rows.forEach((r,j)=>{if(j!==i)r.classList.add("shift")});try{h.setPointerCapture(e.pointerId)}catch{}}
function moveDrag(e){const d=drag,dy=e.clientY-d.y0;d.rows[d.i].style.transform=`translateY(${dy}px)`;
  d.to=Math.max(0,Math.min(d.rows.length-1,Math.round(d.i+dy/d.step)));
  d.rows.forEach((r,j)=>{if(j===d.i)return;let s=0;if(d.i<d.to&&j>d.i&&j<=d.to)s=-d.step;if(d.i>d.to&&j<d.i&&j>=d.to)s=d.step;r.style.transform=s?`translateY(${s}px)`:""})}
function endDrag(){const d=drag;drag=null;swallowClick=true;setTimeout(()=>swallowClick=false,0);moveRank(d.i,d.to)}
function moveRank(i,to){if(i===to){render(true);return}UI.rhist.push(UI.ranks.slice());const [x]=UI.ranks.splice(i,1);UI.ranks.splice(to,0,x);render(true);
  toast(`${byId(x).name} is now ${PLACE[to]} place`);document.querySelector(`[data-handle="${to}"]`)?.focus({preventScroll:true})}
document.addEventListener("keydown",e=>{const h=e.target.closest?.("[data-handle]");if(!h)return;const i=+h.dataset.handle;
  if(e.key==="ArrowUp"&&i>0){e.preventDefault();moveRank(i,i-1)}if(e.key==="ArrowDown"&&i<UI.ranks.length-1){e.preventDefault();moveRank(i,i+1)}});

render();
</script>
</body>
</html>
