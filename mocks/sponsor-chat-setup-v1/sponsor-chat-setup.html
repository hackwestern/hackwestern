<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat setup · Sun Life (mock v1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   DESIGN SYSTEM: copied from sponsor-coffee-chats-v7 (tokens + components).
   Hierarchy from type, spacing and alignment, not cards.
   Blue = action / selected. Green = confirmed / ok. Amber = needs attention
   (errors, warnings, organizer note) and the mock strip.
   ===================================================================== */
:root{
  --ink:#0b2b4a; --ink-2:#1c3550; --ink-3:#516476; --ink-4:rgba(81,100,118,.7);
  --bg:#ffffff; --bg-sub:#f3f7fc; --bg-sel:rgba(225,239,251,.55); --bg-hover:#f6f9fd;
  --line:#e0eaf3; --line-2:#cdddeb; --line-3:#b9cbe0;
  --accent:#0b6bc4; --accent-2:#08559c;
  --ok:#16803c; --warn:#8a4300;
  --mock-bg:#fff8de; --mock-line:#c78a00;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --t-cap:12px; --t-sec:13px; --t-body:14px; --t-sect:16px; --t-title:20px;
  --r1:4px; --r2:6px; --r3:10px;
  --h-ctl:32px;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --ease-drawer:cubic-bezier(0.32,0.72,0,1);
}
@media (pointer:coarse){:root{--h-ctl:40px}}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink-2);font-family:Figtree,system-ui,sans-serif;font-size:var(--t-body);font-weight:500;line-height:1.43;-webkit-tap-highlight-color:transparent}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r1)}
.num{font-variant-numeric:tabular-nums}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}

/* ---------- mock control strip (not part of the product) ---------- */
.mock{background:var(--mock-bg);border-bottom:1px dashed var(--mock-line);font-size:var(--t-cap);color:var(--warn)}
.mock-in{max-width:880px;margin:0 auto;padding:var(--s2) var(--s4);display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) var(--s5)}
.mock-t{font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.mock-g{display:flex;align-items:center;gap:var(--s1);flex-wrap:wrap}
.mock-g>span{margin-right:var(--s1)}
.mock-b{min-height:24px;padding:0 var(--s2);border:1px solid #e6c766;border-radius:var(--r1);background:#fff;font-size:var(--t-cap);font-weight:600;color:var(--warn)}
.mock-b[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#fff}
.mock-v{margin-left:auto;font-weight:700;padding:2px var(--s2);border:1px solid var(--mock-line);border-radius:var(--r1);background:#fff}
@media (pointer:coarse){.mock-b{min-height:32px}}

/* ---------- page + header ---------- */
.wrap{max-width:880px;margin:0 auto;padding:0 var(--s4)}
@media (min-width:720px){.wrap{padding:0 var(--s6)}.mock-in{padding:var(--s2) var(--s6)}}
.hd{padding-top:var(--s4)}
.hd-back{display:inline-flex;align-items:center;gap:var(--s1);font-size:var(--t-sec);font-weight:600;color:var(--ink-3);text-decoration:none;min-height:24px}
.hd-row{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s2)}
.hd-logo{height:24px;display:flex;align-items:center;padding-right:var(--s3);border-right:1px solid var(--line)}
.hd-logo img{height:100%;width:auto;max-width:96px;object-fit:contain}
h1{font-size:var(--t-title);line-height:1.3;font-weight:700;letter-spacing:-0.01em;color:var(--ink)}
.hd-ev{font-size:var(--t-sec);color:var(--ink-3);margin-left:auto;display:none}
@media (min-width:640px){.hd-ev{display:inline}}
.intro{display:flex;flex-direction:column;gap:var(--s1);margin-top:var(--s3);padding-bottom:var(--s5)}
.lead{max-width:620px}
.meta{font-size:var(--t-sec);color:var(--ink-3)}
.meta b{color:var(--ink);font-weight:600}
h2{font-size:var(--t-sect);font-weight:600;color:var(--ink);line-height:1.4}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:var(--h-ctl);padding:0 var(--s3);border-radius:var(--r2);font-size:var(--t-body);font-weight:600;white-space:nowrap;transition:transform 140ms var(--ease-out),background-color 140ms var(--ease-out),border-color 140ms var(--ease-out)}
.btn:active:not(:disabled){transform:scale(0.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-pri{background:var(--accent);color:#fff}
.btn-sec{background:var(--bg);border:1px solid var(--line-2);color:var(--ink)}
.btn-ghost{color:var(--accent);padding:0 var(--s2)}
.btn-icon{width:var(--h-ctl);padding:0;color:var(--ink-3)}
@media (hover:hover) and (pointer:fine){
  .btn-pri:hover:not(:disabled){background:var(--accent-2)}
  .btn-sec:hover:not(:disabled){border-color:var(--line-3);background:var(--bg-hover)}
  .btn-ghost:hover{text-decoration:underline}
  .btn-icon:hover{color:var(--ink);background:var(--bg-sub)}
}

/* ---------- shared: participant ---------- */
.pp{display:inline-flex;align-items:center;gap:var(--s2);min-width:0;max-width:100%;vertical-align:middle}
.pp-av{flex:none;display:grid;place-items:center;border-radius:50%;background:#e4edf7;color:var(--ink-2);font-weight:700;letter-spacing:.02em}
.pp-tx{min-width:0;display:flex}
.pp-n{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp-u{color:var(--ink-3);font-size:var(--t-sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp-md .pp-av{width:28px;height:28px;font-size:11px}
.pp-md .pp-tx{flex-direction:column;line-height:1.3}
.pp-sm .pp-av{width:20px;height:20px;font-size:9px}
.pp-sm .pp-tx{flex-wrap:wrap;column-gap:6px;line-height:1.35}

/* ---------- shared: status marks ---------- */
.st{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-cap);font-weight:600;color:var(--ink-2);white-space:nowrap;line-height:1}
.st-m{flex:none;width:8px;height:8px;border-radius:50%}
.st-short .st-m{background:var(--accent)}
.st-confirmed{color:var(--ok)}

/* ---------- shared: links ---------- */
.ext{display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-size:var(--t-sec);font-weight:600;text-decoration:none;border-radius:var(--r1);min-height:24px}
.ext .arr{font-size:10px;color:var(--ink-3);transform:translateY(-3px)}
.nolink{font-size:var(--t-sec);color:var(--ink-4)}
@media (hover:hover) and (pointer:fine){.ext:hover{text-decoration:underline}}

/* ---------- shared: tables ---------- */
.frame{position:relative;border:1px solid var(--line);border-radius:var(--r3);overflow:hidden}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:var(--t-cap);font-weight:600;color:var(--ink-3);text-align:left;padding:var(--s2) var(--s3);background:var(--bg-sub);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:var(--s2) var(--s3);border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody:last-child tr:last-child td,.tbl tbody:last-child tr:last-child th{border-bottom:0}
.tbl tr.sel{background:var(--bg-sel)}
.sec{font-size:var(--t-sec);color:var(--ink-3)}
.hint{font-size:var(--t-sec);color:var(--ink-3)}
.cap{font-size:var(--t-cap);color:var(--ink-3)}

/* ---------- segmented control (v7) ---------- */
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r2);padding:2px;gap:2px;flex-wrap:wrap}
.seg button{height:calc(var(--h-ctl) - 6px);min-width:32px;padding:0 var(--s3);border-radius:var(--r1);font-size:var(--t-sec);font-weight:600;color:var(--ink-3);transition:background-color 120ms var(--ease-out),color 120ms var(--ease-out)}
.seg button[aria-pressed="true"]{background:var(--bg-sub);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
@media (hover:hover) and (pointer:fine){.seg button[aria-pressed="false"]:hover{color:var(--ink)}}
.f-l{font-size:var(--t-body);font-weight:600;color:var(--ink)}

/* ---------- toast (v7) ---------- */
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));z-index:60;display:flex;align-items:center;gap:var(--s3);width:max-content;max-width:calc(100vw - 32px);
  padding:var(--s2) var(--s4);min-height:40px;border-radius:var(--r3);background:var(--ink);color:#fff;font-size:var(--t-sec);font-weight:600;box-shadow:0 8px 24px rgba(11,43,74,.22);
  transform:translate(-50%,12px);opacity:0;pointer-events:none;transition:opacity 180ms var(--ease-out),transform 180ms var(--ease-out)}
.toast.on{opacity:1;transform:translate(-50%,0)}
body.editing .toast{bottom:96px}

/* ---------- dialog (v7 sheet) ---------- */
.scrim{position:fixed;inset:0;background:rgba(11,43,74,.28);opacity:0;pointer-events:none;transition:opacity 200ms var(--ease-out);z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:50;left:0;right:0;bottom:0;max-height:88dvh;display:flex;flex-direction:column;background:var(--bg);border-radius:var(--r3) var(--r3) 0 0;box-shadow:0 -8px 32px rgba(11,43,74,.16);
  transform:translateY(100%);visibility:hidden;transition:transform 250ms var(--ease-drawer),visibility 0s linear 250ms}
.sheet.on{transform:none;visibility:visible;transition:transform 250ms var(--ease-drawer),visibility 0s}
@media (min-width:720px){
  .sheet{left:50%;top:50%;right:auto;bottom:auto;width:480px;border-radius:var(--r3);box-shadow:0 16px 48px rgba(11,43,74,.2);
    opacity:0;transform:translate(-50%,-48%) scale(.98);transition:opacity 160ms var(--ease-out),transform 160ms var(--ease-out),visibility 0s linear 160ms}
  .sheet.on{opacity:1;transform:translate(-50%,-50%);transition:opacity 200ms var(--ease-out),transform 200ms var(--ease-out),visibility 0s}
}
.s-head{padding:var(--s4) var(--s4) var(--s3);border-bottom:1px solid var(--line)}
.s-sub{font-size:var(--t-sec);color:var(--ink-3);margin-top:2px}
.s-body{padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3)}
.s-foot{display:flex;justify-content:flex-end;gap:var(--s2);padding:var(--s3) var(--s4) max(var(--s3),env(safe-area-inset-bottom));border-top:1px solid var(--line)}

/* =====================================================================
   CHAT SETUP (new in this mock, built from the same tokens)
   ===================================================================== */
.step{display:flex;flex-direction:column;gap:var(--s4);padding:var(--s6) 0;border-top:1px solid var(--line)}
.step>.seg,.step>.fr>.seg{align-self:flex-start}
.step-h{display:flex;flex-direction:column;gap:var(--s1)}
.fr{display:flex;align-items:center;gap:var(--s2) var(--s4);flex-wrap:wrap}
.fr>.f-l,.fr>.fl{min-width:150px}
.fl{font-size:var(--t-sec);font-weight:600;color:var(--ink-2)}

/* stepper */
.stp{display:inline-flex;align-items:stretch;height:var(--h-ctl);border:1px solid var(--line-2);border-radius:var(--r2);overflow:hidden}
.stp-b{width:var(--h-ctl);display:grid;place-items:center;color:var(--ink-2);transition:background-color 120ms var(--ease-out)}
.stp-b[aria-disabled="true"]{color:var(--ink-4);cursor:not-allowed}
.stp-b:focus-visible{outline-offset:-2px}
.stp-v{min-width:36px;display:grid;place-items:center;font-weight:700;color:var(--ink);border-left:1px solid var(--line);border-right:1px solid var(--line)}
@media (hover:hover) and (pointer:fine){.stp-b:not([aria-disabled="true"]):hover{background:var(--bg-hover);color:var(--ink)}}

/* inputs */
.in,.selc,.ta{height:var(--h-ctl);padding:0 var(--s2);border:1px solid var(--line-2);border-radius:var(--r2);background:var(--bg);color:var(--ink);font-size:var(--t-body);transition:border-color 140ms var(--ease-out)}
.selc{font-weight:600;padding-right:var(--s1)}
.ta{height:auto;min-height:96px;width:100%;padding:var(--s2);resize:vertical;line-height:1.43}
.in::placeholder,.ta::placeholder{color:var(--ink-4)}
@media (hover:hover) and (pointer:fine){.in:hover,.selc:hover,.ta:hover{border-color:var(--line-3)}}
@media (pointer:coarse){.in,.selc,.ta{font-size:16px}}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:var(--s3)}
.names label{display:flex;flex-direction:column;gap:var(--s1);font-size:var(--t-cap);font-weight:600;color:var(--ink-3)}
.names .in{width:100%}

/* checkbox rows */
.chk{display:flex;align-items:flex-start;gap:var(--s3);cursor:pointer}
.chk input{flex:none;width:16px;height:16px;margin:2px 0 0;accent-color:var(--accent);cursor:pointer}
.chk input:disabled{cursor:not-allowed}
.chk-t{display:flex;flex-direction:column}
.chk.sm{gap:var(--s2);align-items:center;font-size:var(--t-sec);color:var(--ink-2)}
.chk.sm input{margin:0}

.fmt{display:flex;flex-direction:column;gap:var(--s5)}
.fmt-b{display:flex;flex-direction:column;gap:var(--s3);margin:var(--s3) 0 0 7px;padding-left:var(--s5);border-left:1px solid var(--line)}
.math{font-size:var(--t-sec);color:var(--ink-3)}
.math b{color:var(--ink);font-weight:700}

/* messages: shape + text, never colour alone */
.msg{display:flex;align-items:flex-start;gap:6px;font-size:var(--t-sec);font-weight:600;line-height:1.4}
.msg svg{flex:none;margin-top:2px}
.msg-err,.msg-warn{color:var(--warn)}
.msg-ok{color:var(--ok)}
.msg-info{color:var(--ink-3);font-weight:500}
.msg b{font-weight:700}

/* hours meter */
.meter{display:flex;flex-direction:column;gap:var(--s2);padding:var(--s3) 0}
.meter-r{display:flex;align-items:baseline;gap:var(--s2) var(--s3);flex-wrap:wrap}
.meter-v{font-size:var(--t-sect);font-weight:700;color:var(--ink)}
.meter-v.over{color:var(--warn)}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;max-width:320px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width 200ms var(--ease-out)}
.bar.over i{background:var(--warn)}

/* availability blocks */
.blks{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r3)}
.blk{display:flex;flex-direction:column;gap:var(--s2);padding:var(--s3)}
.blk+.blk{border-top:1px solid var(--line)}
.blk-r{display:flex;align-items:center;flex-wrap:wrap;gap:var(--s2)}
.blk-n{font-weight:600;color:var(--ink);min-width:60px}
.blk-to{color:var(--ink-3);font-size:var(--t-sec)}
.blk-len{font-size:var(--t-sec);color:var(--ink-3);min-width:44px}
.blk-len.bad{color:var(--warn);font-weight:600}
.blk-x{margin-left:auto}
.rp summary{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 var(--s2);border:1px solid var(--line-2);border-radius:var(--r2);font-size:var(--t-sec);font-weight:600;color:var(--ink-2);cursor:pointer;list-style:none;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.rp summary::-webkit-details-marker{display:none}
.rp summary svg{transition:transform 150ms var(--ease-out)}
.rp[open] summary svg{transform:rotate(180deg)}
.rp-l{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);padding-top:var(--s2)}
.blk .selc{width:124px}
.blk-br{display:none}
@media (max-width:639px){
  /* phone: "Block 1 · 2 h · remove" on top, then times, then reps */
  .blk-r>*{order:4}
  .blk-n{order:0}.blk-len{order:1}.blk-x{order:2}
  .blk-br{display:block;order:3;flex-basis:100%;height:0}
  .blk-rp{order:5;flex-basis:100%}
  .blk .selc{flex:1 1 0;min-width:0;width:auto}
}
.empty-b{padding:var(--s5) var(--s4);text-align:center;color:var(--ink-3);border:1px dashed var(--line-2);border-radius:var(--r3)}

/* slot preview */
.bulk{display:flex;flex-direction:column;gap:var(--s2)}
.bulk-r{display:flex;align-items:center;flex-wrap:wrap;gap:var(--s2);font-size:var(--t-sec);color:var(--ink-3)}
.bulk-r .fl{min-width:96px}
.pv-w{overflow-x:auto}
.pv th,.pv td{text-align:center;padding:var(--s1) var(--s2)}
.pv thead th{vertical-align:bottom;padding:var(--s2)}
.pv .c-t{text-align:left;width:88px;padding-left:var(--s3);font-size:var(--t-sec);font-weight:600;color:var(--ink);background:var(--bg);white-space:nowrap}
.pv thead .c-t{background:var(--bg-sub);color:var(--ink-3);font-size:var(--t-cap)}
.ch-n{display:block;color:var(--ink);font-weight:600;font-size:var(--t-sec);max-width:120px;margin:0 auto;overflow:hidden;text-overflow:ellipsis}
.ch-s{display:block;font-weight:500}
.cell{width:100%;min-width:52px;height:28px;border-radius:var(--r1);font-weight:700;color:var(--ink);transition:background-color 120ms var(--ease-out),box-shadow 120ms var(--ease-out)}
.cell.off,.ro.off{color:var(--ink-4);font-weight:500}
.cell:focus-visible{outline-offset:-2px}
@media (hover:hover) and (pointer:fine){.cell:hover{background:var(--bg-hover);box-shadow:inset 0 0 0 1px var(--line-3)}}
.ro{display:inline-block;min-width:40px;font-weight:700;color:var(--ink)}
.na{color:var(--ink-4)}
.pv .brk td{background:var(--bg-sub);text-align:left;font-size:var(--t-cap);color:var(--ink-3);padding:6px var(--s3)}
@media (max-width:639px){.pv{width:max-content;min-width:100%}}
.pv-sum{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--s1) var(--s3)}
.pv-sum b{color:var(--ink);font-weight:700;font-size:var(--t-sect)}

/* shortlist */
.sl-top{display:flex;flex-direction:column;gap:var(--s2)}
.sl-n{font-size:var(--t-sect);color:var(--ink-2)}
.sl-n b{color:var(--ink);font-weight:700}
.tools{display:flex;flex-wrap:wrap;align-items:flex-end;gap:var(--s2) var(--s3)}
.search{position:relative;display:block;width:220px;max-width:100%}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.search .in{width:100%;padding-left:30px}
.tools label.fld{display:flex;flex-direction:column;gap:2px;font-size:var(--t-cap);font-weight:600;color:var(--ink-3)}
.tools .selc{max-width:200px;font-size:var(--t-sec)}
@media (max-width:639px){.search{flex:1 1 100%;width:auto}.tools label.fld{flex:1 1 30%;min-width:0}.tools .selc{max-width:none;width:100%}}
.dir .c-sl{width:150px;text-align:right}
.dir .g1{display:block;font-size:var(--t-sec);color:var(--ink-2)}
.dir .g2{display:block;font-size:var(--t-sec);color:var(--ink-3)}
@media (min-width:720px){.dir-w{max-height:560px;overflow-y:auto}.dir thead th{position:sticky;top:0;z-index:1}}
.tg{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 var(--s2);border:1px solid var(--line-2);border-radius:var(--r2);font-size:var(--t-cap);font-weight:600;color:var(--ink-2);background:var(--bg);white-space:nowrap;transition:transform 140ms var(--ease-out),border-color 140ms var(--ease-out),color 140ms var(--ease-out)}
.tg:active:not(:disabled){transform:scale(0.97)}
.tg:disabled{opacity:.45;cursor:not-allowed}
.tg .plus{color:var(--accent);font-size:14px;line-height:1}
.tg[aria-pressed="true"]{border-color:transparent;background:transparent;padding-right:0}
.tg .tg-x{color:var(--ink-3);font-weight:600;margin-left:var(--s1)}
@media (pointer:coarse){.tg{height:36px}}
@media (hover:hover) and (pointer:fine){.tg[aria-pressed="false"]:not(:disabled):hover{border-color:var(--accent);color:var(--accent)}.tg[aria-pressed="true"]:hover .tg-x{color:var(--ink);text-decoration:underline}}
.empty{padding:var(--s6) var(--s4);text-align:center;color:var(--ink-3)}
@media (max-width:719px){
  .dir thead{display:none}
  .dir tbody tr{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"p s" "g g" "l l";column-gap:var(--s3);row-gap:2px;padding:var(--s2) var(--s3);border-bottom:1px solid var(--line)}
  .dir tbody tr:last-child{border-bottom:0}
  .dir td{display:block;padding:0;border:0!important}

<script>
/* ---------- constants ---------- */
const WIN=[600,1020];              // Saturday 10:00 AM - 5:00 PM, in minutes
const ALLOC=180;                   // Sun Life package: 3 chatting hours
const ROOM_MAX=6, SHORT_MAX=40, MIN_BLOCK=60, LONG_RUN=180;
const DEADLINE="Thu Nov 19, 11:59 PM"; // placeholder
const GL="ABCDEFGH";

/* ---------- FAKE data: fictional hackers (copied from v7, plus skills + role interest) ---------- */
const RAW = [
 ["Avery","K","Western University","Computer Science",3,1],["Noor","H","University of Waterloo","Statistics",2,1],
 ["Mateo","R","McMaster University","Software Engineering",4,1],["Priya","S","University of Toronto","Math & Economics",3,1],
 ["Jonah","W","Queen's University","Commerce",2,1],["Lin","Z","Western University","Software Engineering",1,0],
 ["Kofi","A","York University","Information Technology",3,1],["Sofia","M","Toronto Metropolitan University","Computer Engineering",4,1],
 ["Ravi","P","University of Ottawa","Computer Science",2,1],["Elodie","B","McGill University","Cognitive Science",3,1],
 ["Theo","N","Western University","Ivey HBA",4,1],["Amara","O","University of Waterloo","Computer Science",3,1],
 ["Haruto","T","University of Guelph","Bioinformatics",2,1],["Isla","F","Carleton University","Cybersecurity",3,0],
 ["Diego","L","Western University","Electrical Engineering",2,1],["Mei","C","University of Toronto","Data Science",4,1],
 ["Yusuf","E","Wilfrid Laurier University","Business Technology",3,1],["Clara","V","Queen's University","Computing",1,0],
 ["Arjun","D","McMaster University","Computer Science",3,1],["Zoe","G","Western University","Media & Information",2,1],
 ["Omar","S","University of Windsor","Computer Science",4,1],["Hana","Y","University of Waterloo","Mathematics",2,1],
 ["Felix","J","University of Ottawa","Software Engineering",3,1],["Leila","R","York University","Computer Science",2,1],
 ["Ben","Q","Western University","Computer Science",4,1],["Ines","P","Université de Montréal","Computer Science",3,1],
 ["Kai","L","Simon Fraser University","Interactive Arts",2,0],["Grace","H","University of Toronto","Engineering Science",3,1],
 ["Samir","K","Toronto Metropolitan University","Business Analytics",4,1],["Nina","W","Western University","Health Sciences",3,1],
 ["Oscar","T","University of Guelph","Computer Science",1,1],["Freya","D","Queen's University","Mechanical Engineering",4,1],
 ["Tariq","M","McMaster University","Computer Science",2,1],["Lucia","A","University of Waterloo","Systems Design Engineering",3,1],
 ["Ezra","B","Carleton University","Computer Science",3,1],["Aiko","S","Western University","Computer Science",2,1],
 ["Marcus","F","Wilfrid Laurier University","Computer Science",4,0],["Tessa","I","University of Toronto","Statistics",3,1],

 ["Jules","R","Western University","Computer Science",2,1],["Maya","T","University of Waterloo","Mechatronics Engineering",3,1],
 ["Ahmed","N","McMaster University","Computer Science",4,1],["Chloe","B","Queen's University","Computing",2,0],

 ["Talia","W","Carleton University","Information Technology",2,1],["Kenji","M","Wilfrid Laurier University","Computer Science",3,1],
];
const SKILLS=["Python","React","SQL","Java","Machine learning","Data analysis","Cloud","UX design","Security","Product"];
const ROLES=["Software engineering","Data science","Product management","Design","Actuarial and risk","Cybersecurity"];
function roleOf(p,i){
  if(i%7===3)return "Actuarial and risk";
  if(/Statistic|Math|Data|Econom|Bioinf/.test(p))return "Data science";
  if(/Commerce|Business|Ivey|Health/.test(p))return "Product management";
  if(/Media|Arts|Cognitive/.test(p))return "Design";
  if(/Cyber|Information Tech/.test(p))return "Cybersecurity";
  return "Software engineering";
}
const HACKERS=RAW.map((r,i)=>({id:i,first:r[0],last:r[1],school:r[2],prog:r[3],year:r[4],resume:!!r[5],
  skills:[...new Set([SKILLS[i%10],SKILLS[(i*3+4)%10],SKILLS[(i*7+1)%10]])],role:roleOf(r[3],i)}));
const PRE_SHORT=[0,1,3,7,11,15,18,21,24,27,33,38];

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nm=h=>`${h.first} ${h.last}.`, ini=h=>h.first[0]+h.last;
const fmt=m=>{const h=Math.floor(m/60),mm=m%60;return `${((h+11)%12)+1}:${String(mm).padStart(2,"0")}`;};
const ap=m=>m>=720?"PM":"AM";
const fa=m=>`${fmt(m)} ${ap(m)}`;
const rng=(s,e)=>ap(s)===ap(e)?`${fmt(s)}–${fa(e)}`:`${fa(s)}–${fa(e)}`;
const hrs=m=>`${+(m/60).toFixed(2)} h`;
const dur=m=>m<60?`${m} min`:hrs(m);
const plural=(n,w)=>`${n} ${w}${n===1?"":"s"}`;
const SVG={
  check:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>`,
  lock:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`,
  x:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>`,
  alert:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17h.01"/></svg>`,
  info:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>`,
  plus:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>`,
  minus:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>`,
  chev:`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>`,
  search:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>`,
};
const msg=(kind,html,id)=>`<p class="msg msg-${kind}"${id?` id="${id}" tabindex="-1"`:""}>${kind==="info"?SVG.info:kind==="ok"?SVG.check:SVG.alert}<span>${html}</span></p>`;

/* ---------- state ---------- */
function fresh(pre){
  return pre?{reps:4,names:["Dana Whitfield","Marcus Oyelaran","",""],one:true,oneReps:2,group:true,groups:1,rpg:2,hpc:4,len:30,
      blocks:[{s:600,e:720,reps:null},{s:780,e:840,reps:null}],cells:{},notes:"",short:new Set(PRE_SHORT),prefilled:true}
    :{reps:1,names:[""],one:false,oneReps:1,group:false,groups:1,rpg:1,hpc:2,len:30,blocks:[],cells:{},notes:"",short:new Set(),prefilled:false};
}
let S=fresh(true), STATE="draft", MODE="edit", NOTE=false, RESUB=false, SENT="Wed Nov 18, 3:12 PM",
    REPLYING=false, REPLY=null, OVER=false, FULL=false;
const UI={merge:null,snap:null,clamp:null,open:new Set(),focus:null,bkT:"",bkV:"full",lnS:null,lnE:null,q:"",school:"",skill:"",role:"",only:false};

/* ---------- derived ---------- */
const repName=r=>(S.names[r]||"").trim()||`Rep ${r+1}`;
const shortName=r=>{const n=(S.names[r]||"").trim();if(!n)return `Rep ${r+1}`;const p=n.split(/\s+/);return p.length>1?`${p[0]} ${p[p.length-1][0]}.`:p[0];};
const repsUsed=()=>(S.one?S.oneReps:0)+(S.group?S.groups*S.rpg:0);
function cols(){
  const out=[];let r=0;
  if(S.one)for(let i=0;i<S.oneReps;i++){out.push({key:"o"+i,kind:"one",reps:[r],label:shortName(r),sub:"1-on-1",max:1});r++;}
  if(S.group)for(let g=0;g<S.groups;g++){const reps=[];for(let j=0;j<S.rpg;j++)reps.push(r++);
    out.push({key:"g"+g,kind:"group",reps,label:`Group ${GL[g]}`,sub:`${plural(S.rpg,"rep")} + ${S.hpc}`,max:S.hpc});}
  return out;
}
function slots(){const out=[];S.blocks.forEach((b,bi)=>{for(let t=b.s;t+S.len<=b.e;t+=S.len)out.push({t,bi});});return out;}
const avail=(c,bi)=>{const b=S.blocks[bi];return !b.reps||c.reps.every(r=>b.reps.includes(r));};
const cellVal=(c,t)=>{const v=S.cells[c.key+"|"+t];return v==null?c.max:Math.min(v,c.max);};
function seats(){const cs=cols();return slots().reduce((a,{t,bi})=>a+cs.reduce((x,c)=>x+(avail(c,bi)?cellVal(c,t):0),0),0);}
const usedMin=()=>S.blocks.reduce((a,b)=>a+Math.max(0,b.e-b.s),0);
function longRuns(){
  const out=[],sl=slots();
  cols().forEach(c=>{let run=null;
    const close=()=>{if(run&&run.e-run.s>LONG_RUN)out.push({c,...run});run=null;};
    sl.forEach(({t,bi})=>{const on=avail(c,bi)&&cellVal(c,t)>0;
      if(on&&run&&run.e===t)run.e=t+S.len;else if(on){close();run={s:t,e:t+S.len};}else close();});
    close();});
  return out;
}
function issues(){
  const out=[],u=repsUsed(),used=usedMin();
  if(!S.one&&!S.group)out.push({m:"Pick 1-on-1, group, or both.",to:"f-one"});
  if(u>S.reps)out.push({m:`Reps used: ${u} of ${S.reps}. Lower a format count or add reps.`,to:"repsUsed"});
  if(!S.blocks.length)out.push({m:"Add at least one availability block.",to:"addBlk"});
  S.blocks.forEach((b,i)=>{if(b.e-b.s<MIN_BLOCK)out.push({m:`Block ${i+1} is ${dur(b.e-b.s)}. Blocks need at least 1 hour.`,to:`b${i}-e`});});
  if(used>ALLOC)out.push({m:`You've requested ${hrs(used)}; your package includes ${hrs(ALLOC)}. Remove ${hrs(used-ALLOC)} or contact organizers.`,to:"hoursMsg"});
  if(cols().length&&slots().length&&seats()===0)out.push({m:"Every slot is Off. Turn at least one back on.",to:"pvH"});
  return out;
}
function sentence(){
  const p=[plural(S.reps,"rep")];
  if(S.one)p.push(`${S.oneReps} one-on-one`);
  if(S.group)p.push(`${S.groups===1?"1 group":S.groups+" groups"} of ${plural(S.rpg,"rep")} + ${plural(S.hpc,"hacker")}`);
  if(!S.one&&!S.group)p.push("no format yet");
  p.push(`${S.len} min`);
  const used=usedMin();
  p.push(`<span class="${used>ALLOC?"over":""}">${+(used/60).toFixed(2)} / ${ALLOC/60} h</span>`);
  p.push(`~${seats()} hacker seats`);
  p.push(`${S.short.size} shortlisted`);
  return p.join(" · ");
}

/* ---------- block normalisation: sort, merge overlapping / touching ---------- */
function normalize(){
  const b=[...S.blocks].sort((a,c)=>a.s-c.s),out=[],notes=[];
  for(const x of b){const last=out[out.length-1];
    if(last&&x.s<=last.e){
      const before=rng(last.s,last.e),other=rng(x.s,x.e),touch=x.s===last.e;
      last.e=Math.max(last.e,x.e);
      last.reps=(!last.reps||!x.reps)?null:[...new Set([...last.reps,...x.reps])].sort((a,c)=>a-c);
      notes.push(`${before} and ${other} ${touch?"touched":"overlapped"}, so they're now one block: <b>${rng(last.s,last.e)}</b>.`);
    } else out.push({...x,reps:x.reps?[...x.reps]:null});}
  S.blocks=out;
  return notes.length?notes.join(" "):null;
}
function freeSpot(){
  for(let s=WIN[0];s+MIN_BLOCK<=WIN[1];s+=S.len){const e=s+MIN_BLOCK;if(S.blocks.every(b=>e<b.s||s>b.e))return s;}
  return null;
}

/* ---------- components ---------- */
function stepper(id,val,min,max,noun,labelId){
  return `<div class="stp" role="group" aria-labelledby="${labelId}">
    <button type="button" class="stp-b" id="${id}-dec" data-step="${id}" data-d="-1" aria-disabled="${val<=min}" aria-label="Fewer ${noun}">${SVG.minus}</button>
    <output class="stp-v num" id="${id}-v" aria-live="polite">${val}</output>
    <button type="button" class="stp-b" id="${id}-inc" data-step="${id}" data-d="1" aria-disabled="${val>=max}" aria-label="More ${noun}">${SVG.plus}</button></div>`;
}
function person(h,size="md"){
  return `<span class="pp pp-${size}"><span class="pp-av" aria-hidden="true">${ini(h)}</span><span class="pp-tx"><span class="pp-n">${esc(nm(h))}</span><span class="pp-u">${esc(h.school)}</span></span></span>`;
}
function timeOpts(sel,isEnd){
  // steps of the chat length inside 10-5; one whole hour on each side is shown disabled so the window is visible
  const lo=isEnd?WIN[0]+S.len:WIN[0], hi=isEnd?WIN[1]:WIN[1]-S.len;
  let o="";
  for(let t=lo-60;t<=hi+60;t+=S.len){
    const out=t<lo||t>hi;
    if(out&&t%60!==0)continue;
    o+=`<option value="${t}"${t===sel?" selected":""}${out?" disabled":""}>${fa(t)}${out?" (closed)":""}</option>`;
  }
  return o;
}

/* ========== FORM SECTIONS ========== */
function renderReps(){
  const n=S.reps;

  <div class="names">${Array.from({length:n},(_,i)=>`<label for="nm${i}">Rep ${i+1} name (optional)<input class="in" id="nm${i}" data-name="${i}" type="text" autocomplete="off" value="${esc(S.names[i]||"")}" placeholder="Rep ${i+1}"></label>`).join("")}</div>`;
}
function renderFormat(){
  const u=repsUsed(),max=ROOM_MAX-S.rpg,total=S.rpg+S.hpc;
  const hpcBtns=Array.from({length:max},(_,i)=>i+1).map(v=>`<button type="button" id="hpc-${v}" data-hpc="${v}" aria-pressed="${v===S.hpc}">${v}</button>`).join("");
  const used=(!S.one&&!S.group)?msg("info","Pick 1-on-1, group, or both.")
    :u>S.reps?msg("err",`<b>Reps used: ${u} of ${S.reps}.</b> Lower a count here or add reps above.`,"repsUsed")
    :u===S.reps?msg("ok",`Reps used: ${u} of ${S.reps}`,"repsUsed")

  $("st-format").innerHTML=`<div class="step-h"><h2 id="h-format">Format</h2><p class="hint">Pick one or both. A room holds up to ${ROOM_MAX} people, reps and hackers combined.</p></div>

    <div>
      <label class="chk"><input type="checkbox" id="f-one" ${S.one?"checked":""}><span class="chk-t"><span class="f-l">1-on-1</span><span class="hint">One rep with one hacker at a time.</span></span></label>
      ${S.one?`<div class="fmt-b">
        <div class="fr"><span class="fl" id="l-one">Reps doing 1-on-1s</span>${stepper("one",S.oneReps,1,8,"1-on-1 reps","l-one")}</div>
        <p class="hint">Each 1-on-1 rep needs their own room, so ${plural(S.oneReps,"rep")} means ${plural(S.oneReps,"room")}.</p></div>`:""}
    </div>

      <label class="chk"><input type="checkbox" id="f-group" ${S.group?"checked":""}><span class="chk-t"><span class="f-l">Group</span><span class="hint">One or more reps with a few hackers at once.</span></span></label>

  reps:v=>{S.reps=v;while(S.names.length<v)S.names.push("");
    S.blocks.forEach(b=>{if(b.reps){b.reps=b.reps.filter(r=>r<v);if(!b.reps.length||b.reps.length===v)b.reps=null;}});},
  one:v=>{S.oneReps=v;},
  groups:v=>{S.groups=v;},
  rpg:v=>{S.rpg=v;if(S.hpc>ROOM_MAX-v){S.hpc=ROOM_MAX-v;UI.clamp=`Hackers per chat lowered to ${S.hpc} to keep the room at ${ROOM_MAX}.`;}},
};
const LIM={reps:[1,8],one:[1,8],groups:[1,8],rpg:[1,5]};
const CUR={reps:()=>S.reps,one:()=>S.oneReps,groups:()=>S.groups,rpg:()=>S.rpg};

document.addEventListener("click",e=>{
  const t=e.target.closest("button,a");if(!t)return;
  if(t.matches("a[href='#']"))e.preventDefault();
  if(t.dataset.state){setState(t.dataset.state);return;}
  if(t.dataset.tog==="over"){OVER=!OVER;
    if(MODE!=="edit"){MODE="edit";STATE="draft";NOTE=false;RESUB=false;}
    S.blocks=OVER?[{s:600,e:840,reps:null}]:[{s:600,e:720,reps:null},{s:780,e:840,reps:null}];clearNotes();renderAll();return;}
  if(t.dataset.tog==="full"){FULL=!FULL;S.short=new Set(FULL?HACKERS.slice(0,SHORT_MAX).map(h=>h.id):PRE_SHORT);renderAll();return;}
  if(t.dataset.step){if(t.getAttribute("aria-disabled")==="true")return;clearNotes();
    const k=t.dataset.step,[lo,hi]=LIM[k];const v=Math.max(lo,Math.min(hi,CUR[k]()+(+t.dataset.d)));STEP[k](v);refresh();return;}
  if(t.dataset.hpc){clearNotes();S.hpc=+t.dataset.hpc;refresh();return;}
  if(t.dataset.len){const v=+t.dataset.len;if(v===S.len)return;clearNotes();S.len=v;
    let moved=false;S.blocks.forEach(b=>{const s=WIN[0]+Math.floor((b.s-WIN[0])/v)*v,en=Math.min(WIN[1],WIN[0]+Math.ceil((b.e-WIN[0])/v)*v);if(s!==b.s||en!==b.e)moved=true;b.s=s;b.e=en;});
    if(moved)UI.snap=`Block times moved to ${v}-minute steps.`;UI.merge=normalize();UI.lnS=null;refresh();return;}
  if(t.dataset.rmblk!=null){clearNotes();const i=+t.dataset.rmblk,b=S.blocks[i];S.blocks.splice(i,1);UI.open=new Set();
    UI.focus=S.blocks.length?`b${Math.max(0,i-1)}-x`:"addBlk";refresh();toast(`Removed ${rng(b.s,b.e)}`);return;}
  if(t.id==="addBlk"){clearNotes();const s=freeSpot();if(s==null)return;S.blocks.push({s,e:s+MIN_BLOCK,reps:null});UI.merge=normalize();
    UI.focus=`b${S.blocks.findIndex(b=>b.s<=s&&b.e>=s+MIN_BLOCK)}-s`;refresh();return;}
  if(t.dataset.cell){const [k,tm]=t.dataset.cell.split("|"),c=cols().find(x=>x.key===k),v=cellVal(c,+tm);
    S.cells[t.dataset.cell]=v===0?c.max:v-1;refresh();return;}
  if(t.id==="bk-go"){const tg=$("bk-t").value,val=$("bk-v").value,[kind,ref]=tg.split(":");UI.bkT=tg;UI.bkV=val;
    const cs=cols();slots().forEach(({t:tm})=>cs.forEach(c=>{if(kind==="r"&&tm!==+ref)return;if(kind==="c"&&c.key!==ref)return;
      const key=c.key+"|"+tm;if(val==="full")delete S.cells[key];else S.cells[key]=Math.min(+val,c.max);}));
    refresh();toast(`${kind==="r"?fa(+ref)+" row":cs.find(c=>c.key===ref).label+" column"} set to ${val==="full"?"full":val==="0"?"Off":plural(+val,"hacker")}`);return;}
  if(t.id==="ln-go"){const s=+$("ln-s").value,en=+$("ln-e").value,cs=cols();
    slots().forEach(({t:tm})=>{if(tm>=s&&tm<en)cs.forEach(c=>S.cells[c.key+"|"+tm]=0);});refresh();toast(`Lunch break: ${rng(s,en)} is Off`);return;}
  if(t.dataset.sl){const id=+t.dataset.sl;if(S.short.has(id))S.short.delete(id);else if(S.short.size<SHORT_MAX)S.short.add(id);
    renderSlTop();renderList();renderFooter();const f=$("sl-"+id);if(f)f.focus({preventScroll:true});return;}
  if(t.dataset.only!=null){UI.only=t.dataset.only==="1";$("only-0").setAttribute("aria-pressed",String(!UI.only));$("only-1").setAttribute("aria-pressed",String(UI.only));renderList();return;}
  if(t.dataset.jump){const f=$(t.dataset.jump);if(f){f.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});f.focus({preventScroll:true});}return;}
  if(t.id==="submit"){openConfirm();return;}
  if(t.id==="cfCancel"){closeConfirm();return;}
  if(t.id==="cfGo"){closeConfirm(false);MODE="submitted";STATE="submitted";
    SENT=`Wed Nov 18, ${new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})}`;
    RESUB=false;renderAll();window.scrollTo({top:0});$("doneH").focus({preventScroll:true});toast("Preferences sent to Hack Western");return;}
  if(t.hasAttribute("data-edit")){MODE="edit";RESUB=true;STATE=NOTE?"note":"draft";renderAll();$("h-reps").scrollIntoView({block:"start"});return;}
  if(t.id==="replyBtn"){REPLYING=true;renderBanners();$("replyTx").focus();return;}
  if(t.id==="replyCancel"){REPLYING=false;renderBanners();$("replyBtn").focus();return;}
  if(t.id==="replySend"){const v=$("replyTx").value.trim();if(!v){$("replyTx").focus();return;}REPLY=v;REPLYING=false;renderBanners();$("replyBtn").focus();toast("Reply sent to organizers");return;}
  if(t.id==="contactBtn"){toast("Opens an email to Hack Western organizers (mock)");return;}
  if(t.dataset.link!=null){toast("Opens the résumé in a new tab (mock)");return;}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="f-one"){clearNotes();S.one=t.checked;refresh();return;}
  if(t.id==="f-group"){clearNotes();S.group=t.checked;refresh();return;}
  if(t.dataset.bs!=null){clearNotes();const b=S.blocks[+t.dataset.bs];b.s=+t.value;if(b.e<=b.s)b.e=Math.min(WIN[1],b.s+MIN_BLOCK);UI.merge=normalize();refresh();return;}
  if(t.dataset.be!=null){clearNotes();const b=S.blocks[+t.dataset.be];b.e=+t.value;if(b.e<=b.s)b.s=Math.max(WIN[0],b.e-MIN_BLOCK);UI.merge=normalize();refresh();return;}
  if(t.dataset.brep){clearNotes();const [i,r]=t.dataset.brep.split("|").map(Number),b=S.blocks[i];
    let cur=b.reps?[...b.reps]:Array.from({length:S.reps},(_,k)=>k);
    cur=t.checked?[...new Set([...cur,r])].sort((a,c)=>a-c):cur.filter(x=>x!==r);
    b.reps=cur.length===S.reps?null:cur;UI.open.add(i);refresh();return;}
  if(t.id==="bk-t"){UI.bkT=t.value;return;}
  if(t.id==="bk-v"){UI.bkV=t.value;return;}
  if(t.id==="ln-s"){UI.lnS=+t.value;if(UI.lnE<=UI.lnS)UI.lnE=UI.lnS+S.len;renderPreview();$("ln-s").focus();return;}
  if(t.id==="ln-e"){UI.lnE=+t.value;return;}
  if(t.id==="fSchool"){UI.school=t.value;renderList();return;}
  if(t.id==="fSkill"){UI.skill=t.value;renderList();return;}
  if(t.id==="fRole"){UI.role=t.value;renderList();return;}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.name!=null){S.names[+t.dataset.name]=t.value;refresh({keepReps:true});return;}
  if(t.id==="notes"){S.notes=t.value;return;}
  if(t.id==="q"){UI.q=t.value;renderList();return;}
});
document.addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.rpd!=null){const i=+d.dataset.rpd;d.open?UI.open.add(i):UI.open.delete(i);}},true);
document.addEventListener("keydown",e=>{
  if(!sheetOpen())return;
  if(e.key==="Escape"){e.preventDefault();closeConfirm();return;}
  if(e.key==="Tab"){const f=[...$("sheet").querySelectorAll("button")];const first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
});
$("scrim").addEventListener("click",()=>closeConfirm());

setState("draft");
</script>
</body>
</html>
