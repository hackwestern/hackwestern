<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Badge scan wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Tokens: src/lib/tokens.ts (dashboardColors, dashboardRadius, dashboardShadows) */
:root{
  --t-heavy:#0b2b4a; --t-medium:#1c3550; --t-light:#516476; --t-ph:rgba(81,100,118,0.7); --t-dis:rgba(81,100,118,0.5);
  --t-inverse:#fff; --t-link:#0b6bc4; --t-active:#08559c; --t-warning:#8a4300;
  --bg-page:#f3f7fc; --bg-surface:#fff; --bg-nav:#dbe7f5; --bg-navSel:#b9d3f0; --bg-inset:#edf3fa;
  --bg-hl:#e1effb; --bg-hl-sub:rgba(225,239,251,0.4); --bg-task:#ffefb8;
  --primary:#0b6bc4;
  --b-default:#cdddeb; --b-subtle:#e0eaf3; --b-card:#d6e3ef; --b-control:#b9cbe0; --b-outline:#accae5;
  --b-faint:rgba(81,100,118,0.1); --b-muted:rgba(81,100,118,0.2); --b-medium:rgba(81,100,118,0.5); --b-strong:#516476;
  --live:#16803c; --warn:#a34a00;
  --s-pink:rgba(250,104,235,0.15); --s-blue:rgba(37,130,254,0.15); --s-green:rgba(104,250,109,0.15); --s-orange:rgba(254,145,37,0.15);
  --r-xs:3px; --r-sm:4px; --r-md:6px; --r-lg:8px; --r-xl:10px; --r-2xl:12px; --r-3xl:20px; --r-full:999px;
  --sh-card:0px 1px 2px 0px rgba(11,43,74,0.06),0px 1px 4px 0px rgba(11,43,74,0.05);
  --sh-pri:0px 2px 4px 0px rgba(11,43,74,0.2);
  --sh-sec:0px 2px 8px 0px rgba(0,0,0,0.12);
  --ease:cubic-bezier(0.23,1,0.32,1);
  --ease-drawer:cubic-bezier(0.32,0.72,0,1);
}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg-page);color:var(--t-heavy);font-family:Figtree,system-ui,sans-serif;font-weight:500;font-size:14px;line-height:1.35}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
a{color:var(--t-link);touch-action:manipulation}
input{font:inherit;font-size:16px}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- harness chrome ---------- */
.hx{max-width:1320px;margin:0 auto;padding:72px 20px 12px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between}
.hx-l{min-width:0;flex:1 1 420px}
.hx-page{font-size:12px;font-weight:600;color:var(--t-light);text-transform:uppercase;letter-spacing:.02em}
.hx-name{font-size:18px;font-weight:700;margin-top:2px}
.hx-why{color:var(--t-light);margin-top:2px}
.hx-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.wf{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--t-warning);background:var(--bg-task);border-radius:var(--r-full);padding:4px 8px;white-space:nowrap}
.stagewrap{padding:0 20px 80px}
.frame{container:app/inline-size;position:relative;margin:0 auto;width:100%;max-width:1280px;background:var(--bg-page);border:1px solid var(--b-subtle);border-radius:var(--r-2xl);min-height:720px}
body[data-device=phone] .frame{width:375px;max-width:375px;border-radius:28px;border:1px solid var(--b-default);box-shadow:var(--sh-sec)}

/* ---------- picker (verbatim from prototype/PICKER.md) ---------- */
.proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,0.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,0.08) inset,0 8px 24px rgba(0,0,0,0.24),0 2px 6px rgba(0,0,0,0.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;max-width:calc(100vw - 16px);overflow-x:auto;scrollbar-width:none}
.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,0.12)}
.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(0.23,1,0.32,1),width 250ms cubic-bezier(0.23,1,0.32,1)}
@media (prefers-reduced-motion:reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}}
.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,0.55);font:inherit;cursor:pointer;white-space:nowrap;transition:color 150ms ease-out,transform 160ms cubic-bezier(0.23,1,0.32,1)}
@media (hover:hover) and (pointer:fine){.proto-picker-item:hover{color:rgba(255,255,255,0.85)}}
.proto-picker-item:active{transform:scale(0.97)}
.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,0.4);outline-offset:2px}
.proto-picker-item[data-active]{color:#fff}
.proto-picker[data-position="top"]{bottom:auto;top:24px}

/* ---------- shared UI ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:var(--r-full);border:1px solid var(--b-control);background:var(--bg-surface);color:var(--t-medium);font-size:13px;font-weight:600;white-space:nowrap;text-decoration:none;transition:transform 160ms var(--ease),background-color 150ms ease-out,border-color 150ms ease-out,color 150ms ease-out}
.pill:active{transform:scale(0.97)}
.pill.pri{background:var(--primary);border-color:var(--primary);color:var(--t-inverse);box-shadow:var(--sh-pri)}
.pill.on{background:var(--bg-navSel);border-color:transparent;color:var(--t-active)}
.pill.ghost{border-color:transparent;background:transparent;color:var(--t-link);padding:0 6px}
.pill.sm{height:24px;padding:0 9px;font-size:12px}
.pill[disabled]{opacity:.5;cursor:default}
@media (hover:hover) and (pointer:fine){.pill:hover{border-color:var(--b-medium)}.pill.pri:hover{background:var(--t-active)}.pill.ghost:hover{background:var(--bg-inset)}}
@media (pointer:coarse){.pill{height:32px}.pill.sm{height:28px}}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--bg-nav);border-radius:var(--r-full);padding:2px;gap:2px;max-width:100%}
.seg button{height:26px;padding:0 10px;border-radius:var(--r-full);border:0;background:transparent;font-size:13px;font-weight:600;color:var(--t-light);white-space:nowrap;transition:transform 160ms var(--ease),background-color 150ms ease-out}
.seg button:active{transform:scale(0.97)}
.seg button[aria-pressed=true]{background:var(--bg-surface);color:var(--t-heavy);box-shadow:var(--sh-card)}
.seg .n{margin-left:5px;color:var(--t-light);font-variant-numeric:tabular-nums;font-weight:500}
@media (pointer:coarse){.seg button{height:30px}}
.card{background:var(--bg-surface);border:1px solid var(--b-subtle);border-radius:var(--r-2xl);box-shadow:var(--sh-card)}
.muted{color:var(--t-light)}
.small{font-size:12px}
.lab{font-size:12px;font-weight:600;color:var(--t-light);text-transform:uppercase;letter-spacing:.02em}
.h2{font-size:20px;font-weight:600}
.h3{font-size:16px;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:12px;padding:2px 7px;border-radius:var(--r-full);background:var(--bg-inset);color:var(--t-medium)}
.tag{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:var(--r-full);font-size:12px;font-weight:600;white-space:nowrap}
.tag.acc{background:rgba(22,128,60,.1);color:var(--live)}
.tag.wait{background:var(--bg-hl);color:var(--t-active)}
.tag.dec{background:var(--bg-inset);color:var(--t-light)}
.tag.warn{background:var(--bg-task);color:var(--t-warning)}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:currentColor}
.lnks{display:flex;gap:10px;font-size:13px;font-weight:600}
.logo{height:22px;width:auto;display:block}
.bar{height:6px;border-radius:3px;background:var(--bg-inset);overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:3px}
.stepper{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--b-control);border-radius:var(--r-full);padding:2px}
.stepper button{width:26px;height:24px;border:0;border-radius:var(--r-full);background:transparent;font-size:16px;line-height:1;color:var(--t-medium)}
.stepper button:active{transform:scale(0.95);background:var(--bg-inset)}
.stepper button[disabled]{opacity:.35}
.stepper output{min-width:64px;text-align:center;font-weight:600;font-size:13px}
.empty{padding:20px;border-radius:var(--r-xl);background:var(--bg-inset);color:var(--t-light);text-align:center}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--b-subtle);background:var(--bg-surface);border-radius:var(--r-2xl) var(--r-2xl) 0 0}
body[data-device=phone] .top{border-radius:28px 28px 0 0;padding:16px}
.top h1{font-size:20px;font-weight:700}
.map{background:var(--primary);color:#fff;border-color:var(--primary)}
.pad{padding:20px}
@container app (max-width:700px){.pad{padding:16px}}

/* dialog + toast */
.ovl{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(11,43,74,.28)}
.dlg{width:min(460px,calc(100vw - 32px));max-height:min(640px,calc(100dvh - 120px));overflow:auto;background:var(--bg-surface);border-radius:var(--r-3xl);box-shadow:var(--sh-sec);padding:20px;display:flex;flex-direction:column;gap:14px}
body[data-device=phone] .ovl{align-items:flex-end}
body[data-device=phone] .dlg{width:375px;max-width:100vw;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.dlg.anim{animation:dlgIn 220ms var(--ease)}
body[data-device=phone] .dlg.anim{animation:sheetIn 320ms var(--ease-drawer)}
.ovl.anim{animation:fadeIn 200ms ease-out}
@keyframes dlgIn{from{opacity:0;transform:scale(.96)}}
@keyframes sheetIn{from{transform:translateY(100%)}}
@keyframes fadeIn{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--t-heavy);color:#fff;padding:10px 14px;border-radius:var(--r-xl);font-weight:600;box-shadow:var(--sh-sec);animation:toastIn 240ms var(--ease);max-width:calc(100vw - 32px)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}}
.slotpick{display:flex;flex-wrap:wrap;gap:6px}
.slotpick button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:7px 11px;border-radius:var(--r-lg);border:1px solid var(--b-control);background:var(--bg-surface);text-align:left;transition:transform 160ms var(--ease)}
.slotpick button:active{transform:scale(.97)}
.slotpick button[aria-pressed=true]{border-color:var(--primary);background:var(--bg-hl);color:var(--t-active)}
.slotpick b{font-size:14px}.slotpick span{font-size:12px;color:var(--t-light)}
.hpick{display:flex;flex-direction:column;gap:4px}
.hpick button{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 11px;border:1px solid var(--b-subtle);border-radius:var(--r-lg);background:var(--bg-surface);text-align:left}
.hpick button[aria-pressed=true]{border-color:var(--primary);background:var(--bg-hl)}
@media (prefers-reduced-motion:reduce){*{animation-duration:1ms!important;transition-duration:1ms!important}}


/* ---------- scan shared ---------- */
:root{--g8:#191919;--g9:#111111;--g7:#262626}
.vf{position:relative;overflow:hidden;background:radial-gradient(120% 80% at 30% 20%,#323232 0,var(--g9) 60%);color:#fff;border-radius:var(--r-3xl);display:flex;align-items:center;justify-content:center;min-height:300px}
.vf::before{content:"";position:absolute;inset:0;background:radial-gradient(40% 30% at 70% 70%,rgba(255,255,255,.07),transparent),radial-gradient(30% 20% at 20% 80%,rgba(255,255,255,.05),transparent)}
.vf-box{position:relative;width:min(220px,60%);aspect-ratio:1}
.vf-box i{position:absolute;width:28px;height:28px;border:3px solid #fff;border-radius:4px}
.vf-box i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}.vf-box i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}
.vf-box i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0}.vf-box i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0}
.vf-line{position:absolute;left:8%;right:8%;top:10%;height:2px;background:rgba(255,255,255,.7);animation:scanl 1.8s ease-in-out infinite alternate}
@keyframes scanl{to{transform:translateY(160px)}}
@media (prefers-reduced-motion:reduce){.vf-line{animation:none;top:50%}}
.vf-cap{position:absolute;left:0;right:0;bottom:16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:0 16px}
.vf-cap .pill{background:rgba(255,255,255,.14);border-color:transparent;color:#fff;backdrop-filter:blur(8px)}
.vf-top{position:absolute;left:0;right:0;top:12px;display:flex;justify-content:space-between;padding:0 12px;gap:8px}
.vf-top .pill{background:rgba(255,255,255,.14);border-color:transparent;color:#fff}
.vf.off{background:var(--g8)}
.vf.off .vf-box i{border-color:rgba(255,255,255,.25)}
.hcard{display:flex;flex-direction:column;gap:10px}
.hname{font-size:26px;font-weight:700;letter-spacing:-.01em}
.times{display:flex;flex-wrap:wrap;gap:6px}
.times button{display:flex;flex-direction:column;gap:1px;align-items:flex-start;padding:7px 11px;border-radius:var(--r-lg);border:1px solid var(--b-control);background:var(--bg-surface);text-align:left;transition:transform 160ms var(--ease)}
.times button:active{transform:scale(.97)}
.times button[aria-pressed=true]{border-color:var(--primary);background:var(--bg-hl);color:var(--t-active)}
.times b{font-size:14px}.times span{font-size:12px;color:var(--t-light)}
.okmark{width:44px;height:44px;border-radius:50%;background:var(--live);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:700}
.okmark.in{animation:pop 260ms var(--ease)}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.errmark{width:44px;height:44px;border-radius:50%;background:var(--bg-task);color:var(--t-warning);display:grid;place-items:center;font-size:22px;font-weight:700}
.field{display:flex;flex-direction:column;gap:6px}
.field input{height:40px;border:1px solid var(--b-control);border-radius:var(--r-lg);padding:0 12px;background:var(--bg-surface);width:100%;min-width:0}
.fade{animation:fadeUp 220ms var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}}

/* V1 full screen */
.s1{min-height:720px;display:flex;flex-direction:column}
.s1 .vf{flex:1;border-radius:0 0 var(--r-2xl) var(--r-2xl);min-height:620px}
body[data-device=phone] .s1 .vf{border-radius:0 0 28px 28px}
.s1-page{flex:1;display:flex;flex-direction:column;gap:16px;padding:28px 24px;max-width:560px;width:100%;margin:0 auto}
.s1-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.s1-foot .pill{height:40px;justify-content:center;font-size:14px}
/* V2 sheet */
.s2{position:relative;min-height:720px;overflow:hidden;border-radius:inherit}
.s2 .vf{position:absolute;inset:0;border-radius:inherit}
.s2-sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg-surface);border-radius:20px 20px 0 0;padding:10px 20px 20px;box-shadow:0 -8px 24px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:12px;max-height:78%;overflow:auto;animation:sheetIn 340ms var(--ease-drawer)}
.s2-grab{width:36px;height:5px;border-radius:3px;background:var(--b-muted);margin:0 auto 4px}
@container app (min-width:760px){.s2-sheet{left:auto;top:56px;right:16px;bottom:16px;width:380px;border-radius:var(--r-3xl);max-height:none;animation:sideIn 300ms var(--ease)}.s2-grab{display:none}}
@keyframes sideIn{from{transform:translateX(24px);opacity:0}}
.s2-mini{position:absolute;left:12px;right:12px;bottom:12px;background:var(--bg-surface);border-radius:var(--r-2xl);padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:var(--sh-sec);animation:sheetIn 300ms var(--ease-drawer)}
@container app (min-width:760px){.s2-mini{left:auto;width:380px;right:16px}}
/* V3 type */
.s3{max-width:560px;margin:0 auto;padding:32px 20px;display:flex;flex-direction:column;gap:16px}
.s3-words{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.s3-words input{height:52px;border:1px solid var(--b-control);border-radius:var(--r-xl);text-align:center;font-size:18px;font-weight:600;width:100%;min-width:0;background:var(--bg-surface)}
.s3-sug{display:flex;gap:6px;flex-wrap:wrap}
/* V4 in page */
.s4{max-width:720px;margin:0 auto;padding:24px 20px;display:flex;flex-direction:column;gap:16px}
.s4 .vf{min-height:280px}
/* V5 split */
.s5{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);min-height:680px}
.s5 .vf{border-radius:0 0 0 var(--r-2xl);min-height:100%}
.s5-r{padding:24px;display:flex;flex-direction:column;gap:14px;border-left:1px solid var(--b-subtle);background:var(--bg-surface);border-radius:0 0 var(--r-2xl) 0}
.s5-hist{margin-top:auto;border-top:1px solid var(--b-subtle);padding-top:12px;display:flex;flex-direction:column;gap:6px}
@container app (max-width:760px){.s5{grid-template-columns:1fr;min-height:0}.s5 .vf{min-height:220px;border-radius:0}.s5-r{border-left:0;padding:16px;border-radius:0 0 28px 28px}}
/* V6 batch */
.s6{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;padding:20px}
.s6 .vf{min-height:340px}
.s6-row{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-top:1px solid var(--b-subtle)}
.s6-row.new{background:var(--bg-hl-sub);animation:fadeUp 240ms var(--ease)}
@container app (max-width:760px){.s6{grid-template-columns:1fr;padding:16px}.s6 .vf{min-height:220px}}
/* V7 slot first */
.s7{max-width:760px;margin:0 auto;padding:24px 20px;display:flex;flex-direction:column;gap:16px}
.s7-slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.s7-slot{padding:12px;border-radius:var(--r-xl);border:1px solid var(--b-subtle);background:var(--bg-surface);text-align:left;display:flex;flex-direction:column;gap:2px;transition:transform 160ms var(--ease)}
.s7-slot:active{transform:scale(.98)}
.s7-slot[aria-pressed=true]{border-color:var(--primary);background:var(--bg-hl)}
.s7-slot[disabled]{opacity:.5}
.s7-slot b{font-size:18px}
.s7 .vf{min-height:260px}
/* V8 steps */
.s8{max-width:520px;margin:0 auto;padding:24px 20px;display:flex;flex-direction:column;gap:16px}
.s8-prog{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.s8-prog div{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--t-light)}
.s8-prog div::before{content:"";height:4px;border-radius:2px;background:var(--bg-nav)}
.s8-prog div.on{color:var(--t-heavy)}.s8-prog div.on::before{background:var(--primary)}
.s8 .vf{min-height:320px}
.s8-nav{display:flex;justify-content:space-between;gap:8px}
/* V9 conversation */
.s9{max-width:620px;margin:0 auto;padding:24px 20px;display:flex;flex-direction:column;gap:12px}
.bub{max-width:88%;padding:10px 14px;border-radius:18px;line-height:1.4}
.bub.them{background:var(--bg-surface);border:1px solid var(--b-subtle);align-self:flex-start;border-bottom-left-radius:6px}
.bub.me{background:var(--primary);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.bub.new{animation:fadeUp 220ms var(--ease)}
.s9 .vf{min-height:200px;border-radius:var(--r-xl)}
.s9-quick{display:flex;gap:6px;flex-wrap:wrap;align-self:flex-end;justify-content:flex-end}
/* V10 HUD */
.s10{position:relative;min-height:720px;overflow:hidden;border-radius:inherit}
.s10 .vf{position:absolute;inset:0;border-radius:inherit}
.s10-ban{position:absolute;left:12px;right:12px;top:12px;max-width:520px;margin:0 auto;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-radius:var(--r-2xl);padding:12px 14px;box-shadow:var(--sh-sec);display:flex;flex-direction:column;gap:10px;animation:banIn 260ms var(--ease)}
@keyframes banIn{from{transform:translateY(-16px);opacity:0}}
.s10-ban.ok{background:#eaf5ee}
.s10-dock{position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 12px}
.s10 .vf-cap{bottom:64px}
.s10-dock .pill{background:rgba(255,255,255,.14);color:#fff;border-color:transparent;backdrop-filter:blur(8px)}
</style>
</head>
<body data-device="desktop">

<nav class="proto-picker" data-position="top" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
</nav>

<header class="hx">
  <div class="hx-l">
    <div class="hx-page">Sponsor · Scan a badge</div>
    <div class="hx-name" id="vName"></div>
    <div class="hx-why" id="vWhy"></div>
  </div>
  <div class="hx-r">
    <div class="seg" role="group" aria-label="Frame size">
      <button data-dev="desktop" aria-pressed="true">Desktop</button>
      <button data-dev="phone" aria-pressed="false">Phone</button>
    </div>
    <span class="wf">WIREFRAME · dummy data</span><span class="wf" style="opacity:.75">v2 · new map logistics</span>
  </div>
  <div style="flex-basis:100%;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="small muted">State</span><div class="seg" id="states" role="group" aria-label="Demo state"></div></div>
</header>

<div class="stagewrap"><div class="frame" id="stage"></div></div>
<div id="toast"></div>

<script>
/* ================= data (fictional) ================= */
const LOGO='../../public/shared/sponsors/startech.svg';
const MAYA={name:'Maya R.',first:'Maya',school:'Western',prog:'Computer Engineering, 3rd year',skills:['C++','Embedded','PCB design'],cv:true,gh:true,note:'Built a USB-C hub from scratch for a class project.'};
const QUEUE=[MAYA,
 {name:'Tobi A.',first:'Tobi',school:'Waterloo',prog:'Electrical Engineering, 2nd year',skills:['Python','FPGA'],cv:true,gh:false},
 {name:'Priya S.',first:'Priya',school:'UofT',prog:'Computer Science, 4th year',skills:['React','TypeScript','Node'],cv:false,gh:true},
 {name:'Ewan M.',first:'Ewan',school:'McMaster',prog:'Mechatronics, 3rd year',skills:['SolidWorks','Arduino'],cv:false,gh:false}];
const TIMES=[{id:'t1',t:'10:15',room:'Rm 2243',left:1},{id:'t2',t:'10:45',room:'Rm 2243',left:2},{id:'t3',t:'11:00',room:'Rm 2241',left:3},{id:'t4',t:'11:15',room:'Rm 2241',left:2},{id:'t5',t:'11:30',room:'Rm 2241',left:1}];
const TB=Object.fromEntries(TIMES.map(t=>[t.id,t]));
const STATES=[['cam','Camera'],['card','Hacker card'],['time','Pick a time'],['sent','Sent'],['nocam','No camera'],['unknown','Unknown badge'],['noslot','No free slot']];
const S={s:'cam',t:'t1',code:'',rep:'',v:{},anim:true};
const ap=t=>+t.split(':')[0]>=9&&+t.split(':')[0]<12?' AM':' PM';
const tlabel=id=>`${TB[id].t}${ap(TB[id].t)}`;

/* ================= shared pieces ================= */
function vf(opts={}){const off=opts.off;return `<div class="vf ${off?'off':''}" style="${opts.style||''}" aria-label="Camera view">
  ${opts.top?`<div class="vf-top">${opts.top}</div>`:''}
  <div class="vf-box"><i></i><i></i><i></i><i></i>${off?'':'<span class="vf-line"></span>'}</div>
  <div class="vf-cap">${off?`<span class="small" style="color:rgba(255,255,255,.7)">Camera is off</span>`:`<span class="small" style="color:rgba(255,255,255,.8)">${opts.cap||'Hold the QR code on their badge inside the frame'}</span><button class="pill sm" data-a="scan">Simulate a scan</button>`}${opts.capx||''}</div></div>`;}
const links=h=>(h.cv||h.gh)?`<div class="lnks">${h.cv?'<a href="#" data-a="noop">Resume</a>':''}${h.gh?'<a href="#" data-a="noop">GitHub</a>':''}</div>`:'<span class="small muted">No resume or GitHub shared</span>';
const chips=h=>`<div class="chips">${h.skills.map(s=>`<span class="chip">${s}</span>`).join('')}</div>`;
function hcard(h=MAYA,big=true){return `<div class="hcard"><div><div class="${big?'hname':'h3'}">${h.first}</div><div class="muted">${h.school} · ${h.prog}</div></div>${chips(h)}${links(h)}</div>`;}
function times(compact){const noslot=S.s==='noslot';if(noslot)return noSlot();
  return `<div class="times" role="group" aria-label="Start time">${TIMES.map(t=>`<button data-a="t" data-val="${t.id}" aria-pressed="${S.t===t.id}"><b>${t.t}${ap(t.t)}</b>${compact?'':`<span>${t.room} · ${t.left} seat${t.left>1?'s':''} left</span>`}</button>`).join('')}</div><p class="small muted">15-minute chat. Earliest open time is picked for you.</p>`;}
const noSlot=()=>`<div class="empty" style="text-align:left"><b style="color:var(--t-heavy)">No open times</b><br><span class="small">Every remaining time is full, or Maya is already booked then. You can still save her and offer later.</span><div class="row" style="margin-top:10px"><button class="pill sm" data-a="noop">See your rooms</button><button class="pill sm" data-a="next">Scan someone else</button></div></div>`;
const repField=()=>`<label class="field"><span class="small muted">Your name (optional) · so Maya knows who to look for</span><input id="rep" value="${S.rep}" placeholder="e.g. Jordan"></label>`;
const sendBtn=(cls='')=>S.s==='noslot'?'':`<button class="pill pri ${cls}" data-a="send">Offer ${tlabel(S.t)} chat</button>`;
const sentMsg=()=>`Offer sent to Maya for ${tlabel(S.t)}, ${TB[S.t].room}. She'll accept or decline on her live site.`;
const sentBlock=()=>`<div style="display:flex;flex-direction:column;gap:10px;align-items:flex-start"><div class="okmark in">✓</div><div class="h2">Offer sent</div><p class="muted">${sentMsg()}</p><p class="small muted">You'll see her reply under Your coffee chats.</p><div class="row"><button class="pill pri" data-a="next">Scan next badge</button><button class="pill" data-a="noop">Your coffee chats</button></div></div>`;
const manual=(ac='Look up')=>`<label class="field"><span style="font-weight:600">Type their hacker code</span><span class="small muted">The three words on their badge or wallet pass, like brave-otter-kite.</span><div class="row" style="flex-wrap:nowrap"><input id="code" value="${S.code}" placeholder="brave-otter-kite" autocapitalize="off" autocomplete="off" spellcheck="false"><button class="pill pri" data-a="lookup">${ac}</button></div></label>`;
const nocam=()=>`<div style="display:flex;flex-direction:column;gap:10px"><div class="errmark">!</div><div class="h3">Camera blocked</div><p class="muted">Allow camera access for this site in your browser settings and try again, or type their hacker code below.</p><div class="row"><button class="pill" data-a="retry">Try again</button></div>${manual()}</div>`;
const unknown=()=>`<div style="display:flex;flex-direction:column;gap:10px;align-items:flex-start"><div class="errmark">?</div><div class="h3">Not a hacker badge</div><p class="muted">That code isn't a Hack Western hacker's badge. Try scanning again, or type their code.</p><div class="row"><button class="pill pri" data-a="retry">Scan again</button><button class="pill" data-a="go" data-val="nocam">Type a code</button></div></div>`;
const topbar=(extra='')=>`<div class="top"><button class="pill sm ghost" data-a="noop">‹ Back</button><img class="logo" src="${LOGO}" alt="StarTech"><h1>Scan a badge</h1><span class="sp"></span>${extra}<button class="pill sm map" data-a="noop">Map</button></div>`;
function toast(t){const el=document.getElementById('toast');el.innerHTML=`<div class="toast" role="status">${t}</div>`;clearTimeout(toast.k);toast.k=setTimeout(()=>{el.innerHTML='';},2600);}
const isCard=()=>['card','time','noslot'].includes(S.s);

/* ================= variants ================= */
const V=[];

V.push({name:'Full screen',title:'Full-screen camera',why:'Phone-first: the camera owns the whole screen, then each next step takes the whole screen too. Big targets, no distractions.',html(){
  const s=S.s;let inner='';
  if(s==='cam')inner=vf({top:`<button class="pill sm" data-a="noop">✕ Close</button><button class="pill sm" data-a="go" data-val="nocam">Type a code</button>`,style:'min-height:640px'});
  else if(s==='nocam'||s==='unknown')inner=`<div class="s1-page fade">${s==='nocam'?nocam():unknown()}</div>`;
  else if(s==='sent')inner=`<div class="s1-page fade" style="justify-content:center">${sentBlock()}</div>`;
  else inner=`<div class="s1-page fade"><span class="lab">Scanned just now</span>${hcard()}<div class="lab" style="margin-top:8px">${s==='card'?'':'Start time'}</div>${s==='card'?`<p class="muted">${MAYA.note}</p>`:times()}${s==='time'?repField():''}
    <div class="s1-foot">${s==='card'?`<button class="pill pri" data-a="go" data-val="time">Offer a chat</button>`:sendBtn()}<button class="pill" data-a="next">Scan someone else</button></div></div>`;
  return `<div class="s1">${s==='cam'?'':topbar()}${inner}</div>`;}});

V.push({name:'Sheet',title:'Sheet over the camera',why:'The camera never closes: the hacker slides up in a sheet (side panel on desktop), so the next scan is one swipe away.',html(){
  const s=S.s;let sheet='';
  if(isCard())sheet=`<div class="s2-sheet"><span class="s2-grab"></span><div class="row"><span class="lab">Scanned</span><span class="sp"></span><button class="pill sm ghost" data-a="next" aria-label="Close">✕</button></div>${hcard(MAYA,false)}${s==='card'?`<p class="small muted">${MAYA.note}</p><div class="row"><button class="pill pri" data-a="go" data-val="time">Offer a chat</button></div>`:`<div class="lab">Start time</div>${times()}<div class="row">${sendBtn()}</div>`}</div>`;
  if(s==='sent')sheet=`<div class="s2-mini" role="status"><div class="okmark in" style="width:32px;height:32px;font-size:16px">✓</div><div style="min-width:0;flex:1"><b>Offer sent to Maya</b><div class="small muted">${tlabel(S.t)} · ${TB[S.t].room}</div></div><button class="pill sm" data-a="noop">Undo</button></div>`;
  if(s==='unknown')sheet=`<div class="s2-sheet"><span class="s2-grab"></span>${unknown()}</div>`;
  if(s==='nocam')sheet=`<div class="s2-sheet"><span class="s2-grab"></span>${nocam()}</div>`;
  return `<div class="s2">${vf({off:s==='nocam',top:`<button class="pill sm" data-a="noop">‹ Back</button><button class="pill sm" data-a="go" data-val="nocam">Type a code</button>`,cap:s==='sent'?'Ready for the next badge':undefined})}${sheet}</div>`;}});

V.push({name:'Type it',title:'Code entry first',why:'Cameras fail in a dim hall: the three-word code is the main path and the camera is the shortcut.',html(){
  const s=S.s;let res='';
  if(isCard())res=`<section class="card pad fade" style="display:flex;flex-direction:column;gap:12px">${hcard()}<div class="lab">Start time</div>${times(true)}<div class="row">${sendBtn()}</div></section>`;
  if(s==='sent')res=`<section class="card pad fade">${sentBlock()}</section>`;
  if(s==='unknown')res=`<section class="card pad fade" style="display:flex;flex-direction:column;gap:8px"><b>No hacker with that code</b><span class="small muted">Check the spelling on their badge. Codes are three words with dashes.</span><div class="s3-sug"><span class="small muted">Did you mean</span><button class="pill sm" data-a="lookup2">brave-otter-kite</button></div></section>`;
  return `${topbar()}<div class="s3"><div class="h2">Type their hacker code</div><p class="muted">Three words on their badge or wallet pass.</p>
  <div class="s3-words"><input aria-label="First word" value="brave" ><input aria-label="Second word" value="otter"><input aria-label="Third word" value="${s==='unknown'?'kit':'kite'}"></div>
  <div class="row"><button class="pill pri" data-a="go" data-val="card">Look up</button><span class="sp"></span>${s==='nocam'?`<span class="small muted">Camera blocked. Allow it in browser settings.</span>`:`<button class="pill" data-a="v" data-k="cam" data-val="${S.v.cam?'':'1'}">${S.v.cam?'Hide camera':'Use camera instead'}</button>`}</div>
  ${S.v.cam&&s!=='nocam'?vf({style:'min-height:240px'}):''}${res}</div>`;}});

V.push({name:'In page',title:'One scrolling page',why:'Closest to today\'s page: camera, hacker and times stack in one column, so nothing hides and it reads top to bottom.',html(){
  const s=S.s;
  return `${topbar()}<div class="s4"><div><div class="lab">Coffee chats</div><div class="h2" style="margin-top:2px">Scan a hacker's badge</div><p class="muted" style="margin-top:4px">Point your camera at the QR code on a hacker's badge or live site. They'll get your offer and accept or decline.</p></div>
  ${s==='nocam'?`<section class="card pad">${nocam()}</section>`:vf({cap:s==='cam'?undefined:'Scan another badge any time'})}
  ${s!=='nocam'?`<details class="card pad"><summary style="cursor:pointer;font-weight:600">Type a code instead</summary><div style="margin-top:10px">${manual()}</div></details>`:''}
  ${s==='unknown'?`<section class="card pad fade">${unknown()}</section>`:''}
  ${isCard()?`<section class="card pad fade" style="display:flex;flex-direction:column;gap:12px"><span class="lab">Offer a coffee chat</span><div class="h2">Chat with Maya?</div>${hcard(MAYA,false)}<div class="lab">Start time</div>${times()}${repField()}<div class="row">${sendBtn()}</div></section>`:''}
  ${s==='sent'?`<section class="card pad fade">${sentBlock()}</section>`:''}</div>`;}});

V.push({name:'Side by side',title:'Camera and result side by side',why:'On a laptop at the booth: the camera stays live on the left, the right panel answers "who is this and when?", with today\'s scans below.',html(){
  const s=S.s;let r='';
  if(s==='cam')r=`<div class="empty" style="text-align:left"><b style="color:var(--t-heavy)">Waiting for a badge</b><br><span class="small">The hacker shows up here as soon as you scan.</span></div>${manual()}`;
  if(isCard())r=`<div class="fade" style="display:flex;flex-direction:column;gap:12px">${hcard()}<p class="small muted">${MAYA.note}</p><div class="lab">Start time</div>${times()}<div class="row">${sendBtn()}<button class="pill" data-a="next">Skip</button></div></div>`;
  if(s==='sent')r=`<div class="fade">${sentBlock()}</div>`;
  if(s==='unknown')r=`<div class="fade">${unknown()}</div>`;
  if(s==='nocam')r=nocam();
  return `${topbar()}<div class="s5">${vf({off:s==='nocam'})}<aside class="s5-r">${r}<div class="s5-hist"><div class="lab">Scanned today</div><div class="row small"><b>Tobi A.</b><span class="muted">Waterloo</span><span class="sp"></span><span class="tag wait">Waiting · 10:45</span></div><div class="row small"><b>Priya S.</b><span class="muted">UofT</span><span class="sp"></span><span class="tag acc">Booked · 11:00</span></div></div></aside></div>`;}});

V.push({name:'Batch',title:'Scan now, offer later',why:'During a booth rush you can\'t stop to pick times: scan everyone into a list, then offer chats when it\'s quiet.',html(){
  const s=S.s;const n=s==='cam'?2:3;const list=QUEUE.slice(0,n);
  const row=(h,i)=>{const first=i===0&&isCard()||i===0&&s==='sent';let act='';
    if(i===0&&s==='sent')act=`<span class="tag wait"><span class="dot"></span>Offer sent · ${tlabel(S.t)}</span>`;
    else if(first&&s!=='card')act=times(true)+`<div class="row">${sendBtn('sm')}<button class="pill sm" data-a="go" data-val="card">Cancel</button></div>`;
    else if(i===2)act=`<span class="tag wait">Waiting · 11:15</span>`;
    else act=`<div class="row"><button class="pill sm pri" data-a="${i===0?'go':'noop'}" data-val="time">Offer a chat</button><button class="pill sm ghost" data-a="noop">Remove</button></div>`;
    return `<div class="s6-row ${i===0&&s!=='cam'?'new':''}"><div class="row"><b>${h.name}</b><span class="small muted">${h.school} · ${h.prog}</span><span class="sp"></span><span class="small muted">${i===0?'Just now':i===1?'2 min ago':'9 min ago'}</span></div>${chips(h)}${links(h)}${act}</div>`;};
  return `${topbar()}<div class="s6"><div style="display:flex;flex-direction:column;gap:10px">${vf({off:s==='nocam',cap:'Keep scanning. Each badge joins your list.'})}${s==='nocam'?nocam():''}${s==='unknown'?`<div class="card pad small" style="display:flex;gap:8px;align-items:center"><span class="tag warn">Skipped</span>That last code wasn't a hacker badge.</div>`:''}</div>
  <section class="card" style="overflow:hidden"><div class="row pad" style="padding-bottom:12px"><span class="h3">Scanned today</span><span class="small muted">${n}</span><span class="sp"></span><span class="small muted">${TIMES.reduce((a,t)=>a+t.left,0)} open seats</span></div>${list.map(row).join('')}</section></div>`;}});

V.push({name:'Time first',title:'Pick the time, then scan',why:'Fill a specific empty seat: choose 10:15, then whoever you scan gets that time. One less decision per hacker.',html(){
  const s=S.s;const picked=s!=='cam'||S.v.picked;
  return `${topbar()}<div class="s7"><div class="row"><span class="h2">${picked?`Scanning for ${tlabel(S.t)}`:'Which time are you filling?'}</span><span class="sp"></span>${picked?`<button class="pill sm" data-a="v" data-k="picked" data-val="">Change time</button>`:''}</div>
  ${!picked||s==='noslot'?`<div class="s7-slots">${TIMES.map(t=>`<button class="s7-slot" data-a="pick7" data-val="${t.id}" aria-pressed="${S.t===t.id&&picked}" ${s==='noslot'?'disabled':''}><b>${t.t}${ap(t.t)}</b><span class="small muted">${t.room}</span><span class="small">${s==='noslot'?'Full':t.left+' seat'+(t.left>1?'s':'')+' left'}</span></button>`).join('')}</div>`:`<p class="muted">${TB[S.t].room} · ${TB[S.t].left} seat${TB[S.t].left>1?'s':''} left · 15 min</p>`}
  ${s==='noslot'?`<div class="empty" style="text-align:left"><b style="color:var(--t-heavy)">Every time is full</b><br><span class="small">Nothing left to fill today. Ask the spon team if you'd like another room.</span></div>`:''}
  ${picked&&s==='cam'?vf({cap:`Scan a badge to offer ${tlabel(S.t)}`}):''}
  ${s==='nocam'?`<section class="card pad">${nocam()}</section>`:''}
  ${s==='unknown'?`<section class="card pad">${unknown()}</section>`:''}
  ${s==='card'||s==='time'?`<section class="card pad fade" style="display:flex;flex-direction:column;gap:12px">${hcard()}<div class="row">${sendBtn()}<button class="pill" data-a="next">Not this person</button></div></section>`:''}
  ${s==='sent'?`<section class="card pad fade">${sentBlock()}</section>`:''}</div>`;}});

V.push({name:'Steps',title:'Four clear steps',why:'A progress bar names where you are: Scan, Check, Time, Done. Good for reps who do this twice all weekend.',html(){
  const s=S.s;const idx={cam:0,nocam:0,unknown:0,card:1,time:2,noslot:2,sent:3}[s];const names=['Scan','Check','Time','Done'];let b='';
  if(s==='cam')b=vf()+`<button class="pill ghost" data-a="go" data-val="nocam">Can't scan? Type the code</button>`;
  if(s==='nocam')b=`<section class="card pad">${nocam()}</section>`;
  if(s==='unknown')b=`<section class="card pad">${unknown()}</section>`;
  if(s==='card')b=`<section class="card pad fade">${hcard()}<p class="muted" style="margin-top:10px">${MAYA.note}</p></section><div class="s8-nav"><button class="pill" data-a="next">Back</button><button class="pill pri" data-a="go" data-val="time">Next: pick a time</button></div>`;
  if(s==='time'||s==='noslot')b=`<section class="card pad fade" style="display:flex;flex-direction:column;gap:12px"><div class="h3">When should Maya come by?</div>${times()}</section><div class="s8-nav"><button class="pill" data-a="go" data-val="card">Back</button>${sendBtn()}</div>`;
  if(s==='sent')b=`<section class="card pad fade">${sentBlock()}</section>`;
  return `${topbar()}<div class="s8"><div class="s8-prog">${names.map((n,i)=>`<div class="${i<=idx?'on':''}">${i+1}. ${n}</div>`).join('')}</div>${b}</div>`;}});

V.push({name:'Chat',title:'Conversation',why:'Each step is a message and the answers are quick-reply pills, so it reads like texting a helper.',html(){
  const s=S.s;const m=[];
  m.push(`<div class="bub them">Point your camera at the QR code on their badge.</div>`);
  if(s==='nocam'){m.push(`<div class="bub them new">I can't open your camera. Allow it in your browser settings, or type their code.</div><div class="bub them" style="width:88%">${manual('Send')}</div>`);}
  else if(s==='cam')m.push(`<div class="bub them" style="width:88%;padding:6px">${vf()}</div>`);
  else m.push(`<div class="bub me">Scanned a badge</div>`);
  if(s==='unknown')m.push(`<div class="bub them new">Hmm, that isn't a Hack Western hacker badge. Want to try again?</div><div class="s9-quick"><button class="pill sm" data-a="retry">Scan again</button><button class="pill sm" data-a="go" data-val="nocam">Type a code</button></div>`);
  if(['card','time','noslot','sent'].includes(s)){m.push(`<div class="bub them ${s==='card'?'new':''}" style="width:88%">${hcard(MAYA,false)}</div>`);
    if(s==='card')m.push(`<div class="s9-quick"><button class="pill sm pri" data-a="go" data-val="time">Offer a chat</button><button class="pill sm" data-a="next">Scan someone else</button></div>`);
    else m.push(`<div class="bub me">Offer a chat</div>`);}
  if(s==='time')m.push(`<div class="bub them new">When? These have open seats.</div><div class="s9-quick">${TIMES.map(t=>`<button class="pill sm" data-a="sendt" data-val="${t.id}">${t.t}${ap(t.t)} · ${t.room}</button>`).join('')}</div>`);
  if(s==='noslot')m.push(`<div class="bub them new">Every remaining time is full, or Maya is already booked then.</div><div class="s9-quick"><button class="pill sm" data-a="noop">See your rooms</button><button class="pill sm" data-a="next">Scan someone else</button></div>`);
  if(s==='sent')m.push(`<div class="bub me">${tlabel(S.t)}</div><div class="bub them new">Sent. Maya will accept or decline on her live site, and you'll see it under Your coffee chats.</div><div class="s9-quick"><button class="pill sm pri" data-a="next">Scan next badge</button></div>`);
  return `${topbar()}<div class="s9">${m.join('')}</div>`;}});

V.push({name:'One tap',title:'One-tap offer',why:'Speed first: scan, and the banner already offers the next open time. One tap sends; "Other time" is there if needed.',html(){
  const s=S.s;let ban='';
  if(s==='card'||s==='time')ban=`<div class="s10-ban"><div class="row" style="flex-wrap:nowrap"><div style="min-width:0;flex:1"><b style="font-size:16px">${MAYA.first}</b> <span class="small muted">${MAYA.school} · ${MAYA.prog}</span><div style="margin-top:4px">${chips(MAYA)}</div></div></div>${links(MAYA)}${s==='time'?times(true):''}<div class="row"><button class="pill pri" data-a="send">Offer ${tlabel(S.t)} · ${TB[S.t].room}</button>${s==='card'?`<button class="pill" data-a="go" data-val="time">Other time</button>`:''}<span class="sp"></span><button class="pill sm ghost" data-a="next">Dismiss</button></div></div>`;
  if(s==='noslot')ban=`<div class="s10-ban"><div><b>${MAYA.first}</b> <span class="small muted">${MAYA.school}</span></div>${noSlot()}</div>`;
  if(s==='sent')ban=`<div class="s10-ban ok" role="status"><div class="row" style="flex-wrap:nowrap"><div class="okmark in" style="width:28px;height:28px;font-size:14px">✓</div><div style="flex:1;min-width:0"><b>Sent to Maya · ${tlabel(S.t)}</b><div class="small muted">Keep scanning.</div></div><button class="pill sm" data-a="noop">Undo</button></div></div>`;
  if(s==='unknown')ban=`<div class="s10-ban"><div class="row"><span class="tag warn">Not a hacker badge</span><span class="small muted">Try another code.</span></div></div>`;
  if(s==='nocam')ban=`<div class="s10-ban">${nocam()}</div>`;
  return `<div class="s10">${vf({off:s==='nocam'})}${ban}<div class="s10-dock"><button class="pill sm" data-a="noop">‹ Back</button><button class="pill sm" data-a="go" data-val="nocam">Type a code</button><button class="pill sm" data-a="noop">Torch</button></div></div>`;}});

/* ================= events ================= */
const stage=document.getElementById('stage');
let cur=0;
function renderStates(){document.getElementById('states').innerHTML=STATES.map(([k,l])=>`<button data-a="go" data-val="${k}" aria-pressed="${S.s===k}">${l}</button>`).join('');}
function render(){const ae=document.activeElement;const aid=ae&&ae.id;stage.innerHTML=V[cur].html();renderStates();
  const c=document.getElementById('code');if(c)c.oninput=e=>{S.code=e.target.value;};const r=document.getElementById('rep');if(r)r.oninput=e=>{S.rep=e.target.value;};
  if(aid){const n=document.getElementById(aid);if(n)n.focus();}}
document.addEventListener('click',e=>{
  const dv=e.target.closest('[data-dev]');if(dv){document.body.dataset.device=dv.dataset.dev;document.querySelectorAll('[data-dev]').forEach(b=>b.setAttribute('aria-pressed',b===dv));render();return;}
  const el=e.target.closest('[data-a]');if(!el)return;if(el.tagName==='A')e.preventDefault();const a=el.dataset.a,val=el.dataset.val;
  switch(a){
    case 'noop':return;
    case 'go':S.s=val;break;
    case 'scan':S.s='card';break;
    case 'retry':case 'next':S.s='cam';S.v.picked=null;break;
    case 't':S.t=val;break;
    case 'send':S.s='sent';toast(`Offer sent to Maya for ${tlabel(S.t)}`);break;
    case 'sendt':S.t=val;S.s='sent';break;
    case 'pick7':S.t=val;S.v.picked=1;S.s='cam';break;
    case 'lookup':{const c=(S.code||'').trim();S.s=/^[a-z]+-[a-z]+-[a-z]+$/i.test(c)?'card':'unknown';break;}
    case 'lookup2':S.s='card';break;
    case 'v':S.v[el.dataset.k]=val||null;break;
  }
  render();});

/* ================= picker wiring (PICKER.md) ================= */
const picker=document.querySelector('.proto-picker');
V.forEach((v,i)=>{const b=document.createElement('button');b.className='proto-picker-item';b.textContent=(i+1)%10+' '+v.name;picker.appendChild(b);});
const highlight=picker.querySelector('.proto-picker-highlight');
const items=[...picker.querySelectorAll('.proto-picker-item')];
function moveHighlight(){const el=items[cur];highlight.style.width=el.offsetWidth+'px';highlight.style.transform=`translateX(${el.offsetLeft}px)`;}
function mount(i){S.v={};document.getElementById('vName').textContent=`${i+1}. ${V[i].title}`;document.getElementById('vWhy').textContent=V[i].why;stage.innerHTML='';requestAnimationFrame(render);}
function setActive(i){if(i<0||i>=V.length)return;cur=i;items.forEach((el,j)=>{el.toggleAttribute('data-active',j===i);if(j===i)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current');});moveHighlight();const url=new URL(location);url.searchParams.set('v',i+1);history.replaceState(null,'',url);mount(i);}
items.forEach((el,i)=>el.addEventListener('click',()=>setActive(i)));
window.addEventListener('resize',moveHighlight);
document.addEventListener('keydown',e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable)return;if(e.metaKey||e.ctrlKey||e.altKey)return;
  const n=parseInt(e.key,10);if(!isNaN(n)){setActive(n===0?9:n-1);}else if(e.key==='ArrowRight')setActive((cur+1)%V.length);else if(e.key==='ArrowLeft')setActive((cur-1+V.length)%V.length);});
const qp=new URLSearchParams(location.search);const req=parseInt(qp.get('v'),10);
if(qp.get('d')==='phone'){document.body.dataset.device='phone';document.querySelectorAll('[data-dev]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.dev==='phone'));}
if(qp.get('s'))S.s=qp.get('s');
setActive(req>=1&&req<=V.length?req-1:0);
requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
</script>
</body>
</html>
