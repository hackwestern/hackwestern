<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Venue map wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Design tokens: src/lib/tokens.ts dashboardColors / radius / shadows */
:root{
  --text-heavy:#0b2b4a; --text-medium:#1c3550; --text-light:#516476;
  --text-placeholder:rgba(81,100,118,.7); --text-inverse:#fff; --link:#0b6bc4; --active:#08559c; --text-warning:#8a4300;
  --bg-page:#f3f7fc; --bg-surface:#fff; --bg-nav:#dbe7f5; --bg-nav-sel:#b9d3f0;
  --bg-inset:#edf3fa; --bg-highlight:#e1effb; --bg-task:#ffefb8;
  --primary:#0b6bc4;
  --border:#cdddeb; --border-subtle:#e0eaf3; --border-control:#b9cbe0; --border-outline:#accae5; --border-strong:#516476;
  --live:#16803c;
  --r-sm:4px; --r-md:6px; --r-lg:8px; --r-xl:10px; --r-2xl:12px; --r-3xl:20px; --r-full:999px;
  --sh-card:0 1px 2px rgba(11,43,74,.06),0 1px 4px rgba(11,43,74,.05);
  --sh-btn:0 2px 4px rgba(11,43,74,.2); --sh-pop:0 2px 8px rgba(0,0,0,.12);
  --ease-out:cubic-bezier(.23,1,.32,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg-nav);font-family:Figtree,system-ui,sans-serif;color:var(--text-medium);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}

/* ---------- Picker: verbatim from prototype/PICKER.md (data-position="top") ---------- */
.proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12)}
.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}
@media (prefers-reduced-motion:reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}}
.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out,transform 160ms cubic-bezier(.23,1,.32,1)}
@media (hover:hover) and (pointer:fine){.proto-picker-item:hover{color:rgba(255,255,255,.85)}}
.proto-picker-item:active{transform:scale(.97)}
.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}
.proto-picker-item[data-active]{color:#fff}
.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,.12)}
.proto-picker-replay{padding:0 10px;font-size:14px}
.proto-picker[data-position="top"]{bottom:auto;top:24px}
.proto-picker-item{white-space:nowrap}
@media (max-width:900px){.proto-picker{max-width:calc(100vw - 16px);overflow-x:auto}.proto-picker-item{padding:0 8px;flex:none}}

/* ---------- Harness chrome ---------- */
.hz{position:relative;z-index:60;max-width:1280px;margin:76px auto 12px;padding:0 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.hz-name{font-weight:700;color:var(--text-heavy);font-size:15px}
.hz-why{font-size:13px;color:var(--text-light);margin-top:2px;max-width:680px}
.hz .row{flex-wrap:wrap}
.wf.v2n{background:var(--bg-inset);color:var(--text-light)}
.wf{font:600 11px Figtree;letter-spacing:.04em;text-transform:uppercase;color:var(--text-warning);background:var(--bg-task);border-radius:var(--r-full);padding:4px 8px}
.frame{position:relative;margin:0 auto 64px;width:calc(100% - 32px);max-width:1280px;min-height:760px;background:var(--bg-page);border-radius:var(--r-2xl);box-shadow:var(--sh-pop);overflow-x:clip}
.frame.phone{width:375px;max-width:calc(100% - 16px);height:780px;min-height:0;overflow:hidden;transform:translateZ(0);border-radius:28px;box-shadow:0 0 0 8px var(--text-heavy),var(--sh-pop)}
.cq{container-type:inline-size;height:100%}
#stage{min-height:760px}
.frame.phone #stage{height:100%;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
#ov{position:fixed;inset:0;container-type:inline-size;pointer-events:none;z-index:50}
#ov>*{pointer-events:auto}

/* ---------- Shared atoms ---------- */
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:var(--r-full);background:var(--bg-nav);flex-wrap:wrap}
.seg button{height:26px;padding:0 10px;border:0;border-radius:var(--r-full);background:transparent;color:var(--text-light);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:transform 160ms var(--ease-out)}
.seg button[aria-pressed="true"]{background:var(--bg-surface);color:var(--text-heavy);box-shadow:var(--sh-card)}
.seg .ct{font-weight:500;color:var(--text-light);margin-left:4px}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border:1px solid var(--border);border-radius:var(--r-full);background:var(--bg-surface);color:var(--text-medium);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;transition:transform 160ms var(--ease-out),background-color 150ms ease}
.pill:active,.seg button:active{transform:scale(.97)}
.pill.primary{background:var(--primary);border-color:var(--primary);color:var(--text-inverse);box-shadow:var(--sh-btn)}
.pill.on{background:var(--bg-highlight);border-color:var(--border-outline);color:var(--active)}
.pill.ghost{border-color:transparent;background:transparent;color:var(--link)}
.pill.map{border-color:var(--primary);color:var(--primary);font-weight:700}
.pill:disabled{opacity:.5;cursor:default}
.pill:focus-visible,.seg button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,.lrow:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
@media (hover:hover) and (pointer:fine){.pill:not(:disabled):not(.primary):hover{background:var(--bg-inset)}}
.card{background:var(--bg-surface);border-radius:var(--r-2xl);box-shadow:var(--sh-card)}
.muted{color:var(--text-light)}
.small{font-size:13px}.tiny{font-size:12px}
.h1{font-size:22px;font-weight:700;color:var(--text-heavy);letter-spacing:-.01em}
.h2{font-size:17px;font-weight:700;color:var(--text-heavy)}
.h3{font-size:15px;font-weight:700;color:var(--text-heavy)}
.lbl{font-size:12px;font-weight:600;color:var(--text-light)}
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:var(--r-full);background:var(--bg-inset);color:var(--text-light);font-size:12px;font-weight:600;white-space:nowrap}
.badge.live{background:var(--bg-highlight);color:var(--live)}
.badge.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--live)}
.badge.blue{background:var(--bg-highlight);color:var(--active)}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.between{justify-content:space-between}
.stack{display:flex;flex-direction:column}
.g4{gap:4px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.fade-in{animation:fadeIn 240ms var(--ease-out) both}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}}
@keyframes fadeOnly{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.fade-in{animation:none}*{transition-duration:0ms!important;animation-duration:0ms!important}}

/* Sponsor shell */
.app{min-height:100%;display:flex;flex-direction:column}
.sh{display:flex;align-items:center;gap:16px;padding:12px 24px;background:var(--bg-surface);border-bottom:1px solid var(--border-subtle);position:sticky;top:0;z-index:6}
.sh-logo{height:18px;width:auto;display:block}
.sh-nav{display:flex;gap:2px}
.sh-nav a{padding:6px 10px;border-radius:var(--r-full);font-size:13px;font-weight:600;color:var(--text-light);text-decoration:none}
.sh-nav a[aria-current]{background:var(--bg-nav);color:var(--active)}
.main{flex:1;width:100%;max-width:1120px;margin:0 auto;padding:24px}
.main.flush{max-width:none;padding:0}
@container (max-width:640px){
  .sh{padding:10px 16px;gap:10px}
  .sh-nav{display:none}
  .main{padding:16px}
  .main.flush{padding:0}
  .h1{font-size:20px}
  .hide-sm{display:none!important}
}
@container (min-width:641px){.show-sm{display:none!important}}

/* ---------- Floor plan view (image + pins, cropped to the plan, no legend) ---------- */
.mv{position:relative;overflow:hidden;width:100%;background:var(--bg-surface);border-radius:var(--r-xl)}
.mv-in{position:absolute}
.mv-in img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.mv svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.pin{position:absolute;transform:translate(-50%,-100%) scale(var(--ps,1));transform-origin:50% 100%;display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:auto;cursor:pointer;border:0;background:transparent;padding:0;z-index:1}
.pin b{font-size:11px;font-weight:700;color:var(--text-heavy);background:var(--bg-surface);border-radius:var(--r-full);padding:3px 7px;box-shadow:var(--sh-pop);white-space:nowrap}
.pin i{width:12px;height:12px;border-radius:50%;background:var(--primary);border:2px solid var(--bg-surface);box-shadow:var(--sh-btn);margin-bottom:-6px}
.pin.hi{z-index:3}
.pin.hi b{background:var(--primary);color:#fff;font-size:12px;padding:4px 9px}
.pin.hi i{width:16px;height:16px;margin-bottom:-8px;box-shadow:0 0 0 6px rgba(11,107,196,.22)}
.pin.dim{opacity:.55}
.mv.nolabels .pin:not(.hi) b{display:none}
@container (max-width:640px){.mv.autolabels .pin:not(.hi) b{display:none}}

/* ---------- V1 Modal ---------- */
.home-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.scrim{position:absolute;inset:0;background:rgba(11,43,74,.36);animation:fadeOnly 200ms ease-out both}
.dlg{position:absolute;left:50%;top:50%;width:min(880px,calc(100% - 48px));max-height:calc(100% - 48px);overflow-y:auto;transform:translate(-50%,-50%);padding:20px;display:flex;flex-direction:column;gap:14px;animation:dlgIn 220ms var(--ease-out) both}
@keyframes dlgIn{from{opacity:0;transform:translate(-50%,-50%) scale(.97)}}
.kp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.kp button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border-radius:var(--r-xl);border:1px solid var(--border-subtle);background:var(--bg-surface);cursor:pointer}
.kp button[aria-pressed="true"]{border-color:var(--primary);background:var(--bg-highlight)}
@container (max-width:640px){
  .home-grid{grid-template-columns:1fr}
  .dlg{left:0;top:0;width:100%;max-height:100%;height:100%;transform:none;border-radius:0;padding:16px;animation:fadeOnly 200ms ease-out both}
  .kp{grid-template-columns:1fr}
}

/* ---------- V2 Full page pan/zoom ---------- */
.v2{position:relative;height:calc(760px - 47px);overflow:hidden;background:var(--bg-inset);touch-action:none;cursor:grab}
.frame.phone .v2{height:calc(780px - 45px)}
.v2.grabbing{cursor:grabbing}
.v2-layer{position:absolute;left:0;top:0;width:100%;transform-origin:0 0}
.v2-tl{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:4}
.v2-tl>*{pointer-events:auto}
.v2-zoom{position:absolute;right:12px;bottom:16px;display:flex;flex-direction:column;gap:6px;z-index:4}
.v2-zoom .pill{width:36px;height:36px;justify-content:center;padding:0;font-size:16px;box-shadow:var(--sh-pop)}
.v2-card{position:absolute;left:12px;bottom:16px;max-width:320px;padding:12px 14px;z-index:4}
@container (max-width:640px){.v2-card{right:60px}}

/* ---------- V3 Bottom sheet ---------- */
.v3{position:relative;height:calc(760px - 47px);overflow:hidden;background:var(--bg-inset)}
.frame.phone .v3{height:calc(780px - 45px)}
.v3-map{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;justify-content:center;padding:12px}
.v3-map .mv{max-width:900px}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg-surface);border-radius:var(--r-3xl) var(--r-3xl) 0 0;box-shadow:0 -4px 24px rgba(11,43,74,.14);display:flex;flex-direction:column;z-index:5}
.sheet.snap{transition:height 420ms cubic-bezier(.32,.72,0,1)}
@container (min-width:641px){.sheet{left:16px;right:auto;width:400px}}
.grab{flex:none;height:28px;display:grid;place-items:center;cursor:grab;touch-action:none}
.grab::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--border-control)}
.sheet-body{flex:1;overflow-y:auto;padding:0 16px calc(16px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;width:100%;text-align:left;padding:12px 4px;border:0;border-top:1px solid var(--border-subtle);background:transparent;cursor:pointer}
.lrow[aria-current="true"]{background:var(--bg-highlight);border-radius:var(--r-lg)}

/* ---------- V4 List first ---------- */
.v4{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.v4-row{border-top:1px solid var(--border-subtle)}
.v4-row:first-child{border-top:0}
.v4-btn{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;width:100%;padding:14px 16px;border:0;background:transparent;text-align:left;cursor:pointer;align-items:center}
.v4-btn .chev{transition:transform 200ms var(--ease-out);color:var(--text-light)}
.v4-btn[aria-expanded="true"] .chev{transform:rotate(90deg)}
.v4-open{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px;animation:fadeIn 220ms var(--ease-out) both}

/* ---------- V5 Search ---------- */
.v5{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:var(--r-full);background:var(--bg-surface);box-shadow:var(--sh-card);border:1px solid var(--border)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;color:var(--text-heavy)}
.search input::placeholder{color:var(--text-placeholder)}
.search:focus-within{border-color:var(--primary)}
mark{background:var(--bg-task);color:inherit;border-radius:2px}

/* ---------- V6 Directions ---------- */
.v6{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
.v6 select{height:36px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--bg-surface);padding:0 10px;font-size:16px;font-weight:600;color:var(--text-heavy);width:100%}
.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:10px;border-radius:var(--r-xl);border:0;background:transparent;text-align:left;cursor:pointer;width:100%}
.step[aria-current="true"]{background:var(--bg-highlight)}
.step .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--bg-nav);color:var(--active);font-weight:700;font-size:13px}
.step[aria-current="true"] .n{background:var(--primary);color:#fff}
@container (max-width:640px){.v6{grid-template-columns:1fr}.v6-map{order:-1;position:sticky;top:45px;z-index:2}}

/* ---------- V7 Where now ---------- */
.v7{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.now{padding:20px;display:flex;flex-direction:column;gap:12px;border:2px solid var(--primary)}
.tl-row{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--border-subtle);align-items:start}
.tl-row.past{opacity:.5}
.tl-row.cur .tl-t{color:var(--live)}
.tl-t{font-size:12px;font-weight:700;color:var(--text-heavy)}
@container (max-width:640px){.v7{grid-template-columns:1fr}}

/* ---------- V8 Booths ---------- */
.bay{padding:20px;display:flex;flex-direction:column;gap:12px}
.screen{display:flex;flex-direction:column;align-items:center;gap:4px}
.screen span:not(.lbl){height:4px;width:70%;border-radius:2px;background:var(--text-heavy)}
.booths{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(5,minmax(56px,auto));gap:8px}
.booth{display:grid;place-items:center;padding:8px;border-radius:var(--r-lg);border:1px solid var(--border-subtle);background:var(--bg-surface);cursor:pointer;min-height:56px;transition:transform 160ms var(--ease-out)}
.booth:active{transform:scale(.97)}
.booth img{max-width:100%;max-height:26px;width:auto;height:auto;display:block}
.booth.v{min-height:84px}
.booth.mine{border:2px solid var(--primary);background:var(--bg-highlight);box-shadow:0 0 0 4px rgba(11,107,196,.12)}
.booth[aria-pressed="true"]:not(.mine){border-color:var(--border-strong)}
.booth .txt{font-weight:800;font-size:13px;color:var(--text-heavy);letter-spacing:.02em}
.floorzone{grid-column:2/5;grid-row:2/5;border-radius:var(--r-lg);background:var(--bg-inset);display:grid;place-items:center;color:var(--text-light);font-size:12px;font-weight:600}
@container (max-width:640px){.booths{gap:5px;grid-template-rows:repeat(5,minmax(46px,auto))}.booth{padding:5px;min-height:46px}.booth img{max-height:18px}.bay{padding:14px}}

/* ---------- V9 Split ---------- */
.v9{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;align-items:start}
.v9-list{padding:8px 12px}
.v9-map{position:sticky;top:64px}
@container (max-width:640px){.v9{grid-template-columns:1fr}.v9-map{order:-1;top:45px;z-index:2}}

/* ---------- V10 Schematic ---------- */
.sch{padding:20px;display:flex;flex-direction:column;gap:16px}
.fl{display:grid;grid-template-columns:44px repeat(6,minmax(0,1fr)) 44px;gap:6px;align-items:stretch}
.fl-name{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--text-light)}
.rm{border-radius:var(--r-lg);border:1px solid var(--border-subtle);background:var(--bg-page);padding:10px 8px;min-height:72px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;justify-content:flex-end}
.rm.key{background:var(--bg-highlight);border-color:var(--border-outline)}
.rm[aria-pressed="true"]{border:2px solid var(--primary)}
.rm b{font-size:13px;color:var(--text-heavy)}
.rm span{font-size:11px;color:var(--text-light)}
.st{border-radius:var(--r-lg);background:repeating-linear-gradient(0deg,var(--bg-nav) 0 4px,var(--bg-surface) 4px 8px);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--text-light);writing-mode:vertical-rl;min-height:72px}
.hall{grid-column:2/8;height:18px;border-radius:var(--r-full);background:var(--bg-inset);font-size:10px;font-weight:600;color:var(--text-light);display:grid;place-items:center}
@container (max-width:640px){
  .fl{grid-template-columns:1fr;gap:4px}
  .fl>*{grid-column:auto!important;grid-row:auto!important}
  .st{writing-mode:horizontal-tb;min-height:24px}
  .rm{min-height:0;flex-direction:row;justify-content:space-between;align-items:center}
  .hall{display:none}
}
</style>
</head>
<body>
<nav class="proto-picker" data-position="top" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Modal</button>
  <button class="proto-picker-item">Full page</button>
  <button class="proto-picker-item">Bottom sheet</button>
  <button class="proto-picker-item">List first</button>
  <button class="proto-picker-item">Search</button>
  <button class="proto-picker-item">Directions</button>
  <button class="proto-picker-item">Where now</button>
  <button class="proto-picker-item">Booths</button>
  <button class="proto-picker-item">Split</button>
  <button class="proto-picker-item">Schematic</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<div class="hz">
  <div>
    <div class="row g8"><span class="hz-name" id="hzName"></span><span class="wf">Wireframe · dummy data</span><span class="wf v2n">v2 · new map logistics</span></div>
    <div class="hz-why" id="hzWhy"></div>
  </div>
  <div class="seg" id="devSeg" role="group" aria-label="Frame size">
    <button data-dev="desktop" aria-pressed="true">Desktop</button>
    <button data-dev="phone">Phone</button>
  </div>
</div>

function mapView({floor,pins=[],hi=null,crop=null,cls='',route=null,extra=''}){

  const pinHtml=pins.map(id=>{const p=P(id), r=R(p); if(!r||r.floor!==floor) return '';

  return `<div class="mv ${cls}" style="aspect-ratio:${ar.toFixed(4)}"><div class="mv-in" style="width:${100/c.w*100}%;height:${100/c.h*100}%;left:${-c.x/c.w*100}%;top:${-c.y/c.h*100}%"><img src="${F.img}" alt="${F.label} floor plan">${svg}${pinHtml}${extra}</div></div>`;
}
function cropAround(id,w=26,h=22){const r=R(P(id)), F=FLOORS[r.floor].crop;

// y values are % of the full image height (floor1 2086px, floor2 2453px tall)
const STAIRS=[{name:'Stair C (west end)',x1:[15,50.6],x2:[17.9,41.1],x:16},{name:'the spiral stairs (middle)',x1:[62.5,42.6],x2:[63,36],x:62},{name:'Stair A (east end)',x1:[92.5,45.5],x2:[92.7,38.5],x:92}];
const HALL={floor1:55.4,floor2:52.6}; // rough y of the main hallway
function route(fromId,toId){
  const a=P(fromId),b=P(toId),ra=R(a),rb=R(b);
  const dir=(x1,x2)=>x2>x1?'east':'west';
  const steps=[];
  if(ra.floor===rb.floor){
    steps.push({floor:ra.floor,text:`Leave ${a.name} and walk ${dir(ra.x,rb.x)} along the main hallway.`,pts:[[ra.x,ra.y],[ra.x,HALL[ra.floor]],[rb.x,HALL[ra.floor]]]});
  } else {
    const st=STAIRS.slice().sort((s,t)=>(Math.abs(ra.x-s.x)+Math.abs(rb.x-s.x))-(Math.abs(ra.x-t.x)+Math.abs(rb.x-t.x)))[0];
    const sa=ra.floor==='floor1'?st.x1:st.x2, sb=rb.floor==='floor1'?st.x1:st.x2;
    steps.push({floor:ra.floor,text:`Leave ${a.name} and walk ${Math.abs(ra.x-st.x)<4?'to':dir(ra.x,st.x)+' to'} ${st.name}.`,pts:[[ra.x,ra.y],[ra.x,HALL[ra.floor]],[sa[0],HALL[ra.floor]],sa]});
    steps.push({floor:rb.floor,text:`Take ${st.name.split(' (')[0]} ${rb.floor==='floor2'?'up':'down'} one level to ${FLOORS[rb.floor].label}.`,pts:[sb],stair:true});
    steps.push({floor:rb.floor,text:`Walk ${Math.abs(rb.x-st.x)<4?'a few steps':dir(st.x,rb.x)+' along the hallway'} to ${b.room==='1235'?'the Sponsor Bay':/^\d/.test(b.room)?'Rm '+b.room:b.name}.`,pts:[sb,[sb[0],HALL[rb.floor]],[rb.x,HALL[rb.floor]]]});
  }
  steps.push({floor:rb.floor,text:`You're there: ${b.name}. ${b.note}`,pts:[[rb.x,HALL[rb.floor]],[rb.x,rb.y]],end:true});
  return steps;
}
V.push({name:'Directions',why:'Pick From and To and get numbered steps, each with the plan showing just that leg. Answers "how do I get there", not just "where is it".',
render(){

  const opts=sel=>PLACES.filter(p=>p.id!=='judge').map(p=>`<option value="${p.id}" ${sel===p.id?'selected':''}>${p.name}</option>`).join('');

  // route polyline is drawn in plan coordinates inside .mv-in, so pass raw percents
  return shell(`<div class="v6"><div class="card stack g12" style="padding:16px">
     <label class="stack g4"><span class="lbl">From</span><select data-chg="from">${opts(S.from)}</select></label>

     <div class="stack">${steps.map((s,i)=>`<button class="step" data-act="step" data-v="${i}" aria-current="${i===S.step}"><span class="n">${s.end?'✓':i+1}</span><span class="small" style="color:var(--text-heavy)">${s.text}</span></button>`).join('')}</div>
     <p class="tiny muted">Directions are approximate. Volunteers in the hallways can help.</p></div>
   <div class="v6-map card stack g8" style="padding:12px"><div class="row between"><span class="badge blue">Step ${S.step+1} of ${steps.length} · ${F.label}</span><div class="row g4"><button class="pill" data-act="step" data-v="${S.step-1}" ${S.step?'':'disabled'}>Back</button><button class="pill primary" data-act="step" data-v="${S.step+1}" ${S.step<steps.length-1?'':'disabled'}>Next</button></div></div>
     ${mapView({floor:fl,pins:pinsOn,hi:st.floor===floorOf(S.to)?S.to:S.from,route:st.pts,extra:stairPin,cls:'autolabels'})}</div></div>`,{title:''});
}});

/* 7. Where now --------------------------------------------------------------- */
V.push({name:'Where should I be now',why:'Starts from the clock, not the map: what you should be doing right now, where, and what is next. The map is a supporting picture.',
render(){
  const pr=PRESETS[S.t], items=PLAN.filter(x=>x.d===pr.d);
  const cur=items.find(x=>x.s<=pr.m&&pr.m<x.e), next=items.find(x=>x.s>pr.m);
  const p=cur?P(cur.place):null;
  return shell(`<div class="stack g12"><div class="row between wrap g8"><h1 class="h1">Right now</h1><div class="seg" role="group" aria-label="Preview another time">${PRESETS.map((x,i)=>`<button data-act="t" data-v="${i}" aria-pressed="${S.t===i}">${x.l}</button>`).join('')}</div></div>
   <div class="v7"><div class="stack g12">
    ${cur?`<div class="card now fade-in"><div class="row between wrap g8"><span class="badge live">Now · ${fmt(cur.s)} to ${fmt(cur.e)}</span><span class="tiny muted">${pr.l}</span></div><h2 class="h1">${cur.what}</h2><div class="row g8 wrap"><span class="h2">${p.name}</span><span class="small muted">${p.where}</span></div>${cur.hint?`<p class="small muted">${cur.hint}</p>`:''}
      ${mapView({floor:floorOf(cur.place),pins:[cur.place],hi:cur.place,crop:cropAround(cur.place,34,26)})}</div>`
     :`<div class="card now fade-in"><span class="badge">Nothing scheduled</span><h2 class="h1">You're free</h2><p class="small muted">The sponsor lounge is behind the curtain in Rm 2110 Alumni Commons, Floor 2.</p>${next?`<p class="small">Next at ${fmt(next.s)}: <b>${next.what}</b>, ${P(next.place).name}.</p>`:''}</div>`}
    ${cur&&next?`<div class="card row g12" style="padding:14px 16px"><span class="lbl" style="width:60px">Next · ${fmt(next.s)}</span><div class="grow"><div class="h3">${next.what}</div><div class="tiny muted">${P(next.place).name} · ${P(next.place).where}</div></div></div>`:''}
    <div class="card row g12" style="padding:14px 16px"><span class="lbl" style="width:60px">Any time</span><div class="grow small">Bags overnight in <b>Rm 2244</b> · lounge behind the curtain in <b>Rm 2110</b> · MLH hardware at the <b>help desk</b> · emergency: Noah (phone coming soon)</div></div>
   </div>
   <div class="card" style="padding:4px 16px 8px"><div class="h3" style="padding:12px 0 4px">${pr.d==='Fri'?'Friday':pr.d==='Sat'?'Saturday':'Sunday'} for ${ME}</div>${items.map(x=>`<div class="tl-row ${x.e<=pr.m?'past':x===cur?'cur':''}"><span class="tl-t">${fmt(x.s)}</span><div class="stack"><span class="small" style="font-weight:600;color:var(--text-heavy)">${x.what}</span><span class="tiny muted">${P(x.place).name} · ${P(x.place).where}</span></div></div>`).join('')}</div></div></div>`,{title:''});
}});

/* 8. Booths ------------------------------------------------------------------ */
V.push({name:'Booth layout',why:'For the busiest place of the weekend: the Sponsor Bay booth grid with real logos and your booth ringed, plus where the bay sits in the building.',
render(){
  const sel=BOOTHS.find(b=>b.s===S.booth);
  return shell(`<div class="stack g12" style="max-width:760px;margin:0 auto"><div class="row between wrap g8"><div class="stack g4"><h1 class="h1">Sponsor Bay</h1><span class="small muted">Rm 1235 · Floor 1, west end · next to Stair C</span><span class="tiny muted">Set up Fri 4 PM · open Fri until 11 PM, Sat 10 AM to midnight · closed Sunday</span></div>
   <div class="seg" role="group" aria-label="View"><button data-act="bayView" data-v="booths" aria-pressed="${S.bayView==='booths'}">Booths</button><button data-act="bayView" data-v="where" aria-pressed="${S.bayView==='where'}">Where it is</button></div></div>
   ${S.bayView==='booths'?`<div class="card bay fade-in"><div class="screen"><span class="lbl">Projector screen</span><span></span></div>
     <div class="booths" role="group" aria-label="Booths">${BOOTHS.map(b=>`<button class="booth ${b.v?'v':''} ${b.s===ME?'mine':''}" style="grid-column:${b.c};grid-row:${b.r}" data-act="booth" data-v="${b.s}" aria-pressed="${S.booth===b.s}" aria-label="${b.s}${b.s===ME?', your booth':''}">${b.logo?`<img src="../../public/shared/sponsors/${b.logo}" alt="">`:`<span class="txt">${b.s}</span>`}</button>`).join('')}<div class="floorzone">Open floor</div></div></div>
     <div class="card row g12" style="padding:14px 16px"><div class="grow"><div class="h3">${sel.s===ME?'Your booth':sel.s}</div><div class="tiny muted">${{left:'Left wall',right:'Right wall',top:'Front row, under the screen',bottom:'Back row'}[sel.v?(sel.c===1?'left':'right'):(sel.r===1?'top':'bottom')]}${sel.s===ME?'':` · ${ME} is on the right wall`}</div></div>${sel.s!==ME?`<button class="pill" data-act="booth" data-v="${ME}">Show mine</button>`:''}</div>`
   :`<div class="card stack g8 fade-in" style="padding:12px">${mapView({floor:'floor1',pins:['bay','food','help','hall'],hi:'bay'})}<p class="small muted" style="padding:4px">Come in the west entrance; the bay is on your right. Bags overnight go upstairs to Rm 2244, right at the top of Stair C.</p></div>`}
  </div>`,{title:''});

/* 9. Split ------------------------------------------------------------------- */
V.push({name:'List + map split',why:'List and plan side by side with filter pills; picking a place switches floor and lights its pin. On a phone the map pins to the top.',
render(){
  const f={all:['All',p=>p.id!=='judge'],mine:['For you',p=>p.mine],coffee:['Coffee chats',p=>p.kind==='coffee'],judging:['Judging',p=>p.kind==='judging'],workshop:['Workshops',p=>p.kind==='workshop'],hacker:['Hacker spaces',p=>p.kind==='hacker']};

   <div class="v9"><div class="card v9-list">${list.map(p=>`<button class="lrow" data-act="hi" data-id="${p.id}" aria-current="${hi===p.id}" style="padding:12px 8px"><span class="h3 trunc">${p.name}</span><span class="badge">${FLOORS[R(p).floor].label}</span><span class="tiny muted trunc" style="grid-column:1/-1">${p.where}</span></button>`).join('')}</div>
   <div class="v9-map card stack g8" style="padding:12px"><div class="row between"><span class="h3">${FLOORS[fl].label}</span><span class="tiny muted">Pins are approximate</span></div>${mapView({floor:fl,pins:pins.length>4?pins.filter(id=>!['cc1','cc3'].includes(id)):pins,hi,cls:'autolabels'})}<p class="small">${P(hi).note}</p></div></div></div>`,{title:''});
}});

/* 10. Schematic -------------------------------------------------------------- */
V.push({name:'Schematic',why:'A simple subway-style diagram instead of the architect\u2019s drawing: two floors, west to east, stairs lined up. Real plan is one tap away.',
render(){
  const rm=(id,label,sub,col,span=1)=>{const p=P(id);return `<button class="rm ${p.mine?'key':''}" style="grid-column:${col}/span ${span}" data-act="sch" data-id="${id}" aria-pressed="${S.schSel===id}"><b>${label}</b><span>${sub}</span></button>`};
  const st=(n,col)=>`<span class="st" style="grid-column:${col}" aria-label="${n}">${n}</span>`;
  const sel=P(S.schSel);
  return shell(`<div class="stack g12" style="max-width:900px;margin:0 auto"><div class="row between wrap g8"><h1 class="h1">The building, simplified</h1><button class="pill ${S.schPlan?'on':''}" data-act="schPlan" aria-pressed="${S.schPlan}">${S.schPlan?'✓ ':''}Show real floor plan</button></div>
   <div class="card sch"><div class="row between tiny muted" style="font-weight:600"><span>← West</span><span>East →</span></div>
    <div class="fl"><span class="fl-name">Floor 2</span>${st('Stair C',1)}${rm('belong','2244','Belongings',2)}${rm('cc2','2241-43','Coffee chats',3)}${rm('wsc','2235','Workshop C',4)}${rm('wsb','2230','Workshop B',5)}${st('Spiral',6)}${rm('lounge','2110','Sponsor lounge + quiet hacking',7)}${st('Stair A',8)}<span class="hall">Main hallway</span></div>
    <div class="fl"><span class="fl-name">Floor 1</span>${st('Stair C',1)}${rm('bay','Sponsor Bay','Rm 1235 · booths',2)}${rm('food','1230','Hacker space + food',3,3)}${st('Spiral',6)}${rm('hall','Grand Hall','1110 · judging, food',7)}${st('Stair A',8)}<span class="hall">Main hallway</span></div>
   </div>
   <div class="card row g12 wrap fade-in" style="padding:14px 16px">${placeLine(sel)}<p class="small muted grow">${sel.note}</p></div>
   ${S.schPlan?mapView({floor:floorOf(S.schSel),pins:OVERVIEW[floorOf(S.schSel)],hi:S.schSel==='judge'?'hall':S.schSel,cls:'autolabels'}):''}</div>`,{title:''});
}});

/* ================= Harness wiring (PICKER.md reference) ================= */
const stage=document.getElementById('stage'), ov=document.getElementById('ov'), frame=document.getElementById('frame');
const picker=document.querySelector('.proto-picker');
const highlight=picker.querySelector('.proto-picker-highlight');
const items=[...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay=picker.querySelector('.proto-picker-replay');
let current=0;
const variants=V.map(v=>()=>v.render());
function focusKey(el){if(!el||!el.dataset) return null; if(el.id) return '#'+el.id; if(el.dataset.act) return el.dataset.act+'|'+(el.dataset.id||'')+'|'+(el.dataset.v||''); return null}
function draw(){
  const fk=focusKey(document.activeElement); const caret=document.activeElement&&document.activeElement.id==='q'?document.activeElement.selectionStart:null;
  stage.innerHTML=variants[current]();
  ov.innerHTML=V[current].ov?V[current].ov():'';
  if(fk){const el=fk[0]==='#'?document.querySelector(fk):[...document.querySelectorAll('[data-act]')].find(e=>focusKey(e)===fk); if(el){el.focus({preventScroll:true}); if(caret!=null&&el.setSelectionRange) el.setSelectionRange(caret,caret);}}
  document.getElementById('hzName').textContent=`${current+1}. ${V[current].name}`;
  document.getElementById('hzWhy').textContent=V[current].why;
}
function moveHighlight(){const el=items[current];highlight.style.width=el.offsetWidth+'px';highlight.style.transform=`translateX(${el.offsetLeft}px)`}
function mount(){stage.innerHTML='';ov.innerHTML='';requestAnimationFrame(()=>draw())}
function setActive(i){
  if(i<0||i>=variants.length) return;
  current=i; S.open=true;
  if(i===0){S.floor='floor2';S.hi='lounge'} if(i===1){S.z={s:1,x:0,y:0};S.floor='floor2';S.hi='lounge'} if(i===2){S.hi=null;S.sheet='half'}
  items.forEach((el,j)=>{el.toggleAttribute('data-active',j===i);if(j===i)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current')});
  moveHighlight();
  const url=new URL(location);url.searchParams.set('v',i+1);history.replaceState(null,'',url);
  mount();
}
items.forEach((el,i)=>el.addEventListener('click',()=>setActive(i)));
replay?.addEventListener('click',()=>mount());
window.addEventListener('resize',moveHighlight);
document.addEventListener('keydown',e=>{
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==='Escape'&&current===0&&S.open){S.open=false;draw();return}
  const num=parseInt(e.key,10);
  if(e.key==='0') setActive(9);
  else if(num>=1&&num<=variants.length) setActive(num-1);
  else if(e.key==='ArrowRight') setActive((current+1)%variants.length);
  else if(e.key==='ArrowLeft') setActive((current-1+variants.length)%variants.length);
  else if(e.key==='r'||e.key==='R') mount();
});
document.getElementById('devSeg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#devSeg button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  frame.classList.toggle('phone',b.dataset.dev==='phone'); S.z={s:1,x:0,y:0}; draw();
});

/* Actions */
const A={
  noop(){},
  openMap(){ if(current===0){S.open=true} else setActive(0) },
  openAt(el){S.open=true;S.hi=el.dataset.id;S.floor=floorOf(el.dataset.id)},
  close(){S.open=false},
  floor(el){S.floor=el.dataset.v; if(S.hi&&floorOf(S.hi)!==S.floor) S.hi=null; S.z={s:1,x:0,y:0}},
  hi(el){const id=el.dataset.id||null; S.hi=S.hi===id&&current!==2&&current!==8?null:id; if(id) S.floor=floorOf(id); if(current===2) S.sheet=id?'peek':'half'},
  hiJump(el){S.hi=el.dataset.id;S.floor=floorOf(el.dataset.id)},
  zin(){zoomAt(1.4)}, zout(){zoomAt(1/1.4)}, zreset(){S.z={s:1,x:0,y:0}},
  open4(el){S.open4=S.open4===el.dataset.id?null:el.dataset.id},
  suggest(el){S.q=el.dataset.v},
  clearQ(){S.q=''},
  step(el){S.step=+el.dataset.v},
  t(el){S.t=+el.dataset.v},
  booth(el){S.booth=el.dataset.v},
  bayView(el){S.bayView=el.dataset.v},
  filter(el){S.filter=el.dataset.v},
  sch(el){S.schSel=el.dataset.id},
  schPlan(){S.schPlan=!S.schPlan},
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el||(!stage.contains(el)&&!ov.contains(el))) return;
  if(el.tagName==='A') e.preventDefault();
  if(pan&&pan.moved) return;
  const f=A[el.dataset.act]; if(!f) return; f(el); draw();
});
document.addEventListener('change',e=>{
  const k=e.target.dataset&&e.target.dataset.chg; if(!k) return;
  S[k]=e.target.value; S.step=0; if(S.from===S.to){ S.to=k==='from'?(S.from==='lounge'?'bay':'lounge'):S.to } draw();
});
document.addEventListener('input',e=>{ if(e.target.id==='q'){ S.q=e.target.value; draw(); } });

/* Full page: pan + zoom (transform only, no re-render while moving) */
let pan=null;
function applyZ(){const l=document.getElementById('v2layer'); if(!l) return; l.style.transform=`translate(${S.z.x}px,${S.z.y}px) scale(${S.z.s})`; l.style.setProperty('--ps',(1/S.z.s).toFixed(3))}
function zoomAt(f,cx,cy){
  const box=document.getElementById('v2'); if(!box) return; const r=box.getBoundingClientRect();
  const px=cx!=null?cx-r.left:r.width/2, py=cy!=null?cy-r.top:r.height/2;
  const s=Math.max(1,Math.min(5,S.z.s*f)), k=s/S.z.s;
  S.z.x=px-(px-S.z.x)*k; S.z.y=py-(py-S.z.y)*k; S.z.s=s; if(s===1){S.z.x=0;S.z.y=0}
}
document.addEventListener('wheel',e=>{const box=e.target.closest&&e.target.closest('#v2'); if(!box) return; e.preventDefault(); zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY); applyZ();},{passive:false});
document.addEventListener('pointerdown',e=>{
  const box=e.target.closest('#v2'); if(!box||e.target.closest('.v2-tl,.v2-zoom,.v2-card')) return;
  pan={x:e.clientX,y:e.clientY,ox:S.z.x,oy:S.z.y,moved:false,id:e.pointerId,box};
});
document.addEventListener('pointermove',e=>{
  if(pan&&e.pointerId===pan.id){const dx=e.clientX-pan.x,dy=e.clientY-pan.y; if(!pan.moved&&Math.hypot(dx,dy)<5) return; if(!pan.moved){pan.moved=true;pan.box.setPointerCapture(e.pointerId);pan.box.classList.add('grabbing')} S.z.x=pan.ox+dx; S.z.y=pan.oy+dy; applyZ();}
  if(sh) sheetMove(e);
});
document.addEventListener('pointerup',e=>{
  if(pan&&e.pointerId===pan.id){const p=pan; p.box.classList.remove('grabbing'); setTimeout(()=>{pan=null},0); if(!p.moved) pan=null;}
  if(sh) sheetEnd(e);
});
document.addEventListener('pointercancel',()=>{pan=null; if(sh){sh.el.classList.add('snap');sh.el.style.height=sheetH(S.sheet);sh=null}});

/* Bottom sheet: height follows the finger, snaps with velocity on release */
let sh=null;
document.addEventListener('pointerdown',e=>{
  const g=e.target.closest('[data-grab]'); if(!g) return; e.preventDefault();
  const el=document.getElementById('sheet'), box=el.parentElement;
  sh={el,box,y:e.clientY,h:el.offsetHeight,max:box.offsetHeight,id:e.pointerId,lastY:e.clientY,lastT:performance.now(),v:0};
  g.setPointerCapture(e.pointerId); el.classList.remove('snap');
});
function sheetMove(e){
  if(e.pointerId!==sh.id) return;
  let h=sh.h-(e.clientY-sh.y); const min=100, max=sh.max*.88;
  if(h>max) h=max+(h-max)*.2; if(h<min) h=min-(min-h)*.2; // rubber-band past the ends
  sh.el.style.height=h+'px';
  const t=performance.now(); sh.v=(e.clientY-sh.lastY)/Math.max(1,t-sh.lastT); sh.lastY=e.clientY; sh.lastT=t;
}
function sheetEnd(e){
  if(e.pointerId!==sh.id) return;
  const h=sh.el.offsetHeight+(-sh.v*180), max=sh.max;
  const snaps={peek:132,half:max*.46,full:max*.88};
  S.sheet=Object.entries(snaps).sort((a,b)=>Math.abs(a[1]-h)-Math.abs(b[1]-h))[0][0];
  sh.el.classList.add('snap'); sh.el.style.height=sheetH(S.sheet); sh=null;
}

const requested=parseInt(new URLSearchParams(location.search).get('v'),10);
setActive(requested>=1&&requested<=variants.length?requested-1:0);
requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
</script>
