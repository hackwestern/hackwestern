    <div class="card tile w2"><span class="lbl">Before that</span><span class="h2">Debrief at 8:30 AM</span><span class="small muted">${ROOM.num}, ${ROOM.name}. There will be coffee!</span></div>
    <div class="card tile w4"><span class="badge warn">Opens Sunday 9:00 AM</span><p class="lockmsg">${MSG}</p></div>
    ${[['9:00','Round 1','Score Devposts, shortlist'],['10:00','Presentations','Teams come to your table'],['11:30','Round 2','Rank your top 5']].map(x=>`<div class="card tile"><span class="lbl">${x[0]}</span><span class="h3">${x[1]}</span><span class="tiny muted">${x[2]}</span></div>`).join('')}
    <div class="card tile"><span class="lbl">After</span><span class="h3">Winners</span><span class="tiny muted">At closing</span></div></div>`);
  if(p==='r1'){const nextT=TEAMS.find(t=>!S.scores[t.id]);
    return shell(`<div class="v10">
    <div class="card tile"><span class="lbl">Scored</span><span class="big">${scoredN()}<span class="small muted">/20</span></span><div class="bar"><i style="width:${scoredN()/20*100}%"></i></div></div>
    <div class="card tile"><span class="lbl">Shortlisted</span><span class="big">${S.saved.size}</span><span class="tiny muted">18 presentation slots</span></div>
    <div class="card tile"><span class="lbl">Time left</span><span class="big">36<span class="small muted"> min</span></span><span class="tiny muted">Round 1 ends 10:00</span></div>
    <div class="card tile" style="justify-content:space-between"><span class="lbl">When you're done</span>${S.confirm?`<span class="confirm small">Send ${S.saved.size}? Final.</span><div class="row g4"><button class="pill" data-act="cancel">Cancel</button><button class="pill primary" data-act="send">Send</button></div>`:`<button class="pill primary" data-act="ask" ${S.saved.size?'':'disabled'}>Send shortlist</button>`}</div>
    ${nextT?`<div class="card tile w2 h2"><span class="lbl">Up next to score</span><span class="h2">${nextT.name}</span><span class="small" style="color:var(--text-heavy);font-weight:600">${nextT.tag}</span><p class="small muted" style="line-height:1.5">${nextT.blurb}</p>${dp()}<span class="grow"></span>${scorePills(nextT.id)}<div>${saveBtn(nextT.id)}</div></div>`:`<div class="card tile w2 h2"><span class="lbl">All scored</span><span class="h2">Nice work</span></div>`}
    <div class="card tile w2 h2"><div class="row between"><span class="lbl">All teams</span>${filterSeg()}</div><div class="stack" data-scroll="v10l" style="max-height:330px;overflow-y:auto">${filtered().map(t=>`<div class="row g8" style="padding:8px 0;border-top:1px solid var(--border-subtle)"><span class="grow trunc small" style="font-weight:600;color:var(--text-heavy)">${t.name}</span><span class="tiny num muted">${S.scores[t.id]?S.scores[t.id]+'/10':'–'}</span>${saveBtn(t.id,true)}</div>`).join('')}</div></div></div>`);}
  if(p==='wait'){const sc=sched(), now=sc.find(s=>s.state==='now'), nx=sc.find(s=>s.state==='next');
    return shell(`<div class="v10"><div class="card tile w2"><span class="lbl">Your spot</span><span class="big">${ROOM.num}</span><span class="small muted">${ROOM.name} · ${ROOM.spot} · ${ROOM.floor}</span><div><button class="pill map">Map</button></div></div>
    <div class="card tile w2" style="outline:2px solid var(--primary)"><span class="lbl">Presenting now · ${now?now.label:''}</span><span class="h2">${now?now.t.name:'—'}</span><span class="tiny muted">${now?now.t.people.join(', '):''}</span></div>
    <div class="card tile"><span class="lbl">Next · ${nx?nx.label:''}</span><span class="h3">${nx?nx.t.name:'—'}</span></div>
    <div class="card tile"><span class="lbl">Done</span><span class="big">${sc.filter(s=>s.state==='done').length}<span class="small muted">/${sc.length}</span></span></div>
    <div class="card tile w2"><span class="lbl">Round 2</span><span class="small">Opens after presentations, around 11:30. You'll rank your top 5 here.</span></div>
    <div class="card tile w4"><span class="lbl">Full schedule</span><div class="row g8 wrap">${sc.map(s=>`<span class="badge ${s.state==='now'?'live':s.state==='next'?'blue':''}" style="${s.state==='done'?'opacity:.5':''}">${s.label} ${s.t.name}</span>`).join('')}</div></div></div>`);}
  if(p==='r2'){const bench=eligible().filter(t=>!S.slots.includes(t.id));
    return shell(`<div class="v10"><div class="card tile w4"><div class="row between wrap g8"><div class="stack g4"><span class="lbl">Round 2 · your top 5</span><span class="small muted">Drag teams into the slots, or tap one to drop it in the next open slot. Drag between slots to swap.</span></div>${submitBtn()}</div>
      <div class="v10-slots">${S.slots.map((id,i)=>`<div class="v10-slot" data-slot="${i}"><span class="rk ${id?'top':''}">${i+1}</span>${id?`<div class="dchip" data-chip="${id}" data-from="${i}"><span class="trunc">${T(id).name}</span></div>`:'<span class="tiny muted">Drop here</span>'}</div>`).join('')}</div></div>
      <div class="card tile w4" data-slot="bench"><span class="lbl">Presented to you · ${bench.length} left</span><div class="row g8 wrap">${bench.map(t=>`<div class="dchip" data-chip="${t.id}" data-from="bench"><span>${t.name}</span><span class="tiny muted num">R1 ${S.scores[t.id]||'–'}</span></div>`).join('')||'<span class="tiny muted">All placed.</span>'}</div>${absentNote()}</div></div>`);}
  return shell(`<div class="v10"><div class="card tile w2"><span class="lbl">Status</span><span class="h2">✓ Top 5 sent</span><span class="small muted">at ${S.submittedAt}</span></div><div class="card tile w2"><span class="lbl">What's next</span><span class="small">${doneNote.replace(/<\/?p[^>]*>/g,'')}</span></div>
    <div class="card tile w4"><span class="lbl">Your top 5</span>${doneList()}</div></div>`);
}});

/* ================= Harness wiring (PICKER.md reference, adapted to also re-render on state change) ================= */
const stage=document.getElementById('stage'), ov=document.getElementById('ov'), frame=document.getElementById('frame');
const picker=document.querySelector('.proto-picker');
const highlight=picker.querySelector('.proto-picker-highlight');
const items=[...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay=picker.querySelector('.proto-picker-replay');
let current=0;
const variants=V.map(v=>()=>v.render(S.phase));

function draw(){
  const keep={}; stage.querySelectorAll('[data-scroll]').forEach(el=>keep[el.dataset.scroll]=el.scrollTop);
  const fk=S.refocus||focusKey(document.activeElement); S.refocus=null;
  stage.innerHTML=variants[current]();
  ov.innerHTML=V[current].ov?V[current].ov(S.phase):'';
  stage.querySelectorAll('[data-scroll]').forEach(el=>{if(keep[el.dataset.scroll]!=null) el.scrollTop=keep[el.dataset.scroll]});
  if(fk){const el=document.querySelector(`[data-k="${fk}"]`)||[...document.querySelectorAll('[data-act]')].find(e=>focusKey(e)===fk); if(el) el.focus({preventScroll:true});}
  document.querySelectorAll('#phaseSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.phase===S.phase));
  document.getElementById('hzName').textContent=`${current+1}. ${V[current].name}`;
  document.getElementById('hzWhy').textContent=V[current].why;
}
function focusKey(el){if(!el||!el.dataset) return null; if(el.dataset.k) return el.dataset.k; if(el.dataset.act) return el.dataset.act+'|'+(el.dataset.id||'')+'|'+(el.dataset.v||''); return null}
function moveHighlight(){const el=items[current];highlight.style.width=el.offsetWidth+'px';highlight.style.transform=`translateX(${el.offsetLeft}px)`}
function mount(i){stage.innerHTML='';ov.innerHTML='';requestAnimationFrame(()=>draw())}
function setActive(i){
  if(i<0||i>=variants.length) return;
  current=i; S.sheet=null; S.detail='0'; S.tab='0'; S.confirm=false;
  items.forEach((el,j)=>{el.toggleAttribute('data-active',j===i);if(j===i)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current')});
  moveHighlight();
  const url=new URL(location);url.searchParams.set('v',i+1);history.replaceState(null,'',url);
  mount(i);
}
items.forEach((el,i)=>el.addEventListener('click',()=>setActive(i)));
replay?.addEventListener('click',()=>mount(current));
window.addEventListener('resize',moveHighlight);
document.addEventListener('keydown',e=>{
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.target.classList&&e.target.classList.contains('dl-h')&&(e.key==='ArrowUp'||e.key==='ArrowDown')){
    e.preventDefault(); const i=+e.target.closest('.dl-item').dataset.i, to=i+(e.key==='ArrowUp'?-1:1);
    moveOrder(i,to); S.refocus='dl'+Math.max(0,Math.min(to,fullOrder().length-1)); draw(); return;
  }
  if(e.key==='Escape'&&S.sheet){S.sheet=null;draw();return}
  // Card stack: arrow keys swipe instead of switching variants while on round 1
  if(current===1&&S.phase==='r1'&&S.idx<TEAMS.length&&(e.key==='ArrowLeft'||e.key==='ArrowRight')&&e.shiftKey===false&&document.activeElement&&document.activeElement.closest&&document.activeElement.closest('.v2-card')){fling(e.key==='ArrowRight'?1:-1);return}
  const num=parseInt(e.key,10);
  if(e.key==='0') setActive(9);
  else if(num>=1&&num<=variants.length) setActive(num-1);
  else if(e.key==='ArrowRight') setActive((current+1)%variants.length);
  else if(e.key==='ArrowLeft') setActive((current-1+variants.length)%variants.length);
  else if(e.key==='r'||e.key==='R') mount(current);
});

/* Phase / device / reset */
document.getElementById('phaseSeg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  const ph=b.dataset.phase; S.phase=ph; S.confirm=false; S.sheet=null; S.tab='0'; S.detail='0'; S.wsel=null;
  if(['wait','r2','done'].includes(ph)&&S.saved.size===0) PRESET_SAVED.forEach(id=>S.saved.add(id));
  if(ph==='r2'&&S.cmp&&S.cmp.pending.length===0&&ranked().length===0) S.cmp=null;
  if(ph==='done'){ if(ranked().length<need()) S.slots=[0,1,2,3,4].map(i=>fullOrder()[i]||null); S.submittedAt=S.submittedAt||'11:52 AM'; }
  draw();
});
document.getElementById('devSeg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#devSeg button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  frame.classList.toggle('phone',b.dataset.dev==='phone'); draw();
});
document.getElementById('resetBtn').addEventListener('click',()=>{
  S.scores={}; S.saved=new Set(); S.slots=[null,null,null,null,null]; S.order=null; S.cmp=null; S.idx=0; S.pair=0; S.g={i:0,step:'score'}; S.notes={}; S.confirm=false; S.submittedAt=null; S.phase='r1'; draw();
});

/* Actions */
const A={
  noop(){},
  score(el){const id=el.dataset.id,v=+el.dataset.v; S.scores[id]=S.scores[id]===v?undefined:v; if(!S.scores[id]) delete S.scores[id];},
  save(el){const id=el.dataset.id; S.saved.has(id)?S.saved.delete(id):S.saved.add(id); S.confirm=false;},
  filter(el){S.filter=el.dataset.v},
  sort(el){S.sort=el.dataset.v},
  ask(){S.confirm=true},
  cancel(){S.confirm=false},
  send(){S.confirm=false; S.phase='wait'; S.sentAt='9:52 AM'; S.tab='0'; S.detail='0'; window.scrollTo(0,0); stage.scrollTop=0},
  up(el){const i=+el.dataset.v; moveOrder(i,i-1); S.refocus='up||'+(i-1>0?i-1:i)},
  down(el){const i=+el.dataset.v; moveOrder(i,i+1); S.refocus='down||'+(i+1)},
  submitOrder(){const o=fullOrder(); S.slots=[0,1,2,3,4].map(i=>o[i]||null); submit()},
  submit(){submit()},
  rank(el){if(!el.dataset.id) return; toggleRank(el.dataset.id); if(current!==1&&current!==7) compactSlots()},
  unrank(el){toggleRank(el.dataset.id); compactSlots()},
  clearRank(){S.slots=[null,null,null,null,null]},
  undo(){const r=ranked(); if(r.length){toggleRank(r[r.length-1]); compactSlots()}},
  sup(el){const i=+el.dataset.v; [S.slots[i-1],S.slots[i]]=[S.slots[i],S.slots[i-1]]},
  sdown(el){const i=+el.dataset.v; [S.slots[i+1],S.slots[i]]=[S.slots[i],S.slots[i+1]]},
  // card stack
  skip(){fling(-1)}, keep(){fling(1)}, back(){S.idx=Math.max(0,S.idx-1)}, toEnd(){S.idx=TEAMS.length}, restart(){S.idx=0},
  // split
  pick(el){S.sel=el.dataset.id; S.detail='1'}, v4back(){S.detail='0'}, wpick(el){S.wsel=el.dataset.id; S.detail='1'},
  // head to head
  pair(el){S.pair=Math.max(0,Math.min(9,S.pair+ +el.dataset.v))},
  cmpStart(){const el=eligible().map(t=>t.id).sort((a,b)=>(S.scores[b]||0)-(S.scores[a]||0)); S.cmp={sorted:[el[0]],pending:el.slice(1),lo:0,hi:1,n:0}; if(!S.cmp.pending.length) finishCmp()},
  cmp(el){const c=S.cmp, mid=Math.floor((c.lo+c.hi)/2); c.n++; if(el.dataset.v==='a') c.hi=mid; else c.lo=mid+1;
    if(c.lo>=c.hi){c.sorted.splice(c.lo,0,c.pending.shift()); c.lo=0; c.hi=Math.min(c.sorted.length,5); if(!c.pending.length) finishCmp()}},
  cmpReset(){S.cmp=null; S.slots=[null,null,null,null,null]},
  // board
  tab(el){S.tab=el.dataset.v},
  // gallery
  sheet(el){S.sheet=el.dataset.id}, closeSheet(){S.sheet=null},
  // guided
  gscore(el){const t=TEAMS[S.g.i]; S.scores[t.id]=+el.dataset.v; S.g.step='save'},
  gsave(el){const t=TEAMS[S.g.i]; el.dataset.v==='1'?S.saved.add(t.id):S.saved.delete(t.id); S.g={i:S.g.i+1,step:'score'}},
  gskip(){S.g={i:S.g.i+1,step:'score'}},
  gto(el){S.g={i:+el.dataset.v,step:'score'}},
};
function finishCmp(){const c=S.cmp; S.slots=[0,1,2,3,4].map(i=>c.sorted[i]||null)}
function submit(){ if(ranked().length<need()) return; compactSlots(); S.phase='done'; S.submittedAt='11:52 AM'; window.scrollTo(0,0); stage.scrollTop=0 }

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el||!stage.contains(el)&&!ov.contains(el)) return;
  if(el.tagName==='A') e.preventDefault();
  const f=A[el.dataset.act]; if(!f) return;
  f(el); if(el.dataset.act!=='skip'&&el.dataset.act!=='keep') draw();
});
document.addEventListener('change',e=>{
  const el=e.target; const k=el.dataset&&el.dataset.chg; if(!k) return;
  const id=el.dataset.id;
  if(k==='score'){ if(el.value) S.scores[id]=+el.value; else delete S.scores[id]; }
  if(k==='save'){ el.checked?S.saved.add(id):S.saved.delete(id); S.confirm=false; }
  if(k==='rankAt'){ const r=el.value?+el.value-1:-1, old=S.slots.indexOf(id);
    if(old>-1) S.slots[old]=null;
    if(r>-1){ const prev=S.slots[r]; S.slots[r]=id; if(prev&&old>-1) S.slots[old]=prev; } }
  draw();
});
document.addEventListener('input',e=>{const id=e.target.dataset&&e.target.dataset.note; if(id) S.notes[id]=e.target.value});

/* Card stack swipe (follows the finger 1:1, flings past 90px) */
let sw=null;
function fling(dir){
  const card=stage.querySelector('.v2-card[data-swipe]'); if(!card){return}
  const id=card.dataset.swipe;
  card.style.transition='transform 220ms var(--ease-out), opacity 220ms ease-out';
  card.style.transform=`translateX(${dir*130}%) rotate(${dir*8}deg)`; card.style.opacity='0';
  setTimeout(()=>{ if(dir>0) S.saved.add(id); S.idx++; S.confirm=false; draw(); },200);
}
document.addEventListener('pointerdown',e=>{
  const card=e.target.closest('.v2-card[data-swipe]'); if(!card||e.target.closest('button,a')) return;
  sw={card,x:e.clientX,dx:0,id:e.pointerId}; card.setPointerCapture(e.pointerId); card.classList.add('dragging');
});
document.addEventListener('pointermove',e=>{
  if(sw&&e.pointerId===sw.id){ sw.dx=e.clientX-sw.x; sw.card.style.transform=`translateX(${sw.dx}px) rotate(${sw.dx/24}deg)`;
    sw.card.querySelector('.v2-hint.yes').style.opacity=Math.max(0,Math.min(1,sw.dx/90));
    sw.card.querySelector('.v2-hint.no').style.opacity=Math.max(0,Math.min(1,-sw.dx/90)); }
  if(dr) dragMove(e); if(cd) chipMove(e);
});
document.addEventListener('pointerup',e=>{
  if(sw&&e.pointerId===sw.id){ const {card,dx}=sw; sw=null; card.classList.remove('dragging');
    if(Math.abs(dx)>90) fling(dx>0?1:-1);
    else { card.style.transition='transform 300ms var(--ease-out)'; card.style.transform=''; card.querySelectorAll('.v2-hint').forEach(h=>h.style.opacity=0); } }
  if(dr) dragEnd(e); if(cd) chipEnd(e);
});
document.addEventListener('pointercancel',e=>{ if(sw){sw.card.style.transform='';sw=null} if(dr){dr=null;draw()} if(cd){cd.ghost&&cd.ghost.remove();cd=null;draw()} });

/* Drag to reorder (timeline variant) */
let dr=null;
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest('.dl-h'); if(!h) return; e.preventDefault();
  const item=h.closest('.dl-item'), list=[...item.parentElement.children];
  const gap=8, rowH=item.offsetHeight+gap;
  dr={item,list,from:+item.dataset.i,to:+item.dataset.i,y:e.clientY,rowH,id:e.pointerId};
  h.setPointerCapture(e.pointerId); item.classList.add('lift');
  list.forEach(el=>{ if(el!==item) el.style.transition='transform 200ms var(--ease-out)'; });
});
function dragMove(e){
  if(e.pointerId!==dr.id) return;
  const dy=e.clientY-dr.y; dr.item.style.transform=`translateY(${dy}px) scale(1.02)`;
  const to=Math.max(0,Math.min(dr.list.length-1,dr.from+Math.round(dy/dr.rowH))); dr.to=to;
  dr.list.forEach((el,j)=>{ if(el===dr.item) return; let s=0;
    if(dr.from<to&&j>dr.from&&j<=to) s=-dr.rowH; if(to<dr.from&&j>=to&&j<dr.from) s=dr.rowH; el.style.transform=s?`translateY(${s}px)`:''; });
}
function dragEnd(e){ if(e.pointerId!==dr.id) return; const {from,to}=dr; dr=null; moveOrder(from,to); draw(); }

/* Drag chips into slots (tiles variant); a tap drops into the next open slot */
let cd=null;
document.addEventListener('pointerdown',e=>{
  const c=e.target.closest('.dchip[data-chip]'); if(!c) return;
  cd={c,id:c.dataset.chip,from:c.dataset.from,x:e.clientX,y:e.clientY,moved:false,ghost:null,pid:e.pointerId};
  c.setPointerCapture(e.pointerId);
});
function chipMove(e){
  if(e.pointerId!==cd.pid) return;
  if(!cd.moved&&Math.hypot(e.clientX-cd.x,e.clientY-cd.y)<6) return;
  const r=ov.getBoundingClientRect();
  if(!cd.moved){ cd.moved=true; cd.ghost=cd.c.cloneNode(true); cd.ghost.classList.add('ghost'); cd.ghost.style.width=cd.c.offsetWidth+'px'; ov.appendChild(cd.ghost); cd.c.classList.add('placeholder'); }
  cd.ghost.style.left=(e.clientX-r.left-20)+'px'; cd.ghost.style.top=(e.clientY-r.top-18)+'px';
  stage.querySelectorAll('[data-slot]').forEach(s=>s.classList.remove('hot'));
  const over=document.elementFromPoint(e.clientX,e.clientY); const slot=over&&over.closest('[data-slot]'); if(slot&&slot.classList.contains('v10-slot')) slot.classList.add('hot');
}
function chipEnd(e){
  if(e.pointerId!==cd.pid) return;
  const {id,from,moved,ghost}=cd; cd=null; if(ghost) ghost.remove();
  if(!moved){ if(from==='bench') toggleRank(id); else S.slots[+from]=null; draw(); return; }
  const over=document.elementFromPoint(e.clientX,e.clientY); const slot=over&&over.closest('[data-slot]');
  if(slot){ const to=slot.dataset.slot;
    if(to==='bench'){ if(from!=='bench') S.slots[+from]=null; }
    else { const i=+to, prev=S.slots[i];
      if(from==='bench'){ S.slots[i]=id; } else { const j=+from; S.slots[i]=id; S.slots[j]=prev||null; } } }
  draw();
}

const requested=parseInt(new URLSearchParams(location.search).get('v'),10);
setActive(requested>=1&&requested<=variants.length?requested-1:0);
requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
</script>
