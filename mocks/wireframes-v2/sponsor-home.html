<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sponsor Home Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- Design tokens (src/lib/tokens.ts, dashboard-*) ---------- */
:root {
  --text-heavy: #0b2b4a; --text-medium: #1c3550; --text-light: #516476;
  --text-placeholder: rgba(81,100,118,0.7); --text-inverse: #fff;
  --text-link: #0b6bc4; --text-active: #08559c; --text-warning: #8a4300;
  --bg-page: #f3f7fc; --bg-surface: #fff; --bg-nav: #dbe7f5; --bg-nav-sel: #b9d3f0;
  --bg-inset: #edf3fa; --bg-highlight: #e1effb; --bg-highlight-subtle: rgba(225,239,251,0.4);
  --primary: #0b6bc4;
  --border-default: #cdddeb; --border-subtle: #e0eaf3; --border-card: #d6e3ef;
  --border-control: #b9cbe0; --border-muted: rgba(81,100,118,0.2);
  --live: #16803c; --warning: #a34a00;
  --tint-pink: rgba(250,104,235,0.15); --tint-blue: rgba(37,130,254,0.15);
  --tint-green: rgba(104,250,109,0.15); --tint-orange: rgba(254,145,37,0.15);
  --r-sm: 4px; --r-md: 6px; --r-lg: 8px; --r-xl: 10px; --r-2xl: 12px; --r-3xl: 20px; --r-full: 999px;
  --shadow-card: 0 1px 2px rgba(11,43,74,0.06), 0 1px 4px rgba(11,43,74,0.05);
  --shadow-btn: 0 2px 4px rgba(11,43,74,0.2);
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #e6edf5; font-family: Figtree, system-ui, sans-serif; font-weight: 500; color: var(--text-heavy); overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
img { display: block; }

/* ---------- Harness chrome (not part of the designs) ---------- */
.h-bar { position: sticky; top: 0; z-index: 50; background: rgba(230,237,245,0.92); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-default); padding: 10px 16px 8px; }
.h-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; max-width: 1312px; margin: 0 auto; }
.h-title { font-weight: 700; font-size: 14px; margin-right: 4px; }
.h-badge { font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 3px 8px; border-radius: var(--r-full); background: #ffefb8; color: #5c3d00; border: 1px solid #c78a00; }
.h-spacer { flex: 1; }
.h-seg { display: inline-flex; background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: var(--r-full); padding: 2px; gap: 2px; }
.h-seg button { border: 0; background: transparent; border-radius: var(--r-full); padding: 4px 10px; font-size: 12px; font-weight: 600; color: var(--text-light); cursor: pointer; white-space: nowrap; }
.h-seg button[aria-pressed="true"] { background: var(--text-heavy); color: #fff; }
.h-select { font: inherit; font-size: 12px; font-weight: 600; border: 1px solid var(--border-default); border-radius: var(--r-full); padding: 4px 8px; background: var(--bg-surface); color: var(--text-heavy); }
.h-note { max-width: 1312px; margin: 6px auto 0; font-size: 13px; color: var(--text-light); }
.h-note b { color: var(--text-heavy); }
.h-pickwrap { max-width: 1312px; margin: 8px auto 0; overflow-x: auto; scrollbar-width: none; }
.h-pickwrap::-webkit-scrollbar { display: none; }
/* Picker: PICKER.md styles, placed in the top bar (brief: picker at the top) */
.proto-picker { position: relative; display: inline-flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(10,10,10,0.82); -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4); box-shadow: 0 0 0 1px rgba(255,255,255,0.08) inset, 0 8px 24px rgba(0,0,0,0.24), 0 2px 6px rgba(0,0,0,0.12); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; line-height: 1; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
.proto-picker-highlight { position: absolute; top: 4px; left: 0; height: 28px; border-radius: 999px; background: rgba(255,255,255,0.12); }
.proto-picker[data-ready] .proto-picker-highlight { transition: transform 250ms cubic-bezier(0.23,1,0.32,1), width 250ms cubic-bezier(0.23,1,0.32,1); }
@media (prefers-reduced-motion: reduce) { .proto-picker[data-ready] .proto-picker-highlight { transition: none; } }
.proto-picker-item { position: relative; display: flex; align-items: center; height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: rgba(255,255,255,0.55); font: inherit; cursor: pointer; white-space: nowrap; transition: color 150ms ease-out, transform 160ms cubic-bezier(0.23,1,0.32,1); }
@media (hover: hover) and (pointer: fine) { .proto-picker-item:hover { color: rgba(255,255,255,0.85); } }
.proto-picker-item:active { transform: scale(0.97); }
.proto-picker-item:focus-visible { outline: 2px solid rgba(255,255,255,0.4); outline-offset: 2px; }
.proto-picker-item[data-active] { color: #fff; }

.stage-wrap { padding: 20px 16px 80px; }
.frame { container: app / inline-size; margin: 0 auto; background: var(--bg-page); min-height: 70vh; width: 100%; max-width: 1280px; border-radius: 14px; box-shadow: 0 0 0 1px var(--border-default), 0 12px 40px rgba(11,43,74,0.10); overflow: clip; }
.frame[data-device="phone"] { max-width: 375px; border-radius: 32px; box-shadow: 0 0 0 10px #0b2b4a, 0 20px 50px rgba(11,43,74,0.25); }

/* ---------- Shared app primitives ---------- */
.app { font-size: 16px; line-height: 1.35; color: var(--text-heavy); min-height: 70vh; }
.wrap { padding: 16px; }
@container app (min-width: 760px) { .wrap { padding: 24px 32px; } }
.card { background: var(--bg-surface); border-radius: var(--r-2xl); box-shadow: var(--shadow-card); }
.label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: -0.02em; color: var(--text-light); margin: 0; }
.muted { color: var(--text-light); }
.small { font-size: 14px; }
.xs { font-size: 12px; }
.strong { font-weight: 600; }
.h1 { font-size: 24px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
.h2 { font-size: 18px; font-weight: 600; margin: 0; }
.row { display: flex; align-items: center; gap: 12px; }
.col { display: flex; flex-direction: column; }
.gap4 { gap: 4px; } .gap8 { gap: 8px; } .gap12 { gap: 12px; } .gap16 { gap: 16px; } .gap20 { gap: 20px; }
.grow { flex: 1; min-width: 0; }
.wrapflex { flex-wrap: wrap; }
.ico { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.ico.sm { width: 16px; height: 16px; }
.dot-ico { width: 40px; height: 40px; border-radius: var(--r-full); background: var(--bg-inset); color: var(--text-medium); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.dot-ico.blue { background: var(--bg-highlight); color: var(--primary); }

/* Pills: small, quiet. The Map pill is the high-visibility one. */
.pill { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: var(--r-full); border: 1px solid var(--border-control); background: var(--bg-surface); color: var(--text-heavy); font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; text-decoration: none; transition: transform 160ms var(--ease-out), background-color 150ms ease; touch-action: manipulation; position: relative; }
.pill::after { content: ""; position: absolute; inset: -6px -2px; } /* 44px hit area */
.pill:active { transform: scale(0.97); }
@media (hover: hover) and (pointer: fine) { .pill:hover { background: var(--bg-highlight); } }
.pill:focus-visible, .tap:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.pill .ico { width: 16px; height: 16px; }
.pill-map { background: var(--primary); border-color: var(--primary); color: #fff; }
@media (hover: hover) and (pointer: fine) { .pill-map:hover { background: var(--text-active); } }
.pill-dark { background: var(--text-heavy); border-color: var(--text-heavy); color: #fff; }
@media (hover: hover) and (pointer: fine) { .pill-dark:hover { background: var(--text-medium); } }
.pill-q { width: 32px; padding: 0; justify-content: center; font-weight: 700; }
.pill-ghost { border-color: transparent; background: transparent; color: var(--text-link); }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: var(--r-sm); background: var(--bg-highlight); color: var(--text-active); white-space: nowrap; }
.tag.grey { background: var(--bg-nav); color: var(--text-light); }
.tag.live { background: rgba(22,128,60,0.1); color: var(--live); }
.tag.live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--live); }
.tag.warn { background: #fbe9dc; color: var(--text-warning); }
.tap { cursor: pointer; transition: transform 160ms var(--ease-out), background-color 150ms ease; border: 0; text-align: left; font: inherit; color: inherit; touch-action: manipulation; }
.tap:active { transform: scale(0.985); }
@media (hover: hover) and (pointer: fine) { .tap.card:hover { background: #fbfdff; } }
.divide > * + * { border-top: 1px solid var(--border-subtle); }
.logo-chip { display: inline-flex; align-items: center; height: 48px; padding: 8px 14px; background: #fff; border-radius: var(--r-lg); box-shadow: var(--shadow-card); width: fit-content; }
.logo-chip img { height: 100%; width: auto; max-width: 170px; object-fit: contain; }
.logo-text { font-weight: 700; font-size: 20px; letter-spacing: 0.04em; color: var(--text-heavy); }
.slots { display: flex; gap: 6px; flex-wrap: wrap; }
.slot { display: flex; flex-direction: column; gap: 2px; padding: 6px 10px; border-radius: var(--r-lg); background: var(--bg-inset); font-size: 12px; min-width: 64px; }
.slot b { font-size: 14px; }
.slot.full { background: var(--tint-orange); }
.slot.now { box-shadow: inset 0 0 0 1.5px var(--primary); }
.lockmsg { margin: 0; padding: 10px 14px; border-radius: var(--r-lg); background: var(--bg-highlight); color: var(--text-active); font-size: 14px; }
[data-locked] .lockmsg { display: none; }
[data-locked][data-open] .lockmsg { display: block; }
.locked-tile { border: 1px dashed var(--border-control); background: var(--bg-inset); color: var(--text-light); box-shadow: none; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.step { font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: var(--r-full); background: var(--bg-inset); color: var(--text-light); }
.step.on { background: var(--primary); color: #fff; }
.step.done { background: var(--bg-highlight); color: var(--text-active); }

/* Sponsor Bay booth grid: logos only, yours highlighted */
.bay { display: flex; flex-direction: column; gap: 10px; }
.bay-screen { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.bay-screen i { display: block; height: 4px; width: 70%; border-radius: 99px; background: var(--text-heavy); }
.bay-screen span { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-light); }
.bay-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-template-rows: repeat(5, minmax(40px, auto)); gap: 6px; }
.booth { display: flex; align-items: center; justify-content: center; padding: 6px; border-radius: var(--r-sm); background: var(--bg-inset); border: 1px solid var(--border-subtle); min-width: 0; position: relative; }
.booth img { max-width: 100%; max-height: 22px; width: auto; object-fit: contain; opacity: .75; }
.booth .bt { font-size: 11px; font-weight: 700; color: var(--text-medium); }
.booth.v { min-height: 56px; }
.booth.mine { background: #fff; border: 2px solid var(--primary); box-shadow: 0 0 0 3px var(--bg-highlight); }
.booth.mine img { opacity: 1; }
.booth .you { position: absolute; top: -9px; right: -4px; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 99px; background: var(--primary); color: #fff; }
.bay.big .bay-grid { grid-template-rows: repeat(5, minmax(64px, auto)); gap: 10px; }
.bay.big .booth img { max-height: 32px; }
.bay.big .booth.v { min-height: 80px; }

/* Overlay: sheets for Map, Need help, How-to */
.ov { position: fixed; inset: 0; z-index: 100; display: flex; align-items: flex-end; justify-content: center; }
.ov[hidden] { display: none; }
.ov-scrim { position: absolute; inset: 0; background: rgba(11,43,74,0.32); animation: fade 200ms ease-out; }
.sheet { position: relative; width: 100%; max-width: 560px; max-height: 86vh; overflow: auto; overscroll-behavior: contain; background: var(--bg-surface); border-radius: 20px 20px 0 0; padding: 20px 20px max(20px, env(safe-area-inset-bottom)); box-shadow: 0 -8px 40px rgba(11,43,74,0.2); animation: rise 260ms var(--ease-out); font-family: Figtree, system-ui, sans-serif; }
.ov[data-device="phone"] .sheet { max-width: 375px; }
@media (min-width: 700px) { .ov { align-items: center; } .sheet { border-radius: 20px; } }
@keyframes rise { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .sheet, .ov-scrim { animation: none; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.floor { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; padding: 12px; background: var(--bg-inset); border-radius: var(--r-2xl); }
.room { grid-column: span 2; padding: 10px 8px; border-radius: var(--r-md); background: #fff; border: 1px solid var(--border-subtle); font-size: 12px; min-height: 54px; display: flex; flex-direction: column; gap: 2px; }
.room b { font-size: 13px; }
.room.key { border: 1.5px solid var(--primary); background: var(--bg-highlight); }
.room.wide { grid-column: span 3; }
.room.full { grid-column: span 6; }
.h-badge.v2n { background: var(--bg-inset); color: var(--text-medium); border-color: var(--border-subtle); }
/* Official floor plan image + overlaid pins (positions are % of the full image) */
.fmap { position: relative; border-radius: var(--r-2xl); overflow: hidden; background: #fff; border: 1px solid var(--border-subtle); }
.fmap img { display: block; width: 100%; height: auto; max-width: 100%; }
.fpin { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: 2px; pointer-events: none; }
.fpin b { font-size: 10px; font-weight: 700; color: var(--text-heavy); background: #fff; border-radius: 999px; padding: 2px 6px; box-shadow: 0 1px 4px rgba(11,43,74,.25); white-space: nowrap; }
.fpin i { width: 10px; height: 10px; border-radius: 50%; background: var(--text-light); border: 2px solid #fff; margin-bottom: -5px; }
.fpin.key b { background: var(--primary); color: #fff; }
.fpin.key i { background: var(--primary); box-shadow: 0 0 0 4px rgba(11,107,196,.22); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 120; background: var(--text-heavy); color: #fff; font-size: 14px; font-weight: 600; padding: 10px 16px; border-radius: var(--r-full); box-shadow: var(--shadow-btn); animation: rise 200ms var(--ease-out); max-width: calc(100vw - 32px); }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }


/* phone width: grids get a shrinkable column, long tags wrap */
.row > .tag { flex-shrink: 1; white-space: normal; text-align: right; }
.v4 .two, .v6 .layout, .v7 .layout, .v10 .venue, .v2 .grid, .v5 .layout, .places, .pair, .split, .three { grid-template-columns: minmax(0,1fr); }
.pill.wrap { white-space: normal; text-align: left; padding-top: 6px; padding-bottom: 6px; }
/* ========== V1 Stack ========== */
.v1 .inner { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.v1 .welcome { background: var(--primary); color: #fff; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
.v1 .welcome p { margin: 0; color: rgba(255,255,255,0.9); }
.v1 .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.v1 .tile { padding: 16px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.v1 .tile.wide { grid-column: span 2; flex-direction: row; align-items: center; }
.v1 .tile.dark { background: var(--text-heavy); color: #fff; }
.v1 .tile.dark .muted { color: rgba(255,255,255,0.8); }
.v1 .tile.dark .dot-ico { background: var(--primary); color: #fff; }
.v1 .dl { padding: 0 16px; }
.v1 .dl > div { display: flex; gap: 12px; align-items: center; padding: 14px 0; }
.v1 .todaystrip { padding: 12px 16px; display: flex; gap: 12px; align-items: center; }

/* ========== V2 Today first ========== */
.v2 .grid { display: grid; gap: 20px; }
@container app (min-width: 760px) { .v2 .grid { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); align-items: start; } }
.v2 .hero { padding: 20px; display: flex; flex-direction: column; gap: 14px; border-top: 4px solid var(--primary); }
.v2 .clock { font-size: 13px; font-weight: 600; color: var(--text-light); }
.v2 .big { font-size: 26px; font-weight: 700; margin: 0; letter-spacing: -0.01em; line-height: 1.15; }
.v2 .nextlist > div { display: flex; gap: 12px; padding: 12px 16px; align-items: baseline; }
.v2 .nextlist time { width: 72px; flex: none; font-size: 14px; color: var(--text-light); font-weight: 600; }
.v2 details { background: var(--bg-surface); border-radius: var(--r-2xl); box-shadow: var(--shadow-card); }
.v2 summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
.v2 summary::-webkit-details-marker { display: none; }
.v2 details[open] summary .ico { transform: rotate(90deg); }
.v2 summary .ico { transition: transform 200ms var(--ease-out); }
.v2 .dbody { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; }

/* ========== V3 Bento ========== */
.v3 .bento { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; grid-auto-flow: dense; }
@container app (min-width: 760px) { .v3 .bento { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; } }
.v3 .b { padding: 16px; display: flex; flex-direction: column; gap: 8px; min-height: 120px; position: relative; }
.v3 .s2 { grid-column: span 2; }
.v3 .r2 { grid-row: span 2; }
.v3 .welcome { justify-content: space-between; }
.v3 .dark { background: var(--text-heavy); color: #fff; }
.v3 .dark .muted { color: rgba(255,255,255,0.8); }
.v3 .accent { background: var(--primary); color: #fff; }
.v3 .accent .muted { color: rgba(255,255,255,0.85); }
.v3 .accent .pill-map { background: #fff; border-color: #fff; color: var(--primary); }
.v3 .today-dot { position: absolute; top: 12px; right: 12px; }
.v3 .big { font-size: 32px; font-weight: 700; line-height: 1; }
@container app (max-width: 759px) { .v3 .r2.mob1 { grid-row: auto; } }

/* ========== V4 Side nav ========== */
.v4 { display: grid; grid-template-columns: 1fr; min-height: 70vh; }
@container app (min-width: 760px) { .v4 { grid-template-columns: 232px minmax(0, 1fr); } }
.v4 .rail { display: none; background: var(--bg-surface); border-right: 1px solid var(--border-subtle); padding: 20px 12px; flex-direction: column; gap: 4px; }
@container app (min-width: 760px) { .v4 .rail { display: flex; } .v4 .tabbar { display: none; } }
.v4 .navi { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--r-lg); color: var(--text-medium); font-weight: 600; font-size: 15px; background: transparent; width: 100%; }
.v4 .navi[aria-current="page"] { background: var(--bg-nav); color: var(--text-active); }
@media (hover: hover) and (pointer: fine) { .v4 .navi:hover { background: var(--bg-inset); } }
.v4 .top { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border-subtle); background: var(--bg-surface); position: sticky; top: 0; z-index: 2; }
.v4 .pane { padding: 16px; display: flex; flex-direction: column; gap: 16px; max-width: 860px; }
@container app (min-width: 760px) { .v4 .pane { padding: 24px 32px; } }
.v4 .two { display: grid; gap: 16px; }
@container app (min-width: 900px) { .v4 .two { grid-template-columns: 1fr 1fr; } }
.v4 .tabbar { position: sticky; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--bg-surface); border-top: 1px solid var(--border-subtle); padding: 6px 4px max(6px, env(safe-area-inset-bottom)); z-index: 3; }
.v4 .tabbar button { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--text-light); background: none; border: 0; padding: 6px 0; min-height: 44px; }
.v4 .tabbar button[aria-current="page"] { color: var(--primary); }
.v4 .main { display: flex; flex-direction: column; min-width: 0; }
@container app (min-width: 760px) { .v4 .v4-phonehelp { display: none; } }

/* ========== V5 Weekend line ========== */
.v5 .layout { display: grid; gap: 20px; }
@container app (min-width: 900px) { .v5 .layout { grid-template-columns: minmax(0, 1fr) 340px; align-items: start; } .v5 .side { position: sticky; top: 16px; } }
.v5 .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.v5 .chips::-webkit-scrollbar { display: none; }
.v5 .chip { flex: none; font-size: 13px; padding: 6px 10px; border-radius: var(--r-full); background: var(--bg-surface); box-shadow: var(--shadow-card); white-space: nowrap; }
.v5 .chip b { font-weight: 700; }
.v5 .tl { position: relative; padding-left: 22px; }

    html += `<div class="dayh">${d.name} · ${d.date}${d.id === c.w.day ? '<span class="tag">Today</span>' : ''}</div>`;
    list.forEach((e) => {

      if (/Check in/.test(e.title)) act = `<div style="margin-top:8px">${mapPill('Find your booth')}</div>`;
      html += `<div class="card ev ${cls}"><div class="row" style="gap:8px;align-items:baseline"><span class="small muted strong" style="width:64px;flex:none">${fmt(e.t)}</span><span class="grow"><span class="${own ? 'strong' : ''}">${esc(e.title)}</span><br><span class="small muted">${esc(e.where)}</span></span>${c.isNow(e) ? '<span class="tag live">Now</span>' : ''}</div>${act}</div>`;

  { t: 'Need help?', b: 'Tap it any time. We ping the sponsor team and show you who is coming to your booth.' },
  { t: 'Scan a badge', b: "Scan a hacker's badge to offer them a coffee chat. At most 3 hackers per slot." },
  { t: 'The Map pill', b: 'Top right on every page. Shows your booth (Rm 1235), the lounge (behind the curtain in Rm 2110) and where to leave your things (Rm 2244).' },
  { t: 'Judging on Sunday', b: 'For prize-track sponsors. It unlocks at 9:00 AM. Come to the debrief at 8:30 AM in the Grand Hall (Rm 1110) first. There will be coffee!' },
];
function tourSheet() {
  const i = S.tourI || 0, st = TOUR[i];
  return `<div class="sheet-head"><span class="label">How this portal works · ${i + 1} of ${TOUR.length}</span><button class="pill pill-q" data-act="close" aria-label="Close">${I('x')}</button></div>
    <h2 class="h2" style="margin-bottom:6px">${st.t}</h2><p style="margin:0 0 16px" class="muted">${st.b}</p>
    <div class="row"><button class="pill" data-act="tour-step" data-d="-1" ${i === 0 ? 'disabled style="opacity:.4"' : ''}>Back</button><span class="grow"></span>${i < TOUR.length - 1 ? '<button class="pill pill-dark" data-act="tour-step" data-d="1">Next</button>' : '<button class="pill pill-dark" data-act="close">Got it</button>'}</div>`;
}

/* ================= Harness wiring ================= */
const stage = document.getElementById('stage'), frame = document.getElementById('frame');
const picker = document.querySelector('.proto-picker'), highlight = picker.querySelector('.proto-picker-highlight');
VARIANTS.forEach((v, i) => { const b = document.createElement('button'); b.className = 'proto-picker-item'; b.textContent = `${(i + 1) % 10} ${v.name}`; b.addEventListener('click', () => select(i + 1)); picker.appendChild(b); });
const items = [...picker.querySelectorAll('.proto-picker-item')];
const sel = document.getElementById('h-sponsor');
sel.innerHTML = Object.keys(SP).map((n) => `<option ${n === S.sponsor ? 'selected' : ''}>${n}</option>`).join('');
sel.addEventListener('change', () => { S.sponsor = sel.value; sync(); render(); });
const whenSeg = document.getElementById('h-when');
whenSeg.innerHTML = Object.entries(WHEN).map(([k, w]) => `<button data-when="${k}">${w.short}</button>`).join('');
whenSeg.addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; S.when = b.dataset.when; S.v8i = 0; S.v10day = null; S.chat = []; sync(); render(); });
document.getElementById('h-device').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; S.device = b.dataset.device; sync(); render(); });

function moveHighlight() { const a = items[S.v - 1]; highlight.style.width = a.offsetWidth + 'px'; highlight.style.transform = `translateX(${a.offsetLeft}px)`; }
function sync() {
  const u = new URL(location.href); u.searchParams.set('v', S.v); u.searchParams.set('device', S.device); u.searchParams.set('when', S.when); u.searchParams.set('sponsor', S.sponsor); history.replaceState(null, '', u);
  items.forEach((b, i) => { if (i === S.v - 1) { b.setAttribute('data-active', ''); b.setAttribute('aria-current', 'true'); } else { b.removeAttribute('data-active'); b.removeAttribute('aria-current'); } });
  moveHighlight();
  whenSeg.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.when === S.when));
  document.querySelectorAll('#h-device button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.device === S.device));
  frame.dataset.device = S.device; document.getElementById('ov').dataset.device = S.device;
  const v = VARIANTS[S.v - 1];
  document.getElementById('h-note').innerHTML = `<b>${S.v}. ${v.name}</b> · ${v.why}`;
}
function render() { stage.innerHTML = VARIANTS[S.v - 1].render(ctx()); bindDeck(); }
function select(n) { S.v = n; sync(); render(); items[n - 1].scrollIntoView({ block: 'nearest', inline: 'nearest' }); }

const ov = document.getElementById('ov'), sheet = document.getElementById('sheet');
let sheetKind = null, lastFocus = null;
function openSheet(kind) { sheetKind = kind; if (ov.hidden) lastFocus = document.activeElement; drawSheet(); ov.hidden = false; sheet.querySelector('button')?.focus(); }
function drawSheet() { sheet.innerHTML = sheetKind === 'map' ? mapSheet() : sheetKind === 'help' ? helpSheet() : tourSheet(); }
function closeSheet() { ov.hidden = true; sheetKind = null; lastFocus?.focus?.(); }
let toastT;
function toast(msg) { document.querySelector('.toast')?.remove(); const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg; document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 1800); }

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act;
  if (a === 'map') { S.mapFloor = 2; openSheet('map'); }
  else if (a === 'help') { openSheet('help'); }
  else if (a === 'tour') { S.tourI = 0; openSheet('tour'); }
  else if (a === 'close') closeSheet();
  else if (a === 'floor') { S.mapFloor = Number(el.dataset.f); drawSheet(); }
  else if (a === 'reason') { S.helpReason = el.dataset.r; drawSheet(); }
  else if (a === 'help-send') { S.helpSent = true; drawSheet(); }
  else if (a === 'help-cancel') { S.helpSent = false; S.helpReason = null; closeSheet(); toast('Cancelled. Glad you are sorted.'); }
  else if (a === 'tour-step') { S.tourI = Math.max(0, Math.min(TOUR.length - 1, (S.tourI || 0) + Number(el.dataset.d))); drawSheet(); }
  else if (a === 'go') toast(`Would open: ${el.dataset.go}`);
  else if (a === 'locked') { const box = el.closest('[data-locked]'); const open = !box.hasAttribute('data-open'); box.toggleAttribute('data-open', open); el.setAttribute('aria-expanded', open); }
  else if (a === 'v4tab') { S.v4tab = el.dataset.tab; render(); }
  else if (a === 'v5past') { S.v5past = !S.v5past; render(); }
  else if (a === 'ask') { S.chat.push(el.dataset.k); render(); }
  else if (a === 'v8') { S.v8dir = Number(el.dataset.d); S.v8i += S.v8dir; render(); }
  else if (a === 'v8go') { const n = Number(el.dataset.i); S.v8dir = n < S.v8i ? -1 : 1; S.v8i = n; render(); }
  else if (a === 'v8all') { S.v8all = !S.v8all; render(); }
  else if (a === 'v10day') { S.v10day = el.dataset.day; render(); }
});
function bindDeck() {
  const deck = document.getElementById('v8deck'); if (!deck) return;
  let x0 = null;
  deck.addEventListener('pointerdown', (e) => { x0 = e.clientX; });
  deck.addEventListener('pointerup', (e) => { if (x0 == null) return; const dx = e.clientX - x0; x0 = null; const n = v8cards(ctx()).length; if (Math.abs(dx) > 50) { const d = dx < 0 ? 1 : -1; const ni = Math.max(0, Math.min(n - 1, S.v8i + d)); if (ni !== S.v8i) { S.v8dir = d; S.v8i = ni; render(); } } });
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !ov.hidden) { closeSheet(); return; }
  const t = e.target; if (e.metaKey || e.ctrlKey || e.altKey || t.matches?.('input,textarea,select,[contenteditable]')) return;
  if (!ov.hidden) return;
  if (e.key === 'ArrowRight') select(S.v % 10 + 1);
  else if (e.key === 'ArrowLeft') select((S.v + 8) % 10 + 1);
  else if (/^[0-9]$/.test(e.key)) select(e.key === '0' ? 10 : Number(e.key));
});
sync(); render();
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
addEventListener('resize', moveHighlight);
</script>
</body>
</html>
