name: Deploy load-tester worker

# Deploys the hw-network-requests Cloudflare Worker (request-event ingest into
# D1) whenever it changes on main. Needs these on the "Production" GitHub
# environment:
#   secrets.CLOUDFLARE_API_TOKEN               Workers Scripts:Edit + D1:Edit
#   secrets.CLOUDFLARE_ACCOUNT_ID
#   secrets.HW_NETWORK_REQUESTS_INGEST_TOKEN   same value as in Vercel
on:
  push:
    branches:
      - main
    paths:
      - "workers/hw-network-requests/**"
      - ".github/workflows/deploy-load-tester-worker.yml"
  workflow_dispatch:

concurrency:
  group: deploy-load-tester-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Also guards manual runs: never deploy prod from a feature branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4.163.0 -c workers/hw-network-requests/wrangler.toml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # schema.sql is idempotent (CREATE ... IF NOT EXISTS).
      - name: Apply D1 schema
        run: $WRANGLER d1 execute hw-network-requests --remote --file=workers/hw-network-requests/schema.sql

      - name: Deploy worker
        run: $WRANGLER deploy

      - name: Set ingest token secret
        env:
          INGEST_TOKEN: ${{ secrets.HW_NETWORK_REQUESTS_INGEST_TOKEN }}
        run: |
          if [ -z "$INGEST_TOKEN" ]; then
            echo "::error::HW_NETWORK_REQUESTS_INGEST_TOKEN is not set on the Production environment"
            exit 1
          fi
          f=$(mktemp)
          jq -n --arg t "$INGEST_TOKEN" '{HW_NETWORK_REQUESTS_INGEST_TOKEN: $t}' > "$f"
          $WRANGLER secret bulk "$f"
          rm -f "$f"
