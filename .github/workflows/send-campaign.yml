name: Hacker Email Campaign Drip

# Sends the HW11/12 → HW13 campaign in small hourly batches so volume stays
# low and reputation-safe. Idempotent + resumable via email_subscriber.last_sent_at.
#
# SAFETY / ARMING:
#   - Scheduled runs DRY-RUN until the repo variable CAMPAIGN_LIVE == 'true'.
#     Arm it when ready:  gh variable set CAMPAIGN_LIVE --body true
#     Pause anytime:      gh variable set CAMPAIGN_LIVE --body false
#   - Manual run: Actions → this workflow → Run workflow → tick "send".
#   - Scoped test: Run workflow → tick "send" + set "only" to one email to send
#     the whole pipeline to just that address (ignores the last-sent gate).
#
# SELF-TERMINATION:
#   - When a send run finds 0 eligible recipients (list drained), it disables
#     this workflow (gh workflow disable) so the cron stops firing.

on:
  schedule:
    - cron: "0 13-23 * * *" # hourly, ~9am–7pm ET (13:00–23:00 UTC)
  workflow_dispatch:
    inputs:
      send:
        description: "Actually send (unticked = dry run)"
        type: boolean
        default: false
      only:
        description: "Scope to a single email (test). Blank = normal batch."
        type: string
        default: ""

concurrency:
  group: email-campaign-drip
  cancel-in-progress: false

permissions:
  actions: write # needed to self-disable when the list is drained

jobs:
  drip:
    runs-on: ubuntu-latest
    environment: Production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Drip sends via Mailjet (scripts/send-campaign.ts). Transactional email
      # stays on Cloudflare, so this workflow needs only the Mailjet creds.
      MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}
      MAILJET_SECRET_KEY: ${{ secrets.MAILJET_SECRET_KEY }}
      SKIP_ENV_VALIDATION: "1"
      CHUNK: "14" # steady-state ~154/day (14 × 11 runs); the run step overrides this with a warm-up curve until the domain is warmed. Under the Mailjet free 200/day cap, which the drip now owns alone (transactional is on Cloudflare).
      SOURCE: "hw12" # cohort filter — start with hw12 (fresher/engaged); switch to "hw11" once reputation holds, or "" for all sources
      START: "2026-07-30T00:00:00Z" # campaign kickoff; gates re-sends (must precede first send)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci

      - name: Decide send vs dry-run
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SEND: ${{ inputs.send }}
          VAR_LIVE: ${{ vars.CAMPAIGN_LIVE }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then ARMED="$INPUT_SEND"; else ARMED="$VAR_LIVE"; fi
          if [ "$ARMED" = "true" ]; then echo "flag=--send" >> "$GITHUB_OUTPUT"; else echo "flag=" >> "$GITHUB_OUTPUT"; fi
          echo "Send mode: ${ARMED:-false}"

      - name: Run drip batch
        env:
          FLAG: ${{ steps.mode.outputs.flag }}
          ONLY: ${{ inputs.only }}
        run: |
          set -o pipefail
          # New-sending-path warm-up curve. Per Mailjet docs, the shared IP is
          # already pre-warmed by Mailjet — no IP warm-up needed on this tier.
          # What IS new is the DOMAIN path: mail.hackwestern.com has zero history
          # sending *through Mailjet* (Cloudflare reputation does not transfer,
          # different IPs). So ramp volume gently to build domain reputation
          # instead of tripping spam filters with a cold blast. Bands reset to
          # start on the Mailjet cutover (2026-08-15, day 1 = 0 sent). Send daily
          # for consistency; step up only while bounces/complaints stay clean.
          # Dates are UTC; ISO dates compare correctly as strings. Reverts to the
          # CHUNK env (~154/day, under the 200/day cap) once past the last band.
          TODAY="$(date -u +%F)"
          if   [[ "$TODAY" < "2026-08-18" ]]; then CHUNK=2   # days 1-3   ~22/day
          elif [[ "$TODAY" < "2026-08-22" ]]; then CHUNK=4   # days 4-7   ~44/day
          elif [[ "$TODAY" < "2026-08-29" ]]; then CHUNK=7   # week 2     ~77/day
          elif [[ "$TODAY" < "2026-09-05" ]]; then CHUNK=11  # week 3    ~121/day
          fi                                                 # week 4+   ~154/day (CHUNK env)
          args=(--chunk="$CHUNK" --start="$START")
          [ -n "$SOURCE" ] && args+=(--source="$SOURCE")
          [ -n "$FLAG" ] && args+=("$FLAG")
          [ -n "$ONLY" ] && args+=(--only="$ONLY")
          npx tsx scripts/send-campaign.ts "${args[@]}" | tee out.log

      - name: Self-disable when list is drained
        if: ${{ steps.mode.outputs.flag == '--send' && inputs.only == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          WF_NAME: ${{ github.workflow }}
        run: |
          if grep -q "Chunk: 0 recipient(s)" out.log; then
            echo "✅ Campaign complete — 0 recipients left. Disabling this workflow."
            gh workflow disable "$WF_NAME"
          else
            echo "Recipients remain — will run again next tick."
          fi
